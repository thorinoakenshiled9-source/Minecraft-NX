name: Build Minecraft-NX + JavaVM

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-minecraft-nx:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Minecraft-NX
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-nro
          path: Minecraft-NX.nro

    build-javm:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - name: Clone javm-nx-poc
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      - name: Patch old libjavm
        run: |
          sed -i '1i #include <algorithm>' \
            javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp

          sed -i '1i #include <algorithm>' \
            javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp

      - name: Disable obsolete HID module
        run: |
          sed -i '/#include.*nx\/hid\/Input.class.hpp/d' \
            javm-nx-poc/nx/native/nx_Java.hpp

          sed -i '/NX_ADD_CLASS.*hid.*Input/d' \
            javm-nx-poc/nx/native/nx_Java.hpp

      - name: Build Java VM
        working-directory: javm-nx-poc/javm
        run: make -j2

      - name: Find generated files
        run: |
          find javm-nx-poc -type f \( -name "*.nro" -o -name "*.nacp" \) -print

      - name: Upload Java VM
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-JavaVM
          path: |
            javm-nx-poc/**/*.nro
            javm-nx-poc/sd_out/**
