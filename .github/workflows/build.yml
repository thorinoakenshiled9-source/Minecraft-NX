name: Minecraft-NX Java Diagnostic v3.2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took
          path: Minecraft-NX.nro


  java-diagnostic:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:

      # ============================================================
      # Ferramentas
      # ============================================================

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      # ============================================================
      # JavaVM
      # ============================================================

      - name: Clone JavaVM
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      # ============================================================
      # Compatibilidade com C++ atual
      # ============================================================

      - name: Patch algorithm compatibility
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; files=[Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp"),Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp")]; [(p.write_text(("#include <algorithm>\n" if "#include <algorithm>" not in p.read_text() else "")+p.read_text())) for p in files]'

      # ============================================================
      # HID moderno
      # ============================================================

      - name: Port HID to modern libnx
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/nx/native/nx/hid/Input.class.hpp"); s="""#pragma once

          #include <nx_Include.hpp>
          #include <switch.h>

          namespace nx::hid {

              class Input : public native::Class {

                  private:

                      inline static PadState pad;
                      inline static bool initialized = false;

                      static void EnsureInitialized() {

                          if(!initialized) {

                              padConfigureInput(
                                  1,
                                  HidNpadStyleSet_NpadStandard
                              );

                              padInitializeDefault(&pad);

                              initialized = true;
                          }
                      }

                  public:

                      JAVM_NATIVE_CLASS_CTOR(Input) {

                          JAVM_NATIVE_CLASS_NAME("nx.hid.Input")

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getDownInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getUpInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getHeldInput
                          )
                      }

                      core::Value getDownInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsDown(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getUpInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsUp(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getHeldInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtons(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }
              };

          }
          """; p.write_text(s)'

      # ============================================================
      # Confirma registro HID
      # ============================================================

      - name: Verify HID
        shell: bash
        run: |
          grep -q "Input.class.hpp" \
            javm-nx-poc/nx/native/nx_Java.hpp

          grep -q "LoadNativeClass<hid::Input>" \
            javm-nx-poc/nx/native/nx_Java.hpp

          echo "HID OK"

      # ============================================================
      # Java minimo
      # ============================================================

      - name: Create minimal Java test
        shell: bash
        run: |
          MAIN_JAVA=$(find javm-nx-poc/java-hello-world/src -type f -name "Main.java" | head -n 1)

          if [ -z "$MAIN_JAVA" ]; then
            echo "ERRO: Main.java nao encontrado"
            exit 1
          fi

          printf '%s\n' \
          'package javmnx.helloworld;' \
          '' \
          'public class Main {' \
          '    public static void main(String[] args) {' \
          '        System.out.println("Minecraft-NX");' \
          '        System.out.println("Created by Farbert_Took");' \
          '        System.out.println("[JAVA] main executado");' \
          '    }' \
          '}' \
          > "$MAIN_JAVA"

          echo "=== Main.java ==="
          cat "$MAIN_JAVA"

      # ============================================================
      # Biblioteca NX Java
      # ============================================================

      - name: Build nx Java library
        working-directory: javm-nx-poc/nx/java
        run: |
          mvn package

      # ============================================================
      # JAR
      # ============================================================

      - name: Build Java test
        working-directory: javm-nx-poc/java-hello-world
        run: |
          mvn clean package

      - name: Show generated JAR
        shell: bash
        run: |
          echo "=== JARs gerados ==="

          find \
            javm-nx-poc/java-hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

      # ============================================================
      # Main.cpp de diagnostico
      #
      # Usa o fluxo REAL do javm-nx-poc.
      # Cada fase abre uma mensagem no Switch.
      # ============================================================

      - name: Install diagnostic Main.cpp
        shell: bash
        run: |
          MAIN_CPP="javm-nx-poc/javm/source/Main.cpp"

          cat > "$MAIN_CPP" <<'EOF'
          #include <switch.h>
          #include <string>
          #include <javm/core/core_Machine.hpp>

          using namespace javm;

          #include <nx_Java.hpp>


          void LogMessage(std::string msg) {

              switch(appletGetAppletType()) {

                  case AppletType_Application:
                  case AppletType_SystemApplication: {

                      ErrorApplicationConfig cfg;

                      errorApplicationCreate(
                          &cfg,
                          msg.c_str(),
                          nullptr
                      );

                      errorApplicationShow(&cfg);

                      break;
                  }

                  case AppletType_SystemApplet:
                  case AppletType_LibraryApplet:
                  case AppletType_OverlayApplet: {

                      ErrorSystemConfig cfg;

                      errorSystemCreate(
                          &cfg,
                          msg.c_str(),
                          nullptr
                      );

                      errorSystemShow(&cfg);

                      break;
                  }

                  default:
                      break;
              }
          }


          int main(int argc, char **argv) {

              static char direct_app[] =
                  "javm.nro";

              static char direct_jar[] =
                  "sdmc:/switch/minecraft-nx/test.jar";

              static char *direct_argv[] = {
                  direct_app,
                  direct_jar,
                  nullptr
              };

              argc = 2;
              argv = direct_argv;


              LogMessage(
                  "Minecraft-NX\n"
                  "Created by Farbert_Took\n\n"
                  "BOOT 1 - main iniciou"
              );


              std::string jar = argv[1];


              LogMessage(
                  "Minecraft-NX\n\n"
                  "BOOT 2 - caminho do JAR definido"
              );


              core::Machine machine;


              LogMessage(
                  "Minecraft-NX\n\n"
                  "BOOT 3 - Machine criada"
              );


              machine.LoadBuiltinNativeClasses();


              LogMessage(
                  "Minecraft-NX\n\n"
                  "BOOT 4 - classes nativas carregadas"
              );


              nx::LoadClasses(machine);


              LogMessage(
                  "Minecraft-NX\n\n"
                  "BOOT 5 - classes NX carregadas"
              );


              auto &jar_ref =
                  machine.LoadJavaArchive(jar);


              LogMessage(
                  "Minecraft-NX\n\n"
                  "BOOT 6 - LoadJavaArchive retornou"
              );


              if(!jar_ref->CanBeExecuted()) {

                  LogMessage(
                      "Minecraft-NX\n\n"
                      "ERRO:\n"
                      "JAR nao pode ser executado."
                  );

                  return 0;
              }


              LogMessage(
                  "Minecraft-NX\n\n"
                  "BOOT 7 - JAR executavel"
              );


              auto args_array_value =
                  core::CreateArray<java::lang::String>(0);


              LogMessage(
                  "Minecraft-NX\n\n"
                  "BOOT 8 - args Java criado"
              );


              LogMessage(
                  "Minecraft-NX\n\n"
                  "BOOT 9 - chamando Java main()"
              );


              machine.CallFunction(
                  jar_ref->GetMainClass(),
                  "main",
                  args_array_value
              );


              LogMessage(
                  "Minecraft-NX\n\n"
                  "BOOT 10 - Java main retornou"
              );


              if(machine.WasExceptionThrown()) {

                  auto info =
                      machine.GetExceptionInfo();

                  LogMessage(
                      "Minecraft-NX\n\n"
                      "EXCEPTION:\n" +
                      info.class_type +
                      "\n" +
                      info.message
                  );

                  return 0;
              }


              LogMessage(
                  "Minecraft-NX\n"
                  "Created by Farbert_Took\n\n"
                  "DIAGNOSTICO CONCLUIDO\n"
                  "Java terminou normalmente."
              );


              return 0;
          }
          EOF

          echo ""
          echo "=== Main.cpp de diagnostico ==="
          cat "$MAIN_CPP"

      # ============================================================
      # Compila JavaVM
      # ============================================================

      - name: Build JavaVM
        working-directory: javm-nx-poc/javm
        run: |
          make clean || true
          make -j2

      # ============================================================
      # Localiza arquivos
      # ============================================================

      - name: Locate build files
        shell: bash
        run: |
          echo "=== NRO ==="

          find \
            javm-nx-poc/javm \
            -type f \
            -name "javm.nro" \
            -print

          echo ""
          echo "=== JAR ==="

          find \
            javm-nx-poc/java-hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

      # ============================================================
      # Pacote SD
      # ============================================================

      - name: Prepare SD package
        shell: bash
        run: |
          set -e

          rm -rf SD

          mkdir -p \
            SD/switch/minecraft-nx

          JAVM_NRO=$(find javm-nx-poc/javm -type f -name "javm.nro" | head -n 1)

          TEST_JAR=$(find javm-nx-poc/java-hello-world/target -maxdepth 1 -type f -name "*.jar" | head -n 1)


          if [ -z "$JAVM_NRO" ]; then

            echo "ERRO: javm.nro nao encontrado"

            exit 1
          fi


          if [ -z "$TEST_JAR" ]; then

            echo "ERRO: JAR nao encontrado"

            exit 1
          fi


          cp \
            "$JAVM_NRO" \
            SD/switch/minecraft-nx/javm.nro


          cp \
            "$TEST_JAR" \
            SD/switch/minecraft-nx/test.jar


          echo ""
          echo "========================================"
          echo " Minecraft-NX Diagnostic v3.2"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""

          find SD -type f -print

      # ============================================================
      # Verificacao final
      # ============================================================

      - name: Verify package
        shell: bash
        run: |
          set -e

          test -f \
            SD/switch/minecraft-nx/javm.nro

          test -f \
            SD/switch/minecraft-nx/test.jar


          echo "=== javm.nro ==="

          ls -lh \
            SD/switch/minecraft-nx/javm.nro


          echo ""

          echo "=== test.jar ==="

          ls -lh \
            SD/switch/minecraft-nx/test.jar


          echo ""

          echo "Minecraft-NX Diagnostic v3.2 pronto"
          echo "Created by Farbert_Took"

      # ============================================================
      # Artifact
      # ============================================================

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-Diagnostic-v3.2
          path: SD
