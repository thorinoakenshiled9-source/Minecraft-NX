name: Minecraft-NX Java Diagnostic v3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took
          path: Minecraft-NX.nro

  java-diagnostic:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      - name: Clone JavaVM
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      # ============================================================
      # C++ compatibility
      # ============================================================

      - name: Patch algorithm compatibility
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; files=[Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp"),Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp")]; [(p.write_text(("#include <algorithm>\n" if "#include <algorithm>" not in p.read_text() else "")+p.read_text())) for p in files]'

      # ============================================================
      # HID moderno - mesma base que executou Hello World
      # ============================================================

      - name: Port HID to modern libnx
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/nx/native/nx/hid/Input.class.hpp"); s="""#pragma once

          #include <nx_Include.hpp>
          #include <switch.h>

          namespace nx::hid {

              class Input : public native::Class {

                  private:

                      inline static PadState pad;
                      inline static bool initialized = false;

                      static void EnsureInitialized() {

                          if(!initialized) {

                              padConfigureInput(
                                  1,
                                  HidNpadStyleSet_NpadStandard
                              );

                              padInitializeDefault(&pad);

                              initialized = true;
                          }
                      }

                  public:

                      JAVM_NATIVE_CLASS_CTOR(Input) {

                          JAVM_NATIVE_CLASS_NAME("nx.hid.Input")

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getDownInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getUpInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getHeldInput
                          )
                      }

                      core::Value getDownInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsDown(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getUpInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsUp(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getHeldInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtons(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }
              };

          }
          """; p.write_text(s)'

      - name: Verify HID
        shell: bash
        run: |
          grep -q "Input.class.hpp" \
            javm-nx-poc/nx/native/nx_Java.hpp

          grep -q "LoadNativeClass<hid::Input>" \
            javm-nx-poc/nx/native/nx_Java.hpp

          echo "HID OK"

      # ============================================================
      # Java: usa exatamente Main.java do exemplo original
      # ============================================================

      - name: Create minimal Minecraft-NX Java test
        shell: bash
        run: |
          MAIN_JAVA=$(find javm-nx-poc/java-hello-world/src -type f -name "Main.java" | head -n 1)

          if [ -z "$MAIN_JAVA" ]; then
            echo "ERRO: Main.java nao encontrado"
            exit 1
          fi

          echo "Main original:"
          echo "$MAIN_JAVA"

          printf '%s\n' \
          'package javmnx.helloworld;' \
          '' \
          'public class Main {' \
          '    public static void main(String[] args) {' \
          '        System.out.println("Minecraft-NX");' \
          '        System.out.println("Created by Farbert_Took");' \
          '        System.out.println("[1] JVM OK");' \
          '    }' \
          '}' \
          > "$MAIN_JAVA"

          echo ""
          echo "=== Main.java ==="
          cat "$MAIN_JAVA"

      # ============================================================
      # Biblioteca Java nx
      # ============================================================

      - name: Build nx Java library
        working-directory: javm-nx-poc/nx/java
        run: |
          mvn package

      # ============================================================
      # JAR usando exatamente o Maven original
      # ============================================================

      - name: Build Java diagnostic
        working-directory: javm-nx-poc/java-hello-world
        run: |
          mvn clean package

      - name: Locate Java JAR
        shell: bash
        run: |
          echo "=== JARs ==="
          find javm-nx-poc/java-hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

      # ============================================================
      # Direct launch
      #
      # IMPORTANTE:
      # mantemos o nome javm.nro.
      # ============================================================

      - name: Patch direct launch
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/javm/source/Main.cpp"); s=p.read_text(); marker="int main(int argc, char **argv)"; marker2="int main(int argc, char *argv[])"; marker=marker if marker in s else marker2; assert marker in s, "main nao encontrado"; start=s.index(marker); brace=s.index("{", start)+1; patch="\n    static char direct_app[] = \"javm.nro\";\n    static char direct_jar[] = \"sdmc:/switch/minecraft-nx/test.jar\";\n    static char *direct_argv[] = { direct_app, direct_jar, nullptr };\n    argc = 2;\n    argv = direct_argv;\n"; p.write_text(s[:brace]+patch+s[brace:]); print(p.read_text())'

      # ============================================================
      # PAUSA DE DIAGNOSTICO
      #
      # Se a VM terminar normalmente, nao fecha imediatamente.
      # ============================================================

      - name: Patch exit diagnostic
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/javm/source/Main.cpp"); s=p.read_text(); old="consoleExit(NULL);"; new="printf(\"\\n[Minecraft-NX] Java retornou ao launcher.\\n\"); printf(\"Created by Farbert_Took\\n\"); printf(\"Use HOME para sair.\\n\"); consoleUpdate(NULL); while (appletMainLoop()) { consoleUpdate(NULL); } consoleExit(NULL);"; assert old in s, "consoleExit nao encontrado"; p.write_text(s.replace(old,new)); print(p.read_text())'

      # ============================================================
      # Compila javm
      # ============================================================

      - name: Build JavaVM
        working-directory: javm-nx-poc/javm
        run: |
          make clean || true
          make -j2

      # ============================================================
      # Pacote SD
      # ============================================================

      - name: Prepare SD package
        shell: bash
        run: |
          set -e

          rm -rf SD

          mkdir -p \
            SD/switch/minecraft-nx

          JAVM_NRO=$(find javm-nx-poc/javm -type f -name "javm.nro" | head -n 1)

          TEST_JAR=$(find javm-nx-poc/java-hello-world/target -maxdepth 1 -type f -name "*.jar" | head -n 1)

          if [ -z "$JAVM_NRO" ]; then
            echo "ERRO: javm.nro nao encontrado"
            exit 1
          fi

          if [ -z "$TEST_JAR" ]; then
            echo "ERRO: JAR nao encontrado"
            exit 1
          fi

          cp \
            "$JAVM_NRO" \
            SD/switch/minecraft-nx/javm.nro

          cp \
            "$TEST_JAR" \
            SD/switch/minecraft-nx/test.jar

          echo ""
          echo "=== Minecraft-NX Diagnostic v3 ==="
          echo "Created by Farbert_Took"

          echo ""
          echo "=== ARQUIVOS ==="

          find SD -type f -print

      # ============================================================
      # Verificacao
      # ============================================================

      - name: Verify package
        shell: bash
        run: |
          set -e

          test -f \
            SD/switch/minecraft-nx/javm.nro

          test -f \
            SD/switch/minecraft-nx/test.jar

          echo ""
          echo "=== javm.nro ==="

          ls -lh \
            SD/switch/minecraft-nx/javm.nro

          echo ""
          echo "=== test.jar ==="

          ls -lh \
            SD/switch/minecraft-nx/test.jar

          echo ""
          echo "Minecraft-NX Diagnostic v3 OK"

      # ============================================================
      # Artifact
      # ============================================================

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-Diagnostic-v3
          path: SD
