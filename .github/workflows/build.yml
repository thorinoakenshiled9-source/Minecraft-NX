name: Build Minecraft-NX Java HID Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-nro
          path: Minecraft-NX.nro

  java-hid-test:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      - name: Clone JavaVM
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      - name: Patch C++ compatibility
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp"),
              Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp")
          ]

          for p in files:
              s = p.read_text()

              if "#include <algorithm>" not in s:
                  s = "#include <algorithm>\n" + s

              p.write_text(s)
          PY

      - name: Port nx hid Input to modern libnx
        shell: bash
        run: |
          cat > javm-nx-poc/nx/native/nx/hid/Input.class.hpp <<'EOF'
          #pragma once

          #include <nx_Include.hpp>
          #include <switch.h>

          namespace nx::hid {

              class Input : public native::Class {

                  private:
                      inline static PadState pad;
                      inline static bool initialized = false;

                      static void EnsureInitialized() {
                          if(!initialized) {
                              padConfigureInput(
                                  1,
                                  HidNpadStyleSet_NpadStandard
                              );

                              padInitializeDefault(&pad);

                              initialized = true;
                          }
                      }

                  public:
                      JAVM_NATIVE_CLASS_CTOR(Input) {

                          JAVM_NATIVE_CLASS_NAME("nx.hid.Input")

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(getDownInput)
                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(getUpInput)
                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(getHeldInput)
                      }

                      core::Value getDownInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {
                          if(parameters.size() > 0) {

                              // Mantemos o parametro controller para
                              // compatibilidade com a API Java original.
                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsDown(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getUpInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {
                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsUp(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getHeldInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {
                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtons(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }
              };

          }
          EOF

      - name: Verify HID patch
        run: |
          echo "=== Input.class.hpp ==="
          cat javm-nx-poc/nx/native/nx/hid/Input.class.hpp

          echo ""
          echo "=== nx_Java.hpp ==="
          cat javm-nx-poc/nx/native/nx_Java.hpp

          grep -q 'Input.class.hpp' \
            javm-nx-poc/nx/native/nx_Java.hpp

          grep -q 'LoadNativeClass<hid::Input>' \
            javm-nx-poc/nx/native/nx_Java.hpp

          echo "HID registrado."

      - name: Patch direct JAR launch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "javm-nx-poc/j
