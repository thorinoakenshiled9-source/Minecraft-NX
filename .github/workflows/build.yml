name: Build Minecraft-NX Java Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-nro
          path: Minecraft-NX.nro

  java-test:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      - name: Clone javm
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      - name: Patch javm
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("javm-nx-poc")

          for name in [
              "libjavm/libjavm/include/javm/core/core_ClassObject.hpp",
              "libjavm/libjavm/include/javm/core/core_ManifestFile.hpp"
          ]:
              p = root / name
              text = p.read_text()

              if "#include <algorithm>" not in text:
                  text = "#include <algorithm>\n" + text

              p.write_text(text)

          p = root / "nx/native/nx_Java.hpp"
          text = p.read_text()

          lines = []

          for line in text.splitlines():
              if "Input.class.hpp" in line:
                  continue

              if "LoadNativeClass<hid::Input>" in line:
                  continue

              lines.append(line)

          p.write_text("\n".join(lines) + "\n")

          print("Patch concluido")
          PY

      - name: Build javm NRO
        working-directory: javm-nx-poc/javm
        run: make -j2

      - name: Build nx Java library
        working-directory: javm-nx-poc/nx/java
        run: mvn package

      - name: Build Java Hello World
        working-directory: javm-nx-poc/java-hello-world
        run: mvn package

      - name: Show generated files
        run: |
          echo "=== NRO ==="
          find javm-nx-poc -type f -name "*.nro" -print

          echo "=== JAR ==="
          find javm-nx-poc -type f -name "*.jar" -print

          echo "=== SD OUT ==="
          find javm-nx-poc/sd_out -type f -print

      - name: Prepare SD package
        shell: bash
        run: |
          mkdir -p SD

          cp -r javm-nx-poc/sd_out/. SD/

          HELLO_JAR=$(find javm-nx-poc/java-hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | head -n 1)

          if [ -z "$HELLO_JAR" ]; then
            echo "Hello World JAR nao encontrado"
            exit 1
          fi

          mkdir -p SD/switch

          cp "$HELLO_JAR" \
            SD/switch/java-hello-world.jar

          echo "=== PACOTE FINAL ==="
          find SD -type f -print

      - name: Upload SD package
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Java-Test-SD
          path: SD
