name: Build Minecraft-NX by Farbert_Took

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took
          path: Minecraft-NX.nro

  java-capability:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven unzip

      - name: Clone JavaVM
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      # ============================================================
      # Compatibilidade C++
      # ============================================================

      - name: Patch algorithm compatibility
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; files=[Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp"),Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp")]; [(p.write_text(("#include <algorithm>\n" if "#include <algorithm>" not in p.read_text() else "")+p.read_text())) for p in files]'

      # ============================================================
      # Port do HID antigo para PadState do libnx atual
      # ============================================================

      - name: Port HID to modern libnx
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/nx/native/nx/hid/Input.class.hpp"); s="""#pragma once

          #include <nx_Include.hpp>
          #include <switch.h>

          namespace nx::hid {

              class Input : public native::Class {

                  private:

                      inline static PadState pad;
                      inline static bool initialized = false;

                      static void EnsureInitialized() {

                          if(!initialized) {

                              padConfigureInput(
                                  1,
                                  HidNpadStyleSet_NpadStandard
                              );

                              padInitializeDefault(&pad);

                              initialized = true;
                          }
                      }

                  public:

                      JAVM_NATIVE_CLASS_CTOR(Input) {

                          JAVM_NATIVE_CLASS_NAME("nx.hid.Input")

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getDownInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getUpInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getHeldInput
                          )
                      }

                      core::Value getDownInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsDown(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getUpInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsUp(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getHeldInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtons(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }
              };

          }
          """; p.write_text(s)'

      - name: Verify HID
        shell: bash
        run: |
          grep -q "Input.class.hpp" \
            javm-nx-poc/nx/native/nx_Java.hpp

          grep -q "LoadNativeClass<hid::Input>" \
            javm-nx-poc/nx/native/nx_Java.hpp

          echo "HID OK"

      # ============================================================
      # Mostra estrutura original do Hello World
      # ============================================================

      - name: Show original Java project
        shell: bash
        run: |
          echo "=== JAVA SOURCES ==="

          find \
            javm-nx-poc/java-hello-world \
            -type f \
            -name "*.java" \
            -print

          echo ""
          echo "=== POM ==="

          cat javm-nx-poc/java-hello-world/pom.xml

      # ============================================================
      # Substitui somente Main.java
      # Mantemos o projeto Maven original que ja funcionou.
      # ============================================================

      - name: Create Minecraft-NX capability test
        shell: bash
        run: |
          MAIN_JAVA=$(find javm-nx-poc/java-hello-world/src -type f -name "Main.java" | head -n 1)

          if [ -z "$MAIN_JAVA" ]; then
            echo "ERRO: Main.java nao encontrado"
            exit 1
          fi

          echo "Main.java:"
          echo "$MAIN_JAVA"

          printf '%s\n' \
          'package javmnx.helloworld;' \
          '' \
          'public class Main {' \
          '' \
          '    public static void main(String[] args) {' \
          '' \
          '        System.out.println("Minecraft-NX");' \
          '        System.out.println("Created by Farbert_Took");' \
          '        System.out.println("==========================");' \
          '' \
          '        System.out.println("[1] JVM OK");' \
          '' \
          '        String project = "Minecraft-NX";' \
          '        System.out.println("[2] String OK");' \
          '        System.out.println(project);' \
          '' \
          '        int a = 20;' \
          '        int b = 22;' \
          '        int result = a + b;' \
          '' \
          '        if(result == 42) {' \
          '            System.out.println("[3] Inteiros OK");' \
          '        }' \
          '' \
          '        int multiply = 7 * 6;' \
          '' \
          '        if(multiply == 42) {' \
          '            System.out.println("[4] Multiplicacao OK");' \
          '        }' \
          '' \
          '        int counter = 0;' \
          '' \
          '        for(int i = 0; i < 5; i++) {' \
          '            counter = counter + 1;' \
          '        }' \
          '' \
          '        if(counter == 5) {' \
          '            System.out.println("[5] Loop OK");' \
          '        }' \
          '' \
          '        int[] numbers = new int[3];' \
          '' \
          '        numbers[0] = 10;' \
          '        numbers[1] = 20;' \
          '        numbers[2] = 30;' \
          '' \
          '        if(numbers[1] == 20) {' \
          '            System.out.println("[6] Array OK");' \
          '        }' \
          '' \
          '        System.out.println("==========================");' \
          '        System.out.println("[DONE] Java test concluido");' \
          '        System.out.println("Minecraft-NX by Farbert_Took");' \
          '        System.out.println("Use HOME para sair");' \
          '    }' \
          '}' \
          > "$MAIN_JAVA"

          echo ""
          echo "=== Minecraft-NX Main.java ==="

          cat "$MAIN_JAVA"

      # ============================================================
      # Biblioteca Java NX
      # ============================================================

      - name: Build nx Java library
        working-directory: javm-nx-poc/nx/java
        run: |
          mvn package

      # ============================================================
      # Capability JAR
      # ============================================================

      - name: Build capability JAR
        working-directory: javm-nx-poc/java-hello-world
        run: |
          mvn clean package

      - name: Inspect capability JAR
        shell: bash
        run: |
          JAR_FILE=$(find javm-nx-poc/java-hello-world/target -maxdepth 1 -type f -name "*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERRO: JAR nao encontrado"
            exit 1
          fi

          echo "=== JAR ==="
          echo "$JAR_FILE"

          echo ""
          echo "=== CONTEUDO ==="
          unzip -l "$JAR_FILE"

          echo ""
          echo "=== MANIFEST ==="
          unzip -p "$JAR_FILE" META-INF/MANIFEST.MF

      # ============================================================
      # Forca javm.nro a iniciar nosso capability-test.jar
      # ============================================================

      - name: Patch direct JAR launch
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/javm/source/Main.cpp"); s=p.read_text(); marker="int main(int argc, char **argv)"; marker2="int main(int argc, char *argv[])"; marker=marker if marker in s else marker2; assert marker in s, "main nao encontrado"; start=s.index(marker); brace=s.index("{", start)+1; patch="\n    static char direct_app[] = \"javm.nro\";\n    static char direct_jar[] = \"sdmc:/switch/minecraft-nx/capability-test.jar\";\n    static char *direct_argv[] = { direct_app, direct_jar, nullptr };\n    argc = 2;\n    argv = direct_argv;\n"; p.write_text(s[:brace]+patch+s[brace:]); print(p.read_text())'

      # ============================================================
      # Compila JavaVM
      # ============================================================

      - name: Build JavaVM
        working-directory: javm-nx-poc/javm
        run: |
          make clean || true
          make -j2

      # ============================================================
      # Pacote SD
      # ============================================================

      - name: Prepare SD package
        shell: bash
        run: |
          set -e

          rm -rf SD

          mkdir -p \
            SD/switch/minecraft-nx

          JAVM_NRO=$(find javm-nx-poc/javm -type f -name "javm.nro" | head -n 1)

          if [ -z "$JAVM_NRO" ]; then
            echo "ERRO: javm.nro nao encontrado"
            exit 1
          fi

          CAPABILITY_JAR=$(find javm-nx-poc/java-hello-world/target -maxdepth 1 -type f -name "*.jar" | head -n 1)

          if [ -z "$CAPABILITY_JAR" ]; then
            echo "ERRO: capability JAR nao encontrado"
            exit 1
          fi

          cp \
            "$JAVM_NRO" \
            SD/switch/minecraft-nx/Minecraft-NX.nro

          cp \
            "$CAPABILITY_JAR" \
            SD/switch/minecraft-nx/capability-test.jar

          echo ""
          echo "=== Minecraft-NX ==="
          echo "Created by Farbert_Took"

          echo ""
          echo "=== PACOTE FINAL ==="

          find SD -type f -print

      # ============================================================
      # Verificacao
      # ============================================================

      - name: Verify SD package
        shell: bash
        run: |
          set -e

          test -f \
            SD/switch/minecraft-nx/Minecraft-NX.nro

          test -f \
            SD/switch/minecraft-nx/capability-test.jar

          echo "=== Minecraft-NX NRO ==="

          ls -lh \
            SD/switch/minecraft-nx/Minecraft-NX.nro

          echo ""
          echo "=== Java test ==="

          ls -lh \
            SD/switch/minecraft-nx/capability-test.jar

          echo ""
          echo "Minecraft-NX"
          echo "Created by Farbert_Took"
          echo "BUILD OK"

      # ============================================================
      # Artifact
      # ============================================================

      - name: Upload Minecraft-NX Java test
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-Java-Test
          path: SD
