name: Minecraft-NX Java Baseline v3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:

      # ============================================================
      # Ferramentas
      # ============================================================

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      # ============================================================
      # Clone LIMPO
      # ============================================================

      - name: Clone original JavaVM
        shell: bash
        run: |
          rm -rf javm-nx-poc

          git clone --recursive \
            https://github.com/XorTroll/javm-nx-poc.git

          echo "JavaVM clonado."

      # ============================================================
      # Compatibilidade C++
      # ============================================================

      - name: Patch algorithm compatibility
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; files=[Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp"),Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp")]; [(p.write_text(("#include <algorithm>\n" if "#include <algorithm>" not in p.read_text() else "")+p.read_text())) for p in files]'

      # ============================================================
      # HID moderno
      # MESMO patch do Recovery v2 funcional
      # ============================================================

      - name: Patch HID for modern libnx
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/nx/native/nx/hid/Input.class.hpp"); s="""#pragma once

          #include <nx_Include.hpp>
          #include <switch.h>

          namespace nx::hid {

              class Input : public native::Class {

                  private:

                      inline static PadState pad;
                      inline static bool initialized = false;

                      static void EnsureInitialized() {

                          if(!initialized) {

                              padConfigureInput(
                                  1,
                                  HidNpadStyleSet_NpadStandard
                              );

                              padInitializeDefault(&pad);

                              initialized = true;
                          }
                      }

                  public:

                      JAVM_NATIVE_CLASS_CTOR(Input) {

                          JAVM_NATIVE_CLASS_NAME("nx.hid.Input")

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getDownInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getUpInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getHeldInput
                          )
                      }

                      core::Value getDownInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();
                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsDown(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getUpInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();
                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsUp(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getHeldInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();
                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtons(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }
              };

          }
          """; p.write_text(s)'

      # ============================================================
      # Confirma HID
      # ============================================================

      - name: Verify native Input
        shell: bash
        run: |
          set -e

          grep -q \
            "Input.class.hpp" \
            javm-nx-poc/nx/native/nx_Java.hpp

          grep -q \
            "LoadNativeClass<hid::Input>" \
            javm-nx-poc/nx/native/nx_Java.hpp

          echo "HID OK"

      # ============================================================
      # ÚNICA MUDANÇA EM RELAÇÃO AO BASELINE:
      #
      # Main.java
      # ============================================================

      - name: Change Hello World text
        shell: bash
        run: |
          MAIN_JAVA=$(find \
            javm-nx-poc/java-hello-world/src \
            -type f \
            -name "Main.java" \
            | head -n 1)

          if [ -z "$MAIN_JAVA" ]; then
            echo "ERRO: Main.java nao encontrado"
            exit 1
          fi

          echo "Main.java:"
          echo "$MAIN_JAVA"

          printf '%s\n' \
          'package javmnx.helloworld;' \
          '' \
          'public class Main {' \
          '    public static void main(String[] args) {' \
          '        System.out.println("Minecraft-NX");' \
          '        System.out.println("Created by Farbert_Took");' \
          '    }' \
          '}' \
          > "$MAIN_JAVA"

          echo ""
          echo "=== Main.java MODIFICADO ==="
          cat "$MAIN_JAVA"

      # ============================================================
      # Biblioteca NX Java
      # ============================================================

      - name: Build NX Java library
        working-directory: javm-nx-poc/nx/java
        run: |
          mvn package

      # ============================================================
      # Compila o MESMO projeto java-hello-world
      # ============================================================

      - name: Build Java program
        working-directory: javm-nx-poc/java-hello-world
        run: |
          mvn clean package

      # ============================================================
      # Launcher:
      # MESMO patch do Recovery v2 funcional
      # ============================================================

      - name: Patch direct Java launch
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/javm/source/Main.cpp"); s=p.read_text(); marker="int main(int argc, char **argv)"; marker2="int main(int argc, char *argv[])"; marker=marker if marker in s else marker2; assert marker in s, "main nao encontrado"; start=s.index(marker); brace=s.index("{", start)+1; patch="\n    static char direct_app[] = \"javm.nro\";\n    static char direct_jar[] = \"sdmc:/switch/java-hello-world.jar\";\n    static char *direct_argv[] = { direct_app, direct_jar, nullptr };\n    argc = 2;\n    argv = direct_argv;\n"; p.write_text(s[:brace]+patch+s[brace:]); print(p.read_text())'

      # ============================================================
      # Verifica launcher
      # ============================================================

      - name: Verify direct launch
        shell: bash
        run: |
          set -e

          grep -q \
            'sdmc:/switch/java-hello-world.jar' \
            javm-nx-poc/javm/source/Main.cpp

          echo "Launcher OK"

      # ============================================================
      # Compila JavaVM
      # ============================================================

      - name: Build JavaVM
        working-directory: javm-nx-poc/javm
        run: |
          make clean || true
          make -j2

      # ============================================================
      # Pacote SD
      #
      # MESMOS caminhos do baseline funcional
      # ============================================================

      - name: Prepare SD package
        shell: bash
        run: |
          set -e

          rm -rf SD
          mkdir -p SD/switch

          JAVM_NRO=$(find \
            javm-nx-poc/javm \
            -type f \
            -name "javm.nro" \
            | head -n 1)

          JAVA_JAR=$(find \
            javm-nx-poc/java-hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | head -n 1)

          if [ -z "$JAVM_NRO" ]; then
            echo "ERRO: javm.nro nao encontrado"
            exit 1
          fi

          if [ -z "$JAVA_JAR" ]; then
            echo "ERRO: JAR nao encontrado"
            exit 1
          fi

          cp \
            "$JAVM_NRO" \
            SD/switch/javm.nro

          cp \
            "$JAVA_JAR" \
            SD/switch/java-hello-world.jar

          echo ""
          echo "========================================"
          echo " Minecraft-NX Java Baseline v3"
          echo " Created by Farbert_Took"
          echo "========================================"

          find SD -type f -print

      # ============================================================
      # Verificação final
      # ============================================================

      - name: Verify package
        shell: bash
        run: |
          set -e

          test -f SD/switch/javm.nro
          test -f SD/switch/java-hello-world.jar

          echo ""
          echo "=== javm.nro ==="
          ls -lh SD/switch/javm.nro

          echo ""
          echo "=== java-hello-world.jar ==="
          ls -lh SD/switch/java-hello-world.jar

          echo ""
          echo "Baseline v3 OK"

      # ============================================================
      # Artifact único
      # ============================================================

      - name: Upload Baseline v3
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-Baseline-v3
          path: SD
