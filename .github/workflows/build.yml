name: Build Minecraft-NX Java Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Minecraft-NX
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: |
          make -j2

      - name: Verify Minecraft-NX
        run: |
          echo "=== Minecraft-NX ==="
          ls -lh Minecraft-NX.nro
          test -f Minecraft-NX.nro

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-nro
          path: Minecraft-NX.nro


  java-test:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      - name: Clone javm-nx-poc
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      # ------------------------------------------------------------
      # Compatibilidade com GCC/libnx atuais
      # ------------------------------------------------------------

      - name: Patch JavaVM compatibility
        shell: bash
