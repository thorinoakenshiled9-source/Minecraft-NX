name: Minecraft-NX Java Diagnostic v3.3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took
          path: Minecraft-NX.nro


  java-test:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:

      # ============================================================
      # Ferramentas
      # ============================================================

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      # ============================================================
      # JavaVM
      # ============================================================

      - name: Clone JavaVM
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      # ============================================================
      # Compatibilidade C++
      # ============================================================

      - name: Patch algorithm compatibility
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; files=[Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp"),Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp")]; [(p.write_text(("#include <algorithm>\n" if "#include <algorithm>" not in p.read_text() else "")+p.read_text())) for p in files]'

      # ============================================================
      # HID moderno
      # ============================================================

      - name: Port HID to modern libnx
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/nx/native/nx/hid/Input.class.hpp"); s="""#pragma once

          #include <nx_Include.hpp>
          #include <switch.h>

          namespace nx::hid {

              class Input : public native::Class {

                  private:

                      inline static PadState pad;
                      inline static bool initialized = false;

                      static void EnsureInitialized() {

                          if(!initialized) {

                              padConfigureInput(
                                  1,
                                  HidNpadStyleSet_NpadStandard
                              );

                              padInitializeDefault(&pad);

                              initialized = true;
                          }
                      }

                  public:

                      JAVM_NATIVE_CLASS_CTOR(Input) {

                          JAVM_NATIVE_CLASS_NAME("nx.hid.Input")

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getDownInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getUpInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getHeldInput
                          )
                      }

                      core::Value getDownInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();
                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsDown(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getUpInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();
                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsUp(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getHeldInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();
                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtons(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }
              };

          }
          """; p.write_text(s)'

      # ============================================================
      # Confirma HID
      # ============================================================

      - name: Verify HID
        shell: bash
        run: |
          grep -q "Input.class.hpp" \
            javm-nx-poc/nx/native/nx_Java.hpp

          grep -q "LoadNativeClass<hid::Input>" \
            javm-nx-poc/nx/native/nx_Java.hpp

          echo "HID moderno OK"

      # ============================================================
      # Java
      # ============================================================

      - name: Create Java test
        shell: bash
        run: |
          MAIN_JAVA=$(find javm-nx-poc/java-hello-world/src -type f -name "Main.java" | head -n 1)

          if [ -z "$MAIN_JAVA" ]; then
            echo "ERRO: Main.java nao encontrado"
            exit 1
          fi

          printf '%s\n' \
          'package javmnx.helloworld;' \
          '' \
          'public class Main {' \
          '' \
          '    public static void main(String[] args) {' \
          '' \
          '        System.out.println("Minecraft-NX");' \
          '        System.out.println("Created by Farbert_Took");' \
          '        System.out.println("==========================");' \
          '' \
          '        System.out.println("[1] JVM OK");' \
          '' \
          '        String project = "Minecraft-NX";' \
          '        System.out.println("[2] String OK");' \
          '        System.out.println(project);' \
          '' \
          '        int a = 20;' \
          '        int b = 22;' \
          '        int result = a + b;' \
          '' \
          '        if(result == 42) {' \
          '            System.out.println("[3] Inteiros OK");' \
          '        }' \
          '' \
          '        int multiply = 7 * 6;' \
          '' \
          '        if(multiply == 42) {' \
          '            System.out.println("[4] Multiplicacao OK");' \
          '        }' \
          '' \
          '        int counter = 0;' \
          '' \
          '        for(int i = 0; i < 5; i++) {' \
          '            counter = counter + 1;' \
          '        }' \
          '' \
          '        if(counter == 5) {' \
          '            System.out.println("[5] Loop OK");' \
          '        }' \
          '' \
          '        int[] numbers = new int[3];' \
          '' \
          '        numbers[0] = 10;' \
          '        numbers[1] = 20;' \
          '        numbers[2] = 30;' \
          '' \
          '        if(numbers[1] == 20) {' \
          '            System.out.println("[6] Array OK");' \
          '        }' \
          '' \
          '        System.out.println("==========================");' \
          '        System.out.println("[DONE] Java test concluido");' \
          '        System.out.println("Minecraft-NX by Farbert_Took");' \
          '    }' \
          '}' \
          > "$MAIN_JAVA"

          echo "=== Main.java ==="
          cat "$MAIN_JAVA"

      # ============================================================
      # Biblioteca Java NX
      # ============================================================

      - name: Build nx Java library
        working-directory: javm-nx-poc/nx/java
        run: |
          mvn package

      # ============================================================
      # JAR
      # ============================================================

      - name: Build Java test
        working-directory: javm-nx-poc/java-hello-world
        run: |
          mvn clean package

      # ============================================================
      # Main.cpp
      #
      # Executa o JAR e NAO sai automaticamente.
      # Depois do Java, espera o botao +.
      # ============================================================

      - name: Install Minecraft-NX launcher
        shell: bash
        run: |
          MAIN_CPP="javm-nx-poc/javm/source/Main.cpp"

          cat > "$MAIN_CPP" <<'EOF'
          #include <switch.h>
          #include <string>
          #include <javm/core/core_Machine.hpp>

          using namespace javm;

          #include <nx_Java.hpp>


          void LogMessage(std::string msg) {

              switch(appletGetAppletType()) {

                  case AppletType_Application:
                  case AppletType_SystemApplication: {

                      ErrorApplicationConfig cfg;

                      errorApplicationCreate(
                          &cfg,
                          msg.c_str(),
                          nullptr
                      );

                      errorApplicationShow(&cfg);

                      break;
                  }

                  case AppletType_SystemApplet:
                  case AppletType_LibraryApplet:
                  case AppletType_OverlayApplet: {

                      ErrorSystemConfig cfg;

                      errorSystemCreate(
                          &cfg,
                          msg.c_str(),
                          nullptr
                      );

                      errorSystemShow(&cfg);

                      break;
                  }

                  default:
                      break;
              }
          }


          void WaitForPlus() {

              PadState pad;

              padConfigureInput(
                  1,
                  HidNpadStyleSet_NpadStandard
              );

              padInitializeDefault(&pad);


              while(appletMainLoop()) {

                  padUpdate(&pad);

                  u64 down =
                      padGetButtonsDown(&pad);


                  if(down & HidNpadButton_Plus) {
                      break;
                  }


                  svcSleepThread(
                      16'000'000
                  );
              }
          }


          int main(int argc, char **argv) {

              static char direct_app[] =
                  "javm.nro";

              static char direct_jar[] =
                  "sdmc:/switch/minecraft-nx/test.jar";

              static char *direct_argv[] = {
                  direct_app,
                  direct_jar,
                  nullptr
              };


              argc = 2;
              argv = direct_argv;


              std::string jar =
                  argv[1];


              core::Machine machine;


              machine.LoadBuiltinNativeClasses();


              nx::LoadClasses(machine);


              auto &jar_ref =
                  machine.LoadJavaArchive(jar);


              if(!jar_ref->CanBeExecuted()) {

                  LogMessage(
                      "Minecraft-NX\n"
                      "Created by Farbert_Took\n\n"
                      "ERRO:\n"
                      "Nao foi possivel executar test.jar.\n\n"
                      "Pressione + para sair."
                  );

                  WaitForPlus();

                  return 0;
              }


              auto args_array_value =
                  core::CreateArray<java::lang::String>(0);


              machine.CallFunction(
                  jar_ref->GetMainClass(),
                  "main",
                  args_array_value
              );


              if(machine.WasExceptionThrown()) {

                  auto info =
                      machine.GetExceptionInfo();


                  LogMessage(
                      "Minecraft-NX\n"
                      "Created by Farbert_Took\n\n"
                      "Java exception:\n" +
                      info.class_type +
                      "\n" +
                      info.message +
                      "\n\nPressione + para sair."
                  );


                  WaitForPlus();

                  return 0;
              }


              LogMessage(
                  "Minecraft-NX\n"
                  "Created by Farbert_Took\n\n"
                  "Java terminou normalmente.\n\n"
                  "JVM: OK\n"
                  "JAR: OK\n"
                  "Main: OK\n\n"
                  "Pressione + para sair."
              );


              WaitForPlus();


              return 0;
          }
          EOF

          echo "=== Minecraft-NX Main.cpp ==="
          cat "$MAIN_CPP"

      # ============================================================
      # Build JavaVM
      # ============================================================

      - name: Build JavaVM
        working-directory: javm-nx-poc/javm
        run: |
          make clean || true
          make -j2

      # ============================================================
      # Pacote final
      # ============================================================

      - name: Prepare SD package
        shell: bash
        run: |
          set -e

          rm -rf SD

          mkdir -p \
            SD/switch/minecraft-nx


          JAVM_NRO=$(find javm-nx-poc/javm -type f -name "javm.nro" | head -n 1)

          TEST_JAR=$(find javm-nx-poc/java-hello-world/target -maxdepth 1 -type f -name "*.jar" | head -n 1)


          if [ -z "$JAVM_NRO" ]; then

            echo "ERRO: javm.nro nao encontrado"

            exit 1
          fi


          if [ -z "$TEST_JAR" ]; then

            echo "ERRO: test.jar nao encontrado"

            exit 1
          fi


          cp \
            "$JAVM_NRO" \
            SD/switch/minecraft-nx/javm.nro


          cp \
            "$TEST_JAR" \
            SD/switch/minecraft-nx/test.jar


          echo ""
          echo "========================================"
          echo " Minecraft-NX v3.3"
          echo " Created by Farbert_Took"
          echo "========================================"

          find SD -type f -print

      # ============================================================
      # Verificacao
      # ============================================================

      - name: Verify package
        shell: bash
        run: |
          set -e

          test -f \
            SD/switch/minecraft-nx/javm.nro

          test -f \
            SD/switch/minecraft-nx/test.jar


          echo ""
          echo "=== javm.nro ==="

          ls -lh \
            SD/switch/minecraft-nx/javm.nro


          echo ""
          echo "=== test.jar ==="

          ls -lh \
            SD/switch/minecraft-nx/test.jar


          echo ""
          echo "Minecraft-NX v3.3 pronto"
          echo "Created by Farbert_Took"

      # ============================================================
      # Artifact
      # ============================================================

      - name: Upload Minecraft-NX Java v3.3
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-v3.3
          path: SD
