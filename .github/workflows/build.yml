name: Minecraft-NX Java Recovery v2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  recovery:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:

      # ============================================================
      # Ferramentas
      # ============================================================

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      # ============================================================
      # Clone LIMPO
      #
      # Remove qualquer pasta existente antes do git clone.
      # ============================================================

      - name: Clone original JavaVM
        shell: bash
        run: |
          rm -rf javm-nx-poc

          git clone --recursive \
            https://github.com/XorTroll/javm-nx-poc.git

          echo ""
          echo "JavaVM clonado com sucesso."

      # ============================================================
      # Compatibilidade C++ atual
      # ============================================================

      - name: Patch algorithm compatibility
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; files=[Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp"),Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp")]; [(p.write_text(("#include <algorithm>\n" if "#include <algorithm>" not in p.read_text() else "")+p.read_text())) for p in files]'

          echo ""
          echo "algorithm compatibility OK"

      # ============================================================
      # HID antigo -> PadState atual
      #
      # Mantemos exatamente a abordagem que permitiu o
      # Hello World funcionar anteriormente.
      # ============================================================

      - name: Patch HID for modern libnx
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/nx/native/nx/hid/Input.class.hpp"); s="""#pragma once

          #include <nx_Include.hpp>
          #include <switch.h>

          namespace nx::hid {

              class Input : public native::Class {

                  private:

                      inline static PadState pad;
                      inline static bool initialized = false;

                      static void EnsureInitialized() {

                          if(!initialized) {

                              padConfigureInput(
                                  1,
                                  HidNpadStyleSet_NpadStandard
                              );

                              padInitializeDefault(&pad);

                              initialized = true;
                          }
                      }

                  public:

                      JAVM_NATIVE_CLASS_CTOR(Input) {

                          JAVM_NATIVE_CLASS_NAME("nx.hid.Input")

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getDownInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getUpInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getHeldInput
                          )
                      }

                      core::Value getDownInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsDown(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getUpInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsUp(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getHeldInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();

                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtons(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }
              };

          }
          """; p.write_text(s)'

      # ============================================================
      # Verifica registro da classe Input
      # ============================================================

      - name: Verify native Input
        shell: bash
        run: |
          set -e

          grep -q \
            "Input.class.hpp" \
            javm-nx-poc/nx/native/nx_Java.hpp

          grep -q \
            "LoadNativeClass<hid::Input>" \
            javm-nx-poc/nx/native/nx_Java.hpp

          echo ""
          echo "HID/Input registrado corretamente."

      # ============================================================
      # NÃO ALTERAMOS O JAVA
      #
      # Mostra o Main.java original apenas para confirmar
      # exatamente o que estamos compilando.
      # ============================================================

      - name: Show original Hello World
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo " ORIGINAL JAVA HELLO WORLD"
          echo "========================================"

          find \
            javm-nx-poc/java-hello-world/src \
            -type f \
            -name "*.java" \
            -print \
            -exec cat {} \;

          echo ""
          echo "========================================"

      # ============================================================
      # Compila biblioteca Java NX
      # ============================================================

      - name: Build NX Java library
        working-directory: javm-nx-poc/nx/java
        run: |
          mvn package

      # ============================================================
      # Compila Hello World ORIGINAL
      # ============================================================

      - name: Build original Hello World
        working-directory: javm-nx-poc/java-hello-world
        run: |
          mvn clean package

      # ============================================================
      # Mostra os JARs gerados
      # ============================================================

      - name: Locate Hello World JAR
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo " JAR GERADO"
          echo "========================================"

          find \
            javm-nx-poc/java-hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

      # ============================================================
      # Patch mínimo do launcher
      #
      # O javm abre diretamente:
      #
      # sdmc:/switch/java-hello-world.jar
      #
      # Não adicionamos console, loops, checkpoints etc.
      # ============================================================

      - name: Patch direct Hello World launch
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/javm/source/Main.cpp"); s=p.read_text(); marker="int main(int argc, char **argv)"; marker2="int main(int argc, char *argv[])"; marker=marker if marker in s else marker2; assert marker in s, "main nao encontrado"; start=s.index(marker); brace=s.index("{", start)+1; patch="\n    static char direct_app[] = \"javm.nro\";\n    static char direct_jar[] = \"sdmc:/switch/java-hello-world.jar\";\n    static char *direct_argv[] = { direct_app, direct_jar, nullptr };\n    argc = 2;\n    argv = direct_argv;\n"; p.write_text(s[:brace]+patch+s[brace:]); print(p.read_text())'

      # ============================================================
      # Confere se o caminho foi inserido
      # ============================================================

      - name: Verify direct launch patch
        shell: bash
        run: |
          set -e

          grep -q \
            'sdmc:/switch/java-hello-world.jar' \
            javm-nx-poc/javm/source/Main.cpp

          echo ""
          echo "Direct launch OK"

      # ============================================================
      # Compila javm.nro
      # ============================================================

      - name: Build JavaVM
        working-directory: javm-nx-poc/javm
        run: |
          make clean || true
          make -j2

      # ============================================================
      # Localiza NRO e JAR
      # ============================================================

      - name: Locate build outputs
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo " NRO"
          echo "========================================"

          find \
            javm-nx-poc/javm \
            -type f \
            -name "javm.nro" \
            -print

          echo ""
          echo "========================================"
          echo " JAR"
          echo "========================================"

          find \
            javm-nx-poc/java-hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

      # ============================================================
      # Cria pacote SD LIMPO
      #
      # Resultado:
      #
      # SD/
      #   switch/
      #     javm.nro
      #     java-hello-world.jar
      #
      # ============================================================

      - name: Prepare clean recovery package
        shell: bash
        run: |
          set -e

          rm -rf SD

          mkdir -p SD/switch


          JAVM_NRO=$(find \
            javm-nx-poc/javm \
            -type f \
            -name "javm.nro" \
            | head -n 1)


          HELLO_JAR=$(find \
            javm-nx-poc/java-hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | head -n 1)


          if [ -z "$JAVM_NRO" ]; then

            echo "ERRO: javm.nro nao encontrado"

            exit 1
          fi


          if [ -z "$HELLO_JAR" ]; then

            echo "ERRO: java-hello-world.jar nao encontrado"

            exit 1
          fi


          echo ""
          echo "Copiando NRO:"
          echo "$JAVM_NRO"


          cp \
            "$JAVM_NRO" \
            SD/switch/javm.nro


          echo ""
          echo "Copiando JAR:"
          echo "$HELLO_JAR"


          cp \
            "$HELLO_JAR" \
            SD/switch/java-hello-world.jar


          echo ""
          echo "========================================"
          echo " Minecraft-NX Recovery v2"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Pacote final:"

          find \
            SD \
            -type f \
            -print

      # ============================================================
      # Verificação final
      # ============================================================

      - name: Verify recovery package
        shell: bash
        run: |
          set -e

          test -f \
            SD/switch/javm.nro

          test -f \
            SD/switch/java-hello-world.jar


          echo ""
          echo "=== javm.nro ==="

          ls -lh \
            SD/switch/javm.nro


          echo ""
          echo "=== java-hello-world.jar ==="

          ls -lh \
            SD/switch/java-hello-world.jar


          echo ""
          echo "========================================"
          echo " RECOVERY v2 OK"
          echo " Created by Farbert_Took"
          echo "========================================"

      # ============================================================
      # Artifact único
      # ============================================================

      - name: Upload Recovery v2
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-Recovery-v2
          path: SD
