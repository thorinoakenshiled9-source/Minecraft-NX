name: Minecraft-NX Native JVM Bridge v3.4

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took
          path: Minecraft-NX.nro


  java-bridge:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:

      # ============================================================
      # Ferramentas
      # ============================================================

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      # ============================================================
      # JavaVM
      # ============================================================

      - name: Clone JavaVM
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      # ============================================================
      # Compatibilidade C++
      # ============================================================

      - name: Patch algorithm compatibility
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; files=[Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp"),Path("javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp")]; [(p.write_text(("#include <algorithm>\n" if "#include <algorithm>" not in p.read_text() else "")+p.read_text())) for p in files]'

      # ============================================================
      # HID moderno para biblioteca NX/Java
      # ============================================================

      - name: Port Java HID to modern libnx
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/nx/native/nx/hid/Input.class.hpp"); s="""#pragma once

          #include <nx_Include.hpp>
          #include <switch.h>

          namespace nx::hid {

              class Input : public native::Class {

                  private:

                      inline static PadState pad;
                      inline static bool initialized = false;

                      static void EnsureInitialized() {

                          if(!initialized) {

                              padConfigureInput(
                                  1,
                                  HidNpadStyleSet_NpadStandard
                              );

                              padInitializeDefault(&pad);

                              initialized = true;
                          }
                      }

                  public:

                      JAVM_NATIVE_CLASS_CTOR(Input) {

                          JAVM_NATIVE_CLASS_NAME("nx.hid.Input")

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getDownInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getUpInput
                          )

                          JAVM_NATIVE_CLASS_REGISTER_STATIC_FN(
                              getHeldInput
                          )
                      }

                      core::Value getDownInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();
                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsDown(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getUpInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();
                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtonsUp(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }

                      core::Value getHeldInput(
                          core::Frame &frame,
                          std::vector<core::FunctionParameter> parameters
                      ) {

                          if(parameters.size() > 0) {

                              auto controller =
                                  parameters[0].value->Get<long>();

                              (void)controller;

                              EnsureInitialized();
                              padUpdate(&pad);

                              u64 keys =
                                  padGetButtons(&pad);

                              return core::CreateNewValue<long>(
                                  static_cast<long>(keys)
                              );
                          }

                          JAVM_NATIVE_CLASS_NO_RETURN
                      }
              };

          }
          """; p.write_text(s)'

      # ============================================================
      # Confirma HID
      # ============================================================

      - name: Verify HID
        shell: bash
        run: |
          grep -q "Input.class.hpp" \
            javm-nx-poc/nx/native/nx_Java.hpp

          grep -q "LoadNativeClass<hid::Input>" \
            javm-nx-poc/nx/native/nx_Java.hpp

          echo "HID OK"

      # ============================================================
      # Java minimo
      # ============================================================

      - name: Create Java bridge test
        shell: bash
        run: |
          MAIN_JAVA=$(find javm-nx-poc/java-hello-world/src -type f -name "Main.java" | head -n 1)

          if [ -z "$MAIN_JAVA" ]; then
            echo "ERRO: Main.java nao encontrado"
            exit 1
          fi

          printf '%s\n' \
          'package javmnx.helloworld;' \
          '' \
          'public class Main {' \
          '' \
          '    public static void main(String[] args) {' \
          '' \
          '        System.out.println("");' \
          '        System.out.println("================================");' \
          '        System.out.println(" Minecraft-NX Java");' \
          '        System.out.println(" Created by Farbert_Took");' \
          '        System.out.println("================================");' \
          '        System.out.println("");' \
          '        System.out.println("[JAVA 1] main() iniciou");' \
          '' \
          '        int value = 21 * 2;' \
          '' \
          '        if(value == 42) {' \
          '            System.out.println("[JAVA 2] bytecode OK");' \
          '        }' \
          '' \
          '        System.out.println("[JAVA 3] main() terminou");' \
          '    }' \
          '}' \
          > "$MAIN_JAVA"

          echo "=== Main.java ==="
          cat "$MAIN_JAVA"

      # ============================================================
      # Biblioteca Java NX
      # ============================================================

      - name: Build nx Java library
        working-directory: javm-nx-poc/nx/java
        run: |
          mvn package

      # ============================================================
      # JAR
      # ============================================================

      - name: Build Java test
        working-directory: javm-nx-poc/java-hello-world
        run: |
          mvn clean package

      # ============================================================
      # Launcher nativo de diagnostico
      #
      # IMPORTANTE:
      # console + controle funcionam ANTES da JVM.
      # ============================================================

      - name: Install native bridge launcher
        shell: bash
        run: |
          MAIN_CPP="javm-nx-poc/javm/source/Main.cpp"

          cat > "$MAIN_CPP" <<'EOF'
          #include <switch.h>
          #include <stdio.h>
          #include <string>

          #include <javm/core/core_Machine.hpp>

          using namespace javm;

          #include <nx_Java.hpp>


          static PadState g_pad;


          void UpdateScreen() {

              consoleUpdate(NULL);
          }


          void ClearScreen() {

              printf("\x1b[2J");
              printf("\x1b[H");
          }


          bool WaitForA() {

              while(appletMainLoop()) {

                  padUpdate(&g_pad);

                  u64 down =
                      padGetButtonsDown(&g_pad);


                  if(down & HidNpadButton_Plus) {
                      return false;
                  }


                  if(down & HidNpadButton_A) {
                      return true;
                  }


                  consoleUpdate(NULL);

                  svcSleepThread(
                      16'000'000
                  );
              }


              return false;
          }


          void WaitForExit() {

              while(appletMainLoop()) {

                  padUpdate(&g_pad);

                  u64 down =
                      padGetButtonsDown(&g_pad);


                  if(down & HidNpadButton_Plus) {
                      break;
                  }


                  consoleUpdate(NULL);

                  svcSleepThread(
                      16'000'000
                  );
              }
          }


          void PrintHeader() {

              printf(
                  "Minecraft-NX - Native/JVM Bridge v3.4\n"
              );

              printf(
                  "Created by Farbert_Took\n"
              );

              printf(
                  "===================================\n\n"
              );
          }


          int main(int argc, char **argv) {

              consoleInit(NULL);


              padConfigureInput(
                  1,
                  HidNpadStyleSet_NpadStandard
              );

              padInitializeDefault(
                  &g_pad
              );


              ClearScreen();

              PrintHeader();


              printf(
                  "[BOOT 1] NRO iniciou.\n"
              );

              printf(
                  "[BOOT 2] consoleInit OK.\n"
              );

              printf(
                  "[BOOT 3] PadState OK.\n\n"
              );


              printf(
                  "A JavaVM AINDA NAO FOI INICIADA.\n\n"
              );


              printf(
                  "A = criar JavaVM\n"
              );

              printf(
                  "+ = sair\n"
              );


              UpdateScreen();


              if(!WaitForA()) {

                  consoleExit(NULL);

                  return 0;
              }


              ClearScreen();

              PrintHeader();


              printf(
                  "[NATIVE 1] Criando core::Machine...\n"
              );

              UpdateScreen();


              core::Machine machine;


              printf(
                  "[NATIVE 2] core::Machine OK.\n\n"
              );


              printf(
                  "A = carregar classes nativas\n"
              );

              printf(
                  "+ = sair\n"
              );


              UpdateScreen();


              if(!WaitForA()) {

                  consoleExit(NULL);

                  return 0;
              }


              printf(
                  "\n[NATIVE 3] LoadBuiltinNativeClasses...\n"
              );

              UpdateScreen();


              machine.LoadBuiltinNativeClasses();


              printf(
                  "[NATIVE 4] Builtin classes OK.\n\n"
              );


              printf(
                  "A = carregar classes NX\n"
              );

              printf(
                  "+ = sair\n"
              );


              UpdateScreen();


              if(!WaitForA()) {

                  consoleExit(NULL);

                  return 0;
              }


              printf(
                  "\n[NATIVE 5] nx::LoadClasses...\n"
              );

              UpdateScreen();


              nx::LoadClasses(machine);


              printf(
                  "[NATIVE 6] Classes NX OK.\n\n"
              );


              printf(
                  "A = carregar test.jar\n"
              );

              printf(
                  "+ = sair\n"
              );


              UpdateScreen();


              if(!WaitForA()) {

                  consoleExit(NULL);

                  return 0;
              }


              std::string jar =
                  "sdmc:/switch/minecraft-nx/test.jar";


              printf(
                  "\n[NATIVE 7] LoadJavaArchive...\n"
              );

              printf(
                  "JAR: %s\n",
                  jar.c_str()
              );


              UpdateScreen();


              auto &jar_ref =
                  machine.LoadJavaArchive(jar);


              printf(
                  "[NATIVE 8] LoadJavaArchive retornou.\n"
              );


              UpdateScreen();


              if(!jar_ref->CanBeExecuted()) {

                  printf(
                      "\n[ERRO] JAR nao executavel.\n"
                  );

                  printf(
                      "\nPressione + para sair.\n"
                  );


                  UpdateScreen();

                  WaitForExit();

                  consoleExit(NULL);

                  return 0;
              }


              printf(
                  "[NATIVE 9] JAR executavel.\n\n"
              );


              printf(
                  "A = executar Java main()\n"
              );

              printf(
                  "+ = sair\n"
              );


              UpdateScreen();


              if(!WaitForA()) {

                  consoleExit(NULL);

                  return 0;
              }


              printf(
                  "\n[NATIVE 10] Criando args Java...\n"
              );

              UpdateScreen();


              auto args_array_value =
                  core::CreateArray<java::lang::String>(0);


              printf(
                  "[NATIVE 11] args OK.\n"
              );


              printf(
                  "[NATIVE 12] Chamando Java main()...\n\n"
              );


              UpdateScreen();


              machine.CallFunction(
                  jar_ref->GetMainClass(),
                  "main",
                  args_array_value
              );


              printf(
                  "\n[NATIVE 13] Java main() retornou.\n"
              );


              UpdateScreen();


              if(machine.WasExceptionThrown()) {

                  auto info =
                      machine.GetExceptionInfo();


                  printf(
                      "\n[JAVA EXCEPTION]\n"
                  );


                  printf(
                      "Classe: %s\n",
                      info.class_type.c_str()
                  );


                  printf(
                      "Mensagem: %s\n",
                      info.message.c_str()
                  );


                  printf(
                      "\nPressione + para sair.\n"
                  );


                  UpdateScreen();

                  WaitForExit();

                  consoleExit(NULL);

                  return 0;
              }


              printf(
                  "\n===================================\n"
              );


              printf(
                  "[SUCCESS] Java executou normalmente.\n"
              );


              printf(
                  "Minecraft-NX by Farbert_Took\n"
              );


              printf(
                  "===================================\n\n"
              );


              printf(
                  "O programa permanecera aberto.\n"
              );


              printf(
                  "Pressione + para sair.\n"
              );


              UpdateScreen();


              WaitForExit();


              consoleExit(NULL);

              return 0;
          }
          EOF

          echo ""
          echo "=== Main.cpp ==="
          cat "$MAIN_CPP"

      # ============================================================
      # Build JavaVM
      # ============================================================

      - name: Build JavaVM
        working-directory: javm-nx-poc/javm
        run: |
          make clean || true
          make -j2

      # ============================================================
      # Pacote SD
      # ============================================================

      - name: Prepare SD package
        shell: bash
        run: |
          set -e

          rm -rf SD

          mkdir -p \
            SD/switch/minecraft-nx


          JAVM_NRO=$(find javm-nx-poc/javm -type f -name "javm.nro" | head -n 1)

          TEST_JAR=$(find javm-nx-poc/java-hello-world/target -maxdepth 1 -type f -name "*.jar" | head -n 1)


          if [ -z "$JAVM_NRO" ]; then

            echo "ERRO: javm.nro nao encontrado"

            exit 1
          fi


          if [ -z "$TEST_JAR" ]; then

            echo "ERRO: test.jar nao encontrado"

            exit 1
          fi


          cp \
            "$JAVM_NRO" \
            SD/switch/minecraft-nx/javm.nro


          cp \
            "$TEST_JAR" \
            SD/switch/minecraft-nx/test.jar


          echo ""
          echo "========================================"
          echo " Minecraft-NX Native/JVM Bridge v3.4"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""

          find SD -type f -print

      # ============================================================
      # Verificacao
      # ============================================================

      - name: Verify package
        shell: bash
        run: |
          set -e

          test -f \
            SD/switch/minecraft-nx/javm.nro

          test -f \
            SD/switch/minecraft-nx/test.jar


          echo ""
          echo "=== javm.nro ==="

          ls -lh \
            SD/switch/minecraft-nx/javm.nro


          echo ""
          echo "=== test.jar ==="

          ls -lh \
            SD/switch/minecraft-nx/test.jar


          echo ""
          echo "Minecraft-NX v3.4 pronto"
          echo "Created by Farbert_Took"

      # ============================================================
      # Artifact
      # ============================================================

      - name: Upload Minecraft-NX v3.4
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-v3.4
          path: SD
