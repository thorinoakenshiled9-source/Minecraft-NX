name: Build Minecraft-NX JavaVM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-nro
          path: Minecraft-NX.nro

  javm:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - name: Clone JavaVM
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      - name: Patch algorithm
        run: |
          sed -i '1i #include <algorithm>' javm-nx-poc/libjavm/libjavm/include/javm/core/core_ClassObject.hpp
          sed -i '1i #include <algorithm>' javm-nx-poc/libjavm/libjavm/include/javm/core/core_ManifestFile.hpp

      - name: Disable old HID
        run: |
          sed -
