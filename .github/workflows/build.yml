name: Build Minecraft-NX Java Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Minecraft-NX
        run: make -j2

      - name: Upload Minecraft-NX
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-nro
          path: Minecraft-NX.nro

  java-test:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 maven

      - name: Clone JavaVM
        run: |
          git clone --recursive https://github.com/XorTroll/javm-nx-poc.git

      - name: Patch JavaVM
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; root=Path("javm-nx-poc"); files=[root/"libjavm/libjavm/include/javm/core/core_ClassObject.hpp",root/"libjavm/libjavm/include/javm/core/core_ManifestFile.hpp"]; [(p.write_text(("#include <algorithm>\n" if "#include <algorithm>" not in p.read_text() else "")+p.read_text())) for p in files]; p=root/"nx/native/nx_Java.hpp"; s=p.read_text(); p.write_text("\n".join(line for line in s.splitlines() if "Input.class.hpp" not in line and "LoadNativeClass<hid::Input>" not in line)+"\n")'

      - name: Patch diagnostic
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("javm-nx-poc/javm/source/Main.cpp"); s=p.read_text(); print(s); p.write_text(s.replace("consoleExit(NULL);", "printf(\"\\n[DEBUG] JavaVM chegou ao final do main.\\nUse HOME para sair.\\n\"); consoleUpdate(NULL); while (appletMainLoop()) { consoleUpdate(NULL); } consoleExit(NULL);"))'

      - name: Show patched Main
        run: |
          echo "=== Main.cpp PATCHED ==="
          cat javm-nx-poc/javm/source/Main.cpp

      - name: Build JavaVM
        working-directory: javm-nx-poc/javm
        run: make -j2

      - name: Build nx Java library
        working-directory: javm-nx-poc/nx/java
        run: mvn package

      - name: Build Java Hello World
        working-directory: javm-nx-poc/java-hello-world
        run: mvn package

      - name: Show generated files
        run: |
          echo "=== NRO ==="
          find javm-nx-poc -type f -name "*.nro" -print

          echo "=== JAR ==="
          find javm-nx-poc -type f -name "*.jar" -print

          echo "=== SD OUT ==="
          find javm-nx-poc/sd_out -type f -print || true

      - name: Prepare SD package
        shell: bash
        run: |
          set -e

          rm -rf SD
          mkdir -p SD

          echo "=== Copiando sd_out ==="
          cp -r javm-nx-poc/sd_out/. SD/

          echo "=== Procurando javm.nro ==="

          JAVM_NRO=$(find javm-nx-poc/javm -type f -name "javm.nro" | head -n 1)

          if [ -z "$JAVM_NRO" ]; then
            echo "ERRO: javm.nro nao encontrado"
            echo "NROs existentes:"
            find javm-nx-poc -type f -name "*.nro" -print
            exit 1
          fi

          echo "Encontrado:"
          echo "$JAVM_NRO"

          mkdir -p SD/switch/javm

          cp "$JAVM_NRO" SD/switch/javm/javm.nro

          echo "=== Procurando Hello World ==="

          HELLO_JAR=$(find javm-nx-poc/java-hello-world/target -maxdepth 1 -type f -name "*.jar" | head -n 1)

          if [ -z "$HELLO_JAR" ]; then
            echo "ERRO: java-hello-world.jar nao encontrado"
            exit 1
          fi

          echo "Encontrado:"
          echo "$HELLO_JAR"

          mkdir -p SD/switch

          cp "$HELLO_JAR" SD/switch/java-hello-world.jar

          echo ""
          echo "=== PACOTE FINAL ==="
          find SD -type f -print

      - name: Verify SD package
        shell: bash
        run: |
          set -e

          echo "=== Verificando javm.nro ==="
          test -f SD/switch/javm/javm.nro

          echo "=== Verificando Hello World ==="
          test -f SD/switch/java-hello-world.jar

          echo "=== Verificando file association ==="
          test -f SD/config/nx-hbmenu/fileassoc/javm.cfg

          echo ""
          echo "=== TAMANHOS ==="
          ls -lh SD/switch/javm/javm.nro
          ls -lh SD/switch/java-hello-world.jar

          echo ""
          echo "PACOTE JAVA OK"

      - name: Upload Java diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Java-Diagnostic-SD
          path: SD
