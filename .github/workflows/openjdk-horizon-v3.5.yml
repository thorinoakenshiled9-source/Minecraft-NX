      - name: Create native semaphore_horizon.hpp
        shell: bash
        run: |
          set -e

          mkdir -p openjdk21/src/hotspot/os/horizon

          cat > openjdk21/src/hotspot/os/horizon/semaphore_horizon.hpp <<'EOF'
          /*
           * Minecraft-NX
           * OpenJDK Horizon experimental port
           * Created by Farbert_Took
           *
           * HotSpot semaphore backend for Horizon/libnx.
           *
           * This implementation deliberately avoids pthread and Linux
           * aliases. A semaphore is represented by a protected permit
           * count plus a libnx condition variable.
           *
           * Runtime/safepoint correctness still requires validation on
           * real Horizon hardware after the VM can link and start.
           */

          #ifndef OS_HORIZON_SEMAPHORE_HORIZON_HPP
          #define OS_HORIZON_SEMAPHORE_HORIZON_HPP

          #include <stdint.h>

          // libnx defines a Mutex typedef which collides with HotSpot's
          // class Mutex. Rename it only while importing libnx headers.
          #define Mutex NxMutex
          #include <switch/kernel/mutex.h>
          #include <switch/kernel/condvar.h>
          #undef Mutex

          class PlatformSemaphore {
           public:
            struct Impl {
              NxMutex mutex;
              CondVar cond;
              uint64_t count;
              explicit Impl(uint value) : count((uint64_t)value) { mutexInit(&mutex); condvarInit(&cond); }
              void signal(uint permits) {
                if (!permits) return;
                mutexLock(&mutex);
                count += (uint64_t)permits;
                if (permits == 1) condvarWakeOne(&cond); else condvarWakeAll(&cond);
                mutexUnlock(&mutex);
              }
              void wait() {
                mutexLock(&mutex);
                while (count == 0) condvarWait(&cond, &mutex);
                --count; mutexUnlock(&mutex);
              }
              bool trywait() {
                bool ok=false; mutexLock(&mutex);
                if (count) { --count; ok=true; }
                mutexUnlock(&mutex); return ok;
              }
            };
            Impl _impl;
            explicit PlatformSemaphore(uint value = 0) : _impl(value) {}
            ~PlatformSemaphore() {}
           private:
            NONCOPYABLE(PlatformSemaphore);
          };

          #endif // OS_HORIZON_SEMAPHORE_HORIZON_HPP
          EOF

          cat > horizon-research/semaphore-strategy-v3.5.txt <<'EOF'
          Minecraft-NX / OpenJDK Horizon v3.5
          Created by Farbert_Took

          Decision: NATIVE HORIZON SEMAPHORE BACKEND
          pthread: NO
          Linux alias: NO

          Backend:
          - libnx Mutex
          - libnx CondVar
          - protected uint64 permit count

          Semantics:
          - signal(n) adds permits and wakes waiters
          - wait() loops until a permit exists, then consumes one
          - trywait() consumes one only when immediately available
          - wait loop tolerates spurious condition-variable wakeups

          This is an experimental HotSpot port.
          Compile success does not prove safepoint/runtime correctness.
          EOF

          echo "===== semaphore_horizon.hpp ====="
          sed -n '1,360p' \
            openjdk21/src/hotspot/os/horizon/semaphore_horizon.hpp

