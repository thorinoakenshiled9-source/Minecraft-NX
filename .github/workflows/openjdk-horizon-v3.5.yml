          #include <switch.h>
          #include <stdint.h>

          struct NxSemaphoreProbe {
              Mutex mutex;
              CondVar cond;
              uint64_t count;
          };

          static void init_probe(NxSemaphoreProbe* s) {
              mutexInit(&s->mutex);
              condvarInit(&s->cond);
              s->count = 0;
          }

          static void signal_probe(NxSemaphoreProbe* s) {
              mutexLock(&s->mutex);
              ++s->count;
              condvarWakeOne(&s->cond);
              mutexUnlock(&s->mutex);
          }

          static bool trywait_probe(NxSemaphoreProbe* s) {
              bool ok = false;
              mutexLock(&s->mutex);
              if (s->count != 0) {
                  --s->count;
                  ok = true;
              }
              mutexUnlock(&s->mutex);
              return ok;
          }

          int main() {
              NxSemaphoreProbe s;
              init_probe(&s);
              signal_probe(&s);
              return trywait_probe(&s) ? 0 : 1;
          }
