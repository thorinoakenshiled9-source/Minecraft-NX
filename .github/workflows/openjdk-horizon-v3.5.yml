      # ============================================================
      # Probe HotSpot
      # ============================================================

      - name: Probe HotSpot v3.5
        shell: bash
        run: |
          set +e

          CONFIG=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null || echo 99
          )

          if [ "$CONFIG" != "0" ]; then
            echo 99 \
              > horizon-research/hotspot-exit-code.txt
            exit 0
          fi

          cd openjdk21

          make \
            LOG=trace \
            hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v3.5.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          exit 0

      # ============================================================
      # Analyze next failure
      # ============================================================

      - name: Analyze HotSpot v3.5
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path
          import re

          log_path = Path(
              "horizon-research/hotspot-build-v3.5.log"
          )

          if not log_path.exists():
              raise SystemExit(0)

          text = log_path.read_text(
              errors="replace"
          )

          lines = text.splitlines()

          def result(name, present):
              Path(
                  "horizon-research/" + name
              ).write_text(
                  ("PRESENT" if present else "PASSED")
                  + "\n"
              )

          Path(
              "horizon-research/macro-result.txt"
          ).write_text(
              (
                  "YES\n"
                  if "-DMINECRAFT_NX_HORIZON=1" in text
                  else "NO\n"
              )
          )

          result(
              "dlfcn-result.txt",
              "fatal error: dlfcn.h: "
              "No such file or directory" in text
          )

          result(
              "globaldefinitions-result.txt",
              '#error "missing platform-specific '
              'definition here"' in text
          )

          result(
              "c1-result.txt",
              "fatal error: c1_globals_horizon.hpp: "
              "No such file or directory" in text
          )

          result(
              "globals-result.txt",
              "fatal error: globals_horizon.hpp: "
              "No such file or directory" in text
          )

          result(
              "os-cpu-globals-result.txt",
              "fatal error: globals_horizon_aarch64.hpp: "
              "No such file or directory" in text
          )

          result(
              "orderaccess-result.txt",
              "fatal error: orderAccess_horizon_aarch64.hpp: "
              "No such file or directory" in text
          )

          result(
              "atomic-result.txt",
              "fatal error: atomic_horizon_aarch64.hpp: "
              "No such file or directory" in text
          )
          
          result(
              "mutex-result.txt",
              "fatal error: mutex_horizon.hpp: "
              "No such file or directory" in text
          )


          result(
              "park-result.txt",
              "fatal error: park_horizon.hpp: "
              "No such file or directory" in text
          )


          result(
              "javathread-result.txt",
              "fatal error: javaThread_horizon_aarch64.hpp: "
              "No such file or directory" in text
          )


          result(
              "semaphore-result.txt",
              "fatal error: semaphore_horizon.hpp: "
              "No such file or directory" in text
          )


          result(
              "copy-result.txt",
              "fatal error: copy_horizon_aarch64.hpp: "
              "No such file or directory" in text
          )

          result(
              "icache-result.txt",
              "fatal error: icache_horizon_aarch64.hpp: "
              "No such file or directory" in text
          )
          result(
              "pauth-result.txt",
              "fatal error: pauth_horizon_aarch64.inline.hpp: "
              "No such file or directory" in text
          )
          result(
              "stdint-result.txt",
              "conflicting declaration" in text and
              ("uint64_t" in text or "intptr_t" in text)
          )
          result(
              "semaphore-impl-result.txt",
              "'_impl' was not declared in this scope" in text
          )

          result(
              "libnx-collision-result.txt",
              "conflicting declaration 'typedef uint8_t u8'" in text or
              "conflicting declaration 'typedef int8_t s8'" in text or
              "conflicting declaration 'typedef u32 Handle'" in text
          )
          result(
              "prixptr-result.txt",
              "expected ')' before 'PRIxPTR'" in text
          )
          result(
              "semaphore-api-result.txt",
              "class PlatformSemaphore' has no member named" in text
          )

          missing = []

          for m in re.findall(
              r"fatal error:\s*([^:\s]*horizon[^:\s]*\.hpp)"
              r":\s*No such file or directory",
              text,
              re.I
          ):
              if m not in missing:
                  missing.append(m)

          Path(
              "horizon-research/"
              "missing-horizon-headers-v3.5.txt"
          ).write_text(
              (
                  "\n".join(missing) + "\n"
                  if missing
                  else "None detected.\n"
              )
          )

          patterns = [
              (
                  "MISSING HORIZON OS+CPU HEADER",
                  re.compile(
                      r"fatal error: .*horizon_aarch64\.hpp:"
                      r" No such file or directory",
                      re.I
                  )
              ),
              (
                  "MISSING HORIZON OS HEADER",
                  re.compile(
                      r"fatal error: .*horizon\.hpp:"
                      r" No such file or directory",
                      re.I
                  )
              ),
              (
                  "MISSING SYSTEM HEADER",
                  re.compile(
                      r"fatal error: .*\.h:"
                      r" No such file or directory",
                      re.I
                  )
              ),
              (
                  "UNDECLARED API",
                  re.compile(
                      r"was not declared in this scope|"
                      r"has not been declared|"
                      r"no member named|"
                      r"not a member of",
                      re.I
                  )
              ),
              (
                  "PREPROCESSOR ERROR",
                  re.compile(
                      r"error:\s*#error",
                      re.I
                  )
              ),
              (
                  "LINKER ERROR",
                  re.compile(
                      r"undefined reference|"
                      r"collect2:.*error|"
                      r"ld:.*error",
                      re.I
                  )
              ),
              (
                  "COMPILER ERROR",
                  re.compile(
                      r"(^|[\s:])error:",
                      re.I
                  )
              ),
          ]

          first = None

          for i, line in enumerate(lines):
              for label, regex in patterns:
                  if regex.search(line):
                      first = (
                          i,
                          label,
                          line
                      )
                      break

              if first:
                  break

          out = [
              "========================================",
              " Minecraft-NX",
              " HOTSPOT DIAGNOSTIC v3.5",
              " Created by Farbert_Took",
              "========================================",
              "",
          ]

          if first:
              i, label, line = first

              out += [
                  "FIRST FAILURE TYPE: " + label,
                  "FIRST FAILURE LINE: " + str(i + 1),
                  "",
                  "===== CONTEXT =====",
                  "",
              ]

              start = max(
                  0,
                  i - 20
              )

              end = min(
                  len(lines),
                  i + 60
              )

              for n in range(start, end):
                  out.append(
                      f"{n + 1}: {lines[n]}"
                  )

          else:
              out += [
                  "No standard compiler failure detected.",
                  "Inspect the build tail.",
              ]

          Path(
              "horizon-research/diagnostic-v3.5.txt"
          ).write_text(
              "\n".join(out) + "\n"
          )

          portability = []

          api_re = re.compile(
              r"fatal error:|"
              r"was not declared in this scope|"
              r"has not been declared|"
              r"undefined reference|"
              r"no member named|"
              r"not a member of",
              re.I
          )

          for i, line in enumerate(lines):
              if api_re.search(line):
                  portability.append(
                      f"{i + 1}: {line}"
                  )

          Path(
              "horizon-research/"
              "portability-errors-v3.5.txt"
          ).write_text(
              (
                  "\n".join(portability[:150]) + "\n"
                  if portability
                  else "None detected.\n"
              )
          )
          PY

          tail \
            -n 300 \
            horizon-research/hotspot-build-v3.5.log \
            > horizon-research/hotspot-last-300-v3.5.txt \
            2>/dev/null \
            || true

          exit 0

