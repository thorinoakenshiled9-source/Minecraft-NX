          test -f \
            openjdk21/src/hotspot/os_cpu/horizon_aarch64/orderAccess_horizon_aarch64.hpp

          test -f \
            openjdk21/src/hotspot/os_cpu/horizon_aarch64/atomic_horizon_aarch64.hpp
           
          test -f \
            openjdk21/src/hotspot/os/horizon/mutex_horizon.hpp

          grep -q "NxMutex _mutex" \
            openjdk21/src/hotspot/os/horizon/mutex_horizon.hpp
          grep -q "CondVar _cond" \
            openjdk21/src/hotspot/os/horizon/mutex_horizon.hpp


          test -f \
            openjdk21/src/hotspot/os/horizon/park_horizon.hpp

          grep -q "class PlatformEvent" \
            openjdk21/src/hotspot/os/horizon/park_horizon.hpp

          grep -q "class PlatformParker" \
            openjdk21/src/hotspot/os/horizon/park_horizon.hpp


          test -f \
            openjdk21/src/hotspot/os_cpu/horizon_aarch64/javaThread_horizon_aarch64.hpp


          test -f \
            openjdk21/src/hotspot/os/horizon/semaphore_horizon.hpp

          grep -q "class PlatformSemaphore" \
            openjdk21/src/hotspot/os/horizon/semaphore_horizon.hpp


          test -f \
            openjdk21/src/hotspot/os_cpu/horizon_aarch64/copy_horizon_aarch64.hpp

          test -f \
            openjdk21/src/hotspot/os_cpu/horizon_aarch64/icache_horizon_aarch64.hpp
          grep -q "Impl _impl" \
            openjdk21/src/hotspot/os/horizon/semaphore_horizon.hpp


          echo "===== HORIZON OS ====="

          find \
            openjdk21/src/hotspot/os/horizon \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "===== HORIZON OS+CPU ====="

          find \
