          set -e
          mkdir -p openjdk21/src/hotspot/os/horizon
          cat > openjdk21/src/hotspot/os/horizon/mutex_horizon.hpp <<'EOF'
          /*
           * Minecraft-NX - OpenJDK Horizon experimental port
           * Created by Farbert_Took
           * Native libnx synchronization backend.
           */
          #ifndef OS_HORIZON_MUTEX_HORIZON_HPP
          #define OS_HORIZON_MUTEX_HORIZON_HPP
          #include <stdint.h>

          // libnx and HotSpot both use the global name Mutex.
          // Rename only the libnx typedef while parsing its headers.
          #define Mutex NxMutex
          #include <switch/kernel/mutex.h>
          #include <switch/kernel/condvar.h>
          #undef Mutex

          class PlatformMutex : public CHeapObj<mtSynchronizer> {
           private:
            PlatformMutex(const PlatformMutex&);
            PlatformMutex& operator=(const PlatformMutex&);
           protected:
            NxMutex _mutex;
            NxMutex* mutex() { return &_mutex; }
           public:
            PlatformMutex() { mutexInit(&_mutex); }
            ~PlatformMutex() {}
            void lock() { mutexLock(&_mutex); }
            void unlock() { mutexUnlock(&_mutex); }
            bool try_lock() { return mutexTryLock(&_mutex); }
          };

          class PlatformMonitor : public PlatformMutex {
           private:
            PlatformMonitor(const PlatformMonitor&);
            PlatformMonitor& operator=(const PlatformMonitor&);
            CondVar _cond;
           public:
            PlatformMonitor() : PlatformMutex() { condvarInit(&_cond); }
            ~PlatformMonitor() {}

            int wait(jlong millis) {
              if (millis <= 0) {
                Result rc = condvarWait(&_cond, mutex());
                return rc == 0 ? 0 : 1;
              }

              const uint64_t nanos_per_milli = 1000000ULL;
              uint64_t timeout_ns =
                  ((uint64_t)millis > UINT64_MAX / nanos_per_milli)
                  ? UINT64_MAX
                  : (uint64_t)millis * nanos_per_milli;

              Result rc = condvarWaitTimeout(&_cond, mutex(), timeout_ns);
              return rc == 0 ? 0 : 1;
            }

            void notify() { (void)condvarWakeOne(&_cond); }
            void notify_all() { (void)condvarWakeAll(&_cond); }
          };
          #endif
          EOF

          cat > horizon-research/mutex-strategy-v3.5.txt <<'EOF'
          Minecraft-NX / OpenJDK Horizon v3.5
          Created by Farbert_Took
          Decision: NATIVE HORIZON BACKEND
          pthread copy: NO
          Linux alias: NO
          Backend: libnx Mutex + CondVar
          Note: compilation success is not yet proof of runtime/safepoint correctness.
          EOF

          cat openjdk21/src/hotspot/os/horizon/mutex_horizon.hpp

