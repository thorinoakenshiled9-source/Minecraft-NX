name: OpenJDK Horizon Research v3.5

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git bash autoconf automake libtool make cmake ninja-build \
            zip unzip file python3 build-essential ca-certificates \
            curl wget tar gzip grep sed gawk pkg-config

          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v3.5"
          echo " Created by Farbert_Took"
          echo "========================================"

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          cat > horizon-research/info.txt <<'EOF'
          Minecraft-NX
          OpenJDK Horizon Research v3.5
          Created by Farbert_Took

          Target: Nintendo Switch Horizon
          CPU: AArch64
          JVM: OpenJDK 21 HotSpot
          Variant: minimal
          Mode: headless

          Passed:
          - configure Horizon
          - JvmMapfile
          - MINECRAFT_NX_HORIZON
          - dlfcn global blocker
          - globalDefinitions GCC blocker
          - c1_globals_horizon.hpp
          - globals_horizon.hpp
          - globals_horizon_aarch64.hpp
          - orderAccess_horizon_aarch64.hpp

          v3.5 target:
          - atomic_horizon_aarch64.hpp
          - inspect next Horizon portability blocker
          EOF

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x "$DEVKITA64/bin/aarch64-none-elf-gcc"
          test -x "$DEVKITA64/bin/aarch64-none-elf-g++"
          test -x "$DEVKITA64/bin/aarch64-none-elf-nm"
          test -f "$DEVKITPRO/libnx/include/switch.h"

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

      # ============================================================
      # Boot JDK
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt

      # ============================================================
      # FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build
          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER="$DEVKITA64/bin/aarch64-none-elf-gcc" \
            -DCMAKE_AR="$DEVKITA64/bin/aarch64-none-elf-ar" \
            -DCMAKE_RANLIB="$DEVKITA64/bin/aarch64-none-elf-ranlib" \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          CONFIG=${PIPESTATUS[0]}

          if [ "$CONFIG" != "0" ]; then
            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" = "0" ]; then
            ninja install
          fi

          exit 0

      - name: Locate FreeType
        shell: bash
        run: |
          set +e

          LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name libfreetype.a \
              | sed -n '1p'
          )

          if [ -z "$LIB" ]; then
            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"
          else
            echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
            echo "FREETYPE_LIBDIR=$(dirname "$LIB")" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # OpenJDK
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt

      # ============================================================
      # Horizon configure patches
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          existing = re.search(
              r'(?m)^([ \t]*)elf\)[ \t]*$',
              s
          )

          if existing:
              area = s[existing.start():existing.start()+300]

              if "VAR_OS=horizon" in area:
                  print("Already mapped")
                  raise SystemExit(0)

              raise SystemExit("Unexpected existing elf case")

          error = re.search(
              r'unsupported operating system',
              s,
              re.I
          )

          if not error:
              raise SystemExit("Unsupported OS marker missing")

          matches = list(
              re.finditer(
                  r'(?m)^([ \t]*)\*\)[ \t]*$',
                  s[:error.start()]
              )
          )

          if not matches:
              raise SystemExit("OS fallback missing")

          m = matches[-1]
          indent = m.group(1)

          block = (
              f"{indent}elf)\n"
              f"{indent}  VAR_OS=horizon\n"
              f"{indent}  ;;\n"
          )

          p.write_text(
              s[:m.start()] + block + s[m.start():]
          )
          PY

      - name: Patch configure dependencies
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          def bypass_error(needle, warning, variables):
              for p in root.rglob("*.m4"):
                  lines = p.read_text(
                      errors="ignore"
                  ).splitlines(True)

                  for i, line in enumerate(lines):
                      if (
                          needle in line
                          and "AC_MSG_ERROR" in line
                      ):
                          indent = line[
                              :len(line)-len(line.lstrip())
                          ]

                          original = line.rstrip("\n")

                          assignments = ""

                          for variable in variables:
                              assignments += (
                                  indent +
                                  f'  {variable}=""\n'
                              )

                          lines[i] = (
                              indent +
                              'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n' +
                              indent +
                              f'  AC_MSG_WARN([{warning}])\n' +
                              assignments +
                              indent +
                              'else\n' +
                              original + '\n' +
                              indent +
                              'fi\n'
                          )

                          p.write_text("".join(lines))
                          print("Patched:", p)
                          return

              raise SystemExit(
                  "Configure check missing: " + needle
              )

          bypass_error(
              "Could not find cups",
              "CUPS disabled for experimental Horizon target",
              ["CUPS_CFLAGS", "CUPS_LIBS"]
          )

          bypass_error(
              "Could not find fontconfig",
              "Fontconfig disabled for experimental Horizon target",
              ["FONTCONFIG_CFLAGS", "FONTCONFIG_LIBS"]
          )

          bypass_error(
              "Could not find X11 libraries",
              "X11 libraries disabled for Horizon headless target",
              ["X_CFLAGS", "X_LIBS"]
          )

          bypass_error(
              "Could not find all X11 headers",
              "X11 headers disabled for Horizon headless target",
              ["X_CFLAGS", "X_LIBS"]
          )
          PY

      - name: Patch static FreeType
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit(
                  "FreeType expression changed upstream"
              )

          p.write_text(
              s.replace(old, new, 1)
          )
          PY

      # ============================================================
      # Configure
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then
            echo 99 > horizon-research/configure-exit-code.txt
            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC="$DEVKITA64/bin/aarch64-none-elf-gcc" \
            CXX="$DEVKITA64/bin/aarch64-none-elf-g++" \
            AR="$DEVKITA64/bin/aarch64-none-elf-ar" \
            NM="$DEVKITA64/bin/aarch64-none-elf-nm" \
            OBJCOPY="$DEVKITA64/bin/aarch64-none-elf-objcopy" \
            STRIP="$DEVKITA64/bin/aarch64-none-elf-strip" \
            2>&1 \
            | tee ../horizon-research/configure-v3.5.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0

      - name: Locate spec.gmk
        shell: bash
        run: |
          set -e

          SPEC=$(
            find openjdk21/build \
              -type f \
              -name spec.gmk \
              | sed -n '1p'
          )

          test -n "$SPEC"

          echo "OPENJDK_SPEC=$SPEC" >> "$GITHUB_ENV"

      # ============================================================
      # JvmMapfile
      # ============================================================

      - name: Add Horizon JvmMapfile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/hotspot/lib/JvmMapfile.gmk"
          )

          s = p.read_text()

          if "isTargetOs, horizon" in s:
              raise SystemExit(0)

          marker = (
              'else ifeq ($(call isTargetOs, macosx), true)'
          )

          if marker not in s:
              raise SystemExit("JvmMapfile marker missing")

          block = r'''else ifeq ($(call isTargetOs, horizon), true)
            # Minecraft-NX / Horizon
            DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only *$(OBJ_SUFFIX)
            ifneq ($(FILTER_SYMBOLS_PATTERN), )
              FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|
            endif
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)^_ZTV|^gHotSpotVM|^UseSharedSpaces$$
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|^_ZN9Arguments17SharedArchivePathE$$
            FILTER_SYMBOLS_AWK_SCRIPT := \
                '{ \
                  if ($$3 ~ /$(FILTER_SYMBOLS_PATTERN)/) print $$3; \
                }'

          '''

          p.write_text(
              s.replace(
                  marker,
                  block + marker,
                  1
              )
          )
          PY

      # ============================================================
      # globalDefinitions
      # ============================================================

      - name: Patch globalDefinitions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          s = p.read_text()

          if "#include <dlfcn.h>" in s:
              s = s.replace(
                  "#include <dlfcn.h>",
                  '''#if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif''',
                  1
              )

          needle = (
              '#error "missing platform-specific '
              'definition here"'
          )

          if needle in s:
              s = s.replace(
                  needle,
                  '''#if defined(MINECRAFT_NX_HORIZON)
          #define DEFAULT_CACHE_LINE_SIZE 64
          #else
          #error "missing platform-specific definition here"
          #endif''',
                  1
              )

          p.write_text(s)
          PY

      # ============================================================
      # Horizon OS headers
      # ============================================================

      - name: Create Horizon OS headers
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/src/hotspot")
          dst = root / "os" / "horizon"

          dst.mkdir(
              parents=True,
              exist_ok=True
          )

          def copy_reference(
              target_name,
              candidate_names
          ):
              candidates = []

              for name in candidate_names:
                  candidates.extend(
                      root.rglob(name)
                  )

              if not candidates:
                  raise SystemExit(
                      "No reference for " + target_name
                  )

              src = candidates[0]
              data = src.read_text()

              data = data.replace(
                  "LINUX",
                  "HORIZON"
              )

              data = data.replace(
                  "Linux",
                  "Horizon"
              )

              target = dst / target_name

              target.write_text(
                  "/* Minecraft-NX Horizon experimental port\n"
                  " * Created by Farbert_Took\n"
                  " * Structural platform defaults only.\n"
                  " */\n\n"
                  + data
              )

              print(
                  target_name,
                  "<-",
                  src
              )

          copy_reference(
              "c1_globals_horizon.hpp",
              [
                  "c1_globals_posix.hpp",
                  "c1_globals_linux.hpp"
              ]
          )

          copy_reference(
              "globals_horizon.hpp",
              [
                  "globals_posix.hpp",
                  "globals_linux.hpp",
                  "globals_bsd.hpp"
              ]
          )
          PY

      # ============================================================
      # Horizon + AArch64 globals
      # ============================================================

      - name: Research OS CPU AArch64 globals
        shell: bash
        run: |
          set -e

          OUT="horizon-research/os-cpu-aarch64-research-v3.5.txt"

          echo "========================================" > "$OUT"
          echo " Minecraft-NX" >> "$OUT"
          echo " OS+CPU AArch64 Research v3.5" >> "$OUT"
          echo " Created by Farbert_Took" >> "$OUT"
          echo "========================================" >> "$OUT"
          echo "" >> "$OUT"

          echo "===== AARCH64 GLOBALS =====" >> "$OUT"

          find openjdk21/src/hotspot/os_cpu \
            -maxdepth 2 \
            -type f \
            -name 'globals_*aarch64*.hpp' \
            -print \
            | sort \
            >> "$OUT" \
            2>/dev/null \
            || true

          cat "$OUT"

      - name: Create globals_horizon_aarch64.hpp
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/src/hotspot")

          dst = (
              root /
              "os_cpu" /
              "horizon_aarch64"
          )

          dst.mkdir(
              parents=True,
              exist_ok=True
          )

          target = (
              dst /
              "globals_horizon_aarch64.hpp"
          )

          preferred = [
              root / "os_cpu" / "linux_aarch64" /
              "globals_linux_aarch64.hpp",

              root / "os_cpu" / "bsd_aarch64" /
              "globals_bsd_aarch64.hpp",
          ]

          source = None
          strategy = None

          for candidate in preferred:
              if candidate.exists():
                  source = candidate

                  if "linux_aarch64" in str(candidate):
                      strategy = (
                          "linux-aarch64-structural-reference"
                      )
                  else:
                      strategy = (
                          "bsd-aarch64-structural-reference"
                      )

                  break

          if source is None:
              matches = list(
                  root.glob(
                      "os_cpu/*_aarch64/"
                      "globals_*_aarch64.hpp"
                  )
              )

              if matches:
                  source = matches[0]
                  strategy = (
                      "first-upstream-aarch64-reference"
                  )

          if source is None:
              raise SystemExit(
                  "No upstream OS+CPU AArch64 globals "
                  "header found."
              )

          data = source.read_text()

          replacements = {
              "globals_linux_aarch64.hpp":
                  "globals_horizon_aarch64.hpp",

              "globals_bsd_aarch64.hpp":
                  "globals_horizon_aarch64.hpp",

              "GLOBALS_LINUX_AARCH64_HPP":
                  "GLOBALS_HORIZON_AARCH64_HPP",

              "GLOBALS_BSD_AARCH64_HPP":
                  "GLOBALS_HORIZON_AARCH64_HPP",

              "OS_CPU_LINUX_AARCH64_GLOBALS_LINUX_AARCH64_HPP":
                  "OS_CPU_HORIZON_AARCH64_GLOBALS_HORIZON_AARCH64_HPP",

              "OS_CPU_BSD_AARCH64_GLOBALS_BSD_AARCH64_HPP":
                  "OS_CPU_HORIZON_AARCH64_GLOBALS_HORIZON_AARCH64_HPP",
          }

          for old, new in replacements.items():
              data = data.replace(old, new)

          banner = '''/*
           * Minecraft-NX
           * OpenJDK Horizon experimental port
           * Created by Farbert_Took
           *
           * Horizon + AArch64 HotSpot platform globals.
           * Horizon remains a distinct target.
           */

          '''

          target.write_text(
              banner + data
          )

          info = Path(
              "horizon-research/"
              "os-cpu-strategy-v3.5.txt"
          )

          info.write_text(
              f"Source: {source}\n"
              f"Strategy: {strategy}\n"
              f"Target: {target}\n"
          )

          print(info.read_text())
          PY

      # ============================================================
      # AArch64 OrderAccess
      # ============================================================

      - name: Research AArch64 OrderAccess
        shell: bash
        run: |
          set -e

          OUT="horizon-research/orderaccess-research-v3.5.txt"

          echo "========================================" > "$OUT"
          echo " Minecraft-NX" >> "$OUT"
          echo " OrderAccess AArch64 Research v3.5" >> "$OUT"
          echo " Created by Farbert_Took" >> "$OUT"
          echo "========================================" >> "$OUT"
          echo "" >> "$OUT"

          echo "===== ALL ORDERACCESS PLATFORM HEADERS =====" >> "$OUT"
          echo "" >> "$OUT"

          find openjdk21/src/hotspot \
            -type f \
            -name 'orderAccess_*.hpp' \
            -print \
            | sort \
            >> "$OUT"

          echo "" >> "$OUT"
          echo "===== AARCH64 ORDERACCESS HEADERS =====" >> "$OUT"
          echo "" >> "$OUT"

          find openjdk21/src/hotspot \
            -type f \
            -name 'orderAccess_*aarch64*.hpp' \
            -print \
            | sort \
            >> "$OUT"

          echo "" >> "$OUT"
          echo "===== CONTENTS =====" >> "$OUT"

          while IFS= read -r FILE
          do
            echo "" >> "$OUT"
            echo "----------------------------------------" >> "$OUT"
            echo "$FILE" >> "$OUT"
            echo "----------------------------------------" >> "$OUT"

            cat "$FILE" >> "$OUT"

          done < <(
            find openjdk21/src/hotspot \
              -type f \
              -name 'orderAccess_*aarch64*.hpp' \
              -print \
              | sort
          )

          cat "$OUT"

      - name: Create orderAccess_horizon_aarch64.hpp
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("openjdk21/src/hotspot")

          dst = (
              root /
              "os_cpu" /
              "horizon_aarch64"
          )

          dst.mkdir(
              parents=True,
              exist_ok=True
          )

          target = (
              dst /
              "orderAccess_horizon_aarch64.hpp"
          )

          candidates = list(
              root.glob(
                  "os_cpu/*_aarch64/"
                  "orderAccess_*_aarch64.hpp"
              )
          )

          candidates = [
              p for p in candidates
              if "horizon_aarch64" not in str(p)
          ]

          if not candidates:
              raise SystemExit(
                  "No upstream AArch64 OrderAccess "
                  "implementation found."
              )

          preferred = [
              root / "os_cpu" / "linux_aarch64" /
              "orderAccess_linux_aarch64.hpp",

              root / "os_cpu" / "bsd_aarch64" /
              "orderAccess_bsd_aarch64.hpp",
          ]

          source = None

          for candidate in preferred:
              if candidate.exists():
                  source = candidate
                  break

          if source is None:
              source = candidates[0]

          data = source.read_text()

          forbidden_patterns = [
              r'#include\s*<sys/',
              r'#include\s*<linux/',
              r'#include\s*<pthread\.h>',
              r'#include\s*<unistd\.h>',
              r'\bpthread_',
              r'\bmmap\s*\(',
              r'\bmunmap\s*\(',
              r'\bsyscall\s*\(',
              r'\bfutex\b',
              r'\b__linux__\b',
          ]

          problems = []

          for pattern in forbidden_patterns:
              if re.search(pattern, data):
                  problems.append(pattern)

          research = Path(
              "horizon-research/"
              "orderaccess-strategy-v3.5.txt"
          )

          if problems:
              research.write_text(
                  "Source: " + str(source) + "\n"
                  "Decision: REJECTED\n"
                  "Reason: OS-specific dependencies detected\n"
                  "Patterns:\n"
                  + "\n".join(problems)
                  + "\n"
              )

              raise SystemExit(
                  "Selected OrderAccess implementation "
                  "contains OS-specific dependencies."
              )

          replacements = {
              "orderAccess_linux_aarch64.hpp":
                  "orderAccess_horizon_aarch64.hpp",

              "orderAccess_bsd_aarch64.hpp":
                  "orderAccess_horizon_aarch64.hpp",

              "ORDERACCESS_LINUX_AARCH64_HPP":
                  "ORDERACCESS_HORIZON_AARCH64_HPP",

              "ORDERACCESS_BSD_AARCH64_HPP":
                  "ORDERACCESS_HORIZON_AARCH64_HPP",

              "OS_CPU_LINUX_AARCH64_ORDERACCESS_LINUX_AARCH64_HPP":
                  "OS_CPU_HORIZON_AARCH64_ORDERACCESS_HORIZON_AARCH64_HPP",

              "OS_CPU_BSD_AARCH64_ORDERACCESS_BSD_AARCH64_HPP":
                  "OS_CPU_HORIZON_AARCH64_ORDERACCESS_HORIZON_AARCH64_HPP",
          }

          for old, new in replacements.items():
              data = data.replace(old, new)

          banner = '''/*
           * Minecraft-NX
