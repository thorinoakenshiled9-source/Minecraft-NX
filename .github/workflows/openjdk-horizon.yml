name: OpenJDK Horizon Research v1.2

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK Horizon Research v1.2
      # Created by Farbert_Took
      #
      # Descoberta do v1.1:
      #
      # make/autoconf/lib-freetype.m4:
      #
      # FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
      #
      # Para o target experimental Horizon isso gerava:
      #
      # libfreetype.so
      #
      # Mas nosso FreeType target foi corretamente compilado como:
      #
      # libfreetype.a
      #
      # v1.2 modifica SOMENTE a deteccao Horizon:
      #
      # Horizon -> libfreetype.a
      # Outros  -> comportamento original
      #
      # Depois:
      #
      # configure
      #   |
      #   +-- falhou -> captura proximo bloqueio
      #   |
      #   +-- passou -> make hotspot
      #
      # Ainda e pesquisa de port.
      # ============================================================


      # ============================================================
      # 1. Dependencias
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.2"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. devkitA64 PATH
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. Workspace
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v1.2"
            echo "Created by Farbert_Took"
            echo ""
            echo "Target: Nintendo Switch Horizon"
            echo "CPU: AArch64"
            echo "JVM: OpenJDK 21 HotSpot minimal"
            echo "Mode: headless"
            echo "FreeType: static target library"
          } > horizon-research/info.txt


      # ============================================================
      # 4. Verifica toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

          test -f /opt/devkitpro/libnx/include/switch.h

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt

          echo ""
          echo "devkitA64 + libnx OK"


      # ============================================================
      # 5. Teste target
      # ============================================================

      - name: Verify Horizon AArch64 compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon-test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon(void)
          {
              u64 java_version = 21;
              return (int)java_version;
          }
          EOF

          aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon-test.c \
            -o horizon-research/horizon-test.o

          file horizon-research/horizon-test.o \
            | tee horizon-research/horizon-object.txt


      # ============================================================
      # 6. Boot JDK
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt


      # ============================================================
      # 7. FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

          git -C freetype-src rev-parse HEAD \
            | tee horizon-research/freetype-commit.txt


      # ============================================================
      # 8. Configure FreeType target
      # ============================================================

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0


      # ============================================================
      # 9. Build FreeType target
      # ============================================================

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "FreeType configure failed." \
              | tee horizon-research/freetype-build.log

            echo "1" \
              > horizon-research/freetype-build-exit.txt

            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then

            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log

          fi

          exit 0


      # ============================================================
      # 10. Valida libfreetype.a
      # ============================================================

      - name: Validate Horizon FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | head -n 1
          )

          if [ -z "$FREETYPE_LIB" ]; then

            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"

            echo "libfreetype.a NOT FOUND"

            exit 0
          fi

          FREETYPE_LIBDIR=$(
            dirname "$FREETYPE_LIB"
          )

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"
          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo " FREETYPE TARGET READY"
          echo "========================================"
          echo ""

          echo "$FREETYPE_LIB"

          ls -lh "$FREETYPE_LIB"

          echo ""
          echo "Archive members:"
          echo ""

          aarch64-none-elf-ar \
            t "$FREETYPE_LIB" \
            | head -n 50 \
            | tee horizon-research/freetype-members.txt

          exit 0


      # ============================================================
      # 11. Teste de compilacao usando headers FreeType
      # ============================================================

      - name: Verify FreeType headers with target compiler
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then
            exit 0
          fi

          cat > horizon-research/freetype-test.c <<'EOF'
          #include <ft2build.h>
          #include FT_FREETYPE_H

          int minecraft_nx_freetype(void)
          {
              FT_Library library = 0;
              return library == 0 ? 21 : 0;
          }
          EOF

          aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -I"$FREETYPE_PREFIX/include/freetype2" \
            -c \
            horizon-research/freetype-test.c \
            -o horizon-research/freetype-test.o \
            2>&1 \
            | tee horizon-research/freetype-test.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > horizon-research/freetype-test-exit.txt

          exit 0


      # ============================================================
      # 12. OpenJDK
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 13. Horizon OS mapping
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/platform.m4"
          )

          s = p.read_text()

          needle = (
              'AC_MSG_ERROR([unsupported operating system $1])'
          )

          if needle not in s:
              raise SystemExit(
                  "OS fallback not found"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)
              case_start = s.rfind("*)", 0, pos)

              if case_start < 0:
                  raise SystemExit(
                      "OS fallback case not found"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print(
              "elf -> horizon mapping installed"
          )
          PY


      # ============================================================
      # 14. CUPS Horizon research bypass
      # ============================================================

      - name: Apply Horizon CUPS research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(
                  errors="ignore"
              )

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "CUPS check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find cups"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)
          PY


      # ============================================================
      # 15. Fontconfig Horizon research bypass
      # ============================================================

      - name: Apply Horizon Fontconfig research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(
                  errors="ignore"
              )

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Fontconfig check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find fontconfig"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)
          PY


      # ============================================================
      # 16. PATCH EXATO DO FREETYPE
      #
      # Original:
      #
      # FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
      #
      # Horizon:
      #
      # FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
      #
      # Outros targets continuam exatamente como antes.
      # ============================================================

      - name: Add static FreeType detection for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          count = s.count(old)

          print(
              "Original FreeType expression count:",
              count
          )

          if count != 1:
              raise SystemExit(
                  "Expected exactly one FreeType library expression"
              )

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              "Horizon static FreeType patch installed"
          )
          PY

          echo ""
          echo "========================================"
          echo " FREETYPE PATCH RESULT"
          echo "========================================"
          echo ""

          grep \
            -n \
            -C 12 \
            'Horizon target: using static FreeType' \
            openjdk21/make/autoconf/lib-freetype.m4 \
            | tee horizon-research/freetype-static-patch.txt


      # ============================================================
      # 17. Verifica se o comportamento original continua presente
      # ============================================================

      - name: Validate FreeType patch
        shell: bash
        run: |
          set -e

          FILE=openjdk21/make/autoconf/lib-freetype.m4

          grep -q \
            'FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"' \
            "$FILE"

          grep -q \
            'FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"' \
            "$FILE"

          grep -q \
            'OPENJDK_TARGET_OS.*horizon' \
            "$FILE"

          echo ""
          echo "Static Horizon path: OK"
          echo "Original shared path: OK"
          echo "Target guard: OK"


      # ============================================================
      # 18. Salva patch
      # ============================================================

      - name: Save OpenJDK Horizon patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v1.2.patch

          echo ""
          echo "Patch lines:"
          echo ""

          wc -l \
            horizon-research/openjdk-horizon-v1.2.patch

          echo ""
          echo "FreeType diff:"
          echo ""

          grep \
            -n \
            -C 15 \
            -E 'FREETYPE_LIB_NAME|Horizon target' \
            horizon-research/openjdk-horizon-v1.2.patch \
            | head -n 500 \
            || true


      # ============================================================
      # 19. Configure OpenJDK
      #
      # IMPORTANTE:
      #
      # Nao passamos FREETYPE_LIBS apontando diretamente para .a.
      #
      # Deixamos lib-freetype.m4 configurar normalmente:
      #
      # -L<path> -lfreetype
      #
      # depois de validar libfreetype.a.
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then

            echo "FreeType target unavailable." \
              > horizon-research/configure-v1.2.log

            echo "99" \
              > horizon-research/configure-exit-code.txt

            exit 0
          fi

          cd openjdk21

          echo ""
          echo "========================================"
          echo " OPENJDK HORIZON CONFIGURE v1.2"
          echo "========================================"
          echo ""

          echo "FreeType include:"
          echo "$FREETYPE_PREFIX/include/freetype2"

          echo ""
          echo "FreeType lib:"
          echo "$FREETYPE_LIBDIR"

          echo ""

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v1.2.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0


      # ============================================================
      # 20. SUMMARY
      # ============================================================

      - name: Analyze OpenJDK configure
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v1.2"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Target:"
            echo "Horizon / AArch64"

            echo ""
            echo "JVM:"
            echo "minimal"

            echo ""
            echo "Mode:"
            echo "headless"

            echo ""
            echo "FreeType configure exit:"
            cat horizon-research/freetype-configure-exit.txt

            echo ""
            echo "FreeType build exit:"
            cat horizon-research/freetype-build-exit.txt

            echo ""
            echo "FreeType ready:"
            echo "${FREETYPE_READY:-no}"

            echo ""
            echo "FreeType library:"
            echo "${FREETYPE_LIB:-not-found}"

            echo ""
            echo "OpenJDK configure exit:"
            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant messages:"
            echo ""

            grep -i -E \
              'error|warning|unsupported|horizon|target|host|aarch64|headless|minimal|freetype|cups|fontconfig|alsa|x11|xext|xrender|xtst|xi|ffi|sysroot|posix|linux|library|libraries|header|headers|jvm|pthread|signal|mmap|dlopen|dlsym|atomic|thread' \
              horizon-research/configure-v1.2.log \
              | tail -n 2500 \
              || true

          } > horizon-research/summary-v1.2.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v1.2"
          echo "========================================"
          echo ""

          cat horizon-research/summary-v1.2.txt


      # ============================================================
      # 21. Configure tail
      # ============================================================

      - name: Show configure tail
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo " CONFIGURE LAST 600"
          echo "========================================"
          echo ""

          tail \
            -n 600 \
            horizon-research/configure-v1.2.log \
            | tee horizon-research/configure-tail-v1.2.txt

          exit 0


      # ============================================================
      # 22. HotSpot probe
      #
      # So roda se configure = 0.
      # ============================================================

      - name: Probe HotSpot build
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            {
              echo "========================================"
              echo " HOTSPOT PROBE v1.2"
              echo "========================================"
              echo ""
              echo "NOT STARTED"
              echo ""
              echo "OpenJDK configure exit:"
              echo "$CONFIG_STATUS"

            } > horizon-research/hotspot-summary-v1.2.txt

            cat horizon-research/hotspot-summary-v1.2.txt

            exit 0
          fi

          echo ""
          echo "========================================"
          echo " OPENJDK CONFIGURE = 0"
          echo " STARTING HOTSPOT"
          echo "========================================"
          echo ""

          cd openjdk21

          make hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v1.2.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " HOTSPOT PROBE v1.2"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "make hotspot exit:"
            echo "$STATUS"

            echo ""
            echo "Relevant messages:"
            echo ""

            grep -i -E \
              'error|fatal|horizon|aarch64|os_cpu|os/|not found|no rule|undefined|unsupported|missing|posix|linux|pthread|signal|mmap|munmap|dlopen|dlsym|clock|gettimeofday|thread|socket|atomic|errno' \
              ../horizon-research/hotspot-build-v1.2.log \
              | tail -n 3000 \
              || true

            echo ""
            echo "===== LAST 800 ====="
            echo ""

            tail \
              -n 800 \
              ../horizon-research/hotspot-build-v1.2.log

          } > ../horizon-research/hotspot-summary-v1.2.txt

          cat ../horizon-research/hotspot-summary-v1.2.txt

          exit 0


      # ============================================================
      # 23. HotSpot source map
      # ============================================================

      - name: Create HotSpot port map
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "HotSpot Horizon Port Map v1.2"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== AArch64 CPU backend ====="

            find \
              openjdk21/src/hotspot/cpu/aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== HotSpot OS implementations ====="

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== HotSpot OS/CPU implementations ====="

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== Linux AArch64 reference ====="

            find \
              openjdk21/src/hotspot/os/linux \
              openjdk21/src/hotspot/os_cpu/linux_aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== Potential Horizon structure ====="

            echo "src/hotspot/os/horizon/"
            echo "src/hotspot/os_cpu/horizon_aarch64/"

          } > horizon-research/hotspot-port-map-v1.2.txt

          exit 0


      # ============================================================
      # 24. Config logs
      # ============================================================

      - name: Collect OpenJDK config logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name 'config.log' \
              -o \
              -name 'configure.log' \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE=$(
                echo "$FILEPATH" \
                | tr '/' '_'
              )

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 25. Final report
      # ============================================================

      - name: Final v1.2 report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.2"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "FreeType target:"
          echo "${FREETYPE_READY:-no}"

          echo ""
          echo "FreeType library:"
          echo "${FREETYPE_LIB:-not-found}"

          echo ""
          echo "OpenJDK configure exit:"
          cat horizon-research/configure-exit-code.txt

          if [ -f horizon-research/hotspot-exit-code.txt ]; then

            echo ""
            echo "HotSpot build exit:"
            cat horizon-research/hotspot-exit-code.txt

          fi

          echo ""
          echo "Files:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"
          echo " IMPORTANT"
          echo "========================================"
          echo ""
          echo "Este workflow ainda e pesquisa de port."
          echo ""
          echo "Mesmo configure=0 nao significa que"
          echo "OpenJDK/HotSpot ja suporta Horizon."
          echo ""
          echo "O objetivo e chegar ao primeiro bloqueio"
          echo "real do HotSpot no target Horizon."


      # ============================================================
      # 26. Artifact
      # ============================================================

      - name: Upload Horizon Research v1.2
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v1.2
          path: horizon-research
