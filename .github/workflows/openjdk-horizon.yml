name: OpenJDK Horizon Research v1.9

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK Horizon Research v1.9
      # Created by Farbert_Took
      #
      # v1.9:
      # - Mantem configure Horizon funcional
      # - Mantem FreeType estatico
      # - Mantem JvmMapfile Horizon
      # - Mantem bypass headless CUPS/Fontconfig/X11
      #
      # Mudanca principal:
      # - Nao depende de CXXFLAGS do configure para identificar Horizon
      # - Injeta MINECRAFT_NX_HORIZON diretamente no spec.gmk
      # - Verifica flags geradas
      # - Verifica compilacao real do HotSpot
      #
      # NAO implementa dlopen/dlsym falsos.
      # ============================================================


      # ============================================================
      # 1. Dependencias
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.9"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. PATH
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. Workspace
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v1.9"
            echo "Created by Farbert_Took"
            echo ""
            echo "Target: Nintendo Switch Horizon"
            echo "CPU: AArch64"
            echo "JVM: OpenJDK 21 HotSpot minimal"
            echo "Mode: headless"
            echo ""
            echo "Target macro:"
            echo "MINECRAFT_NX_HORIZON=1"
          } > horizon-research/info.txt


      # ============================================================
      # 4. Toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          test -f /opt/devkitpro/libnx/include/switch.h

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt

          aarch64-none-elf-nm --version \
            | tee horizon-research/nm-version.txt


      # ============================================================
      # 5. Teste independente do macro
      # ============================================================

      - name: Test Minecraft-NX Horizon macro
        shell: bash
        run: |
          set -e

          cat > horizon-research/macro-test.cpp <<'EOF'
          #ifndef MINECRAFT_NX_HORIZON
          #error MINECRAFT_NX_HORIZON is missing
          #endif

          #if MINECRAFT_NX_HORIZON != 1
          #error MINECRAFT_NX_HORIZON has wrong value
          #endif

          int minecraft_nx_horizon_test()
          {
              return MINECRAFT_NX_HORIZON;
          }
          EOF

          aarch64-none-elf-g++ \
            -march=armv8-a \
            -DMINECRAFT_NX_HORIZON=1 \
            -c \
            horizon-research/macro-test.cpp \
            -o horizon-research/macro-test.o

          file horizon-research/macro-test.o

          echo ""
          echo "Standalone Horizon macro test: OK"


      # ============================================================
      # 6. Boot JDK
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt


      # ============================================================
      # 7. FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

          git -C freetype-src rev-parse HEAD \
            | tee horizon-research/freetype-commit.txt


      # ============================================================
      # 8. Configure FreeType
      # ============================================================

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0


      # ============================================================
      # 9. Build FreeType
      # ============================================================

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "FreeType configure failed."

            echo "1" \
              > horizon-research/freetype-build-exit.txt

            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then

            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log

          fi

          exit 0


      # ============================================================
      # 10. Validate FreeType
      # ============================================================

      - name: Validate Horizon FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | sed -n '1p'
          )

          if [ -z "$FREETYPE_LIB" ]; then

            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"

            echo "libfreetype.a NOT FOUND"

            exit 0
          fi

          FREETYPE_LIBDIR=$(
            dirname "$FREETYPE_LIB"
          )

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"
          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" >> "$GITHUB_ENV"

          echo ""
          echo "FreeType ready:"
          echo "$FREETYPE_LIB"

          ls -lh "$FREETYPE_LIB"


      # ============================================================
      # 11. OpenJDK
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 12. elf -> horizon
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/platform.m4"
          )

          s = p.read_text()

          needle = (
              'AC_MSG_ERROR([unsupported operating system $1])'
          )

          if needle not in s:
              raise SystemExit(
                  "OS fallback not found"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)

              case_start = s.rfind(
                  "*)",
                  0,
                  pos
              )

              if case_start < 0:
                  raise SystemExit(
                      "OS fallback case not found"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print("elf -> horizon mapping installed")
          PY


      # ============================================================
      # 13. CUPS
      # ============================================================

      - name: Apply Horizon CUPS bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "CUPS check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find cups"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)

          print("CUPS Horizon bypass installed")
          PY


      # ============================================================
      # 14. Fontconfig
      # ============================================================

      - name: Apply Horizon Fontconfig bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Fontconfig check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find fontconfig"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)

          print("Fontconfig Horizon bypass installed")
          PY


      # ============================================================
      # 15. FreeType static
      # ============================================================

      - name: Add static FreeType detection
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit(
                  "FreeType expression not found exactly once"
              )

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              "Static FreeType Horizon patch installed"
          )
          PY


      # ============================================================
      # 16. X11
      # ============================================================

      - name: Apply Horizon X11 bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          checks = [
              (
                  "Could not find X11 libraries",
                  "X11 libraries"
              ),
              (
                  "Could not find all X11 headers",
                  "X11 headers"
              ),
          ]

          for needle, label in checks:

              candidates = []

              for p in root.rglob("*.m4"):

                  text = p.read_text(
                      errors="ignore"
                  )

                  if needle in text:
                      candidates.append(p)

              if len(candidates) != 1:
                  raise SystemExit(
                      f"{label}: expected one source file, "
                      f"found {len(candidates)}"
                  )

              p = candidates[0]

              lines = p.read_text().splitlines(True)

              indexes = []

              for i, line in enumerate(lines):

                  if (
                      needle in line
                      and "AC_MSG_ERROR" in line
                  ):
                      indexes.append(i)

              if len(indexes) != 1:
                  raise SystemExit(
                      f"{label}: expected one AC_MSG_ERROR, "
                      f"found {len(indexes)}"
                  )

              i = indexes[0]

              original = lines[i]

              indent = original[
                  :len(original)
                  - len(original.lstrip())
              ]

              original_body = original.rstrip("\n")

              if label == "X11 libraries":

                  warning = (
                      "X11 libraries disabled for "
                      "experimental Horizon headless target"
                  )

              else:

                  warning = (
                      "X11 headers disabled for "
                      "experimental Horizon headless target"
                  )

              replacement = (
                  indent
                  + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
                  + indent
                  + '  AC_MSG_WARN(['
                  + warning
                  + '])\n'
                  + indent
                  + '  X_CFLAGS=""\n'
                  + indent
                  + '  X_LIBS=""\n'
                  + indent
                  + 'else\n'
                  + original_body
                  + '\n'
                  + indent
                  + 'fi\n'
              )

              lines[i] = replacement

              p.write_text(
                  "".join(lines)
              )

          print("X11 Horizon bypass installed")
          PY


      # ============================================================
      # 17. Configure OpenJDK
      #
      # Nao dependemos de CXXFLAGS para nosso macro.
      # A injecao HotSpot acontece DEPOIS do configure.
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then

            echo "FreeType unavailable" \
              > horizon-research/configure-v1.9.log

            echo "99" \
              > horizon-research/configure-exit-code.txt

            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v1.9.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0


      # ============================================================
      # 18. Configure result
      # ============================================================

      - name: Show configure result
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo " CONFIGURE RESULT v1.9"
          echo "========================================"

          STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          echo ""
          echo "Configure exit:"
          echo "$STATUS"

          grep \
            -i \
            -E \
            'error|warning|horizon|aarch64|minimal|headless|freetype|x11|cups|fontconfig' \
            horizon-research/configure-v1.9.log \
            > horizon-research/configure-important-v1.9.txt \
            || true

          tail \
            -n 1000 \
            horizon-research/configure-important-v1.9.txt \
            || true

          exit 0


      # ============================================================
      # 19. Localiza spec.gmk
      # ============================================================

      - name: Locate OpenJDK spec.gmk
        shell: bash
        run: |
          set -e

          SPEC=$(
            find \
              openjdk21/build \
              -type f \
              -name spec.gmk \
              | sed -n '1p'
          )

          if [ -z "$SPEC" ]; then
            echo "spec.gmk NOT FOUND"
            exit 1
          fi

          echo "OPENJDK_SPEC=$SPEC" \
            >> "$GITHUB_ENV"

          echo "$SPEC" \
            > horizon-research/spec-path-v1.9.txt

          echo ""
          echo "OpenJDK spec:"
          echo "$SPEC"


      # ============================================================
      # 20. Pesquisa flags existentes
      # ============================================================

      - name: Research generated compiler flags
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo " GENERATED COMPILER FLAGS BEFORE v1.9"
            echo "========================================"
            echo ""

            echo "SPEC:"
            echo "$OPENJDK_SPEC"

            echo ""
            echo "===== FLAG VARIABLES ====="
            echo ""

            grep \
              -n \
              -E '(^|_)(CFLAGS|CXXFLAGS|JVM_CFLAGS|JVM_CXXFLAGS|EXTRA_CFLAGS|EXTRA_CXXFLAGS)[[:space:]]*[:?+]?=' \
              "$OPENJDK_SPEC" \
              || true

            echo ""
            echo "===== ALL CFLAGS/CXXFLAGS REFERENCES ====="
            echo ""

            grep \
              -n \
              -E 'CFLAGS|CXXFLAGS' \
              "$OPENJDK_SPEC" \
              || true

          } > horizon-research/compiler-flags-before-v1.9.txt

          sed -n '1,1500p' \
            horizon-research/compiler-flags-before-v1.9.txt

          exit 0


      # ============================================================
      # 21. Injeta macro no spec.gmk
      #
      # Esta e a mudanca principal do v1.9.
      #
      # Em vez de depender de CXXFLAGS de ambiente/configure,
      # adicionamos o define nas flags geradas que o make inclui.
      # ============================================================

      - name: Inject Minecraft-NX Horizon macro into OpenJDK spec
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os
          from pathlib import Path

          spec = Path(os.environ["OPENJDK_SPEC"])

          if not spec.exists():
              raise SystemExit(
                  f"spec.gmk not found: {spec}"
              )

          text = spec.read_text()

          marker = "# Minecraft-NX Horizon v1.9 compiler identity"

          if marker in text:
              raise SystemExit(
                  "Minecraft-NX block already exists"
              )

          block = r'''

          # Minecraft-NX Horizon v1.9 compiler identity
          #
          # This target is not Linux.
          # Keep a dedicated compile-time identity for Horizon.
          CFLAGS += -DMINECRAFT_NX_HORIZON=1
          CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1

          '''

          text += block

          spec.write_text(text)

          print(
              "Minecraft-NX Horizon flags appended to:"
          )
          print(spec)
          PY

          echo ""
          echo "===== INJECTED BLOCK ====="
          echo ""

          grep \
            -n \
            -A 15 \
            -B 2 \
            'Minecraft-NX Horizon v1.9' \
            "$OPENJDK_SPEC" \
            | tee horizon-research/spec-injected-block-v1.9.txt


      # ============================================================
      # 22. Verifica o spec
      # ============================================================

      - name: Verify Horizon macro in spec.gmk
        shell: bash
        run: |
          set -e

          COUNT=$(
            grep \
              -c \
              'DMINECRAFT_NX_HORIZON=1' \
              "$OPENJDK_SPEC" \
              || true
          )

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " spec.gmk Macro Verification v1.9"
            echo "========================================"
            echo ""
            echo "spec:"
            echo "$OPENJDK_SPEC"
            echo ""
            echo "Occurrences:"
            echo "$COUNT"
            echo ""

            grep \
              -n \
              'MINECRAFT_NX_HORIZON' \
              "$OPENJDK_SPEC" \
              || true

          } > horizon-research/spec-macro-verification-v1.9.txt

          cat \
            horizon-research/spec-macro-verification-v1.9.txt

          if [ "$COUNT" -lt 1 ]; then

            echo ""
            echo "ERROR: Horizon macro was not inserted."
            exit 1

          fi


      # ============================================================
      # 23. JvmMapfile Horizon
      # ============================================================

      - name: Add Horizon support to JvmMapfile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/hotspot/lib/JvmMapfile.gmk"
          )

          if not p.exists():
              raise SystemExit(
                  "JvmMapfile.gmk not found"
              )

          s = p.read_text()

          linux_marker = (
              'ifeq ($(call isTargetOs, linux), true)'
          )

          mac_marker = (
              'else ifeq ($(call isTargetOs, macosx), true)'
          )

          if linux_marker not in s:
              raise SystemExit(
                  "Linux JvmMapfile branch not found"
              )

          if mac_marker not in s:
              raise SystemExit(
                  "macOS JvmMapfile branch not found"
              )

          if "isTargetOs, horizon" in s:
              raise SystemExit(
                  "Horizon branch already exists"
              )

          horizon_branch = r'''else ifeq ($(call isTargetOs, horizon), true)
            # Minecraft-NX / Horizon
            #
            # Horizon AArch64 object files are ELF objects generated
            # by the devkitA64 GNU toolchain.
            DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only *$(OBJ_SUFFIX)
            ifneq ($(FILTER_SYMBOLS_PATTERN), )
              FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|
            endif
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)^_ZTV|^gHotSpotVM|^UseSharedSpaces$$
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|^_ZN9Arguments17SharedArchivePathE$$
            FILTER_SYMBOLS_AWK_SCRIPT := \
                '{ \
                  if ($$3 ~ /$(FILTER_SYMBOLS_PATTERN)/) print $$3; \
                }'

          '''

          s = s.replace(
              mac_marker,
              horizon_branch + mac_marker,
              1
          )

          p.write_text(s)

          print(
              "JvmMapfile Horizon branch installed"
          )
          PY


      # ============================================================
      # 24. Patch dlfcn
      # ============================================================

      - name: Disable global dlfcn include for Minecraft-NX Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          if not p.exists():
              raise SystemExit(
                  "globalDefinitions_gcc.hpp not found"
              )

          s = p.read_text()

          old = "#include <dlfcn.h>"

          count = s.count(old)

          print(
              f"dlfcn include count before patch: {count}"
          )

          if count != 1:
              raise SystemExit(
                  "Expected exactly one dlfcn.h include"
              )

          new = '''// Minecraft-NX / Horizon
          //
          // Horizon does not provide the POSIX dlfcn API.
          //
          // Dynamic loading requirements will be handled by
          // the Horizon port rather than pretending Horizon is Linux.
          #if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif'''

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              "dlfcn.h isolated using "
              "MINECRAFT_NX_HORIZON"
          )
          PY

          echo ""
          echo "===== PATCHED HEADER ====="
          echo ""

          sed -n '34,75p' \
            openjdk21/src/hotspot/share/utilities/globalDefinitions_gcc.hpp \
            | nl -ba \
            | tee horizon-research/globalDefinitions-patched-v1.9.txt


      # ============================================================
      # 25. Testa header manualmente
      # ============================================================

      - name: Verify dlfcn guard
        shell: bash
        run: |
          set -e

          cat > horizon-research/dlfcn-condition-test.cpp <<'EOF'
          #if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif

          #ifndef MINECRAFT_NX_HORIZON
          #error Horizon macro missing
          #endif

          #if MINECRAFT_NX_HORIZON != 1
          #error Horizon macro wrong value
          #endif

          int main()
          {
              return 0;
          }
          EOF

          aarch64-none-elf-g++ \
            -DMINECRAFT_NX_HORIZON=1 \
            -c \
            horizon-research/dlfcn-condition-test.cpp \
            -o horizon-research/dlfcn-condition-test.o

          echo ""
          echo "DLFCN GUARD TEST: OK"


      # ============================================================
      # 26. Salva patch antes do build
      # ============================================================

      - name: Save OpenJDK Horizon source patch
        shell: bash
        run: |
          set +e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v1.9.patch

          echo ""
          echo "Source patch lines:"
          wc -l \
            horizon-research/openjdk-horizon-v1.9.patch

          exit 0


      # ============================================================
      # 27. HOTSPOT
      # ============================================================

      - name: Probe HotSpot build v1.9
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "NOT STARTED" \
              > horizon-research/hotspot-build-v1.9.log

            echo "99" \
              > horizon-research/hotspot-exit-code.txt

            exit 0
          fi

          cd openjdk21

          echo ""
          echo "========================================"
          echo " OPENJDK CONFIGURE = 0"
          echo " STARTING HOTSPOT PROBE v1.9"
          echo "========================================"
          echo ""

          make \
            LOG=trace \
            hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v1.9.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          exit 0


      # ============================================================
      # 28. Verificacao REAL do macro
      # ============================================================

      - name: Verify macro reached real HotSpot compilation
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v1.9.log"

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " HotSpot Macro Verification v1.9"
            echo " Created by Farbert_Took"
            echo "========================================"
            echo ""

            if grep -q \
              -- '-DMINECRAFT_NX_HORIZON=1' \
              "$LOG"
            then

              echo "RESULT: FOUND"
              echo ""
              echo "HORIZON MACRO IN HOTSPOT: YES"
              echo ""

              grep \
                -n \
                -- '-DMINECRAFT_NX_HORIZON=1' \
                "$LOG" \
                | sed -n '1,30p'

            else

              echo "RESULT: NOT FOUND"
              echo ""
              echo "HORIZON MACRO IN HOTSPOT: NO"

            fi

          } > horizon-research/hotspot-macro-verification-v1.9.txt

          cat \
            horizon-research/hotspot-macro-verification-v1.9.txt

          exit 0


      # ============================================================
      # 29. Verifica especificamente dlfcn
      # ============================================================

      - name: Check dlfcn blocker
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v1.9.log"

          {
            echo "========================================"
            echo " DLFCN BLOCKER CHECK v1.9"
            echo "========================================"
            echo ""

            if grep -q \
              'fatal error: dlfcn.h' \
              "$LOG"
            then

              echo "DLFCN BLOCKER: STILL PRESENT"
              echo ""

              grep \
                -n \
                'fatal error: dlfcn.h' \
                "$LOG" \
                | sed -n '1,30p'

            else

              echo "DLFCN BLOCKER: PASSED"

            fi

          } > horizon-research/dlfcn-blocker-v1.9.txt

          cat \
            horizon-research/dlfcn-blocker-v1.9.txt

          exit 0


      # ============================================================
      # 30. Primeiro erro REAL
      # ============================================================

      - name: Extract first HotSpot failure
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v1.9.log"

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path(
              "horizon-research/hotspot-build-v1.9.log"
          )

          out = Path(
              "horizon-research/first-hotspot-failure-v1.9.txt"
          )

          if not log.exists():

              out.write_text(
                  "HotSpot log unavailable.\n"
              )

              raise SystemExit(0)

          lines = log.read_text(
              errors="replace"
          ).splitlines()

          pattern = re.compile(
              r"fatal error:|"
              r"\berror:|"
              r"undefined reference|"
              r"No such file or directory|"
              r"No rule to make target|"
              r"Unknown target OS|"
              r"unsupported",
              re.IGNORECASE
          )

          first = None

          for i, line in enumerate(lines):

              if pattern.search(line):
                  first = i
                  break

          result = []

          result.append(
              "========================================"
          )
          result.append(
              " Minecraft-NX"
          )
          result.append(
              " FIRST HOTSPOT FAILURE v1.9"
          )
          result.append(
              " Created by Farbert_Took"
          )
          result.append(
              "========================================"
          )
          result.append("")

          if first is None:

              result.append(
                  "No compiler error pattern found."
              )

          else:

              start = max(
                  0,
                  first - 15
              )

              end = min(
                  len(lines),
                  first + 35
              )

              result.append(
                  f"First matched log line: {first + 1}"
              )
              result.append("")

              for number in range(
                  start,
                  end
              ):

                  result.append(
                      f"{number + 1}:"
                      f"{lines[number]}"
                  )

          out.write_text(
              "\n".join(result) + "\n"
          )
          PY

          cat \
            horizon-research/first-hotspot-failure-v1.9.txt

          exit 0


      # ============================================================
      # 31. Failure logs
      # ============================================================

      - name: Collect HotSpot failure logs
        shell: bash
        run: |
          set +e

          ROOT="openjdk21/build/horizon-aarch64-minimal-release/make-support/failure-logs"

          mkdir -p \
            horizon-research/failure-logs

          if [ -d "$ROOT" ]; then

            find "$ROOT" \
              -type f \
              -print \
              > horizon-research/failure-log-files-v1.9.txt

            cp -R \
              "$ROOT"/. \
              horizon-research/failure-logs/ \
              2>/dev/null \
              || true

          fi

          exit 0


      # ============================================================
      # 32. Pesquisa APIs que provavelmente aparecem depois
      # ============================================================

      - name: Research Horizon platform requirements
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " Horizon Platform Research v1.9"
            echo "========================================"

            echo ""
            echo "===== DYNAMIC LOADER ====="
            echo ""

            grep \
              -Rni \
              -E '\b(dlopen|dlsym|dlclose|dlerror|RTLD_[A-Za-z0-9_]+)\b' \
              openjdk21/src/hotspot \
              2>/dev/null

            echo ""
            echo "===== PTHREAD ====="
            echo ""

            grep \
              -Rni \
              -E '\bpthread_[A-Za-z0-9_]+' \
              openjdk21/src/hotspot \
              2>/dev/null

            echo ""
            echo "===== MMAP ====="
            echo ""

            grep \
              -Rni \
              -E '\b(mmap|munmap|mprotect)\b' \
              openjdk21/src/hotspot \
              2>/dev/null

            echo ""
            echo "===== SIGNAL ====="
            echo ""

            grep \
              -Rni \
              -E '\b(sigaction|sigaltstack|sigprocmask|signal)\b' \
              openjdk21/src/hotspot \
              2>/dev/null

            echo ""
            echo "===== LIBNX LOADER ====="
            echo ""

            grep \
              -Rni \
              -E 'nro|Nro|NRO|roInitialize|ldr|loader' \
              /opt/devkitpro/libnx/include \
              2>/dev/null

          } > horizon-research/platform-research-v1.9.txt

          exit 0


      # ============================================================
      # 33. Summary curto
      #
      # Este e o trecho que voce pode mandar para mim.
      # ============================================================

      - name: Final v1.9 summary
        shell: bash
        run: |
          set -e

          HOTSPOT_EXIT="not-run"

          if [ -f horizon-research/hotspot-exit-code.txt ]; then
