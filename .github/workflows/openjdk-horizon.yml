name: OpenJDK Horizon Research v2.0.1

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK 21 -> Nintendo Switch Horizon
      # Research Build v2.0.1
      # Created by Farbert_Took
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v2.0.1"
          echo " Created by Farbert_Took"
          echo "========================================"

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          cat > horizon-research/info.txt <<'EOF'
          Minecraft-NX
          OpenJDK Horizon Research v2.0.1
          Created by Farbert_Took

          Target: Nintendo Switch Horizon
          Architecture: AArch64
          JVM: OpenJDK 21 HotSpot
          JVM variant: minimal
          Mode: headless

          Experimental target macro:
          MINECRAFT_NX_HORIZON=1
          EOF

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          test -f /opt/devkitpro/libnx/include/switch.h

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt

          aarch64-none-elf-nm --version \
            | tee horizon-research/nm-version.txt

      - name: Test Horizon macro independently
        shell: bash
        run: |
          set -e

          cat > horizon-research/macro-test.cpp <<'EOF'
          #ifndef MINECRAFT_NX_HORIZON
          #error MINECRAFT_NX_HORIZON missing
          #endif

          #if MINECRAFT_NX_HORIZON != 1
          #error MINECRAFT_NX_HORIZON wrong value
          #endif

          int minecraft_nx_horizon_test()
          {
              return MINECRAFT_NX_HORIZON;
          }
          EOF

          aarch64-none-elf-g++ \
            -march=armv8-a \
            -DMINECRAFT_NX_HORIZON=1 \
            -c \
            horizon-research/macro-test.cpp \
            -o horizon-research/macro-test.o

          echo "Standalone Horizon macro test: OK"

      # ============================================================
      # Boot JDK
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt

      # ============================================================
      # FreeType for Horizon
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

          git -C freetype-src rev-parse HEAD \
            | tee horizon-research/freetype-commit.txt

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit.txt \
            2>/dev/null || echo "99"
          )

          if [ "$CONFIG_STATUS" != "0" ]; then
            echo "99" \
              > horizon-research/freetype-build-exit.txt
            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then
            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log
          fi

          exit 0

      - name: Validate Horizon FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | sed -n '1p'
          )

          if [ -z "$FREETYPE_LIB" ]; then
            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"
            echo "libfreetype.a NOT FOUND"
            exit 0
          fi

          FREETYPE_LIBDIR=$(dirname "$FREETYPE_LIB")

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"
          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" >> "$GITHUB_ENV"

          echo "FREETYPE_READY: yes"
          echo "FREETYPE_LIB: $FREETYPE_LIB"
          echo "FREETYPE_LIBDIR: $FREETYPE_LIBDIR"

      # ============================================================
      # OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt

      # ============================================================
      # Experimental Horizon OS mapping
      #
      # v2.0.1:
      # Does NOT depend on an exact whitespace representation of
      # the fallback branch.
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("openjdk21/make/autoconf/platform.m4")

          if not p.exists():
              raise SystemExit("platform.m4 not found")

          s = p.read_text()

          # If an elf case already exists, inspect it.
          existing_elf = re.search(
              r'(?m)^([ \t]*)elf\)[ \t]*$',
              s
          )

          if existing_elf:
              area = s[
                  existing_elf.start():
                  min(len(s), existing_elf.start() + 300)
              ]

              if "VAR_OS=horizon" in area or "VAR_OS=horizon" in s:
                  print("elf -> horizon mapping already installed")
                  raise SystemExit(0)

              raise SystemExit(
                  "An existing elf) OS case was found, "
                  "but it does not map to Horizon. "
                  "Refusing to overwrite it automatically."
              )

          # Find the unsupported-OS error text without depending
          # on exact indentation.
          error_match = re.search(
              r'unsupported operating system',
              s,
              flags=re.IGNORECASE
          )

          if not error_match:
              print("Could not find unsupported OS message.")
              print("")
              print("Relevant platform.m4 lines:")

              for n, line in enumerate(s.splitlines(), 1):
                  low = line.lower()

                  if (
                      "operating system" in low
                      or "var_os" in low
                      or re.search(r'\blinux\)', line)
                  ):
                      print(f"{n}: {line}")

              raise SystemExit(1)

          error_pos = error_match.start()

          # Locate the nearest fallback *) before that error.
          before = s[:error_pos]

          fallbacks = list(
              re.finditer(
                  r'(?m)^([ \t]*)\*\)[ \t]*$',
                  before
              )
          )

          if not fallbacks:
              print(
                  "Could not locate fallback *) "
                  "before unsupported OS error."
              )

              start = max(0, error_pos - 1500)
              end = min(len(s), error_pos + 500)

              print("")
              print("Context:")
              print(s[start:end])

              raise SystemExit(1)

          fallback = fallbacks[-1]
          indent = fallback.group(1)

          horizon = (
              f"{indent}elf)\n"
              f"{indent}  VAR_OS=horizon\n"
              f"{indent}  ;;\n"
          )

          s = (
              s[:fallback.start()]
              + horizon
              + s[fallback.start():]
          )

          p.write_text(s)

          # Verify the exact result.
          verify = re.search(
              r'(?ms)^[ \t]*elf\)[ \t]*\n'
              r'[ \t]*VAR_OS=horizon[ \t]*\n'
              r'[ \t]*;;',
              s
          )

          if not verify:
              raise SystemExit(
                  "Horizon mapping insertion verification failed"
              )

          print("Experimental OpenJDK OS mapping installed:")
          print("  elf -> horizon")
          PY

          echo ""
          echo "===== HORIZON OS MAPPING ====="

          grep \
            -n \
            -A3 \
            -B2 \
            'VAR_OS=horizon' \
            openjdk21/make/autoconf/platform.m4 \
            | tee horizon-research/platform-horizon-v2.0.1.txt \
            || true

      # ============================================================
      # CUPS
      # ============================================================

      - name: Apply Horizon CUPS bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")
          target = None

          for p in root.rglob("*.m4"):
              text = p.read_text(errors="ignore")

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit("CUPS check not found")

          text = target.read_text()
          pos = text.find("Could not find cups")

          start = text.rfind("\n", 0, pos) + 1
          end = text.find("\n", pos)

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original) - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = text[:start] + replacement + text[end:]
          target.write_text(text)

          print("CUPS Horizon bypass installed:", target)
          PY

      # ============================================================
      # Fontconfig
      # ============================================================

      - name: Apply Horizon Fontconfig bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")
          target = None

          for p in root.rglob("*.m4"):
              text = p.read_text(errors="ignore")

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit("Fontconfig check not found")

          text = target.read_text()
          pos = text.find("Could not find fontconfig")

          start = text.rfind("\n", 0, pos) + 1
          end = text.find("\n", pos)

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original) - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = text[:start] + replacement + text[end:]
          target.write_text(text)

          print("Fontconfig Horizon bypass installed:", target)
          PY

      # ============================================================
      # Static FreeType
      # ============================================================

      - name: Add static FreeType detection
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = (
              '    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}'
              '${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'
          )

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit(
                  "FreeType shared-library expression "
                  "not found exactly once"
              )

          p.write_text(
              s.replace(old, new, 1)
          )

          print(
              "Static FreeType Horizon patch installed"
          )
          PY

      # ============================================================
      # X11
      # ============================================================

      - name: Apply Horizon X11 bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          checks = [
              (
                  "Could not find X11 libraries",
                  "X11 libraries disabled for experimental Horizon headless target"
              ),
              (
                  "Could not find all X11 headers",
                  "X11 headers disabled for experimental Horizon headless target"
              ),
          ]

          for needle, warning in checks:

              found = False

              for p in root.rglob("*.m4"):

                  lines = p.read_text(
                      errors="ignore"
                  ).splitlines(True)

                  for i, line in enumerate(lines):

                      if (
                          needle not in line
                          or "AC_MSG_ERROR" not in line
                      ):
                          continue

                      indent = line[
                          :len(line) - len(line.lstrip())
                      ]

                      original = line.rstrip("\n")

                      lines[i] = (
                          indent
                          + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
                          + indent
                          + '  AC_MSG_WARN(['
                          + warning
                          + '])\n'
                          + indent
                          + '  X_CFLAGS=""\n'
                          + indent
                          + '  X_LIBS=""\n'
                          + indent
                          + 'else\n'
                          + original
                          + '\n'
                          + indent
                          + 'fi\n'
                      )

                      p.write_text(
                          "".join(lines)
                      )

                      print(
                          "Patched:",
                          p,
                          needle
                      )

                      found = True
                      break

                  if found:
                      break

              if not found:
                  raise SystemExit(
                      "X11 check not found: "
                      + needle
                  )

          print("X11 Horizon bypass installed")
          PY

      # ============================================================
      # Configure OpenJDK
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then

            echo "FreeType unavailable" \
              > horizon-research/configure-v2.0.1.log

            echo "99" \
              > horizon-research/configure-exit-code.txt

            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v2.0.1.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0

      # ============================================================
      # Locate generated OpenJDK spec
      # ============================================================

      - name: Locate OpenJDK spec.gmk
        shell: bash
        run: |
          set -e

          SPEC=$(
            find openjdk21/build \
              -type f \
              -name spec.gmk \
              | sed -n '1p'
          )

          if [ -z "$SPEC" ]; then
            echo "spec.gmk NOT FOUND"
            exit 1
          fi

          echo "OPENJDK_SPEC=$SPEC" \
            >> "$GITHUB_ENV"

          echo "$SPEC" \
            > horizon-research/spec-path-v2.0.1.txt

          echo "OpenJDK spec:"
          echo "$SPEC"

      # ============================================================
      # Propagate our Horizon identity into actual HotSpot commands
      # ============================================================

      - name: Inject Minecraft-NX Horizon macro
        shell: bash
        run: |
          set -e

          cat >> "$OPENJDK_SPEC" <<'EOF'

          # Minecraft-NX Horizon v2.0.1 compiler identity
          CFLAGS += -DMINECRAFT_NX_HORIZON=1
          CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EOF

          grep \
            -n \
            'MINECRAFT_NX_HORIZON' \
            "$OPENJDK_SPEC" \
            | tee horizon-research/spec-macro-v2.0.1.txt

      # ============================================================
      # JvmMapfile
      # ============================================================

      - name: Add Horizon support to JvmMapfile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/hotspot/lib/JvmMapfile.gmk"
          )

          s = p.read_text()

          marker = (
              'else ifeq ($(call isTargetOs, macosx), true)'
          )

          if "isTargetOs, horizon" in s:
              print(
                  "JvmMapfile Horizon branch "
                  "already present"
              )
              raise SystemExit(0)

          if marker not in s:
              raise SystemExit(
                  "macOS JvmMapfile branch not found"
              )

          horizon = r'''else ifeq ($(call isTargetOs, horizon), true)
            # Minecraft-NX / Horizon
            # Horizon AArch64 object files are ELF objects
            # generated by the devkitA64 GNU toolchain.
            DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only *$(OBJ_SUFFIX)
            ifneq ($(FILTER_SYMBOLS_PATTERN), )
              FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|
            endif
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)^_ZTV|^gHotSpotVM|^UseSharedSpaces$$
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|^_ZN9Arguments17SharedArchivePathE$$
            FILTER_SYMBOLS_AWK_SCRIPT := \
                '{ \
                  if ($$3 ~ /$(FILTER_SYMBOLS_PATTERN)/) print $$3; \
                }'

          '''

          p.write_text(
              s.replace(
                  marker,
                  horizon + marker,
                  1
              )
          )

          print(
              "JvmMapfile Horizon GNU/ELF branch installed"
          )
          PY

      # ============================================================
      # dlfcn.h
      # ============================================================

      - name: Disable global dlfcn include for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          s = p.read_text()

          if (
              "MINECRAFT_NX_HORIZON" in s
              and "#include <dlfcn.h>" in s
          ):
              print(
                  "Horizon dlfcn guard appears "
                  "to already be installed"
              )
              raise SystemExit(0)

          old = "#include <dlfcn.h>"

          if s.count(old) != 1:
              raise SystemExit(
                  "Expected exactly one dlfcn.h include"
              )

          new = '''// Minecraft-NX / Horizon
          //
          // Horizon does not expose the POSIX dlfcn interface.
          // Actual dynamic loading requirements must be ported
          // separately rather than pretending Horizon is Linux.
          #if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif'''

          p.write_text(
              s.replace(old, new, 1)
          )

          print(
              "dlfcn.h Horizon guard installed"
          )
          PY

      # ============================================================
      # Save our source changes
      # ============================================================

      - name: Save OpenJDK Horizon patch
        shell: bash
        run: |
          set +e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v2.0.1.patch

          wc -l \
            horizon-research/openjdk-horizon-v2.0.1.patch

          exit 0

      # ============================================================
      # HotSpot probe
      # ============================================================

      - name: Probe HotSpot build v2.0.1
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null || echo "99"
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "NOT STARTED - configure failed" \
              > horizon-research/hotspot-build-v2.0.1.log

            echo "99" \
              > horizon-research/hotspot-exit-code.txt

            exit 0
          fi

          cd openjdk21

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " HOTSPOT PROBE v2.0.1"
          echo " Created by Farbert_Took"
          echo "========================================"
          echo ""

          make \
            LOG=trace \
            hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v2.0.1.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          exit 0

      # ============================================================
      # Capture tail regardless of success/failure
      # ============================================================

      - name: Capture last 200 HotSpot lines
        shell: bash
        run: |
          set +e

          tail \
            -n 200 \
            horizon-research/hotspot-build-v2.0.1.log \
            > horizon-research/hotspot-last-200-v2.0.1.txt \
            2>/dev/null \
            || true

          exit 0

      # ============================================================
      # Verify actual compiler command contains our macro
      # ============================================================

      - name: Verify Horizon macro in HotSpot
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v2.0.1.log"

          if grep \
            -q \
            -- '-DMINECRAFT_NX_HORIZON=1' \
            "$LOG"
          then

            echo "YES" \
              > horizon-research/macro-result-v2.0.1.txt

          else

            echo "NO" \
              > horizon-research/macro-result-v2.0.1.txt

          fi

          echo -n "HotSpot macro: "
          cat horizon-research/macro-result-v2.0.1.txt

          exit 0

      # ============================================================
      # Verify previous dlfcn blocker remains solved
      # ============================================================

      - name: Verify dlfcn blocker
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v2.0.1.log"

          if grep \
            -Fq \
            'fatal error: dlfcn.h: No such file or directory' \
            "$LOG"
          then

            echo "PRESENT" \
              > horizon-research/dlfcn-result-v2.0.1.txt

          else

            echo "PASSED" \
              > horizon-research/dlfcn-result-v2.0.1.txt

          fi

          echo -n "dlfcn.h blocker: "
          cat horizon-research/dlfcn-result-v2.0.1.txt

          exit 0

      # ============================================================
      # Robust diagnostic parser
      #
      # Deliberately DOES NOT use the word "unsupported"
      # by itself, because jdk.unsupported.desktop is a valid module.
      # ============================================================

      - name: Analyze HotSpot failure
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path
          import re

          log_path = Path(
              "horizon-research/"
              "hotspot-build-v2.0.1.log"
          )

          output = Path(
              "horizon-research/"
              "diagnostic-v2.0.1.txt"
          )

          if not log_path.exists():
              output.write_text(
                  "HotSpot log not found.\n"
              )
              raise SystemExit(0)

          lines = log_path.read_text(
              errors="replace"
          ).splitlines()

          patterns = [
              (
                  "FATAL COMPILER ERROR",
                  re.compile(
                      r"fatal error:",
                      re.IGNORECASE
                  )
              ),
              (
                  "COMPILER ERROR",
                  re.compile(
                      r"(^|[\s:])error:",
                      re.IGNORECASE
                  )
              ),
              (
                  "MISSING FILE OR HEADER",
                  re.compile(
                      r"No such file or directory",
                      re.IGNORECASE
                  )
              ),
              (
                  "UNDEFINED REFERENCE",
                  re.compile(
                      r"undefined reference",
                      re.IGNORECASE
                  )
              ),
              (
                  "MAKE FAILURE",
                  re.compile(
                      r"(?:^|\s)g?make"
                      r"(?:\[[0-9]+\])?: "
                      r"\*\*\*",
                      re.IGNORECASE
                  )
              ),
              (
                  "MAKE ERROR",
                  re.compile(
                      r"\*\*\*.*Error [0-9]+",
                      re.IGNORECASE
                  )
              ),
              (
                  "NO RULE",
                  re.compile(
                      r"No rule to make target",
                      re.IGNORECASE
                  )
              ),
              (
                  "UNKNOWN TARGET OS",
                  re.compile(
                      r"Unknown target OS",
                      re.IGNORECASE
                  )
              ),
              (
                  "LINKER FAILURE",
                  re.compile(
                      r"(collect2:|ld:).*error",
                      re.IGNORECASE
                  )
              ),
          ]

          matches = []

          for i, line in enumerate(lines):

              for label, pattern in patterns:

                  if pattern.search(line):

                      matches.append(
                          (i, label, line)
                      )

                      break

          out = [
              "========================================",
              " Minecraft-NX",
              " HOTSPOT DIAGNOSTIC v2.0.1",
              " Created by Farbert_Took",
              "========================================",
              "",
          ]

          if not matches:

              out.extend([
                  "No standard compiler/make failure "
                  "pattern was detected.",
                  "",
                  "Inspect LAST 200 LINES.",
              ])

          else:

              first_index, label, line = matches[0]

              out.extend([
                  f"FIRST FAILURE TYPE: {label}",
                  f"FIRST FAILURE LINE: "
                  f"{first_index + 1}",
                  "",
                  "===== CONTEXT =====",
                  "",
              ])

              start = max(
                  0,
                  first_index - 15
              )

              end = min(
                  len(lines),
                  first_index + 35
              )

              for n in range(start, end):

                  out.append(
                      f"{n + 1}: {lines[n]}"
                  )

              out.extend([
                  "",
                  "===== DETECTED FAILURES =====",
                  "",
              ])

              for index, label, line in matches[:50]:

                  out.append(
                      f"{index + 1}: "
                      f"[{label}] "
                      f"{line}"
                  )

          output.write_text(
              "\n".join(out) + "\n"
          )
          PY

          cat \
            horizon-research/diagnostic-v2.0.1.txt

          exit 0

      - name: Scan missing headers
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E \
            'fatal error: .*: No such file or directory' \
            horizon-research/hotspot-build-v2.0.1.log \
            > horizon-research/missing-headers-v2.0.1.txt \
            || true

          exit 0

      - name: Scan compiler and linker errors
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E \
            'fatal error:|(^|[[:space:]:])error:|undefined reference|collect2:|ld: .*error' \
            horizon-research/hotspot-build-v2.0.1.log \
            > horizon-research/compiler-errors-v2.0.1.txt \
            || true

          exit 0

      - name: Scan make failures
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E \
            '(^|[[:space:]])g?make(\[[0-9]+\])?: \*\*\*|\*\*\*.*Error [0-9]+|No rule to make target' \
            horizon-research/hotspot-build-v2.0.1.log \
            > horizon-research/make-failures-v2.0.1.txt \
            || true

          exit 0

      # ============================================================
      # OpenJDK's own failure logs
      # ============================================================

      - name: Collect OpenJDK failure logs
        shell: bash
        run: |
          set +e

          ROOT="openjdk21/build/horizon-aarch64-minimal-release/make-support/failure-logs"

          mkdir -p \
            horizon-research/failure-logs

          if [ -d "$ROOT" ]; then

            find "$ROOT" \
              -type f \
              -print \
              > horizon-research/failure-log-files-v2.0.1.txt

            cp -R \
              "$ROOT"/. \
              horizon-research/failure-logs/ \
              2>/dev/null \
              || true

          fi

          exit 0

      # ============================================================
      # Compact output
      #
      # This is the step to copy back into ChatGPT.
      # ============================================================

      - name: Compact result
        shell: bash
        run: |
          set +e

          CONFIG=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null \
            || echo "unknown"
          )

          HOTSPOT=$(
            cat horizon-research/hotspot-exit-code.txt \
            2>/dev/null \
            || echo "unknown"
          )

          MACRO=$(
            cat horizon-research/macro-result-v2.0.1.txt \
            2>/dev/null \
            || echo "unknown"
          )

          DLFCN=$(
            cat horizon-research/dlfcn-result-v2.0.1.txt \
            2>/dev/null \
            || echo "unknown"
          )

          echo ""
          echo "========================================"
          echo " Minecraft-NX v2.0.1 COMPACT RESULT"
          echo " Created by Farbert_Took"
          echo "========================================"
          echo ""

          echo "Configure: $CONFIG"
          echo "HotSpot: $HOTSPOT"
          echo "Macro Horizon: $MACRO"
          echo "dlfcn.h: $DLFCN"

          echo ""
          echo "===== DIAGNOSTIC ====="
          echo ""

          sed -n '1,100p' \
            horizon-research/diagnostic-v2.0.1.txt \
            2>/dev/null \
            || true

          echo ""
          echo "===== MISSING HEADERS ====="
          echo ""

          if [ -s \
            horizon-research/missing-headers-v2.0.1.txt \
          ]; then

            sed -n '1,30p' \
              horizon-research/missing-headers-v2.0.1.txt

          else

            echo "None detected."

          fi

          echo ""
          echo "===== COMPILER / LINKER ERRORS ====="
          echo ""

          if [ -s \
            horizon-research/compiler-errors-v2.0.1.txt \
          ]; then

            sed -n '1,40p' \
              horizon-research/compiler-errors-v2.0.1.txt

          else

            echo "None detected."

          fi

          echo ""
          echo "===== MAKE FAILURES ====="
          echo ""

          if [ -s \
            horizon-research/make-failures-v2.0.1.txt \
          ]; then

            sed -n '1,40p' \
              horizon-research/make-failures-v2.0.1.txt

          else

            echo "None detected."

          fi

          echo ""
          echo "===== LAST 200 LINES ====="
          echo ""

          cat \
            horizon-research/hotspot-last-200-v2.0.1.txt \
            2>/dev/null \
            || true

          echo ""
          echo "========================================"
          echo " END Minecraft-NX v2.0.1"
          echo "========================================"

          exit 0

      - name: Upload Horizon Research v2.0.1
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v2.0.1
          path: horizon-research
