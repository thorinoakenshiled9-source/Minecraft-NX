name: OpenJDK Horizon Research v0.7

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK / Horizon Research v0.7
      # Created by Farbert_Took
      #
      # Confirmado ate v0.6:
      #
      #   Horizon recognition             OK
      #   horizon-aarch64                 OK
      #   Boot JDK 20                     OK
      #   devkitA64 GCC/G++               OK
      #   Cross compilation               OK
      #   Target 64-bit                   OK
      #   libjpeg                         bundled
      #   giflib                          bundled
      #   libpng                          bundled
      #   zlib                            bundled
      #   CUPS                            bypass Horizon
      #
      # v0.7:
      #
      #   Fontconfig                      bypass Horizon
      #
      # Objetivo:
      # continuar o configure ate encontrar a proxima barreira.
      #
      # Os bypasses sao apenas de pesquisa.
      # Eles NAO significam que java.desktop funciona no Horizon.
      # ============================================================


      # ============================================================
      # 1. Ferramentas
      # ============================================================

      - name: Install research tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            make \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.7"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. devkitA64 PATH
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

          echo ""
          echo "devkitA64 PATH configurado."


      # ============================================================
      # 3. Toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          GCC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          GXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

          test -x "$GCC"
          test -x "$GXX"

          echo ""
          echo "===== GCC ====="
          "$GCC" --version

          echo ""
          echo "===== G++ ====="
          "$GXX" --version

          echo ""
          echo "devkitA64 OK"


      # ============================================================
      # 4. Research directory
      # ============================================================

      - name: Prepare research directory
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.7"
            echo "Created by Farbert_Took"
          } > horizon-research/info.txt


      # ============================================================
      # 5. Teste Horizon/libnx
      # ============================================================

      - name: Verify Horizon compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon_test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon_test(void)
          {
              u64 value = 21;
              return (int)value;
          }
          EOF

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon_test.c \
            -o horizon-research/horizon_test.o

          echo ""
          echo "===== HORIZON OBJECT ====="

          file horizon-research/horizon_test.o

          echo ""
          echo "AArch64 + libnx OK"


      # ============================================================
      # 6. Boot JDK 20
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          echo ""
          echo "Baixando Eclipse Temurin JDK 20 x64..."

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          echo ""
          echo "Extraindo Boot JDK..."

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          echo ""
          echo "===== BOOT JDK ====="

          "$BOOT_JDK/bin/java" -version
          "$BOOT_JDK/bin/javac" -version


      # ============================================================
      # 7. Valida Boot JDK
      # ============================================================

      - name: Verify Boot JDK
        shell: bash
        run: |
          set -e

          test -x "$BOOT_JDK/bin/java"
          test -x "$BOOT_JDK/bin/javac"
          test -x "$BOOT_JDK/bin/jar"

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt

          "$BOOT_JDK/bin/javac" -version \
            2>&1 \
            | tee -a horizon-research/boot-jdk-version.txt

          echo ""
          echo "Boot JDK OK"


      # ============================================================
      # 8. OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          echo ""
          echo "===== OPENJDK COMMIT ====="

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 9. Horizon OS mapping
      #
      # aarch64-none-elf
      #       ↓
      # horizon-aarch64
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          cp \
            openjdk21/make/autoconf/platform.m4 \
            horizon-research/platform-original.m4

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          needle = 'AC_MSG_ERROR([unsupported operating system $1])'

          if needle not in s:
              raise SystemExit(
                  "Fallback de sistema operacional nao encontrado"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)
              case_start = s.rfind("*)", 0, pos)

              if case_start < 0:
                  raise SystemExit(
                      "Fallback *) nao encontrado"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print("Horizon OS mapping inserido.")
          PY

          echo ""
          echo "===== HORIZON MAPPING ====="

          grep \
            -n \
            -C 20 \
            'VAR_OS=horizon' \
            openjdk21/make/autoconf/platform.m4


      # ============================================================
      # 10. Localiza CUPS e Fontconfig
      # ============================================================

      - name: Inspect desktop library checks
        shell: bash
        run: |
          set -e

          echo ""
          echo "===== CUPS ====="

          grep -R -n -E \
            'Could not find cups|cups/cups.h|cups/ppd.h' \
            openjdk21/make/autoconf \
            2>/dev/null \
            | tee horizon-research/cups-search.txt \
            || true

          echo ""
          echo "===== FONTCONFIG ====="

          grep -R -n -E \
            'Could not find fontconfig|fontconfig/fontconfig.h|FONTCONFIG' \
            openjdk21/make/autoconf \
            2>/dev/null \
            | tee horizon-research/fontconfig-search.txt \
            || true


      # ============================================================
      # 11. Bypass CUPS para Horizon
      #
      # NAO usa headers/bibliotecas CUPS do Linux.
      # ============================================================

      - name: Disable CUPS requirement for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Nao encontrei checagem fatal CUPS"
              )

          text = target.read_text()

          pos = text.find("Could not find cups")

          if pos < 0:
              raise SystemExit(
                  "Mensagem CUPS nao encontrada"
              )

          line_start = text.rfind("\n", 0, pos) + 1
          line_end = text.find("\n", pos)

          if line_end < 0:
              line_end = len(text)

          original_line = text[line_start:line_end]

          indent = original_line[
              :len(original_line) - len(original_line.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original_line
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:line_start]
              + replacement
              + text[line_end:]
          )

          target.write_text(text)

          Path(
              "horizon-research/cups-patched-file.txt"
          ).write_text(str(target) + "\n")

          print("CUPS Horizon bypass aplicado:", target)
          PY

          CUPS_FILE=$(cat horizon-research/cups-patched-file.txt)

          echo ""
          echo "===== CUPS PATCH ====="

          grep \
            -n \
            -C 15 \
            'CUPS disabled for experimental Horizon target' \
            "$CUPS_FILE" \
            | tee horizon-research/cups-patch-context.txt


      # ============================================================
      # 12. Bypass Fontconfig para Horizon
      #
      # Mesma regra:
      #
      # - nao usa /usr/include/fontconfig
      # - nao usa libfontconfig Linux
      # - nao afirma que Fontconfig existe no Horizon
      #
      # Apenas permite que o configure de pesquisa continue.
      # ============================================================

      - name: Disable Fontconfig requirement for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Nao encontrei checagem fatal Fontconfig"
              )

          text = target.read_text()

          pos = text.find("Could not find fontconfig")

          if pos < 0:
              raise SystemExit(
                  "Mensagem Fontconfig nao encontrada"
              )

          line_start = text.rfind("\n", 0, pos) + 1
          line_end = text.find("\n", pos)

          if line_end < 0:
              line_end = len(text)

          original_line = text[line_start:line_end]

          indent = original_line[
              :len(original_line) - len(original_line.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original_line
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:line_start]
              + replacement
              + text[line_end:]
          )

          target.write_text(text)

          Path(
              "horizon-research/fontconfig-patched-file.txt"
          ).write_text(str(target) + "\n")

          print(
              "Fontconfig Horizon bypass aplicado:",
              target
          )
          PY

          FONTCONFIG_FILE=$(
            cat horizon-research/fontconfig-patched-file.txt
          )

          echo ""
          echo "===== FONTCONFIG PATCH ====="

          grep \
            -n \
            -C 15 \
            'Fontconfig disabled for experimental Horizon target' \
            "$FONTCONFIG_FILE" \
            | tee horizon-research/fontconfig-patch-context.txt


      # ============================================================
      # 13. Salva diff completo
      # ============================================================

      - name: Save OpenJDK Horizon v0.7 patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v0.7.patch

          echo ""
          echo "========================================"
          echo " PATCH v0.7"
          echo "========================================"

          cat horizon-research/openjdk-horizon-v0.7.patch


      # ============================================================
      # 14. Configure
      #
      # Esperado:
      #
      # CUPS disabled...
      # Fontconfig disabled...
      #
      # Depois queremos descobrir a proxima barreira.
      # ============================================================

      - name: Probe OpenJDK after Fontconfig patch
        shell: bash
        run: |
          set +e

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 | tee ../horizon-research/configure-v0.7.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          echo ""
          echo "========================================"
          echo " Configure exit code: $STATUS"
          echo "========================================"

          exit 0


      # ============================================================
      # 15. Summary
      # ============================================================

      - name: Analyze v0.7 result
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v0.7"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Boot JDK:"

            "$BOOT_JDK/bin/java" -version 2>&1

            echo ""
            echo "Configure exit code:"

            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant configure messages:"
            echo ""

            grep -i -E \
              'error|warning|unsupported|horizon|target|host|aarch64|elf|sysroot|compiler|toolchain|boot jdk|bootjdk|cups|fontconfig|freetype|alsa|x11|libx|libc|posix|linux|library|libraries|header|headers|jpeg|gif|png|zlib' \
              horizon-research/configure-v0.7.log \
              | tail -n 1200 \
              || true

          } > horizon-research/summary-v0.7.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v0.7"
          echo "========================================"

          cat horizon-research/summary-v0.7.txt


      # ============================================================
      # 16. Ultimas linhas sem filtro
      # ============================================================

      - name: Show configure tail
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " LAST 300 CONFIGURE LINES"
          echo "========================================"

          tail \
            -n 300 \
            horizon-research/configure-v0.7.log \
            | tee horizon-research/configure-tail-v0.7.txt


      # ============================================================
      # 17. Procura outras dependencias desktop
      # ============================================================

      - name: Inspect next desktop dependencies
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.7"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== DESKTOP LIBRARY REFERENCES ====="

            grep -R -n -E \
              'ALSA|X11|Xext|Xrender|Xtst|Xi|freetype|fontconfig|cups|harfbuzz' \
              openjdk21/make/autoconf \
              | head -n 3000

          } > horizon-research/desktop-library-references.txt

          exit 0


      # ============================================================
      # 18. HotSpot OS ports
      # ============================================================

      - name: Record HotSpot ports
        shell: bash
        run: |
          set -e

          {
            echo "===== HotSpot OS ports ====="
            echo ""

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

            echo ""
            echo "===== HotSpot OS/CPU ports ====="
            echo ""

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

          } > horizon-research/hotspot-ports.txt

          cat horizon-research/hotspot-ports.txt


      # ============================================================
      # 19. Coleta config.log
      # ============================================================

      - name: Collect configuration logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name "config.log" \
              -o \
              -name "configure.log" \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE_NAME=$(echo "$FILEPATH" | tr '/' '_')

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE_NAME"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 20. Resultado final
      # ============================================================

      - name: Final v0.7 report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.7"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Arquivos coletados:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "Os bypasses CUPS/Fontconfig sao de pesquisa."
          echo "Eles nao implementam essas bibliotecas no Horizon."
          echo ""
          echo "Ainda nao temos uma JVM OpenJDK funcional."


      # ============================================================
      # 21. Artifact
      # ============================================================

      - name: Upload Horizon Research v0.7
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v0.7
          path: horizon-research
