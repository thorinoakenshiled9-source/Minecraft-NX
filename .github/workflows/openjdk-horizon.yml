name: OpenJDK Horizon Research v1.0

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK Horizon Research v1.0
      # Created by Farbert_Took
      #
      # Objetivo:
      #
      #  1. Cross-compilar FreeType para AArch64/Horizon
      #  2. Detectar como esta revisao do OpenJDK recebe FreeType
      #  3. Configurar:
      #
      #       horizon-aarch64
      #       minimal
      #       headless
      #
      #  4. Se configure = 0:
      #
      #       make hotspot
      #
      #  5. Capturar a primeira fronteira real do port Horizon.
      #
      # Isto ainda e pesquisa de port.
      # Nao esperamos um NRO Java 21 funcional nesta etapa.
      # ============================================================


      # ============================================================
      # 1. Ferramentas
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.0"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. PATH devkitA64
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. Diretorios
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v1.0"
            echo "Created by Farbert_Took"
            echo ""
            echo "Target:"
            echo "Nintendo Switch Horizon / AArch64"
            echo ""
            echo "JVM:"
            echo "OpenJDK 21 HotSpot minimal"
            echo ""
            echo "Mode:"
            echo "headless"
          } > horizon-research/info.txt


      # ============================================================
      # 4. Toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          GCC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          GXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

          test -x "$GCC"
          test -x "$GXX"

          "$GCC" --version \
            | tee horizon-research/gcc-version.txt

          "$GXX" --version \
            | tee horizon-research/gxx-version.txt

          test -f /opt/devkitpro/libnx/include/switch.h

          echo ""
          echo "devkitA64 + libnx OK."


      # ============================================================
      # 5. Teste AArch64
      # ============================================================

      - name: Verify Horizon AArch64 compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon-test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_java21(void)
          {
              u64 version = 21;
              return (int)version;
          }
          EOF

          aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon-test.c \
            -o horizon-research/horizon-test.o

          file horizon-research/horizon-test.o \
            | tee horizon-research/horizon-object.txt


      # ============================================================
      # 6. Boot JDK 20
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt


      # ============================================================
      # 7. FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

          git -C freetype-src rev-parse HEAD \
            | tee horizon-research/freetype-commit.txt


      # ============================================================
      # 8. Configure FreeType
      # ============================================================

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0


      # ============================================================
      # 9. Build FreeType
      # ============================================================

      - name: Build and install FreeType
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "FreeType configure failed." \
              | tee horizon-research/freetype-build.log

            echo "1" \
              > horizon-research/freetype-build-exit.txt

            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then

            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log

          fi

          exit 0


      # ============================================================
      # 10. Valida FreeType
      # ============================================================

      - name: Validate Horizon FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | head -n 1
          )

          if [ -z "$FREETYPE_LIB" ]; then

            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"

            echo "FreeType target NOT READY."

            exit 0
          fi

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"

          echo "FreeType target READY."
          echo "$FREETYPE_LIB"

          aarch64-none-elf-ar \
            t "$FREETYPE_LIB" \
            | head -n 40 \
            | tee horizon-research/freetype-members.txt

          find "$FREETYPE_PREFIX" \
            -type f \
            -print \
            | sort \
            > horizon-research/freetype-installed-files.txt


      # ============================================================
      # 11. Teste de header FreeType
      # ============================================================

      - name: Compile FreeType test
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then
            exit 0
          fi

          cat > horizon-research/freetype-test.c <<'EOF'
          #include <ft2build.h>
          #include FT_FREETYPE_H

          int minecraft_nx_freetype(void)
          {
              FT_Library library = 0;
              return library == 0 ? 21 : 0;
          }
          EOF

          aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -I"$FREETYPE_PREFIX/include/freetype2" \
            -c \
            horizon-research/freetype-test.c \
            -o horizon-research/freetype-test.o \
            2>&1 \
            | tee horizon-research/freetype-test.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > horizon-research/freetype-test-exit.txt

          exit 0


      # ============================================================
      # 12. OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 13. Horizon mapping
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          needle = 'AC_MSG_ERROR([unsupported operating system $1])'

          if needle not in s:
              raise SystemExit("OS fallback not found")

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)
              case_start = s.rfind("*)", 0, pos)

              if case_start < 0:
                  raise SystemExit("OS fallback case not found")

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print("elf -> horizon mapping installed")
          PY


      # ============================================================
      # 14. CUPS bypass
      # ============================================================

      - name: Apply Horizon CUPS research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit("CUPS check not found")

          text = target.read_text()

          pos = text.find("Could not find cups")
          start = text.rfind("\n", 0, pos) + 1
          end = text.find("\n", pos)

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original) - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)
          PY


      # ============================================================
      # 15. Fontconfig bypass
      # ============================================================

      - name: Apply Horizon Fontconfig research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit("Fontconfig check not found")

          text = target.read_text()

          pos = text.find("Could not find fontconfig")
          start = text.rfind("\n", 0, pos) + 1
          end = text.find("\n", pos)

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original) - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)
          PY


      # ============================================================
      # 16. configure --help
      # ============================================================

      - name: Inspect FreeType configure interface
        shell: bash
        run: |
          set -e

          cd openjdk21

          bash configure --help \
            > ../horizon-research/configure-help.txt \
            2>&1 \
            || true

          grep \
            -i \
            -C 6 \
            'freetype' \
            ../horizon-research/configure-help.txt \
            | tee ../horizon-research/freetype-options.txt \
            || true


      # ============================================================
      # 17. Detecta interface FreeType
      #
      # O v0.9 confirmou:
      #
      # --with-freetype=<path>
      #
      # NAO e valido.
      #
      # Aqui usamos:
      #
      # --with-freetype=system
      #
      # e detectamos as opcoes adicionais oferecidas pela revisao.
      # ============================================================

      - name: Detect OpenJDK FreeType arguments
        shell: bash
        run: |
          set -e

          HELP=horizon-research/configure-help.txt

          INCLUDE="$FREETYPE_PREFIX/include/freetype2"

          LIBDIR=$(
            dirname "$FREETYPE_LIB"
          )

          ARGS="--with-freetype=system"

          MODE="system"

          if grep -q -- '--with-freetype-include' "$HELP"; then

            ARGS="$ARGS --with-freetype-include=$INCLUDE"

            MODE="$MODE + freetype-include"
          fi

          if grep -q -- '--with-freetype-lib' "$HELP"; then

            ARGS="$ARGS --with-freetype-lib=$LIBDIR"

            MODE="$MODE + freetype-lib"
          fi

          if grep -q -- '--with-freetype-include-path' "$HELP"; then

            ARGS="$ARGS --with-freetype-include-path=$INCLUDE"

            MODE="$MODE + freetype-include-path"
          fi

          if grep -q -- '--with-freetype-lib-path' "$HELP"; then

            ARGS="$ARGS --with-freetype-lib-path=$LIBDIR"

            MODE="$MODE + freetype-lib-path"
          fi

          echo "FREETYPE_CONFIGURE_ARGS=$ARGS" \
            >> "$GITHUB_ENV"

          echo "FREETYPE_CONFIGURE_MODE=$MODE" \
            >> "$GITHUB_ENV"

          {
            echo "FreeType prefix:"
            echo "$FREETYPE_PREFIX"

            echo ""
            echo "Include:"
            echo "$INCLUDE"

            echo ""
            echo "Library directory:"
            echo "$LIBDIR"

            echo ""
            echo "Detected mode:"
            echo "$MODE"

            echo ""
            echo "Configure args:"
            echo "$ARGS"

          } | tee horizon-research/freetype-detection.txt


      # ============================================================
      # 18. Prepara pkg-config CROSS
      #
      # Se o OpenJDK usar pkg-config para FreeType, queremos que ele
      # enxergue o .pc que acabou de ser instalado no prefix target.
      # ============================================================

      - name: Prepare target pkg-config environment
        shell: bash
        run: |
          set -e

          PC1="$FREETYPE_PREFIX/lib/pkgconfig"
          PC2="$FREETYPE_PREFIX/lib64/pkgconfig"
          PC3="$FREETYPE_PREFIX/share/pkgconfig"

          TARGET_PC=""

          for P in "$PC1" "$PC2" "$PC3"
          do
            if [ -d "$P" ]; then

              if [ -z "$TARGET_PC" ]; then
                TARGET_PC="$P"
              else
                TARGET_PC="$TARGET_PC:$P"
              fi

            fi
          done

          echo "TARGET_PKG_CONFIG_PATH=$TARGET_PC" \
            >> "$GITHUB_ENV"

          {
            echo "Target pkg-config paths:"
            echo "$TARGET_PC"

            echo ""
            echo "FreeType pc files:"

            find "$FREETYPE_PREFIX" \
              -name '*.pc' \
              -type f \
              -print \
              || true

          } | tee horizon-research/pkg-config-target.txt


      # ============================================================
      # 19. Configure OpenJDK
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then

            echo "FreeType target unavailable." \
              | tee horizon-research/configure-v1.0.log

            echo "99" \
              > horizon-research/configure-exit-code.txt

            exit 0
          fi

          cd openjdk21

          export PKG_CONFIG_PATH="$TARGET_PKG_CONFIG_PATH"
          export PKG_CONFIG_LIBDIR="$TARGET_PKG_CONFIG_PATH"

          export FREETYPE_CFLAGS="-I$FREETYPE_PREFIX/include/freetype2"

          export FREETYPE_LIBS="$FREETYPE_LIB"

          echo "========================================"
          echo " OPENJDK CONFIGURE"
          echo "========================================"

          echo ""
          echo "FreeType args:"
          echo "$FREETYPE_CONFIGURE_ARGS"

          echo ""
          echo "FREETYPE_CFLAGS:"
          echo "$FREETYPE_CFLAGS"

          echo ""
          echo "FREETYPE_LIBS:"
          echo "$FREETYPE_LIBS"

          echo ""

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            $FREETYPE_CONFIGURE_ARGS \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            FREETYPE_CFLAGS="$FREETYPE_CFLAGS" \
            FREETYPE_LIBS="$FREETYPE_LIBS" \
            2>&1 \
            | tee ../horizon-research/configure-v1.0.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0


      # ============================================================
      # 20. Analisa configure
      # ============================================================

      - name: Analyze OpenJDK configure
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v1.0"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Target:"
            echo "Horizon / AArch64"

            echo ""
            echo "JVM:"
            echo "minimal"

            echo ""
            echo "Mode:"
            echo "headless"

            echo ""
            echo "FreeType configure exit:"
            cat horizon-research/freetype-configure-exit.txt

            echo ""
            echo "FreeType build exit:"
            cat horizon-research/freetype-build-exit.txt

            echo ""
            echo "FreeType ready:"
            echo "${FREETYPE_READY:-no}"

            echo ""
            echo "FreeType OpenJDK mode:"
            echo "${FREETYPE_CONFIGURE_MODE:-unknown}"

            echo ""
            echo "OpenJDK configure exit:"
            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant messages:"
            echo ""

            grep -i -E \
              'error|warning|unsupported|horizon|target|host|aarch64|headless|minimal|freetype|cups|fontconfig|alsa|x11|xext|xrender|xtst|xi|ffi|sysroot|posix|linux|library|libraries|header|headers|jvm' \
              horizon-research/configure-v1.0.log \
              | tail -n 2000 \
              || true

          } > horizon-research/summary-v1.0.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v1.0"
          echo "========================================"

          cat horizon-research/summary-v1.0.txt


      # ============================================================
      # 21. Configure tail
      # ============================================================

      - name: Show configure tail
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo " OPENJDK CONFIGURE LAST 500"
          echo "========================================"

          tail \
            -n 500 \
            horizon-research/configure-v1.0.log \
            | tee horizon-research/configure-tail-v1.0.txt

          exit 0


      # ============================================================
      # 22. Probe HotSpot
      #
      # SOMENTE se configure realmente chegou a 0.
      # ============================================================

      - name: Probe HotSpot build
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            {
              echo "HotSpot probe NOT STARTED."
              echo ""
              echo "OpenJDK configure exit:"
              echo "$CONFIG_STATUS"

            } > horizon-research/hotspot-summary-v1.0.txt

            exit 0
          fi

          echo "========================================"
          echo " CONFIGURE = 0"
          echo " STARTING HOTSPOT PROBE"
          echo "========================================"

          cd openjdk21

          make hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v1.0.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          {
            echo "========================================"
            echo " HOTSPOT PROBE v1.0"
            echo "========================================"

            echo ""
            echo "make hotspot exit:"
            echo "$STATUS"

            echo ""
            echo "Relevant messages:"
            echo ""

            grep -i -E \
              'error|fatal|horizon|aarch64|os_cpu|os/|not found|no rule|undefined|unsupported|missing|posix|linux|pthread|signal|mmap|dlopen' \
              ../horizon-research/hotspot-build-v1.0.log \
              | tail -n 2000 \
              || true

            echo ""
            echo "===== LAST 500 ====="

            tail \
              -n 500 \
              ../horizon-research/hotspot-build-v1.0.log

          } > ../horizon-research/hotspot-summary-v1.0.txt

          exit 0


      # ============================================================
      # 23. Inventario HotSpot
      # ============================================================

      - name: Inspect HotSpot port structure
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "HotSpot Horizon Port Research"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== CPU/AArch64 ====="

            find \
              openjdk21/src/hotspot/cpu/aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== OS ports ====="

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== OS/CPU ports ====="

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== Linux AArch64 reference ====="

            find \
              openjdk21/src/hotspot/os/linux \
              openjdk21/src/hotspot/os_cpu/linux_aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== Possible Horizon port ====="

            echo "src/hotspot/os/horizon/"
            echo "src/hotspot/os_cpu/horizon_aarch64/"

          } > horizon-research/hotspot-port-map-v1.0.txt

          exit 0


      # ============================================================
      # 24. Salva patch
      # ============================================================

      - name: Save OpenJDK Horizon patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v1.0.patch


      # ============================================================
      # 25. Coleta config.log
      # ============================================================

      - name: Collect configure logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name 'config.log' \
              -o \
              -name 'configure.log' \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE=$(
                echo "$FILEPATH" \
                | tr '/' '_'
              )

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 26. Relatorio final
      # ============================================================

      - name: Final v1.0 report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.0"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "FreeType target:"
          echo "${FREETYPE_READY:-no}"

          echo ""
          echo "FreeType integration mode:"
          echo "${FREETYPE_CONFIGURE_MODE:-unknown}"

          echo ""
          echo "OpenJDK configure exit:"
          cat horizon-research/configure-exit-code.txt

          if [ -f horizon-research/hotspot-exit-code.txt ]; then

            echo ""
            echo "HotSpot exit:"
            cat horizon-research/hotspot-exit-code.txt

          fi

          echo ""
          echo "Research files:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"
          echo " IMPORTANT"
          echo "========================================"
          echo ""
          echo "configure=0 nao significa que Horizon"
          echo "ja possui suporte no OpenJDK."
          echo ""
          echo "O proximo objetivo e encontrar a primeira"
          echo "dependencia real de OS do HotSpot."


      # ============================================================
      # 27. Artifact
      # ============================================================

      - name: Upload Horizon Research v1.0
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v1.0
          path: horizon-research
