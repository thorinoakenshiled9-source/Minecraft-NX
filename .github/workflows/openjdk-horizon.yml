name: OpenJDK Horizon Research v1.1

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK Horizon Research v1.1
      # Created by Farbert_Took
      #
      # v1.0 confirmou:
      #
      #   FreeType cross configure = OK
      #   FreeType cross build     = OK
      #   Headers                  = encontrados
      #
      # Bloqueio:
      #
      #   OpenJDK procura:
      #     libfreetype.so
      #
      #   Horizon possui:
      #     libfreetype.a
      #
      # v1.1:
      #
      #   1. encontra a macro exata do OpenJDK
      #   2. salva o trecho original
      #   3. adiciona suporte experimental a libfreetype.a
      #      SOMENTE para OPENJDK_TARGET_OS=horizon
      #   4. roda configure
      #   5. se configure=0 -> make hotspot
      #
      # Nao renomeamos .a para .so.
      # ============================================================


      # ============================================================
      # 1. Ferramentas
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.1"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. PATH
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. Diretorios
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v1.1"
            echo "Created by Farbert_Took"
            echo ""
            echo "Target: Horizon / AArch64"
            echo "JVM: HotSpot minimal"
            echo "Mode: headless"
            echo "FreeType: static AArch64 target"
          } > horizon-research/info.txt


      # ============================================================
      # 4. Toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt

          test -f /opt/devkitpro/libnx/include/switch.h

          echo "devkitA64 + libnx OK"


      # ============================================================
      # 5. Teste AArch64
      # ============================================================

      - name: Verify AArch64 compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon-test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon_test(void)
          {
              u64 value = 21;
              return (int)value;
          }
          EOF

          aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon-test.c \
            -o horizon-research/horizon-test.o

          file horizon-research/horizon-test.o \
            | tee horizon-research/horizon-object.txt


      # ============================================================
      # 6. Boot JDK 20
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt


      # ============================================================
      # 7. FreeType source
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

          git -C freetype-src rev-parse HEAD \
            | tee horizon-research/freetype-commit.txt


      # ============================================================
      # 8. FreeType configure
      # ============================================================

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0


      # ============================================================
      # 9. FreeType build
      # ============================================================

      - name: Build FreeType
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "FreeType configure failed." \
              > horizon-research/freetype-build.log

            echo "1" \
              > horizon-research/freetype-build-exit.txt

            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then

            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log

          fi

          exit 0


      # ============================================================
      # 10. Valida libfreetype.a
      # ============================================================

      - name: Validate static FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | head -n 1
          )

          if [ -z "$FREETYPE_LIB" ]; then

            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"

            echo "libfreetype.a NOT FOUND"

            exit 0
          fi

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"

          FREETYPE_LIBDIR=$(dirname "$FREETYPE_LIB")

          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" \
            >> "$GITHUB_ENV"

          echo ""
          echo "===== STATIC FREETYPE ====="
          echo "$FREETYPE_LIB"

          ls -lh "$FREETYPE_LIB"

          echo ""
          echo "Archive members:"
          echo ""

          aarch64-none-elf-ar \
            t "$FREETYPE_LIB" \
            | head -n 50 \
            | tee horizon-research/freetype-members.txt

          echo ""
          echo "Object architecture sample:"
          echo ""

          rm -rf /tmp/freetype-object-test
          mkdir /tmp/freetype-object-test

          cd /tmp/freetype-object-test

          FIRST_OBJECT=$(
            aarch64-none-elf-ar \
              t "$FREETYPE_LIB" \
              | head -n 1
          )

          if [ -n "$FIRST_OBJECT" ]; then

            aarch64-none-elf-ar \
              x "$FREETYPE_LIB" \
              "$FIRST_OBJECT"

            file "$FIRST_OBJECT" \
              | tee "$GITHUB_WORKSPACE/horizon-research/freetype-object-architecture.txt"

          fi

          exit 0


      # ============================================================
      # 11. OpenJDK
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 12. Horizon mapping
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          needle = 'AC_MSG_ERROR([unsupported operating system $1])'

          if needle not in s:
              raise SystemExit(
                  "OS fallback not found"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)
              case_start = s.rfind("*)", 0, pos)

              if case_start < 0:
                  raise SystemExit(
                      "OS fallback case not found"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print("elf -> horizon mapping installed")
          PY


      # ============================================================
      # 13. CUPS bypass
      # ============================================================

      - name: Apply Horizon CUPS research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "CUPS check not found"
              )

          text = target.read_text()

          pos = text.find("Could not find cups")
          start = text.rfind("\n", 0, pos) + 1
          end = text.find("\n", pos)

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original) - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)
          PY


      # ============================================================
      # 14. Fontconfig bypass
      # ============================================================

      - name: Apply Horizon Fontconfig research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Fontconfig check not found"
              )

          text = target.read_text()

          pos = text.find("Could not find fontconfig")
          start = text.rfind("\n", 0, pos) + 1
          end = text.find("\n", pos)

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original) - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)
          PY


      # ============================================================
      # 15. LOCALIZA A CHECAGEM REAL DO FREETYPE
      # ============================================================

      - name: Locate OpenJDK FreeType shared library check
        shell: bash
        run: |
          set -e

          echo "Searching OpenJDK autoconf sources..."

          grep -R -n \
            -E 'libfreetype\.so|Can not find or use freetype|Could not find.*freetype' \
            openjdk21/make/autoconf \
            > horizon-research/freetype-check-locations.txt \
            || true

          cat horizon-research/freetype-check-locations.txt

          echo ""
          echo "===== CONTEXT ====="
          echo ""

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")
          output = []

          needles = [
              "libfreetype.so",
              "Can not find or use freetype",
              "Could not find"
          ]

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")
              lines = text.splitlines()

              for i, line in enumerate(lines):

                  if (
                      "freetype" in line.lower()
                      and any(
                          n.lower() in line.lower()
                          for n in needles
                      )
                  ):

                      start = max(0, i - 35)
                      end = min(len(lines), i + 36)

                      output.append(
                          "\n"
                          + "=" * 70
                          + "\nFILE: "
                          + str(p)
                          + "\nLINE: "
                          + str(i + 1)
                          + "\n"
                          + "=" * 70
                          + "\n"
                      )

                      for j in range(start, end):
                          output.append(
                              f"{j + 1:5}: {lines[j]}\n"
                          )

          Path(
              "horizon-research/freetype-check-context.txt"
          ).write_text(
              "".join(output)
          )
          PY

          cat horizon-research/freetype-check-context.txt \
            || true


      # ============================================================
      # 16. PATCH FREETYPE STATIC PARA HORIZON
      #
      # Em vez de tentar adivinhar o nome da macro, procuramos
      # especificamente a expressao libfreetype.so.
      #
      # Para Horizon:
      #
      #   libfreetype.so -> libfreetype.a
      #
      # Para os outros targets:
      #
      #   comportamento original permanece.
      #
      # O patch e salvo para inspecao.
      # ============================================================

      - name: Patch OpenJDK FreeType detection for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          candidates = []

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "libfreetype.so" in text:
                  candidates.append(p)

          if not candidates:
              raise SystemExit(
                  "No libfreetype.so check found in autoconf sources"
              )

          changed = []

          for p in candidates:

              text = p.read_text(errors="ignore")
              original = text

              # ----------------------------------------------------
              # We intentionally do NOT rename the actual .a file.
              #
              # We modify the configure source so that the Horizon
              # target checks the static archive.
              #
              # Most OpenJDK FreeType detection code stores the
              # library suffix/name in shell/autoconf variables.
              # This first replacement catches direct literal
              # references while preserving all non-Horizon targets.
              # ----------------------------------------------------

              lines = text.splitlines(True)
              new_lines = []

              for line in lines:

                  if "libfreetype.so" not in line:
                      new_lines.append(line)
                      continue

                  indent = line[
                      :len(line) - len(line.lstrip())
                  ]

                  original_line = line.rstrip("\n")

                  replacement = (
                      indent
                      + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
                      + indent
                      + '  FREETYPE_HORIZON_STATIC=yes\n'
                      + indent
                      + original_line.lstrip().replace(
                          "libfreetype.so",
                          "libfreetype.a"
                      )
                      + '\n'
                      + indent
                      + 'else\n'
                      + original_line
                      + '\n'
                      + indent
                      + 'fi\n'
                  )

                  new_lines.append(replacement)

              text = "".join(new_lines)

              if text != original:

                  p.write_text(text)
                  changed.append(str(p))

          if not changed:
              raise SystemExit(
                  "FreeType source located but patch made no changes"
              )

          Path(
              "horizon-research/freetype-static-patched-files.txt"
          ).write_text(
              "\n".join(changed) + "\n"
          )

          print("Patched files:")

          for f in changed:
              print(f)
          PY

          echo ""
          echo "===== PATCH RESULT ====="
          echo ""

          grep -R -n -C 8 \
            'FREETYPE_HORIZON_STATIC' \
            openjdk21/make/autoconf \
            | tee horizon-research/freetype-static-patch-context.txt


      # ============================================================
      # 17. Salva diff imediatamente
      # ============================================================

      - name: Save Horizon patch before configure
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v1.1.patch

          echo ""
          echo "===== PATCH SIZE ====="
          echo ""

          wc -l \
            horizon-research/openjdk-horizon-v1.1.patch

          echo ""
          echo "===== FREETYPE PATCH ====="
          echo ""

          grep -n -C 10 \
            -E 'freetype|FREETYPE_HORIZON_STATIC' \
            horizon-research/openjdk-horizon-v1.1.patch \
            | head -n 500 \
            || true


      # ============================================================
      # 18. Configure help
      # ============================================================

      - name: Inspect OpenJDK configure options
        shell: bash
        run: |
          set -e

          cd openjdk21

          bash configure --help \
            > ../horizon-research/configure-help.txt \
            2>&1 \
            || true

          grep -i -C 6 \
            'freetype' \
            ../horizon-research/configure-help.txt \
            > ../horizon-research/freetype-options.txt \
            || true

          cat ../horizon-research/freetype-options.txt


      # ============================================================
      # 19. Configure OpenJDK
      #
      # Agora continuamos usando a interface oficialmente aceita:
      #
      #   --with-freetype=system
      #   --with-freetype-include=...
      #   --with-freetype-lib=...
      #
      # A diferenca e que a checagem Horizon foi adaptada para .a.
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then

            echo "FreeType target unavailable." \
              > horizon-research/configure-v1.1.log

            echo "99" \
              > horizon-research/configure-exit-code.txt

            exit 0
          fi

          cd openjdk21

          export FREETYPE_CFLAGS="-I$FREETYPE_PREFIX/include/freetype2"

          export FREETYPE_LIBS="$FREETYPE_LIB"

          echo "========================================"
          echo " OPENJDK HORIZON CONFIGURE v1.1"
          echo "========================================"

          echo ""
          echo "FreeType:"
          echo "$FREETYPE_LIB"

          echo ""

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            FREETYPE_CFLAGS="$FREETYPE_CFLAGS" \
            FREETYPE_LIBS="$FREETYPE_LIBS" \
            2>&1 \
            | tee ../horizon-research/configure-v1.1.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0


      # ============================================================
      # 20. Summary
      # ============================================================

      - name: Analyze OpenJDK configure
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v1.1"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Target:"
            echo "Horizon / AArch64"

            echo ""
            echo "JVM:"
            echo "minimal"

            echo ""
            echo "Mode:"
            echo "headless"

            echo ""
            echo "FreeType configure:"
            cat horizon-research/freetype-configure-exit.txt

            echo ""
            echo "FreeType build:"
            cat horizon-research/freetype-build-exit.txt

            echo ""
            echo "FreeType ready:"
            echo "${FREETYPE_READY:-no}"

            echo ""
            echo "FreeType target library:"
            echo "${FREETYPE_LIB:-not-found}"

            echo ""
            echo "OpenJDK configure exit:"
            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant messages:"
            echo ""

            grep -i -E \
              'error|warning|unsupported|horizon|target|host|aarch64|headless|minimal|freetype|cups|fontconfig|alsa|x11|xext|xrender|xtst|xi|ffi|sysroot|posix|linux|library|libraries|header|headers|jvm|pthread|signal|mmap|dlopen' \
              horizon-research/configure-v1.1.log \
              | tail -n 2200 \
              || true

          } > horizon-research/summary-v1.1.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v1.1"
          echo "========================================"

          cat horizon-research/summary-v1.1.txt


      # ============================================================
      # 21. Configure tail
      # ============================================================

      - name: Show configure tail
        shell: bash
        run: |
          set +e

          echo ""
          echo "========================================"
          echo " OPENJDK CONFIGURE LAST 500"
          echo "========================================"

          tail \
            -n 500 \
            horizon-research/configure-v1.1.log \
            | tee horizon-research/configure-tail-v1.1.txt

          exit 0


      # ============================================================
      # 22. HOTSPOT
      #
      # Se finalmente configure=0, entramos no HotSpot.
      # ============================================================

      - name: Probe HotSpot build
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            {
              echo "========================================"
              echo " HOTSPOT PROBE v1.1"
              echo "========================================"
              echo ""
              echo "NOT STARTED"
              echo ""
              echo "Configure exit:"
              echo "$CONFIG_STATUS"

            } > horizon-research/hotspot-summary-v1.1.txt

            cat horizon-research/hotspot-summary-v1.1.txt

            exit 0
          fi

          echo ""
          echo "========================================"
          echo " CONFIGURE = 0"
          echo " ENTERING HOTSPOT BUILD"
          echo "========================================"
          echo ""

          cd openjdk21

          make hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v1.1.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          {
            echo "========================================"
            echo " HOTSPOT PROBE v1.1"
            echo "========================================"

            echo ""
            echo "make hotspot exit:"
            echo "$STATUS"

            echo ""
            echo "Relevant messages:"
            echo ""

            grep -i -E \
              'error|fatal|horizon|aarch64|os_cpu|os/|not found|no rule|undefined|unsupported|missing|posix|linux|pthread|signal|mmap|munmap|dlopen|dlsym|clock|gettimeofday|thread|socket' \
              ../horizon-research/hotspot-build-v1.1.log \
              | tail -n 2500 \
              || true

            echo ""
            echo "===== LAST 600 ====="
            echo ""

            tail \
              -n 600 \
              ../horizon-research/hotspot-build-v1.1.log

          } > ../horizon-research/hotspot-summary-v1.1.txt

          cat ../horizon-research/hotspot-summary-v1.1.txt

          exit 0


      # ============================================================
      # 23. Inventario das implementacoes OS do HotSpot
      # ============================================================

      - name: Create HotSpot Horizon port map
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "HotSpot Horizon Port Map v1.1"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== CPU AArch64 ====="

            find \
              openjdk21/src/hotspot/cpu/aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== OS implementations ====="

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== OS_CPU implementations ====="

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== Linux AArch64 reference ====="

            find \
              openjdk21/src/hotspot/os/linux \
              openjdk21/src/hotspot/os_cpu/linux_aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== BSD reference ====="

            find \
              openjdk21/src/hotspot/os/bsd \
              openjdk21/src/hotspot/os_cpu/bsd_aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== Horizon candidate ====="

            echo "src/hotspot/os/horizon/"
            echo "src/hotspot/os_cpu/horizon_aarch64/"

          } > horizon-research/hotspot-port-map-v1.1.txt

          exit 0


      # ============================================================
      # 24. Config logs
      # ============================================================

      - name: Collect configuration logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name 'config.log' \
              -o \
              -name 'configure.log' \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE=$(
                echo "$FILEPATH" \
                | tr '/' '_'
              )

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 25. Relatorio final
      # ============================================================

      - name: Final v1.1 report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.1"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "FreeType target:"
          echo "${FREETYPE_READY:-no}"

          echo ""
          echo "FreeType library:"
          echo "${FREETYPE_LIB:-not-found}"

          echo ""
          echo "OpenJDK configure exit:"
          cat horizon-research/configure-exit-code.txt

          if [ -f horizon-research/hotspot-exit-code.txt ]; then

            echo ""
            echo "HotSpot exit:"
            cat horizon-research/hotspot-exit-code.txt

          fi

          echo ""
          echo "Research files:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"
          echo " STATUS"
          echo "========================================"
          echo ""
          echo "Este workflow e um experimento de port."
          echo "Nao significa que OpenJDK ja suporta Horizon."


      # ============================================================
      # 26. Artifact
      # ============================================================

      - name: Upload Horizon Research v1.1
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v1.1
          path: horizon-research
