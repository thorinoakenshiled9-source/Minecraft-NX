name: OpenJDK Horizon Research v0.9

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      HORIZON_PREFIX: /opt/horizon-libs
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK Horizon Research v0.9
      # Created by Farbert_Took
      #
      # Objetivo:
      #
      #   OpenJDK 21
      #       +
      #   Horizon/AArch64
      #       +
      #   HotSpot minimal
      #       +
      #   headless
      #       +
      #   FreeType cross-compiled
      #
      # NAO usamos libfreetype x86_64 do Ubuntu como target.
      #
      # Primeiro tentamos produzir:
      #
      #   libfreetype.a
      #
      # usando:
      #
      #   aarch64-none-elf-gcc
      #
      # Depois apontamos o configure do OpenJDK para esse prefix.
      #
      # Ainda nao esperamos um NRO funcional.
      # ============================================================


      # ============================================================
      # 1. Ferramentas do build host
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.9"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. PATH
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. Research directory
      # ============================================================

      - name: Prepare research directories
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf "$HORIZON_PREFIX"
          mkdir -p "$FREETYPE_PREFIX"

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.9"
            echo "Created by Farbert_Took"
            echo ""
            echo "Experiment:"
            echo "Cross-compiled FreeType + minimal/headless OpenJDK 21"
          } > horizon-research/info.txt


      # ============================================================
      # 4. Verifica devkitA64
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          GCC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          GXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

          test -x "$GCC"
          test -x "$GXX"

          "$GCC" --version \
            | tee horizon-research/gcc-version.txt

          "$GXX" --version \
            | tee horizon-research/gxx-version.txt

          echo ""
          echo "===== LIBNX ====="

          test -f /opt/devkitpro/libnx/include/switch.h

          echo "libnx headers encontrados."


      # ============================================================
      # 5. Teste simples AArch64/Horizon
      # ============================================================

      - name: Verify Horizon object compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon_test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_java21_test(void)
          {
              u64 version = 21;
              return (int)version;
          }
          EOF

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon_test.c \
            -o horizon-research/horizon_test.o

          file horizon-research/horizon_test.o \
            | tee horizon-research/horizon-object.txt


      # ============================================================
      # 6. Boot JDK 20
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt


      # ============================================================
      # 7. Baixa FreeType
      #
      # Usamos uma versao conhecida da serie 2.x.
      # ============================================================

      - name: Download FreeType source
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

          git -C freetype-src rev-parse HEAD \
            | tee horizon-research/freetype-commit.txt

          echo ""
          echo "FreeType source OK."


      # ============================================================
      # 8. Configura FreeType para devkitA64
      #
      # Desabilitamos dependencias opcionais:
      #
      # zlib
      # bzip2
      # png
      # harfbuzz
      # brotli
      #
      # Queremos primeiro a biblioteca mais simples possivel.
      # ============================================================

      - name: Configure FreeType for Horizon AArch64
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure-v0.9.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-configure-exit-code.txt

          exit 0


      # ============================================================
      # 9. Compila FreeType
      # ============================================================

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit-code.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "FreeType configure falhou." \
              | tee horizon-research/freetype-build-v0.9.log

            echo "1" \
              > horizon-research/freetype-build-exit-code.txt

            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build-v0.9.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit-code.txt

          if [ "$STATUS" = "0" ]; then

            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install-v0.9.log

          fi

          exit 0


      # ============================================================
      # 10. Inspeciona FreeType gerado
      # ============================================================

      - name: Inspect Horizon FreeType
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo " FREETYPE CROSS BUILD"
            echo "========================================"

            echo ""
            echo "Configure exit:"

            cat \
              horizon-research/freetype-configure-exit-code.txt

            echo ""
            echo "Build exit:"

            cat \
              horizon-research/freetype-build-exit-code.txt

            echo ""
            echo "Installed files:"
            echo ""

            find "$FREETYPE_PREFIX" \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "Libraries:"
            echo ""

            find "$FREETYPE_PREFIX" \
              -type f \
              \( \
                -name '*.a' \
                -o \
                -name '*.so' \
              \) \
              -exec file {} \; \
              2>/dev/null

          } | tee horizon-research/freetype-summary-v0.9.txt

          exit 0


      # ============================================================
      # 11. Valida libfreetype.a
      # ============================================================

      - name: Validate FreeType target library
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | head -n 1
          )

          if [ -z "$FREETYPE_LIB" ]; then

            echo "FREETYPE_TARGET_READY=no" \
              >> "$GITHUB_ENV"

            echo "libfreetype.a nao foi gerada."

            exit 0
          fi

          echo "FREETYPE_TARGET_READY=yes" \
            >> "$GITHUB_ENV"

          echo "FREETYPE_TARGET_LIB=$FREETYPE_LIB" \
            >> "$GITHUB_ENV"

          echo ""
          echo "libfreetype.a encontrada:"
          echo "$FREETYPE_LIB"

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            t "$FREETYPE_LIB" \
            | head -n 30 \
            | tee horizon-research/freetype-archive-members.txt

          echo ""
          echo "FreeType target aparentemente OK."


      # ============================================================
      # 12. Compila pequeno programa usando headers FreeType
      #
      # Apenas compile (-c).
      # Nao tentamos executar no runner.
      # ============================================================

      - name: Test FreeType target headers
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_TARGET_READY" != "yes" ]; then
            echo "FreeType target indisponivel."
            exit 0
          fi

          cat > horizon-research/freetype_test.c <<'EOF'
          #include <ft2build.h>
          #include FT_FREETYPE_H

          int minecraft_nx_freetype_test(void)
          {
              FT_Library library = 0;

              if (library == 0)
                  return 21;

              return 0;
          }
          EOF

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -I"$FREETYPE_PREFIX/include/freetype2" \
            -c \
            horizon-research/freetype_test.c \
            -o horizon-research/freetype_test.o \
            2>&1 \
            | tee horizon-research/freetype-test-build.txt

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > horizon-research/freetype-test-exit-code.txt

          if [ "$STATUS" = "0" ]; then
            file horizon-research/freetype_test.o
          fi

          exit 0


      # ============================================================
      # 13. OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 14. Horizon mapping
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          needle = 'AC_MSG_ERROR([unsupported operating system $1])'

          if needle not in s:
              raise SystemExit(
                  "Fallback OS nao encontrado"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)

              case_start = s.rfind(
                  "*)",
                  0,
                  pos
              )

              if case_start < 0:
                  raise SystemExit(
                      "Fallback *) nao encontrado"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print("Horizon mapping aplicado.")
          PY


      # ============================================================
      # 15. Bypass CUPS
      # ============================================================

      - name: Apply Horizon CUPS research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "CUPS check nao encontrado"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find cups"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)
          PY


      # ============================================================
      # 16. Bypass Fontconfig
      # ============================================================

      - name: Apply Horizon Fontconfig research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Fontconfig check nao encontrado"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find fontconfig"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)
          PY


      # ============================================================
      # 17. Descobre opcoes FreeType do configure
      # ============================================================

      - name: Inspect OpenJDK FreeType options
        shell: bash
        run: |
          set -e

          cd openjdk21

          bash configure --help \
            > ../horizon-research/configure-help.txt \
            2>&1 \
            || true

          echo ""
          echo "===== FREETYPE CONFIGURE OPTIONS ====="

          grep -i -C 5 \
            'freetype' \
            ../horizon-research/configure-help.txt \
            | tee ../horizon-research/freetype-openjdk-options.txt \
            || true


      # ============================================================
      # 18. Configura OpenJDK
      #
      # Primeiro usamos --with-freetype=<prefix>.
      #
      # Se a revisao nao aceitar essa forma, o log/--help vai nos
      # mostrar a forma exata para o v1.0.
      # ============================================================

      - name: Configure OpenJDK with Horizon FreeType
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_TARGET_READY" != "yes" ]; then

            echo "FreeType target nao ficou pronto." \
              | tee horizon-research/configure-v0.9.log

            echo "99" \
              > horizon-research/configure-exit-code.txt

            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype="$FREETYPE_PREFIX" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v0.9.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0


      # ============================================================
      # 19. Summary
      # ============================================================

      - name: Analyze v0.9
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v0.9"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Strategy:"
            echo "Horizon + AArch64 + minimal + headless"
            echo "FreeType cross-compiled with devkitA64"

            echo ""
            echo "FreeType configure exit:"

            cat \
              horizon-research/freetype-configure-exit-code.txt

            echo ""
            echo "FreeType build exit:"

            cat \
              horizon-research/freetype-build-exit-code.txt

            echo ""
            echo "FreeType target ready:"

            echo "${FREETYPE_TARGET_READY:-no}"

            echo ""
            echo "OpenJDK configure exit:"

            cat \
              horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant OpenJDK messages:"
            echo ""

            grep -i -E \
              'error|warning|unsupported|horizon|target|host|aarch64|headless|minimal|freetype|cups|fontconfig|alsa|x11|xext|xrender|xtst|xi|sysroot|posix|linux|library|libraries|header|headers' \
              horizon-research/configure-v0.9.log \
              | tail -n 1800 \
              || true

          } > horizon-research/summary-v0.9.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v0.9"
          echo "========================================"

          cat horizon-research/summary-v0.9.txt


      # ============================================================
      # 20. FreeType logs
      # ============================================================

      - name: Show FreeType tail
        shell: bash
        run: |
          set +e

          echo ""
          echo "===== FREETYPE CONFIGURE LAST 150 ====="

          tail \
            -n 150 \
            horizon-research/freetype-configure-v0.9.log \
            || true

          echo ""
          echo "===== FREETYPE BUILD LAST 150 ====="

          tail \
            -n 150 \
            horizon-research/freetype-build-v0.9.log \
            || true

          exit 0


      # ============================================================
      # 21. OpenJDK tail
      # ============================================================

      - name: Show OpenJDK configure tail
        shell: bash
        run: |
          set +e

          echo ""
          echo "===== OPENJDK LAST 400 ====="

          tail \
            -n 400 \
            horizon-research/configure-v0.9.log \
            | tee horizon-research/configure-tail-v0.9.txt \
            || true

          exit 0


      # ============================================================
      # 22. Se configure = 0, probe HotSpot
      # ============================================================

      - name: Probe HotSpot
        shell: bash
        run: |
          set +e

          STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          if [ "$STATUS" != "0" ]; then

            echo "OpenJDK configure ainda nao terminou." \
              > horizon-research/hotspot-summary-v0.9.txt

            exit 0
          fi

          echo "CONFIGURE OK" \
            | tee horizon-research/hotspot-summary-v0.9.txt

          echo "" \
            | tee -a horizon-research/hotspot-summary-v0.9.txt

          echo "Iniciando make hotspot..." \
            | tee -a horizon-research/hotspot-summary-v0.9.txt

          cd openjdk21

          make hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v0.9.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          {
            echo ""
            echo "===== RELEVANT HOTSPOT ERRORS ====="

            grep -i -E \
              'error|fatal|horizon|aarch64|os_cpu|not found|no rule|undefined|unsupported' \
              ../horizon-research/hotspot-build-v0.9.log \
              | tail -n 1500

            echo ""
            echo "===== LAST 300 ====="

            tail \
              -n 300 \
              ../horizon-research/hotspot-build-v0.9.log

          } >> ../horizon-research/hotspot-summary-v0.9.txt

          exit 0


      # ============================================================
      # 23. Mapa do futuro port HotSpot
      # ============================================================

      - name: Create Horizon HotSpot port map
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "HotSpot Horizon Port Map"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== Linux AArch64 reference ====="

            find \
              openjdk21/src/hotspot/os/linux \
              openjdk21/src/hotspot/os_cpu/linux_aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== BSD reference ====="

            find \
              openjdk21/src/hotspot/os/bsd \
              openjdk21/src/hotspot/os_cpu/bsd_aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== Horizon target ====="

            echo "src/hotspot/os/horizon/"
            echo "src/hotspot/os_cpu/horizon_aarch64/"

          } > horizon-research/hotspot-horizon-port-map.txt

          exit 0


      # ============================================================
      # 24. Salva patch OpenJDK
      # ============================================================

      - name: Save OpenJDK patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v0.9.patch


      # ============================================================
      # 25. Final report
      # ============================================================

      - name: Final v0.9 report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.9"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "FreeType target:"
          echo "${FREETYPE_TARGET_READY:-no}"

          echo ""
          echo "OpenJDK configure exit:"
          cat horizon-research/configure-exit-code.txt

          echo ""
          echo "Files:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "Nenhuma biblioteca Linux x86_64 foi"
          echo "intencionalmente usada como biblioteca target."
          echo ""
          echo "Ainda nao significa que HotSpot suporta Horizon."


      # ============================================================
      # 26. Artifact
      # ============================================================

      - name: Upload Horizon Research v0.9
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v0.9
