name: OpenJDK Horizon Research v0.5

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK / Horizon Research v0.5
      # Created by Farbert_Took
      #
      # Estado confirmado no v0.4:
      #
      #   aarch64-none-elf
      #          ↓
      #   horizon-aarch64             OK
      #          ↓
      #   Boot JDK 20                 OK
      #          ↓
      #   devkitA64 GCC/G++           OK
      #          ↓
      #   target 64-bit               OK
      #          ↓
      #   CUPS                        <- v0.5
      #
      # Objetivo:
      # ultrapassar a verificacao de CUPS e descobrir
      # a proxima barreira real do configure.
      #
      # Ainda NAO esperamos gerar JVM/NRO funcional.
      # ============================================================


      # ============================================================
      # 1. Ferramentas + CUPS
      # ============================================================

      - name: Install research tools and CUPS
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            make \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            libcups2-dev

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.5"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. PATH devkitA64
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

          echo ""
          echo "devkitA64 adicionado ao PATH."


      # ============================================================
      # 3. Verifica toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          GCC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          GXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

          test -x "$GCC"
          test -x "$GXX"

          echo ""
          echo "===== GCC ====="
          "$GCC" --version

          echo ""
          echo "===== G++ ====="
          "$GXX" --version

          echo ""
          echo "devkitA64 OK"


      # ============================================================
      # 4. Diretorio de pesquisa
      # ============================================================

      - name: Prepare research directory
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.5"
            echo "Created by Farbert_Took"
          } > horizon-research/info.txt


      # ============================================================
      # 5. Confirma compilacao AArch64 + libnx
      # ============================================================

      - name: Verify Horizon compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon_test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon_test(void)
          {
              u64 value = 21;
              return (int)value;
          }
          EOF

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon_test.c \
            -o horizon-research/horizon_test.o

          echo ""
          echo "===== HORIZON OBJECT ====="

          file horizon-research/horizon_test.o

          echo ""
          echo "AArch64 + libnx OK"


      # ============================================================
      # 6. Verifica CUPS instalado
      # ============================================================

      - name: Verify CUPS development files
        shell: bash
        run: |
          set -e

          echo ""
          echo "===== CUPS PACKAGES ====="

          dpkg -l | grep cups || true

          echo ""
          echo "===== CUPS HEADERS ====="

          find /usr/include \
            -maxdepth 3 \
            -path '*cups*' \
            -type f \
            | head -n 100 \
            || true

          echo ""
          echo "===== pkg-config CUPS ====="

          pkg-config \
            --modversion cups \
            2>/dev/null \
            || true

          {
            echo "CUPS development package:"
            dpkg -l | grep libcups || true

            echo ""
            echo "CUPS pkg-config:"
            pkg-config --modversion cups 2>/dev/null || true
          } > horizon-research/cups-info.txt


      # ============================================================
      # 7. Boot JDK 20
      #
      # Roda no Linux x86_64 do GitHub Actions.
      # NAO e o Java destinado ao Switch.
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          echo ""
          echo "Baixando Eclipse Temurin JDK 20 x64..."

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          echo ""
          echo "Extraindo Boot JDK..."

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          echo ""
          echo "===== JAVA ====="

          "$BOOT_JDK/bin/java" -version

          echo ""
          echo "===== JAVAC ====="

          "$BOOT_JDK/bin/javac" -version


      # ============================================================
      # 8. Valida Boot JDK
      # ============================================================

      - name: Verify Boot JDK
        shell: bash
        run: |
          set -e

          test -x "$BOOT_JDK/bin/java"
          test -x "$BOOT_JDK/bin/javac"
          test -x "$BOOT_JDK/bin/jar"

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt

          "$BOOT_JDK/bin/javac" -version \
            2>&1 \
            | tee -a horizon-research/boot-jdk-version.txt

          echo ""
          echo "Boot JDK OK"


      # ============================================================
      # 9. OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          echo ""
          echo "===== OPENJDK COMMIT ====="

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 10. Patch Horizon
      #
      # Mantemos o patch que funcionou no v0.3/v0.4:
      #
      #       elf -> horizon
      #
      # NAO estamos fingindo que Horizon e Linux.
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          cp \
            openjdk21/make/autoconf/platform.m4 \
            horizon-research/platform-original.m4

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          needle = 'AC_MSG_ERROR([unsupported operating system $1])'

          if needle not in s:
              raise SystemExit(
                  "Fallback de sistema operacional nao encontrado"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)
              case_start = s.rfind("*)", 0, pos)

              if case_start < 0:
                  raise SystemExit(
                      "Fallback *) nao encontrado"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print("Horizon OS mapping inserido.")
          PY

          echo ""
          echo "===== HORIZON MAPPING ====="

          grep \
            -n \
            -C 20 \
            'VAR_OS=horizon' \
            openjdk21/make/autoconf/platform.m4


      # ============================================================
      # 11. Salva patch
      # ============================================================

      - name: Save Horizon patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v0.5.patch

          echo ""
          echo "===== OPENJDK HORIZON PATCH ====="

          cat horizon-research/openjdk-horizon-v0.5.patch


      # ============================================================
      # 12. Configure
      #
      # Esperamos ultrapassar:
      #
      # Could not find cups!
      #
      # Uma nova falha e aceitavel e desejada:
      # queremos descobrir a proxima dependencia/barreira.
      # ============================================================

      - name: Probe OpenJDK after CUPS
        shell: bash
        run: |
          set +e

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 | tee ../horizon-research/configure-v0.5.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          echo ""
          echo "========================================"
          echo " Configure exit code: $STATUS"
          echo "========================================"

          exit 0


      # ============================================================
      # 13. Summary
      # ============================================================

      - name: Analyze v0.5 result
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v0.5"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Boot JDK:"
            "$BOOT_JDK/bin/java" -version 2>&1

            echo ""
            echo "Configure exit code:"
            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant configure messages:"
            echo ""

            grep -i -E \
              'error|warning|unsupported|horizon|target|host|aarch64|elf|sysroot|compiler|toolchain|boot jdk|bootjdk|cups|freetype|fontconfig|alsa|x11|libc|posix|linux|library|libraries|header|headers' \
              horizon-research/configure-v0.5.log \
              | tail -n 700 \
              || true

          } > horizon-research/summary-v0.5.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v0.5"
          echo "========================================"

          cat horizon-research/summary-v0.5.txt


      # ============================================================
      # 14. Ultimas linhas completas
      #
      # Isso ajuda caso o proximo erro nao corresponda aos termos
      # filtrados acima.
      # ============================================================

      - name: Show configure tail
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " LAST 150 CONFIGURE LINES"
          echo "========================================"

          tail \
            -n 150 \
            horizon-research/configure-v0.5.log \
            | tee horizon-research/configure-tail-v0.5.txt


      # ============================================================
      # 15. Investiga condicionais de OS
      # ============================================================

      - name: Inspect next Horizon barriers
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.5"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== OPENJDK_TARGET_OS ====="

            grep -R -n \
              'OPENJDK_TARGET_OS' \
              openjdk21/make/autoconf \
              | head -n 1500

            echo ""
            echo "===== FIXED OS LISTS ====="

            grep -R -n -E \
              'linux.*macosx|linux.*windows|linux.*aix|linux.*bsd|SUPPORTED_OS|VALID_OS' \
              openjdk21/make/autoconf \
              | head -n 1500

          } > horizon-research/next-horizon-barriers.txt

          exit 0


      # ============================================================
      # 16. HotSpot ports existentes
      # ============================================================

      - name: Record HotSpot ports
        shell: bash
        run: |
          set -e

          {
            echo "===== HotSpot OS ports ====="
            echo ""

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

            echo ""
            echo "===== HotSpot OS/CPU ports ====="
            echo ""

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

          } > horizon-research/hotspot-ports.txt

          cat horizon-research/hotspot-ports.txt


      # ============================================================
      # 17. Coleta config logs
      # ============================================================

      - name: Collect configuration logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name "config.log" \
              -o \
              -name "configure.log" \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE_NAME=$(echo "$FILEPATH" | tr '/' '_')

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE_NAME"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 18. Resultado final
      # ============================================================

      - name: Final v0.5 report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.5"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Arquivos coletados:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "Esta ainda e uma build de pesquisa."
          echo "Nao gera Minecraft-NX.nro nesta etapa."


      # ============================================================
      # 19. Artifact
      # ============================================================

      - name: Upload Horizon Research v0.5
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v0.5
          path: horizon-research
