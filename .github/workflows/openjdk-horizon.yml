name: OpenJDK Horizon Research v0.6

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK / Horizon Research v0.6
      # Created by Farbert_Took
      #
      # Confirmado:
      #
      #   Horizon target recognition       OK
      #   horizon-aarch64                  OK
      #   Boot JDK 20                      OK
      #   devkitA64 GCC/G++                OK
      #   Cross compilation                OK
      #   Target 64-bit                    OK
      #
      # v0.5 mostrou que CUPS do Linux host nao pode simplesmente
      # ser usado pelo compilador Horizon.
      #
      # v0.6:
      #
      #   - identifica a checagem CUPS
      #   - desativa CUPS especificamente para Horizon
      #   - NAO linka libcups Linux ao target
      #   - continua o configure
      #   - captura a proxima barreira
      #
      # Ainda NAO esperamos uma JVM/NRO funcional.
      # ============================================================


      # ============================================================
      # 1. Ferramentas
      # ============================================================

      - name: Install research tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            make \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.6"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. devkitA64 PATH
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

          echo ""
          echo "devkitA64 PATH configurado."


      # ============================================================
      # 3. Verifica toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          GCC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          GXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

          test -x "$GCC"
          test -x "$GXX"

          echo ""
          echo "===== GCC ====="
          "$GCC" --version

          echo ""
          echo "===== G++ ====="
          "$GXX" --version

          echo ""
          echo "devkitA64 OK"


      # ============================================================
      # 4. Research directory
      # ============================================================

      - name: Prepare research directory
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.6"
            echo "Created by Farbert_Took"
          } > horizon-research/info.txt


      # ============================================================
      # 5. Teste libnx
      # ============================================================

      - name: Verify Horizon compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon_test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon_test(void)
          {
              u64 value = 21;
              return (int)value;
          }
          EOF

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon_test.c \
            -o horizon-research/horizon_test.o

          echo ""
          echo "===== HORIZON OBJECT ====="

          file horizon-research/horizon_test.o

          echo ""
          echo "AArch64 + libnx OK"


      # ============================================================
      # 6. Boot JDK 20
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          echo ""
          echo "Baixando Eclipse Temurin JDK 20 x64..."

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          echo ""
          echo "Extraindo..."

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          echo ""
          echo "===== BOOT JDK ====="

          "$BOOT_JDK/bin/java" -version
          "$BOOT_JDK/bin/javac" -version


      # ============================================================
      # 7. Valida Boot JDK
      # ============================================================

      - name: Verify Boot JDK
        shell: bash
        run: |
          set -e

          test -x "$BOOT_JDK/bin/java"
          test -x "$BOOT_JDK/bin/javac"
          test -x "$BOOT_JDK/bin/jar"

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt

          "$BOOT_JDK/bin/javac" -version \
            2>&1 \
            | tee -a horizon-research/boot-jdk-version.txt

          echo ""
          echo "Boot JDK OK"


      # ============================================================
      # 8. OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          echo ""
          echo "===== OPENJDK COMMIT ====="

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 9. Patch de reconhecimento Horizon
      #
      # Mantemos:
      #
      #     elf -> horizon
      #
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          cp \
            openjdk21/make/autoconf/platform.m4 \
            horizon-research/platform-original.m4

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          needle = 'AC_MSG_ERROR([unsupported operating system $1])'

          if needle not in s:
              raise SystemExit(
                  "Fallback de sistema operacional nao encontrado"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)
              case_start = s.rfind("*)", 0, pos)

              if case_start < 0:
                  raise SystemExit(
                      "Fallback *) nao encontrado"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print("Horizon OS mapping inserido.")
          PY

          echo ""
          echo "===== HORIZON MAPPING ====="

          grep \
            -n \
            -C 20 \
            'VAR_OS=horizon' \
            openjdk21/make/autoconf/platform.m4


      # ============================================================
      # 10. Localiza implementacao CUPS
      # ============================================================

      - name: Inspect OpenJDK CUPS checks
        shell: bash
        run: |
          set -e

          echo ""
          echo "===== CUPS CONFIGURE REFERENCES ====="

          grep -R -n -E \
            'Could not find cups|cups/cups.h|cups/ppd.h|CUPS_FOUND|CUPS_CFLAGS|CUPS_LIBS' \
            openjdk21/make/autoconf \
            2>/dev/null \
            | tee horizon-research/cups-configure-search.txt \
            || true

          echo ""
          echo "===== CUPS SOURCE REFERENCES ====="

          grep -R -n \
            '#include <cups/' \
            openjdk21/src \
            2>/dev/null \
            | head -n 300 \
            | tee horizon-research/cups-source-search.txt \
            || true


      # ============================================================
      # 11. Patch CUPS para Horizon
      #
      # IMPORTANTE:
      #
      # Nao adicionamos /usr/include/cups ao cross compiler.
      # Nao adicionamos -lcups do Linux.
      #
      # Em vez disso, para o target Horizon, pulamos a verificacao
      # da biblioteca de impressao.
      #
      # Este e um patch de pesquisa. Mais tarde o modulo desktop
      # precisara ser configurado/portado corretamente.
      # ============================================================

      - name: Disable CUPS requirement for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          candidates = []

          for p in root.rglob("*.m4"):
              text = p.read_text(errors="ignore")

              if (
                  "Could not find cups" in text
                  or "cups/cups.h" in text
                  or "CUPS_FOUND" in text
              ):
                  candidates.append(p)

          if not candidates:
              raise SystemExit(
                  "Nao encontrei arquivo de configuracao CUPS"
              )

          print("Arquivos CUPS encontrados:")

          for p in candidates:
              print(" -", p)

          target = None

          for p in candidates:
              text = p.read_text(errors="ignore")

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Nao encontrei a mensagem fatal de CUPS"
              )

          text = target.read_text()

          marker = 'AC_MSG_ERROR([Could not find cups!'

          pos = text.find(marker)

          if pos < 0:
              # Fallback para pequenas mudancas no texto.
              pos = text.find("Could not find cups")

          if pos < 0:
              raise SystemExit(
                  "Nao localizei a checagem fatal CUPS"
              )

          # Localiza a linha completa contendo o erro.
          line_start = text.rfind("\n", 0, pos) + 1
          line_end = text.find("\n", pos)

          if line_end < 0:
              line_end = len(text)

          original_line = text[line_start:line_end]

          indent = original_line[
              :len(original_line) - len(original_line.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original_line
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:line_start]
              + replacement
              + text[line_end:]
          )

          target.write_text(text)

          Path(
              "horizon-research/cups-patched-file.txt"
          ).write_text(str(target) + "\n")

          print()
          print("Patch CUPS aplicado em:", target)
          print()
          print("Linha original:")
          print(original_line)
          PY

          echo ""
          echo "===== CUPS PATCH CONTEXT ====="

          CUPS_FILE=$(cat horizon-research/cups-patched-file.txt)

          grep \
            -n \
            -C 20 \
            'CUPS disabled for experimental Horizon target' \
            "$CUPS_FILE" \
            | tee horizon-research/cups-patch-context.txt


      # ============================================================
      # 12. Salva patch completo
      # ============================================================

      - name: Save OpenJDK Horizon v0.6 patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v0.6.patch

          echo ""
          echo "========================================"
          echo " PATCH v0.6"
          echo "========================================"

          cat horizon-research/openjdk-horizon-v0.6.patch


      # ============================================================
      # 13. Configure
      #
      # Esperado:
      #
      # CUPS disabled for experimental Horizon target
      #
      # seguido de uma nova verificacao/barreira.
      # ============================================================

      - name: Probe OpenJDK after Horizon CUPS patch
        shell: bash
        run: |
          set +e

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 | tee ../horizon-research/configure-v0.6.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          echo ""
          echo "========================================"
          echo " Configure exit code: $STATUS"
          echo "========================================"

          exit 0


      # ============================================================
      # 14. Summary
      # ============================================================

      - name: Analyze v0.6 result
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v0.6"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Boot JDK:"

            "$BOOT_JDK/bin/java" -version 2>&1

            echo ""
            echo "Configure exit code:"

            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant configure messages:"
            echo ""

            grep -i -E \
              'error|warning|unsupported|horizon|target|host|aarch64|elf|sysroot|compiler|toolchain|boot jdk|bootjdk|cups|freetype|fontconfig|alsa|x11|libc|posix|linux|library|libraries|header|headers|jpeg|gif|png|zlib' \
              horizon-research/configure-v0.6.log \
              | tail -n 1000 \
              || true

          } > horizon-research/summary-v0.6.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v0.6"
          echo "========================================"

          cat horizon-research/summary-v0.6.txt


      # ============================================================
      # 15. Ultimas 250 linhas
      # ============================================================

      - name: Show configure tail
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " LAST 250 CONFIGURE LINES"
          echo "========================================"

          tail \
            -n 250 \
            horizon-research/configure-v0.6.log \
            | tee horizon-research/configure-tail-v0.6.txt


      # ============================================================
      # 16. Procura novas dependencias
      # ============================================================

      - name: Inspect native library checks
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.6"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== LIBRARY CHECKS ====="

            grep -R -n -E \
              'AC_CHECK_HEADERS|AC_CHECK_LIB|PKG_CHECK_MODULES|AC_MSG_ERROR.*find|AC_MSG_ERROR.*library' \
              openjdk21/make/autoconf \
              | head -n 2500

          } > horizon-research/native-library-checks.txt

          exit 0


      # ============================================================
      # 17. Investiga codigo nativo que ja depende de OS
      # ============================================================

      - name: Inspect Horizon source requirements
        shell: bash
        run: |
          set +e

          {
            echo "===== HOTSPOT OS PORTS ====="
            echo ""

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

            echo ""
            echo "===== HOTSPOT OS CPU PORTS ====="
            echo ""

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

            echo ""
            echo "===== JDK UNIX SOURCES ====="
            echo ""

            find \
              openjdk21/src \
              -type d \
              \( \
                -name linux \
                -o \
                -name unix \
                -o \
                -name posix \
              \) \
              | head -n 500

          } > horizon-research/horizon-source-requirements.txt

          exit 0


      # ============================================================
      # 18. Coleta config.log
      # ============================================================

      - name: Collect configuration logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name "config.log" \
              -o \
              -name "configure.log" \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE_NAME=$(echo "$FILEPATH" | tr '/' '_')

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE_NAME"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 19. Resultado
      # ============================================================

      - name: Final v0.6 report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.6"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Arquivos coletados:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "IMPORTANTE:"
          echo ""
          echo "O bypass CUPS desta versao e apenas para pesquisa."
          echo "Ele nao significa que CUPS funciona no Horizon."
          echo ""
          echo "Ainda nao geramos uma JVM/NRO funcional."


      # ============================================================
      # 20. Artifact
      # ============================================================

      - name: Upload Horizon Research v0.6
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v0.6
          path: horizon-research
