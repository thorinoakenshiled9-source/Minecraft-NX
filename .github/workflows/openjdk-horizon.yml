name: OpenJDK Horizon Research v2.4

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git bash autoconf automake libtool make cmake ninja-build \
            zip unzip file python3 build-essential ca-certificates \
            curl wget tar gzip grep sed gawk pkg-config

          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v2.4"
          echo " Created by Farbert_Took"
          echo "========================================"

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e
          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          cat > horizon-research/info.txt <<'EOF'
          Minecraft-NX
          OpenJDK Horizon Research v2.4
          Created by Farbert_Took

          Target: Nintendo Switch Horizon
          CPU: AArch64
          JVM: OpenJDK 21 HotSpot
          Variant: minimal
          Mode: headless

          Passed:
          - configure Horizon
          - JvmMapfile
          - MINECRAFT_NX_HORIZON
          - dlfcn global blocker
          - globalDefinitions GCC blocker
          - c1_globals_horizon.hpp
          - globals_horizon.hpp

          v2.4:
          - globals_horizon_aarch64.hpp
          - OS+CPU layer
          - classify next failure
          EOF

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x "$DEVKITA64/bin/aarch64-none-elf-gcc"
          test -x "$DEVKITA64/bin/aarch64-none-elf-g++"
          test -x "$DEVKITA64/bin/aarch64-none-elf-nm"
          test -f "$DEVKITPRO/libnx/include/switch.h"

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

      # ============================================================
      # Boot JDK
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt

      # ============================================================
      # FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build
          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER="$DEVKITA64/bin/aarch64-none-elf-gcc" \
            -DCMAKE_AR="$DEVKITA64/bin/aarch64-none-elf-ar" \
            -DCMAKE_RANLIB="$DEVKITA64/bin/aarch64-none-elf-ranlib" \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          CONFIG=${PIPESTATUS[0]}

          if [ "$CONFIG" != "0" ]; then
            echo no >> "$GITHUB_ENV"
            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" = "0" ]; then
            ninja install
          fi

          exit 0

      - name: Locate FreeType
        shell: bash
        run: |
          set +e

          LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name libfreetype.a \
              | sed -n '1p'
          )

          if [ -z "$LIB" ]; then
            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"
          else
            echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
            echo "FREETYPE_LIBDIR=$(dirname "$LIB")" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # OpenJDK
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt

      # ============================================================
      # Horizon configure patches
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          existing = re.search(
              r'(?m)^([ \t]*)elf\)[ \t]*$',
              s
          )

          if existing:
              area = s[existing.start():existing.start()+300]

              if "VAR_OS=horizon" in area:
                  print("Already mapped")
                  raise SystemExit(0)

              raise SystemExit("Unexpected existing elf case")

          error = re.search(
              r'unsupported operating system',
              s,
              re.I
          )

          if not error:
              raise SystemExit("Unsupported OS marker missing")

          matches = list(
              re.finditer(
                  r'(?m)^([ \t]*)\*\)[ \t]*$',
                  s[:error.start()]
              )
          )

          if not matches:
              raise SystemExit("OS fallback missing")

          m = matches[-1]
          indent = m.group(1)

          block = (
              f"{indent}elf)\n"
              f"{indent}  VAR_OS=horizon\n"
              f"{indent}  ;;\n"
          )

          p.write_text(
              s[:m.start()] + block + s[m.start():]
          )
          PY

      - name: Patch configure dependencies
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          def bypass_error(needle, warning, variables):
              for p in root.rglob("*.m4"):
                  lines = p.read_text(
                      errors="ignore"
                  ).splitlines(True)

                  for i, line in enumerate(lines):
                      if (
                          needle in line
                          and "AC_MSG_ERROR" in line
                      ):
                          indent = line[
                              :len(line)-len(line.lstrip())
                          ]

                          original = line.rstrip("\n")

                          assignments = ""

                          for variable in variables:
                              assignments += (
                                  indent +
                                  f'  {variable}=""\n'
                              )

                          lines[i] = (
                              indent +
                              'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n' +
                              indent +
                              f'  AC_MSG_WARN([{warning}])\n' +
                              assignments +
                              indent +
                              'else\n' +
                              original + '\n' +
                              indent +
                              'fi\n'
                          )

                          p.write_text("".join(lines))
                          print("Patched:", p)
                          return

              raise SystemExit(
                  "Configure check missing: " + needle
              )

          bypass_error(
              "Could not find cups",
              "CUPS disabled for experimental Horizon target",
              ["CUPS_CFLAGS", "CUPS_LIBS"]
          )

          bypass_error(
              "Could not find fontconfig",
              "Fontconfig disabled for experimental Horizon target",
              ["FONTCONFIG_CFLAGS", "FONTCONFIG_LIBS"]
          )

          bypass_error(
              "Could not find X11 libraries",
              "X11 libraries disabled for Horizon headless target",
              ["X_CFLAGS", "X_LIBS"]
          )

          bypass_error(
              "Could not find all X11 headers",
              "X11 headers disabled for Horizon headless target",
              ["X_CFLAGS", "X_LIBS"]
          )
          PY

      - name: Patch static FreeType
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit(
                  "FreeType expression changed upstream"
              )

          p.write_text(
              s.replace(old, new, 1)
          )
          PY

      # ============================================================
      # Configure
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then
            echo 99 > horizon-research/configure-exit-code.txt
            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC="$DEVKITA64/bin/aarch64-none-elf-gcc" \
            CXX="$DEVKITA64/bin/aarch64-none-elf-g++" \
            AR="$DEVKITA64/bin/aarch64-none-elf-ar" \
            NM="$DEVKITA64/bin/aarch64-none-elf-nm" \
            OBJCOPY="$DEVKITA64/bin/aarch64-none-elf-objcopy" \
            STRIP="$DEVKITA64/bin/aarch64-none-elf-strip" \
            2>&1 \
            | tee ../horizon-research/configure-v2.4.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0

      - name: Locate spec.gmk
        shell: bash
        run: |
          set -e

          SPEC=$(
            find openjdk21/build \
              -type f \
              -name spec.gmk \
              | sed -n '1p'
          )

          test -n "$SPEC"

          echo "OPENJDK_SPEC=$SPEC" >> "$GITHUB_ENV"

      # ============================================================
      # JvmMapfile
      # ============================================================

      - name: Add Horizon JvmMapfile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/hotspot/lib/JvmMapfile.gmk"
          )

          s = p.read_text()

          if "isTargetOs, horizon" in s:
              raise SystemExit(0)

          marker = (
              'else ifeq ($(call isTargetOs, macosx), true)'
          )

          if marker not in s:
              raise SystemExit("JvmMapfile marker missing")

          block = r'''else ifeq ($(call isTargetOs, horizon), true)
            # Minecraft-NX / Horizon
            DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only *$(OBJ_SUFFIX)
            ifneq ($(FILTER_SYMBOLS_PATTERN), )
              FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|
            endif
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)^_ZTV|^gHotSpotVM|^UseSharedSpaces$$
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|^_ZN9Arguments17SharedArchivePathE$$
            FILTER_SYMBOLS_AWK_SCRIPT := \
                '{ \
                  if ($$3 ~ /$(FILTER_SYMBOLS_PATTERN)/) print $$3; \
                }'

          '''

          p.write_text(
              s.replace(
                  marker,
                  block + marker,
                  1
              )
          )
          PY

      # ============================================================
      # Previous globalDefinitions fixes
      # ============================================================

      - name: Patch globalDefinitions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          s = p.read_text()

          if "#include <dlfcn.h>" in s:
              s = s.replace(
                  "#include <dlfcn.h>",
                  '''#if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif''',
                  1
              )

          needle = (
              '#error "missing platform-specific '
              'definition here"'
          )

          if needle in s:
              s = s.replace(
                  needle,
                  '''#if defined(MINECRAFT_NX_HORIZON)
          #define DEFAULT_CACHE_LINE_SIZE 64
          #else
          #error "missing platform-specific definition here"
          #endif''',
                  1
              )

          p.write_text(s)
          PY

      # ============================================================
      # Horizon OS directory
      # ============================================================

      - name: Create Horizon OS headers
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/src/hotspot")
          dst = root / "os" / "horizon"

          dst.mkdir(
              parents=True,
              exist_ok=True
          )

          def copy_reference(
              target_name,
              candidate_names
          ):
              candidates = []

              for name in candidate_names:
                  candidates.extend(
                      root.rglob(name)
                  )

              if not candidates:
                  raise SystemExit(
                      "No reference for " + target_name
                  )

              src = candidates[0]
              data = src.read_text()

              data = data.replace(
                  "LINUX", "HORIZON"
              )

              data = data.replace(
                  "Linux", "Horizon"
              )

              target = dst / target_name

              target.write_text(
                  "/* Minecraft-NX Horizon experimental port\n"
                  " * Created by Farbert_Took\n"
                  " * Structural platform defaults only.\n"
                  " */\n\n"
                  + data
              )

              print(
                  target_name,
                  "<-",
                  src
              )

          copy_reference(
              "c1_globals_horizon.hpp",
              [
                  "c1_globals_posix.hpp",
                  "c1_globals_linux.hpp"
              ]
          )

          copy_reference(
              "globals_horizon.hpp",
              [
                  "globals_posix.hpp",
                  "globals_linux.hpp",
                  "globals_bsd.hpp"
              ]
          )
          PY

      # ============================================================
      # v2.4 research:
      # OS + CPU globals
      # ============================================================

      - name: Research OS CPU AArch64 globals
        shell: bash
        run: |
          set -e

          OUT="horizon-research/os-cpu-aarch64-research-v2.4.txt"

          echo "========================================" > "$OUT"
          echo " Minecraft-NX" >> "$OUT"
          echo " OS+CPU AArch64 Research v2.4" >> "$OUT"
          echo " Created by Farbert_Took" >> "$OUT"
          echo "========================================" >> "$OUT"
          echo "" >> "$OUT"

          echo "===== OS_CPU DIRECTORIES =====" >> "$OUT"

          find openjdk21/src/hotspot/os_cpu \
            -maxdepth 2 \
            -type f \
            -name 'globals_*aarch64*.hpp' \
            -print \
            | sort \
            >> "$OUT" \
            2>/dev/null \
            || true

          echo "" >> "$OUT"
          echo "===== ALL OS_CPU GLOBALS =====" >> "$OUT"

          find openjdk21/src/hotspot/os_cpu \
            -maxdepth 2 \
            -type f \
            -name 'globals_*.hpp' \
            -print \
            | sort \
            >> "$OUT" \
            2>/dev/null \
            || true

          echo "" >> "$OUT"
          echo "===== AARCH64 CONTENT =====" >> "$OUT"

          while IFS= read -r FILE
          do
            echo "" >> "$OUT"
            echo "----------------------------------------" >> "$OUT"
            echo "$FILE" >> "$OUT"
            echo "----------------------------------------" >> "$OUT"

            cat "$FILE" >> "$OUT"

          done < <(
            find openjdk21/src/hotspot/os_cpu \
              -maxdepth 2 \
              -type f \
              -name 'globals_*aarch64*.hpp' \
              -print \
              | sort \
              2>/dev/null
          )

          cat "$OUT"

      # ============================================================
      # Create OS+CPU Horizon/AArch64 globals
      # ============================================================

      - name: Create globals_horizon_aarch64.hpp
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/src/hotspot")

          dst = (
              root /
              "os_cpu" /
              "horizon_aarch64"
          )

          dst.mkdir(
              parents=True,
              exist_ok=True
          )

          target = (
              dst /
              "globals_horizon_aarch64.hpp"
          )

          preferred = [
              root / "os_cpu" / "linux_aarch64" /
              "globals_linux_aarch64.hpp",

              root / "os_cpu" / "bsd_aarch64" /
              "globals_bsd_aarch64.hpp",
          ]

          source = None
          strategy = None

          for candidate in preferred:
              if candidate.exists():
                  source = candidate

                  if "linux_aarch64" in str(candidate):
                      strategy = (
                          "linux-aarch64-structural-reference"
                      )
                  else:
                      strategy = (
                          "bsd-aarch64-structural-reference"
                      )

                  break

          if source is None:
              matches = list(
                  root.glob(
                      "os_cpu/*_aarch64/"
                      "globals_*_aarch64.hpp"
                  )
              )

              if matches:
                  source = matches[0]
                  strategy = (
                      "first-upstream-aarch64-reference"
                  )

          if source is None:
              raise SystemExit(
                  "No upstream OS+CPU AArch64 globals "
                  "header found. Inspect "
                  "os-cpu-aarch64-research-v2.4.txt"
              )

          data = source.read_text()

          # Rewrite only names/guards referring to the source OS.
          data = data.replace(
              "globals_linux_aarch64.hpp",
              "globals_horizon_aarch64.hpp"
          )

          data = data.replace(
              "globals_bsd_aarch64.hpp",
              "globals_horizon_aarch64.hpp"
          )

          data = data.replace(
              "GLOBALS_LINUX_AARCH64_HPP",
              "GLOBALS_HORIZON_AARCH64_HPP"
          )

          data = data.replace(
              "GLOBALS_BSD_AARCH64_HPP",
              "GLOBALS_HORIZON_AARCH64_HPP"
          )

          data = data.replace(
              "OS_CPU_LINUX_AARCH64_GLOBALS_LINUX_AARCH64_HPP",
              "OS_CPU_HORIZON_AARCH64_GLOBALS_HORIZON_AARCH64_HPP"
          )

          data = data.replace(
              "OS_CPU_BSD_AARCH64_GLOBALS_BSD_AARCH64_HPP",
              "OS_CPU_HORIZON_AARCH64_GLOBALS_HORIZON_AARCH64_HPP"
          )

          banner = '''/*
           * Minecraft-NX
           * OpenJDK Horizon experimental port
           * Created by Farbert_Took
           *
           * Horizon + AArch64 HotSpot platform globals.
           *
           * Horizon remains a distinct target.
           * This file does not define __linux__.
           */

          '''

          target.write_text(
              banner + data
          )

          info = Path(
              "horizon-research/"
              "os-cpu-strategy-v2.4.txt"
          )

          info.write_text(
              f"Source: {source}\n"
              f"Strategy: {strategy}\n"
              f"Target: {target}\n"
          )

          print(info.read_text())
          PY

          echo ""
          echo "===== globals_horizon_aarch64.hpp ====="

          sed -n '1,220p' \
            openjdk21/src/hotspot/os_cpu/horizon_aarch64/globals_horizon_aarch64.hpp

      # ============================================================
      # Inject Horizon identity + both include layers
      # ============================================================

      - name: Inject Horizon HotSpot flags
        shell: bash
        run: |
          set -e

          cat >> "$OPENJDK_SPEC" <<'EOF'

          # Minecraft-NX OpenJDK Horizon v2.4
          CFLAGS += -DMINECRAFT_NX_HORIZON=1
          CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1

          # Horizon OS
          CFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon
          CXXFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon
          EXTRA_CFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon
          EXTRA_CXXFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon
          JVM_CFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon
          JVM_CXXFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon

          # Horizon + AArch64
          CFLAGS += -I$(TOPDIR)/src/hotspot/os_cpu/horizon_aarch64
          CXXFLAGS += -I$(TOPDIR)/src/hotspot/os_cpu/horizon_aarch64
          EXTRA_CFLAGS += -I$(TOPDIR)/src/hotspot/os_cpu/horizon_aarch64
          EXTRA_CXXFLAGS += -I$(TOPDIR)/src/hotspot/os_cpu/horizon_aarch64
          JVM_CFLAGS += -I$(TOPDIR)/src/hotspot/os_cpu/horizon_aarch64
          JVM_CXXFLAGS += -I$(TOPDIR)/src/hotspot/os_cpu/horizon_aarch64
          EOF

      - name: Validate Horizon source tree
        shell: bash
        run: |
          set -e

          test -f \
            openjdk21/src/hotspot/os/horizon/c1_globals_horizon.hpp

          test -f \
            openjdk21/src/hotspot/os/horizon/globals_horizon.hpp

          test -f \
            openjdk21/src/hotspot/os_cpu/horizon_aarch64/globals_horizon_aarch64.hpp

          echo "===== HORIZON OS ====="

          find \
            openjdk21/src/hotspot/os/horizon \
            -type f \
            -maxdepth 1 \
            -print \
            | sort

          echo ""
          echo "===== HORIZON OS+CPU ====="

          find \
            openjdk21/src/hotspot/os_cpu/horizon_aarch64 \
            -type f \
            -maxdepth 1 \
            -print \
            | sort

      # ============================================================
      # Build
      # ============================================================

      - name: Probe HotSpot v2.4
        shell: bash
        run: |
          set +e

          CONFIG=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null || echo 99
          )

          if [ "$CONFIG" != "0" ]; then
            echo 99 \
              > horizon-research/hotspot-exit-code.txt
            exit 0
          fi

          cd openjdk21

          make \
            LOG=trace \
            hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v2.4.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          exit 0

      # ============================================================
      # Analyze next failure
      # ============================================================

      - name: Analyze HotSpot v2.4
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path
          import re

          log_path = Path(
              "horizon-research/hotspot-build-v2.4.log"
          )

          if not log_path.exists():
              raise SystemExit(0)

          text = log_path.read_text(
              errors="replace"
          )

          lines = text.splitlines()

          # --------------------------------------------------------
          # Milestones
          # --------------------------------------------------------

          def result(name, present):
              Path(
                  "horizon-research/" + name
              ).write_text(
                  ("PRESENT" if present else "PASSED")
                  + "\n"
              )

          Path(
              "horizon-research/macro-result.txt"
          ).write_text(
              (
                  "YES\n"
                  if "-DMINECRAFT_NX_HORIZON=1" in text
                  else "NO\n"
              )
          )

          result(
              "dlfcn-result.txt",
              "fatal error: dlfcn.h: "
              "No such file or directory" in text
          )

          result(
              "globaldefinitions-result.txt",
              '#error "missing platform-specific '
              'definition here"' in text
          )

          result(
              "c1-result.txt",
              "fatal error: c1_globals_horizon.hpp: "
              "No such file or directory" in text
          )

          result(
              "globals-result.txt",
              "fatal error: globals_horizon.hpp: "
              "No such file or directory" in text
          )

          result(
              "os-cpu-globals-result.txt",
              "fatal error: globals_horizon_aarch64.hpp: "
              "No such file or directory" in text
          )

          # --------------------------------------------------------
          # Missing Horizon headers
          # --------------------------------------------------------

          missing = []

          for m in re.findall(
              r"fatal error:\s*([^:\s]*horizon[^:\s]*\.hpp)"
              r":\s*No such file or directory",
              text,
              re.I
          ):
              if m not in missing:
                  missing.append(m)

          Path(
              "horizon-research/"
              "missing-horizon-headers-v2.4.txt"
          ).write_text(
              (
                  "\n".join(missing) + "\n"
                  if missing
                  else "None detected.\n"
              )
          )

          # --------------------------------------------------------
          # Classify first meaningful error
          # --------------------------------------------------------

          patterns = [
              (
                  "MISSING HORIZON OS+CPU HEADER",
                  re.compile(
                      r"fatal error: .*horizon_aarch64\.hpp:"
                      r" No such file or directory",
                      re.I
                  )
              ),
              (
                  "MISSING HORIZON OS HEADER",
                  re.compile(
                      r"fatal error: .*horizon\.hpp:"
                      r" No such file or directory",
                      re.I
                  )
              ),
              (
                  "MISSING SYSTEM HEADER",
                  re.compile(
                      r"fatal error: .*\.h:"
                      r" No such file or directory",
                      re.I
                  )
              ),
              (
                  "UNDECLARED API",
                  re.compile(
                      r"was not declared in this scope|"
                      r"has not been declared|"
                      r"no member named|"
                      r"not a member of",
                      re.I
                  )
              ),
              (
                  "PREPROCESSOR ERROR",
                  re.compile(
                      r"error:\s*#error",
                      re.I
                  )
              ),
              (
                  "LINKER ERROR",
                  re.compile(
                      r"undefined reference|"
                      r"collect2:.*error|"
                      r"ld:.*error",
                      re.I
                  )
              ),
              (
                  "COMPILER ERROR",
                  re.compile(
                      r"(^|[\s:])error:",
                      re.I
                  )
              ),
          ]

          first = None

          for i, line in enumerate(lines):
              for label, regex in patterns:
                  if regex.search(line):
                      first = (
                          i,
                          label,
                          line
                      )
                      break

              if first:
                  break

          out = [
              "========================================",
              " Minecraft-NX",
              " HOTSPOT DIAGNOSTIC v2.4",
              " Created by Farbert_Took",
              "========================================",
              "",
          ]

          if first:
              i, label, line = first

              out += [
                  "FIRST FAILURE TYPE: " + label,
                  "FIRST FAILURE LINE: " + str(i + 1),
                  "",
                  "===== CONTEXT =====",
                  "",
              ]

              start = max(
                  0,
                  i - 20
              )

              end = min(
                  len(lines),
                  i + 60
              )

              for n in range(start, end):
                  out.append(
                      f"{n + 1}: {lines[n]}"
                  )

          else:
              out += [
                  "No standard compiler failure detected.",
                  "Inspect the build tail.",
              ]

          Path(
              "horizon-research/diagnostic-v2.4.txt"
          ).write_text(
              "\n".join(out) + "\n"
          )

          # --------------------------------------------------------
          # Portability/API errors
          # --------------------------------------------------------

          portability = []

          api_re = re.compile(
              r"fatal error:|"
              r"was not declared in this scope|"
              r"has not been declared|"
              r"undefined reference|"
              r"no member named|"
              r"not a member of",
              re.I
          )

          for i, line in enumerate(lines):
              if api_re.search(line):
                  portability.append(
                      f"{i + 1}: {line}"
                  )

          Path(
              "horizon-research/"
              "portability-errors-v2.4.txt"
          ).write_text(
              (
                  "\n".join(portability[:150]) + "\n"
                  if portability
                  else "None detected.\n"
              )
          )
          PY

          tail \
            -n 300 \
            horizon-research/hotspot-build-v2.4.log \
            > horizon-research/hotspot-last-300-v2.4.txt \
            2>/dev/null \
            || true

          exit 0

      # ============================================================
      # Save Horizon source
      # ============================================================

      - name: Save Horizon port sources
        shell: bash
        run: |
          set +e

          mkdir -p \
            horizon-research/horizon-source/os \
            horizon-research/horizon-source/os_cpu

          cp \
            openjdk21/src/hotspot/os/horizon/*.hpp \
            horizon-research/horizon-source/os/ \
            2>/dev/null \
            || true

          cp \
            openjdk21/src/hotspot/os_cpu/horizon_aarch64/*.hpp \
            horizon-research/horizon-source/os_cpu/ \
            2>/dev/null \
            || true

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v2.4.patch

          exit 0

      # ============================================================
      # Compact
      # ============================================================

      - name: Compact result
        shell: bash
        run: |
          set +e

          CONFIG=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null || echo unknown
          )

          HOTSPOT=$(
            cat horizon-research/hotspot-exit-code.txt \
            2>/dev/null || echo unknown
          )

          MACRO=$(
            cat horizon-research/macro-result.txt \
            2>/dev/null || echo unknown
          )

          DLFCN=$(
            cat horizon-research/dlfcn-result.txt \
            2>/dev/null || echo unknown
          )

          GLOBALDEF=$(
            cat horizon-research/globaldefinitions-result.txt \
            2>/dev/null || echo unknown
          )

          C1=$(
            cat horizon-research/c1-result.txt \
            2>/dev/null || echo unknown
          )

          GLOBALS=$(
            cat horizon-research/globals-result.txt \
            2>/dev/null || echo unknown
          )

          OSCPU=$(
            cat horizon-research/os-cpu-globals-result.txt \
            2>/dev/null || echo unknown
          )

          echo ""
          echo "========================================"
          echo " Minecraft-NX v2.4 COMPACT RESULT"
          echo " Created by Farbert_Took"
          echo "========================================"
          echo ""

          echo "Configure: $CONFIG"
          echo "HotSpot: $HOTSPOT"
          echo "Macro Horizon: $MACRO"
          echo "dlfcn.h blocker: $DLFCN"
          echo "globalDefinitions blocker: $GLOBALDEF"
          echo "c1_globals_horizon blocker: $C1"
          echo "globals_horizon blocker: $GLOBALS"
          echo "globals_horizon_aarch64 blocker: $OSCPU"

          echo ""
          echo "===== OS+CPU STRATEGY ====="
          echo ""

          cat \
            horizon-research/os-cpu-strategy-v2.4.txt \
            2>/dev/null \
            || true

          echo ""
          echo "===== MISSING HORIZON HEADERS ====="
          echo ""

          cat \
            horizon-research/missing-horizon-headers-v2.4.txt \
            2>/dev/null \
            || true

          echo ""
          echo "===== DIAGNOSTIC ====="
          echo ""

          sed -n '1,150p' \
            horizon-research/diagnostic-v2.4.txt \
            2>/dev/null \
            || true

          echo ""
          echo "===== PORTABILITY / API ERRORS ====="
          echo ""

          sed -n '1,100p' \
            horizon-research/portability-errors-v2.4.txt \
            2>/dev/null \
            || true

          echo ""
          echo "========================================"
          echo " END Minecraft-NX v2.4"
          echo "========================================"

          exit 0

      - name: Upload Horizon Research v2.4
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v2.4
          path: horizon-research
