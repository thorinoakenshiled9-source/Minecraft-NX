name: OpenJDK Horizon Research v1.5

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK Horizon Research v1.5
      # Created by Farbert_Took
      #
      # v1.4:
      #   configure OpenJDK: OK
      #   make hotspot: iniciou
      #
      # Primeiro bloqueio real do build HotSpot:
      #
      #   lib/JvmMapfile.gmk:
      #   Unknown target OS horizon
      #
      # v1.5:
      #   - preserva configure funcional
      #   - pesquisa JvmMapfile.gmk
      #   - adiciona tratamento Horizon somente no mapfile
      #   - tenta make hotspot novamente
      #
      # NAO transforma Horizon globalmente em Linux.
      # ============================================================


      # ============================================================
      # 1. Dependencias
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.5"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. devkitA64 PATH
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. Workspace
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v1.5"
            echo "Created by Farbert_Took"
            echo ""
            echo "Target: Nintendo Switch Horizon"
            echo "CPU: AArch64"
            echo "JVM: OpenJDK 21 HotSpot minimal"
            echo "Mode: headless"
            echo "FreeType: static target library"
            echo "Research: JvmMapfile.gmk Horizon support"
          } > horizon-research/info.txt


      # ============================================================
      # 4. Toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
          test -f /opt/devkitpro/libnx/include/switch.h

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt


      # ============================================================
      # 5. Teste Horizon/AArch64
      # ============================================================

      - name: Verify Horizon AArch64 compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon-test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon(void)
          {
              u64 java_version = 21;
              return (int)java_version;
          }
          EOF

          aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon-test.c \
            -o horizon-research/horizon-test.o

          file horizon-research/horizon-test.o \
            | tee horizon-research/horizon-object.txt


      # ============================================================
      # 6. Boot JDK 20
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt


      # ============================================================
      # 7. FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

          git -C freetype-src rev-parse HEAD \
            | tee horizon-research/freetype-commit.txt


      # ============================================================
      # 8. Configure FreeType
      # ============================================================

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0


      # ============================================================
      # 9. Build FreeType
      # ============================================================

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "FreeType configure failed." \
              | tee horizon-research/freetype-build.log

            echo "1" \
              > horizon-research/freetype-build-exit.txt

            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then

            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log

          fi

          exit 0


      # ============================================================
      # 10. Valida FreeType
      # ============================================================

      - name: Validate Horizon FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | head -n 1
          )

          if [ -z "$FREETYPE_LIB" ]; then

            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"

            echo "libfreetype.a NOT FOUND"

            exit 0
          fi

          FREETYPE_LIBDIR=$(
            dirname "$FREETYPE_LIB"
          )

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"
          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo " FREETYPE TARGET READY"
          echo "========================================"
          echo ""

          echo "$FREETYPE_LIB"

          ls -lh "$FREETYPE_LIB"

          aarch64-none-elf-ar \
            t "$FREETYPE_LIB" \
            | head -n 50 \
            | tee horizon-research/freetype-members.txt

          exit 0


      # ============================================================
      # 11. OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 12. Horizon OS mapping
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/platform.m4"
          )

          s = p.read_text()

          needle = (
              'AC_MSG_ERROR([unsupported operating system $1])'
          )

          if needle not in s:
              raise SystemExit(
                  "OS fallback not found"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)

              case_start = s.rfind(
                  "*)",
                  0,
                  pos
              )

              if case_start < 0:
                  raise SystemExit(
                      "OS fallback case not found"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print(
              "elf -> horizon mapping installed"
          )
          PY


      # ============================================================
      # 13. CUPS bypass
      # ============================================================

      - name: Apply Horizon CUPS research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(
                  errors="ignore"
              )

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "CUPS check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find cups"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)

          print(
              "Horizon CUPS bypass installed"
          )
          PY


      # ============================================================
      # 14. Fontconfig bypass
      # ============================================================

      - name: Apply Horizon Fontconfig research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(
                  errors="ignore"
              )

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Fontconfig check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find fontconfig"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)

          print(
              "Horizon Fontconfig bypass installed"
          )
          PY


      # ============================================================
      # 15. FreeType statico
      # ============================================================

      - name: Add static FreeType detection for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit(
                  "Expected exactly one FreeType library expression"
              )

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              "Horizon static FreeType patch installed"
          )
          PY


      # ============================================================
      # 16. X11 libraries + headers
      # ============================================================

      - name: Apply complete Horizon headless X11 bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          checks = [
              (
                  "Could not find X11 libraries",
                  "X11 libraries"
              ),
              (
                  "Could not find all X11 headers",
                  "X11 headers"
              ),
          ]

          for needle, label in checks:

              candidates = []

              for p in root.rglob("*.m4"):

                  text = p.read_text(
                      errors="ignore"
                  )

                  if needle in text:
                      candidates.append(p)

              if len(candidates) != 1:
                  raise SystemExit(
                      f"{label}: expected one source file, "
                      f"found {len(candidates)}"
                  )

              p = candidates[0]

              lines = p.read_text().splitlines(
                  True
              )

              indexes = []

              for i, line in enumerate(lines):

                  if (
                      needle in line
                      and "AC_MSG_ERROR" in line
                  ):
                      indexes.append(i)

              if len(indexes) != 1:
                  raise SystemExit(
                      f"{label}: expected one "
                      f"AC_MSG_ERROR, found "
                      f"{len(indexes)}"
                  )

              i = indexes[0]

              original = lines[i]

              indent = original[
                  :len(original)
                  - len(original.lstrip())
              ]

              original_body = (
                  original.rstrip("\n")
              )

              if label == "X11 libraries":

                  warning = (
                      "X11 libraries disabled for "
                      "experimental Horizon "
                      "headless target"
                  )

              else:

                  warning = (
                      "X11 headers disabled for "
                      "experimental Horizon "
                      "headless target"
                  )

              replacement = (
                  indent
                  + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
                  + indent
                  + '  AC_MSG_WARN(['
                  + warning
                  + '])\n'
                  + indent
                  + '  X_CFLAGS=""\n'
                  + indent
                  + '  X_LIBS=""\n'
                  + indent
                  + 'else\n'
                  + original_body
                  + '\n'
                  + indent
                  + 'fi\n'
              )

              lines[i] = replacement

              p.write_text(
                  "".join(lines)
              )

          print(
              "Horizon X11 library/header bypass installed"
          )
          PY


      # ============================================================
      # 17. Salva configure patch
      # ============================================================

      - name: Save configure Horizon patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-configure-v1.5.patch

          grep \
            -n \
            -C 10 \
            -E \
            'horizon|Horizon|FREETYPE|X11|CUPS|Fontconfig' \
            horizon-research/openjdk-horizon-configure-v1.5.patch \
            | head -n 1500 \
            || true


      # ============================================================
      # 18. Configure OpenJDK
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then

            echo "FreeType target unavailable." \
              > horizon-research/configure-v1.5.log

            echo "99" \
              > horizon-research/configure-exit-code.txt

            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v1.5.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0


      # ============================================================
      # 19. Configure summary
      # ============================================================

      - name: Show configure result
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " CONFIGURE RESULT v1.5"
          echo "========================================"
          echo ""

          STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          echo "Configure exit:"
          echo "$STATUS"

          echo ""

          grep -i -E \
            'error|warning|horizon|aarch64|headless|minimal|freetype|x11|cups|fontconfig|dlopen' \
            horizon-research/configure-v1.5.log \
            | tail -n 1000 \
            || true


      # ============================================================
      # 20. LOCALIZA JvmMapfile.gmk
      # ============================================================

      - name: Locate JvmMapfile rules
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " JVMMAPFILE RESEARCH v1.5"
          echo "========================================"
          echo ""

          JVMMAPFILE=$(
            find openjdk21 \
              -type f \
              -name 'JvmMapfile.gmk' \
              | head -n 1
          )

          if [ -z "$JVMMAPFILE" ]; then
            echo "JvmMapfile.gmk not found"
            exit 1
          fi

          echo "JVMMAPFILE=$JVMMAPFILE" \
            >> "$GITHUB_ENV"

          echo "Found:"
          echo "$JVMMAPFILE"

          echo ""
          echo "===== FULL FILE ====="
          echo ""

          nl -ba "$JVMMAPFILE" \
            | tee horizon-research/JvmMapfile-full-v1.5.txt

          echo ""
          echo "===== OS RELATED ====="
          echo ""

          grep \
            -n \
            -C 30 \
            -E \
            'TARGET_OS|OPENJDK_TARGET_OS|linux|windows|macosx|aix|bsd|Unknown target OS' \
            "$JVMMAPFILE" \
            | tee horizon-research/JvmMapfile-os-context-v1.5.txt \
            || true


      # ============================================================
      # 21. PATCH JvmMapfile.gmk
      #
      # O erro do v1.4 foi:
      #
      # Unknown target OS horizon in JvmMapfile.gmk
      #
      # Em vez de fingir que Horizon = Linux globalmente,
      # tratamos Horizon somente nesta regra.
      #
      # Para ELF/Horizon, a estrategia experimental e usar a mesma
      # ferramenta de processamento de simbolos usada pelo caminho
      # ELF suportado pela regra, sem alterar OPENJDK_TARGET_OS.
      # ============================================================

      - name: Add Horizon support to JvmMapfile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          files = list(
              Path("openjdk21").rglob(
                  "JvmMapfile.gmk"
              )
          )

          if len(files) != 1:
              raise SystemExit(
                  f"Expected exactly one JvmMapfile.gmk, "
                  f"found {len(files)}"
              )

          p = files[0]

          text = p.read_text()

          print(
              "Patching:",
              p
          )

          print("")
          print(
              "Occurrences of unknown OS message:",
              text.count("Unknown target OS")
          )

          if text.count(
              "Unknown target OS"
          ) != 1:

              raise SystemExit(
                  "Unexpected JvmMapfile structure"
              )

          #
          # JvmMapfile.gmk already contains the OS branches.
          # We insert Horizon immediately before the final
          # unsupported-OS branch.
          #
          # Horizon binaries use ELF, so for this mapfile stage
          # we use the ELF/Linux-style mapfile transformation only.
          #
          # This does NOT change Horizon to Linux globally.
          #

          marker = (
              '$(error Unknown target OS '
              '$(OPENJDK_TARGET_OS) in '
              'JvmMapfile.gmk)'
          )

          pos = text.find(marker)

          if pos < 0:
              raise SystemExit(
                  "Exact Unknown target OS expression "
                  "not found"
              )

          #
          # Save surrounding source before modification.
          #

          lines = text.splitlines()

          marker_line = None

          for i, line in enumerate(lines):

              if "Unknown target OS" in line:
                  marker_line = i
                  break

          if marker_line is None:
              raise SystemExit(
                  "Could not determine marker line"
              )

          start = max(
              0,
              marker_line - 80
          )

          end = min(
              len(lines),
              marker_line + 30
          )

          context = "\n".join(
              f"{n + 1:5}: {lines[n]}"
              for n in range(
                  start,
                  end
              )
          )

          Path(
              "horizon-research/"
              "JvmMapfile-before-v1.5.txt"
          ).write_text(
              context + "\n"
          )

          #
          # Discover the Linux branch.
          #
          # Instead of hardcoding a complete OpenJDK rule from
          # memory, duplicate the existing Linux conditional
          # behavior for this one mapfile decision.
          #

          linux_patterns = [
              'ifeq ($(OPENJDK_TARGET_OS), linux)',
              'ifeq ($(OPENJDK_TARGET_OS),linux)',
          ]

          linux_start = -1

          for pattern in linux_patterns:

              linux_start = text.find(
                  pattern
              )

              if linux_start >= 0:
                  break

          if linux_start < 0:

              #
              # Some OpenJDK revisions use filter expressions
              # rather than a simple ifeq. In that case, the
              # safest local adaptation is to make Horizon match
              # Linux only in this file's OS dispatch expression.
              #

              replacements = [
                  (
                      '$(filter linux,$(OPENJDK_TARGET_OS))',
                      '$(filter linux horizon,$(OPENJDK_TARGET_OS))'
                  ),
                  (
                      '$(filter linux, $(OPENJDK_TARGET_OS))',
                      '$(filter linux horizon, $(OPENJDK_TARGET_OS))'
                  ),
              ]

              changed = False

              for old, new in replacements:

                  if old in text:

                      text = text.replace(
                          old,
                          new,
                          1
                      )

                      changed = True

                      print(
                          "Extended existing ELF/Linux "
                          "mapfile branch to Horizon"
                      )

                      break

              if not changed:

                  #
                  # Final targeted fallback:
                  #
                  # The v1.4 error proves the final branch is
                  # explicitly rejecting Horizon.
                  #
                  # Add a Horizon conditional directly before
                  # that rejection, reusing the mapfile command
                  # selected by the nearest Linux branch is not
                  # safe without seeing structure, so stop here.
                  #

                  raise SystemExit(
                      "Could not safely identify Linux/ELF "
                      "JvmMapfile branch. "
                      "See JvmMapfile-before-v1.5.txt."
                  )

          else:

              #
              # Simple ifeq form.
              #
              # Extend ONLY this JvmMapfile condition:
              #
              #   linux
              #
              # becomes:
              #
              #   linux or horizon
              #
              # using filter, while leaving the rest of the
              # Linux implementation untouched.
              #

              old = pattern

              new = (
                  'ifneq ($(filter '
                  'linux horizon,'
                  '$(OPENJDK_TARGET_OS)),)'
              )

              text = text.replace(
                  old,
                  new,
                  1
              )

              print(
                  "JvmMapfile Linux/ELF condition "
                  "extended to Horizon"
              )

          p.write_text(text)

          print("")
          print(
              "Horizon remains a distinct "
              "OPENJDK_TARGET_OS."
          )
          PY

          echo ""
          echo "========================================"
          echo " JVMMAPFILE PATCH RESULT"
          echo "========================================"
          echo ""

          git -C openjdk21 diff \
            -- '*JvmMapfile.gmk' \
            | tee horizon-research/JvmMapfile-patch-v1.5.diff

          echo ""
          echo "Horizon references:"
          echo ""

          grep \
            -n \
            -C 30 \
            -E \
            'horizon|Horizon|Unknown target OS' \
            "$JVMMAPFILE" \
            | tee horizon-research/JvmMapfile-after-v1.5.txt \
            || true


      # ============================================================
      # 22. Salva patch completo
      # ============================================================

      - name: Save complete Horizon patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v1.5.patch

          echo ""
          echo "Complete patch lines:"
          echo ""

          wc -l \
            horizon-research/openjdk-horizon-v1.5.patch


      # ============================================================
      # 23. HOTSPOT PROBE v1.5
      # ============================================================

      - name: Probe HotSpot build v1.5
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            {
              echo "========================================"
              echo " HOTSPOT PROBE v1.5"
              echo "========================================"
              echo ""
              echo "NOT STARTED"
              echo ""
              echo "Configure exit:"
              echo "$CONFIG_STATUS"

            } > horizon-research/hotspot-summary-v1.5.txt

            cat horizon-research/hotspot-summary-v1.5.txt

            exit 0
          fi

          cd openjdk21

          echo ""
          echo "========================================"
          echo " HOTSPOT PROBE v1.5"
          echo " Created by Farbert_Took"
          echo "========================================"
          echo ""

          make hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v1.5.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " HOTSPOT PROBE v1.5"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "make hotspot exit:"
            echo "$STATUS"

            echo ""
            echo "Relevant messages:"
            echo ""

            grep -i -E \
              'error|fatal|horizon|aarch64|os_cpu|os/|not found|no rule|undefined|unsupported|missing|posix|linux|pthread|signal|mmap|munmap|dlopen|dlsym|clock|gettimeofday|thread|socket|atomic|errno|mapfile|JvmMapfile' \
              ../horizon-research/hotspot-build-v1.5.log \
              | tail -n 6000 \
              || true

            echo ""
            echo "===== LAST 1500 ====="
            echo ""

            tail \
              -n 1500 \
              ../horizon-research/hotspot-build-v1.5.log

          } > ../horizon-research/hotspot-summary-v1.5.txt

          cat ../horizon-research/hotspot-summary-v1.5.txt

          exit 0


      # ============================================================
      # 24. Detecta primeiro erro
      # ============================================================

      - name: Extract first HotSpot failure
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v1.5.log"

          if [ ! -f "$LOG" ]; then
            exit 0
          fi

          {
            echo "Minecraft-NX"
            echo "First HotSpot Failure v1.5"
            echo "Created by Farbert_Took"
            echo ""

            echo "===== FIRST ERROR-LIKE LINES ====="
            echo ""

            grep \
              -n \
              -m 40 \
              -E \
              '(^|[^A-Za-z])(error:|fatal error:|Error [0-9]|undefined reference|No such file|No rule to make target|Unknown target|unsupported)' \
              "$LOG" \
              || true

          } > horizon-research/first-hotspot-failure-v1.5.txt

          cat \
            horizon-research/first-hotspot-failure-v1.5.txt

          exit 0


      # ============================================================
      # 25. Source map
      # ============================================================

      - name: Create Horizon HotSpot source map
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "HotSpot Horizon Source Map v1.5"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== CPU/AArch64 ====="

            find \
              openjdk21/src/hotspot/cpu/aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== OS ====="

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== OS_CPU ====="

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== LINUX REFERENCE ====="

            find \
              openjdk21/src/hotspot/os/linux \
              openjdk21/src/hotspot/os_cpu/linux_aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== HORIZON CURRENT ====="

            find \
              openjdk21/src/hotspot/os/horizon \
              openjdk21/src/hotspot/os_cpu/horizon_aarch64 \
              -type f \
              -print \
              2>/dev/null \
              | sort

          } > horizon-research/hotspot-source-map-v1.5.txt

          exit 0


      # ============================================================
      # 26. Procura seletores de OS no build system
      # ============================================================

      - name: Research additional HotSpot OS selectors
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "HotSpot OS Selector Research v1.5"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== UNKNOWN TARGET OS ====="

            grep \
              -Rni \
              -E \
              'Unknown target OS|Unsupported target OS|unsupported.*TARGET_OS|OPENJDK_TARGET_OS' \
              openjdk21/make \
              2>/dev/null \
              | head -n 3000

            echo ""
            echo "===== HOTSPOT OS PATHS ====="

            grep \
              -Rni \
              -E \
              'src/hotspot/os/|src/hotspot/os_cpu/|HOTSPOT_TARGET_OS' \
              openjdk21/make \
              2>/dev/null \
              | head -n 3000

          } > horizon-research/hotspot-os-selectors-v1.5.txt

          exit 0


      # ============================================================
      # 27. Final summary
      # ============================================================

      - name: Final v1.5 summary
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v1.5"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Target:"
            echo "Horizon / AArch64"

            echo ""
            echo "JVM:"
            echo "minimal"

            echo ""
            echo "Mode:"
            echo "headless"

            echo ""
            echo "FreeType:"
            echo "${FREETYPE_READY:-no}"

            echo ""
            echo "Configure exit:"
            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "JvmMapfile Horizon patch:"
            echo "attempted"

            echo ""

            if [ -f horizon-research/hotspot-exit-code.txt ]; then

              echo "HotSpot exit:"
              cat horizon-research/hotspot-exit-code.txt

            else

              echo "HotSpot exit:"
              echo "not-run"

            fi

            echo ""
            echo "===== FIRST FAILURE ====="
            echo ""

            if [ -f horizon-research/first-hotspot-failure-v1.5.txt ]; then

              cat \
                horizon-research/first-hotspot-failure-v1.5.txt

            fi

            echo ""
            echo "===== HOTSPOT TAIL ====="
            echo ""

            if [ -f horizon-research/hotspot-build-v1.5.log ]; then

              tail \
                -n 500 \
                horizon-research/hotspot-build-v1.5.log

            fi

          } > horizon-research/summary-v1.5.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v1.5"
          echo "========================================"
          echo ""

          cat horizon-research/summary-v1.5.txt


      # ============================================================
      # 28. Collect configure logs
      # ============================================================

      - name: Collect OpenJDK config logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name 'config.log' \
              -o \
              -name 'configure.log' \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE=$(
                echo "$FILEPATH" \
                | tr '/' '_'
              )

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 29. Final report
      # ============================================================

      - name: Final report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.5"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Configure:"
          cat horizon-research/configure-exit-code.txt

          if [ -f horizon-research/hotspot-exit-code.txt ]; then

            echo ""
            echo "HotSpot:"
            cat horizon-research/hotspot-exit-code.txt

          fi

          echo ""
          echo "Research files:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"
          echo " STATUS"
          echo "========================================"
          echo ""
          echo "OpenJDK configure ja foi atravessado."
          echo ""
          echo "v1.5 pesquisa e adapta somente"
          echo "JvmMapfile.gmk para Horizon."
          echo ""
          echo "Isto ainda nao constitui um port"
          echo "funcional do HotSpot para Horizon."


      # ============================================================
      # 30. Artifact
      # ============================================================

      - name: Upload Horizon Research v1.5
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v1.5
          path: horizon-research
