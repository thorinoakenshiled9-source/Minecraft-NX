name: OpenJDK Horizon Research v0.3

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK / Horizon Research v0.3
      # Created by Farbert_Took
      #
      # Objetivo:
      #
      # 1. Validar novamente devkitA64
      # 2. Baixar OpenJDK 21
      # 3. Encontrar onde "elf" e rejeitado como OS
      # 4. Registrar a logica original
      # 5. Aplicar patch experimental minimo
      # 6. Rodar configure novamente
      # 7. Descobrir a PROXIMA barreira
      #
      # Ainda NAO esperamos gerar uma JVM.
      # ============================================================


      # ============================================================
      # 1. Ferramentas
      # ============================================================

      - name: Install research tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            make \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            grep \
            sed \
            gawk

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.3"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. PATH devkitA64
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

          echo "devkitA64 PATH configurado."


      # ============================================================
      # 3. Verifica toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x \
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc

          test -x \
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

          echo ""
          echo "===== GCC ====="

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            --version

          echo ""
          echo "===== G++ ====="

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            --version


      # ============================================================
      # 4. Diretório de resultados
      # ============================================================

      - name: Prepare research directory
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.3"
            echo "Created by Farbert_Took"
          } > horizon-research/info.txt


      # ============================================================
      # 5. Confirma compilacao AArch64 + libnx
      # ============================================================

      - name: Verify Horizon compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon_test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon_test(void)
          {
              u64 value = 21;
              return (int)value;
          }
          EOF

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon_test.c \
            -o horizon-research/horizon_test.o

          file horizon-research/horizon_test.o

          echo ""
          echo "AArch64 + libnx OK"


      # ============================================================
      # 6. OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 7. Localiza a mensagem que vimos no v0.2
      #
      # Queremos saber exatamente qual arquivo/macro rejeita "elf".
      # ============================================================

      - name: Locate unsupported OS check
        shell: bash
        run: |
          set -e

          echo ""
          echo "===== SEARCHING OPENJDK CONFIGURE SOURCES ====="

          grep -R -n \
            "unsupported operating system" \
            openjdk21/make \
            openjdk21/configure \
            openjdk21/make/autoconf \
            2>/dev/null \
            | tee horizon-research/unsupported-os-search.txt \
            || true

          echo ""
          echo "===== OS NORMALIZATION REFERENCES ====="

          grep -R -n -E \
            'OPENJDK_TARGET_OS|openjdk_target_os|VALID_OS|SUPPORTED_OS|operating system' \
            openjdk21/make/autoconf \
            2>/dev/null \
            | head -n 500 \
            | tee horizon-research/os-normalization-search.txt \
            || true


      # ============================================================
      # 8. Salva platform.m4 original
      #
      # No OpenJDK moderno a normalizacao de plataforma normalmente
      # fica em make/autoconf/platform.m4.
      # ============================================================

      - name: Inspect platform configuration
        shell: bash
        run: |
          set -e

          PLATFORM_FILE="openjdk21/make/autoconf/platform.m4"

          if [ ! -f "$PLATFORM_FILE" ]; then

            echo "ERRO: platform.m4 nao encontrado."

            find openjdk21/make/autoconf \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          cp \
            "$PLATFORM_FILE" \
            horizon-research/platform-original.m4

          echo ""
          echo "===== ELF REFERENCES ====="

          grep -n -C 15 \
            'unsupported operating system' \
            "$PLATFORM_FILE" \
            | tee horizon-research/platform-context.txt \
            || true


      # ============================================================
      # 9. Descobre a estrutura exata do case de OS
      #
      # Esta etapa NAO modifica nada.
      # ============================================================

      - name: Analyze platform OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")
          text = p.read_text()

          needle = "unsupported operating system"

          pos = text.find(needle)

          if pos < 0:
              raise SystemExit(
                  "Nao encontrei a mensagem de unsupported operating system"
              )

          start = max(0, pos - 4000)
          end = min(len(text), pos + 2000)

          context = text[start:end]

          Path(
              "horizon-research/platform-os-block.txt"
          ).write_text(context)

          print(context)
          PY


      # ============================================================
      # 10. Patch experimental
      #
      # IMPORTANTE:
      #
      # Neste primeiro experimento NAO fingimos que Horizon e Linux.
      #
      # Apenas ensinamos a etapa de normalizacao a reconhecer:
      #
      #     elf -> horizon
      #
      # Isso deve permitir descobrir quais outras partes do sistema
      # de build precisam conhecer "horizon".
      #
      # O patch procura o "case" que termina na mensagem de erro e
      # injeta um caso "elf)" antes do fallback.
      # ============================================================

      - name: Add experimental Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")

          s = p.read_text()

          needle = 'AC_MSG_ERROR([unsupported operating system $1])'

          if needle not in s:
              raise SystemExit(
                  "Nao encontrei o fallback de OS esperado em platform.m4"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)

              case_start = s.rfind("*)", 0, pos)

              if case_start < 0:
                  raise SystemExit(
                      "Nao consegui localizar o fallback *) do case de OS"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print("Patch Horizon inserido.")
          PY

          echo ""
          echo "===== PATCH RESULT ====="

          grep -n -C 20 \
            'VAR_OS=horizon' \
            openjdk21/make/autoconf/platform.m4 \
            | tee horizon-research/horizon-patch-context.txt


      # ============================================================
      # 11. Salva diff
      # ============================================================

      - name: Save Horizon patch diff
        shell: bash
        run: |
          set +e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v0.3.patch

          echo ""
          echo "===== PATCH ====="

          cat horizon-research/openjdk-horizon-v0.3.patch

          exit 0


      # ============================================================
      # 12. Primeira tentativa de configure APOS o patch
      #
      # Novamente:
      # configure pode falhar.
      #
      # Queremos descobrir a proxima barreira.
      # ============================================================

      - name: Probe patched OpenJDK configure
        shell: bash
        run: |
          set +e

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 | tee ../horizon-research/configure-v0.3.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          echo ""
          echo "========================================"
          echo " Configure exit code: $STATUS"
          echo "========================================"

          exit 0


      # ============================================================
      # 13. Analisa o novo erro
      # ============================================================

      - name: Analyze v0.3 result
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v0.3"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Configure exit code:"

            cat \
              horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant configure messages:"
            echo ""

            grep -i -E \
              'error|unsupported|horizon|target|host|aarch64|elf|sysroot|compiler|toolchain|boot jdk|bootjdk|libc|posix|linux' \
              horizon-research/configure-v0.3.log \
              | tail -n 400 \
              || true

          } > horizon-research/summary-v0.3.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v0.3"
          echo "========================================"

          cat horizon-research/summary-v0.3.txt


      # ============================================================
      # 14. Procura referencias que assumem lista fixa de OS
      #
      # Agora que criamos "horizon", queremos descobrir todas as
      # proximas validacoes que podem rejeita-lo.
      # ============================================================

      - name: Find fixed OS assumptions
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.3"
            echo "Created by Farbert_Took"
            echo ""

            grep -R -n -E \
              'linux.*macosx|linux.*windows|linux.*aix|OPENJDK_TARGET_OS.*linux|VALID_OS|SUPPORTED_OS' \
              openjdk21/make/autoconf \
              openjdk21/make/modules \
              2>/dev/null \
              | head -n 1000

          } > horizon-research/fixed-os-assumptions.txt

          exit 0


      # ============================================================
      # 15. HotSpot OS ports existentes
      # ============================================================

      - name: Record HotSpot OS ports
        shell: bash
        run: |
          set -e

          {
            echo "Existing HotSpot OS ports:"
            echo ""

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

            echo ""
            echo "Existing HotSpot os_cpu ports:"
            echo ""

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

          } > horizon-research/hotspot-os-ports.txt

          cat horizon-research/hotspot-os-ports.txt


      # ============================================================
      # 16. Coleta config.log
      # ============================================================

      - name: Collect configure logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name "config.log" \
              -o \
              -name "configure.log" \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE_NAME=$(echo "$FILEPATH" | tr '/' '_')

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE_NAME"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 17. Resultado final
      # ============================================================

      - name: Final v0.3 report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.3"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Arquivos:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "v0.3 e uma build de pesquisa."
          echo "Nao esperamos uma JVM funcional ainda."


      # ============================================================
      # 18. Artifact
      # ============================================================

      - name: Upload Horizon Research v0.3
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v0.3
          path: horizon-research
