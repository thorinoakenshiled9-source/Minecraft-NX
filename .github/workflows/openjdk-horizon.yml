name: OpenJDK Horizon Research v1.8

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK Horizon Research v1.8
      # Created by Farbert_Took
      #
      # v1.7:
      #   configure = OK
      #   JvmMapfile = OK
      #   patch dlfcn entrou
      #   __SWITCH__ nao chegou ao HotSpot
      #
      # v1.8:
      #   cria macro proprio:
      #     MINECRAFT_NX_HORIZON=1
      #
      #   adiciona macro nas flags reais do HotSpot
      #   remove dlfcn.h somente para esse target
      #   captura comandos reais do compilador
      # ============================================================


      # ============================================================
      # 1. Dependencias
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.8"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. PATH
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. Workspace
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v1.8"
            echo "Created by Farbert_Took"
            echo ""
            echo "Target: Nintendo Switch Horizon"
            echo "CPU: AArch64"
            echo "JVM: OpenJDK 21 HotSpot minimal"
            echo "Mode: headless"
            echo ""
            echo "Target macro:"
            echo "MINECRAFT_NX_HORIZON=1"
          } > horizon-research/info.txt


      # ============================================================
      # 4. Toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          test -f /opt/devkitpro/libnx/include/switch.h

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt


      # ============================================================
      # 5. Teste do nosso macro
      # ============================================================

      - name: Test Minecraft-NX Horizon macro
        shell: bash
        run: |
          set -e

          cat > horizon-research/macro-test.cpp <<'EOF'
          #ifndef MINECRAFT_NX_HORIZON
          #error MINECRAFT_NX_HORIZON is missing
          #endif

          #if MINECRAFT_NX_HORIZON != 1
          #error MINECRAFT_NX_HORIZON has wrong value
          #endif

          int minecraft_nx_horizon_test()
          {
              return MINECRAFT_NX_HORIZON;
          }
          EOF

          aarch64-none-elf-g++ \
            -march=armv8-a \
            -DMINECRAFT_NX_HORIZON=1 \
            -c \
            horizon-research/macro-test.cpp \
            -o horizon-research/macro-test.o

          file horizon-research/macro-test.o

          echo ""
          echo "MINECRAFT_NX_HORIZON macro test: OK"


      # ============================================================
      # 6. Boot JDK
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt


      # ============================================================
      # 7. FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

          git -C freetype-src rev-parse HEAD \
            | tee horizon-research/freetype-commit.txt


      # ============================================================
      # 8. Configure FreeType
      # ============================================================

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0


      # ============================================================
      # 9. Build FreeType
      # ============================================================

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "FreeType configure failed."

            echo "1" \
              > horizon-research/freetype-build-exit.txt

            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then

            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log

          fi

          exit 0


      # ============================================================
      # 10. Validate FreeType
      # ============================================================

      - name: Validate Horizon FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | head -n 1
          )

          if [ -z "$FREETYPE_LIB" ]; then

            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"

            echo "libfreetype.a NOT FOUND"

            exit 0
          fi

          FREETYPE_LIBDIR=$(
            dirname "$FREETYPE_LIB"
          )

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"
          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" >> "$GITHUB_ENV"

          echo ""
          echo "FreeType ready:"
          echo "$FREETYPE_LIB"


      # ============================================================
      # 11. OpenJDK
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 12. elf -> horizon
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/platform.m4"
          )

          s = p.read_text()

          needle = (
              'AC_MSG_ERROR([unsupported operating system $1])'
          )

          if needle not in s:
              raise SystemExit(
                  "OS fallback not found"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)

              case_start = s.rfind(
                  "*)",
                  0,
                  pos
              )

              if case_start < 0:
                  raise SystemExit(
                      "OS fallback case not found"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print("elf -> horizon mapping installed")
          PY


      # ============================================================
      # 13. CUPS
      # ============================================================

      - name: Apply Horizon CUPS bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "CUPS check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find cups"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)

          print("CUPS Horizon bypass installed")
          PY


      # ============================================================
      # 14. Fontconfig
      # ============================================================

      - name: Apply Horizon Fontconfig bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(errors="ignore")

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Fontconfig check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find fontconfig"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)

          print(
              "Fontconfig Horizon bypass installed"
          )
          PY


      # ============================================================
      # 15. FreeType static
      # ============================================================

      - name: Add static FreeType detection
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit(
                  "FreeType expression not found exactly once"
              )

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              "Static FreeType Horizon patch installed"
          )
          PY


      # ============================================================
      # 16. X11
      # ============================================================

      - name: Apply Horizon X11 bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          checks = [
              (
                  "Could not find X11 libraries",
                  "X11 libraries"
              ),
              (
                  "Could not find all X11 headers",
                  "X11 headers"
              ),
          ]

          for needle, label in checks:

              candidates = []

              for p in root.rglob("*.m4"):

                  text = p.read_text(
                      errors="ignore"
                  )

                  if needle in text:
                      candidates.append(p)

              if len(candidates) != 1:
                  raise SystemExit(
                      f"{label}: expected one source file, "
                      f"found {len(candidates)}"
                  )

              p = candidates[0]

              lines = p.read_text().splitlines(True)

              indexes = []

              for i, line in enumerate(lines):

                  if (
                      needle in line
                      and "AC_MSG_ERROR" in line
                  ):
                      indexes.append(i)

              if len(indexes) != 1:
                  raise SystemExit(
                      f"{label}: expected one AC_MSG_ERROR, "
                      f"found {len(indexes)}"
                  )

              i = indexes[0]

              original = lines[i]

              indent = original[
                  :len(original)
                  - len(original.lstrip())
              ]

              original_body = original.rstrip("\n")

              if label == "X11 libraries":

                  warning = (
                      "X11 libraries disabled for "
                      "experimental Horizon headless target"
                  )

              else:

                  warning = (
                      "X11 headers disabled for "
                      "experimental Horizon headless target"
                  )

              replacement = (
                  indent
                  + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
                  + indent
                  + '  AC_MSG_WARN(['
                  + warning
                  + '])\n'
                  + indent
                  + '  X_CFLAGS=""\n'
                  + indent
                  + '  X_LIBS=""\n'
                  + indent
                  + 'else\n'
                  + original_body
                  + '\n'
                  + indent
                  + 'fi\n'
              )

              lines[i] = replacement

              p.write_text(
                  "".join(lines)
              )

          print("X11 Horizon bypass installed")
          PY


      # ============================================================
      # 17. Configure OpenJDK
      #
      # IMPORTANTE:
      # adicionamos nosso macro diretamente em CFLAGS/CXXFLAGS.
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then

            echo "FreeType unavailable" \
              > horizon-research/configure-v1.8.log

            echo "99" \
              > horizon-research/configure-exit-code.txt

            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            CFLAGS="-DMINECRAFT_NX_HORIZON=1" \
            CXXFLAGS="-DMINECRAFT_NX_HORIZON=1" \
            2>&1 \
            | tee ../horizon-research/configure-v1.8.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0


      # ============================================================
      # 18. Configure result
      # ============================================================

      - name: Show configure result
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " CONFIGURE RESULT v1.8"
          echo "========================================"
          echo ""

          STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          echo "Configure exit:"
          echo "$STATUS"

          echo ""

          grep \
            -i \
            -E \
            'error|warning|horizon|aarch64|minimal|headless|freetype|x11|cups|fontconfig' \
            horizon-research/configure-v1.8.log \
            | tail -n 1000 \
            || true


      # ============================================================
      # 19. Verifica se macro entrou no spec.gmk
      # ============================================================

      - name: Verify Horizon macro in generated build configuration
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " Generated Flag Research v1.8"
            echo "========================================"
            echo ""

            echo "Searching generated configuration..."
            echo ""

            grep \
              -Rni \
              'MINECRAFT_NX_HORIZON' \
              openjdk21/build \
              2>/dev/null \
              | head -n 1000

          } > horizon-research/generated-horizon-flags-v1.8.txt

          cat \
            horizon-research/generated-horizon-flags-v1.8.txt

          exit 0


      # ============================================================
      # 20. JvmMapfile
      # ============================================================

      - name: Add Horizon support to JvmMapfile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/hotspot/lib/JvmMapfile.gmk"
          )

          if not p.exists():
              raise SystemExit(
                  "JvmMapfile.gmk not found"
              )

          s = p.read_text()

          linux_marker = (
              'ifeq ($(call isTargetOs, linux), true)'
          )

          mac_marker = (
              'else ifeq ($(call isTargetOs, macosx), true)'
          )

          if linux_marker not in s:
              raise SystemExit(
                  "Linux branch not found"
              )

          if mac_marker not in s:
              raise SystemExit(
                  "macOS branch not found"
              )

          if "isTargetOs, horizon" in s:
              raise SystemExit(
                  "Horizon branch already exists"
              )

          horizon_branch = r'''else ifeq ($(call isTargetOs, horizon), true)
            # Minecraft-NX / Horizon
            #
            # Horizon AArch64 uses ELF objects generated
            # by the devkitA64 GNU toolchain.
            DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only *$(OBJ_SUFFIX)
            ifneq ($(FILTER_SYMBOLS_PATTERN), )
              FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|
            endif
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)^_ZTV|^gHotSpotVM|^UseSharedSpaces$$
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|^_ZN9Arguments17SharedArchivePathE$$
            FILTER_SYMBOLS_AWK_SCRIPT := \
                '{ \
                  if ($$3 ~ /$(FILTER_SYMBOLS_PATTERN)/) print $$3; \
                }'

          '''

          s = s.replace(
              mac_marker,
              horizon_branch + mac_marker,
              1
          )

          p.write_text(s)

          print(
              "JvmMapfile Horizon branch installed"
          )
          PY


      # ============================================================
      # 21. Pesquisa original dlfcn
      # ============================================================

      - name: Research original dlfcn usage
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo " DLFCN RESEARCH BEFORE PATCH v1.8"
            echo "========================================"
            echo ""

            echo "===== globalDefinitions_gcc.hpp ====="
            echo ""

            nl -ba \
              openjdk21/src/hotspot/share/utilities/globalDefinitions_gcc.hpp \
              | head -n 140

            echo ""
            echo "===== DLFCN INCLUDES ====="
            echo ""

            grep \
              -Rni \
              '#include.*dlfcn\.h' \
              openjdk21/src/hotspot \
              2>/dev/null \
              | head -n 1000

            echo ""
            echo "===== DLOPEN / DLSYM ====="
            echo ""

            grep \
              -Rni \
              -E '\b(dlopen|dlsym|dlclose|dlerror|RTLD_[A-Za-z0-9_]+)\b' \
              openjdk21/src/hotspot \
              2>/dev/null \
              | head -n 5000

          } > horizon-research/dlfcn-before-v1.8.txt

          exit 0


      # ============================================================
      # 22. Corrige dlfcn.h
      # ============================================================

      - name: Disable global dlfcn include for Minecraft-NX Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          if not p.exists():
              raise SystemExit(
                  "globalDefinitions_gcc.hpp not found"
              )

          s = p.read_text()

          old = "#include <dlfcn.h>"

          count = s.count(old)

          print(
              f"dlfcn include count before patch: {count}"
          )

          if count != 1:
              raise SystemExit(
                  "Expected exactly one dlfcn.h include"
              )

          new = '''// Minecraft-NX / Horizon
          //
          // Horizon does not expose the POSIX dlfcn interface.
          // Do not pull dlfcn.h into every HotSpot translation unit.
          //
          // Actual dynamic loading requirements will be ported
          // separately instead of emulating Linux here.
          #if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif'''

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              "dlfcn.h isolated using "
              "MINECRAFT_NX_HORIZON"
          )
          PY

          echo ""
          echo "===== PATCHED HEADER ====="
          echo ""

          nl -ba \
            openjdk21/src/hotspot/share/utilities/globalDefinitions_gcc.hpp \
            | head -n 100 \
            | tee horizon-research/globalDefinitions-patched-v1.8.txt


      # ============================================================
      # 23. Verifica preprocessor manualmente
      # ============================================================

      - name: Verify dlfcn condition with target compiler
        shell: bash
        run: |
          set -e

          cat > horizon-research/dlfcn-condition-test.cpp <<'EOF'
          #if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif

          #ifndef MINECRAFT_NX_HORIZON
          #error Horizon macro missing
          #endif

          int main()
          {
              return 0;
          }
          EOF

          aarch64-none-elf-g++ \
            -DMINECRAFT_NX_HORIZON=1 \
            -c \
            horizon-research/dlfcn-condition-test.cpp \
            -o horizon-research/dlfcn-condition-test.o

          echo ""
          echo "========================================"
          echo " DLFCN CONDITION TEST = OK"
          echo "========================================"
          echo ""


      # ============================================================
      # 24. Salva patch
      # ============================================================

      - name: Save complete Horizon v1.8 patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v1.8.patch

          echo ""
          echo "Patch lines:"
          echo ""

          wc -l \
            horizon-research/openjdk-horizon-v1.8.patch

          echo ""
          echo "Relevant changes:"
          echo ""

          grep \
            -n \
            -i \
            -E \
            'horizon|minecraft_nx|dlfcn|freetype|x11|cups|fontconfig' \
            horizon-research/openjdk-horizon-v1.8.patch \
            | head -n 3000 \
            || true


      # ============================================================
      # 25. HOTSPOT PROBE
      #
      # LOG=trace para termos mais informacao.
      # ============================================================

      - name: Probe HotSpot build v1.8
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            {
              echo "========================================"
              echo " Minecraft-NX"
              echo " HOTSPOT PROBE v1.8"
              echo " Created by Farbert_Took"
              echo "========================================"
              echo ""
              echo "NOT STARTED"
              echo ""
              echo "Configure exit:"
              echo "$CONFIG_STATUS"

            } > horizon-research/hotspot-summary-v1.8.txt

            cat \
              horizon-research/hotspot-summary-v1.8.txt

            exit 0
          fi

          cd openjdk21

          echo ""
          echo "========================================"
          echo " OPENJDK CONFIGURE = 0"
          echo " STARTING HOTSPOT PROBE v1.8"
          echo "========================================"
          echo ""

          make \
            LOG=trace \
            hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v1.8.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " HOTSPOT PROBE v1.8"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "make hotspot exit:"
            echo "$STATUS"

            echo ""
            echo "===== MACRO IN BUILD LOG ====="
            echo ""

            grep \
              -n \
              -m 100 \
              'MINECRAFT_NX_HORIZON' \
              ../horizon-research/hotspot-build-v1.8.log \
              || true

            echo ""
            echo "===== RELEVANT MESSAGES ====="
            echo ""

            grep \
              -i \
              -E \
              'error|fatal|horizon|minecraft_nx|aarch64|dlfcn|dlopen|dlsym|dlclose|dlerror|RTLD|os_cpu|os/|not found|no rule|undefined|unsupported|missing|posix|linux|pthread|signal|mmap|munmap|mprotect|clock|gettimeofday|thread|socket|atomic|errno|mapfile' \
              ../horizon-research/hotspot-build-v1.8.log \
              | tail -n 12000 \
              || true

            echo ""
            echo "===== LAST 3000 ====="
            echo ""

            tail \
              -n 3000 \
              ../horizon-research/hotspot-build-v1.8.log

          } > ../horizon-research/hotspot-summary-v1.8.txt

          cat \
            ../horizon-research/hotspot-summary-v1.8.txt

          exit 0


      # ============================================================
      # 26. Confirma macro no comando REAL
      # ============================================================

      - name: Verify macro reached HotSpot compiler
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v1.8.log"

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " HotSpot Macro Verification v1.8"
            echo "========================================"
            echo ""

            if grep -q \
              'MINECRAFT_NX_HORIZON' \
              "$LOG"
            then

              echo "RESULT: FOUND"
              echo ""

              grep \
                -n \
                -m 100 \
                'MINECRAFT_NX_HORIZON' \
                "$LOG"

            else

              echo "RESULT: NOT FOUND"
              echo ""
              echo "The generated HotSpot command did not"
              echo "show MINECRAFT_NX_HORIZON."

            fi

          } > horizon-research/hotspot-macro-verification-v1.8.txt

          cat \
            horizon-research/hotspot-macro-verification-v1.8.txt

          exit 0


      # ============================================================
      # 27. Primeiro erro
      # ============================================================

      - name: Extract first HotSpot failure
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v1.8.log"

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " FIRST HOTSPOT FAILURE v1.8"
            echo " Created by Farbert_Took"
            echo "========================================"
            echo ""

            if [ ! -f "$LOG" ]; then

              echo "HotSpot log unavailable."

              exit 0
            fi

            echo "===== FIRST ERROR-LIKE LINES ====="
            echo ""

            grep \
              -n \
              -m 150 \
              -E \
              '(^|[^A-Za-z])(error:|fatal error:|Error [0-9]|undefined reference|No such file|No rule to make target|Unknown target|unsupported|Unsupported)' \
              "$LOG" \
              || true

            echo ""
            echo "===== DLFCN ====="
            echo ""

            grep \
              -n \
              -m 500 \
              -E \
              'dlfcn|dlopen|dlsym|dlclose|dlerror|RTLD_' \
              "$LOG" \
              || true

            echo ""
            echo "===== HORIZON / OS ====="
            echo ""

            grep \
              -n \
              -m 500 \
              -i \
              -E \
              'horizon|minecraft_nx|os_cpu|src/hotspot/os/' \
              "$LOG" \
              || true

          } > horizon-research/first-hotspot-failure-v1.8.txt

          cat \
            horizon-research/first-hotspot-failure-v1.8.txt

          exit 0


      # ============================================================
      # 28. Failure logs
      # ============================================================

      - name: Collect HotSpot failure logs
        shell: bash
        run: |
          set +e

          ROOT="openjdk21/build/horizon-aarch64-minimal-release/make-support/failure-logs"

          mkdir -p \
            horizon-research/failure-logs

          if [ -d "$ROOT" ]; then

            find "$ROOT" \
              -type f \
              -print \
              | tee horizon-research/failure-log-files-v1.8.txt

            cp -R \
              "$ROOT"/. \
              horizon-research/failure-logs/ \
              2>/dev/null \
              || true

          fi

          exit 0


      # ============================================================
      # 29. Procura dlfcn depois do build
      # ============================================================

      - name: Analyze remaining dynamic loader requirements
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo " Dynamic Loader Requirements v1.8"
            echo "========================================"
            echo ""

            echo "===== HOTSPOT DLOPEN ====="
            echo ""

            grep \
              -Rni \
              -E '\b(dlopen|dlsym|dlclose|dlerror)\b' \
              openjdk21/src/hotspot \
              2>/dev/null \
              | head -n 5000

            echo ""
            echo "===== HOTSPOT RTLD ====="
            echo ""

            grep \
              -Rni \
              -E '\bRTLD_[A-Za-z0-9_]+' \
              openjdk21/src/hotspot \
              2>/dev/null \
              | head -n 5000

            echo ""
            echo "===== DYNAMIC LOADER IN LIBNX ====="
            echo ""

            grep \
              -Rni \
              -E 'nro|Nro|NRO|roInitialize|ldr|LoadNro|loadNro' \
              /opt/devkitpro/libnx/include \
              2>/dev/null \
              | head -n 3000

          } > horizon-research/dynamic-loader-research-v1.8.txt

          exit 0


      # ============================================================
      # 30. Summary
      # ============================================================

      - name: Final v1.8 summary
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v1.8"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Target:"
            echo "Horizon / AArch64"

            echo ""
            echo "JVM:"
            echo "minimal"

            echo ""
            echo "Mode:"
            echo "headless"

            echo ""
            echo "FreeType:"
            echo "${FREETYPE_READY:-no}"

            echo ""
            echo "Configure exit:"
            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "JvmMapfile:"
            echo "Horizon ELF/GNU nm"

            echo ""
            echo "Target macro:"
            echo "MINECRAFT_NX_HORIZON=1"

            echo ""
            echo "dlfcn.h:"
            echo "conditional on MINECRAFT_NX_HORIZON"

            echo ""
            echo "Fake dlopen/dlsym:"
            echo "NO"

            echo ""

            if [ -f horizon-research/hotspot-exit-code.txt ]; then

              echo "HotSpot exit:"
              cat horizon-research/hotspot-exit-code.txt

            else

              echo "HotSpot exit:"
              echo "not-run"

            fi

            echo ""
            echo "===== MACRO VERIFICATION ====="
            echo ""

            if [ -f horizon-research/hotspot-macro-verification-v1.8.txt ]; then

              cat \
                horizon-research/hotspot-macro-verification-v1.8.txt

            fi

            echo ""
            echo "===== FIRST FAILURE ====="
            echo ""

            if [ -f horizon-research/first-hotspot-failure-v1.8.txt ]; then

              cat \
                horizon-research/first-hotspot-failure-v1.8.txt

            fi

            echo ""
            echo "===== LAST 1200 ====="
            echo ""

            if [ -f horizon-research/hotspot-build-v1.8.log ]; then

              tail \
                -n 1200 \
                horizon-research/hotspot-build-v1.8.log

            fi

          } > horizon-research/summary-v1.8.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v1.8"
          echo "========================================"
          echo ""

          cat \
            horizon-research/summary-v1.8.txt


      # ============================================================
      # 31. Final report
      # ============================================================

      - name: Final report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.8"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Configure:"
          cat horizon-research/configure-exit-code.txt

          echo ""

          if [ -f horizon-research/hotspot-exit-code.txt ]; then

            echo "HotSpot:"
            cat horizon-research/hotspot-exit-code.txt

          fi

          echo ""
          echo "Files:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"
          echo " v1.8 COMPLETE"
          echo "========================================"


      # ============================================================
      # 32. Artifact
      # ============================================================

      - name: Upload Horizon Research v1.8
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v1.8
          path: horizon-research
