            cat \
              horizon-research/hotspot-macro-verification-v1.9.txt

            echo ""
            echo "===== DLFCN ====="
            cat \
              horizon-research/dlfcn-blocker-v1.9.txt

            echo ""
            echo "===== FIRST FAILURE ====="
            cat \
              horizon-research/first-hotspot-failure-v1.9.txt

          } > horizon-research/summary-v1.9.txt

          cat \
            horizon-research/summary-v1.9.txt


      # ============================================================
      # 34. Compact result
      #
      # Ainda menor para copiar pelo celular.
