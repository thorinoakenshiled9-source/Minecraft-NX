name: OpenJDK Horizon Research v1.6

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK Horizon Research v1.6
      # Created by Farbert_Took
      #
      # v1.4:
      #   OpenJDK configure: OK
      #   make hotspot iniciou
      #
      # v1.5:
      #   identificou a estrutura real de JvmMapfile.gmk
      #
      # v1.6:
      #   adiciona ramo Horizon explicito em JvmMapfile.gmk
      #   usando GNU nm para objetos ELF
      #
      # IMPORTANTE:
      #   Horizon continua sendo Horizon.
      #   Nao transformamos Horizon globalmente em Linux.
      # ============================================================


      # ============================================================
      # 1. Dependencias
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.6"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. devkitA64 PATH
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. Workspace
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v1.6"
            echo "Created by Farbert_Took"
            echo ""
            echo "Target: Nintendo Switch Horizon"
            echo "CPU: AArch64"
            echo "JVM: OpenJDK 21 HotSpot minimal"
            echo "Mode: headless"
            echo "FreeType: static target library"
            echo "JvmMapfile: Horizon ELF/GNU nm"
          } > horizon-research/info.txt


      # ============================================================
      # 4. Verifica devkitA64
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          test -f /opt/devkitpro/libnx/include/switch.h

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt

          aarch64-none-elf-nm --version \
            | tee horizon-research/nm-version.txt


      # ============================================================
      # 5. Teste AArch64/Horizon
      # ============================================================

      - name: Verify Horizon AArch64 compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon-test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon(void)
          {
              u64 java_version = 21;
              return (int)java_version;
          }
          EOF

          aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon-test.c \
            -o horizon-research/horizon-test.o

          file horizon-research/horizon-test.o \
            | tee horizon-research/horizon-object.txt

          echo ""
          echo "Symbols:"
          echo ""

          aarch64-none-elf-nm \
            --defined-only \
            horizon-research/horizon-test.o \
            | tee horizon-research/horizon-test-symbols.txt


      # ============================================================
      # 6. Boot JDK 20
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt


      # ============================================================
      # 7. FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

          git -C freetype-src rev-parse HEAD \
            | tee horizon-research/freetype-commit.txt


      # ============================================================
      # 8. Configura FreeType
      # ============================================================

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0


      # ============================================================
      # 9. Compila FreeType
      # ============================================================

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            echo "FreeType configure failed." \
              | tee horizon-research/freetype-build.log

            echo "1" \
              > horizon-research/freetype-build-exit.txt

            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then

            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log

          fi

          exit 0


      # ============================================================
      # 10. Valida FreeType
      # ============================================================

      - name: Validate Horizon FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | head -n 1
          )

          if [ -z "$FREETYPE_LIB" ]; then

            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"

            echo "libfreetype.a NOT FOUND"

            exit 0
          fi

          FREETYPE_LIBDIR=$(
            dirname "$FREETYPE_LIB"
          )

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"
          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo " FREETYPE TARGET READY"
          echo "========================================"
          echo ""

          echo "$FREETYPE_LIB"

          ls -lh "$FREETYPE_LIB"

          aarch64-none-elf-ar \
            t "$FREETYPE_LIB" \
            | head -n 50 \
            | tee horizon-research/freetype-members.txt

          exit 0


      # ============================================================
      # 11. OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 12. Mapeia ELF -> Horizon
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/platform.m4"
          )

          s = p.read_text()

          needle = (
              'AC_MSG_ERROR([unsupported operating system $1])'
          )

          if needle not in s:
              raise SystemExit(
                  "OS fallback not found"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:

              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )

          else:

              pos = s.find(needle)

              case_start = s.rfind(
                  "*)",
                  0,
                  pos
              )

              if case_start < 0:
                  raise SystemExit(
                      "OS fallback case not found"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print(
              "elf -> horizon mapping installed"
          )
          PY


      # ============================================================
      # 13. CUPS
      # ============================================================

      - name: Apply Horizon CUPS research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(
                  errors="ignore"
              )

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "CUPS check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find cups"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)

          print(
              "Horizon CUPS bypass installed"
          )
          PY


      # ============================================================
      # 14. Fontconfig
      # ============================================================

      - name: Apply Horizon Fontconfig research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          target = None

          for p in root.rglob("*.m4"):

              text = p.read_text(
                  errors="ignore"
              )

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Fontconfig check not found"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find fontconfig"
          )

          start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          end = text.find(
              "\n",
              pos
          )

          if end < 0:
              end = len(text)

          original = text[start:end]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          target.write_text(text)

          print(
              "Horizon Fontconfig bypass installed"
          )
          PY


      # ============================================================
      # 15. FreeType estatico para Horizon
      # ============================================================

      - name: Add static FreeType detection for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit(
                  "Expected exactly one FreeType library expression"
              )

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              "Horizon static FreeType patch installed"
          )
          PY


      # ============================================================
      # 16. X11
      # ============================================================

      - name: Apply complete Horizon headless X11 bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "openjdk21/make/autoconf"
          )

          checks = [
              (
                  "Could not find X11 libraries",
                  "X11 libraries"
              ),
              (
                  "Could not find all X11 headers",
                  "X11 headers"
              ),
          ]

          for needle, label in checks:

              candidates = []

              for p in root.rglob("*.m4"):

                  text = p.read_text(
                      errors="ignore"
                  )

                  if needle in text:
                      candidates.append(p)

              if len(candidates) != 1:
                  raise SystemExit(
                      f"{label}: expected one source file, "
                      f"found {len(candidates)}"
                  )

              p = candidates[0]

              lines = p.read_text().splitlines(
                  True
              )

              indexes = []

              for i, line in enumerate(lines):

                  if (
                      needle in line
                      and "AC_MSG_ERROR" in line
                  ):
                      indexes.append(i)

              if len(indexes) != 1:
                  raise SystemExit(
                      f"{label}: expected one "
                      f"AC_MSG_ERROR, found "
                      f"{len(indexes)}"
                  )

              i = indexes[0]

              original = lines[i]

              indent = original[
                  :len(original)
                  - len(original.lstrip())
              ]

              original_body = (
                  original.rstrip("\n")
              )

              if label == "X11 libraries":

                  warning = (
                      "X11 libraries disabled for "
                      "experimental Horizon "
                      "headless target"
                  )

              else:

                  warning = (
                      "X11 headers disabled for "
                      "experimental Horizon "
                      "headless target"
                  )

              replacement = (
                  indent
                  + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
                  + indent
                  + '  AC_MSG_WARN(['
                  + warning
                  + '])\n'
                  + indent
                  + '  X_CFLAGS=""\n'
                  + indent
                  + '  X_LIBS=""\n'
                  + indent
                  + 'else\n'
                  + original_body
                  + '\n'
                  + indent
                  + 'fi\n'
              )

              lines[i] = replacement

              p.write_text(
                  "".join(lines)
              )

          print(
              "Horizon X11 library/header bypass installed"
          )
          PY


      # ============================================================
      # 17. Salva patches do configure
      # ============================================================

      - name: Save configure Horizon patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-configure-v1.6.patch

          grep \
            -n \
            -C 10 \
            -E \
            'horizon|Horizon|FREETYPE|X11|CUPS|Fontconfig' \
            horizon-research/openjdk-horizon-configure-v1.6.patch \
            | head -n 1500 \
            || true


      # ============================================================
      # 18. Configure OpenJDK
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then

            echo "FreeType target unavailable." \
              > horizon-research/configure-v1.6.log

            echo "99" \
              > horizon-research/configure-exit-code.txt

            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v1.6.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0


      # ============================================================
      # 19. Resultado do configure
      # ============================================================

      - name: Show configure result
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " CONFIGURE RESULT v1.6"
          echo "========================================"
          echo ""

          STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          echo "Configure exit:"
          echo "$STATUS"

          echo ""

          grep -i -E \
            'error|warning|horizon|aarch64|headless|minimal|freetype|x11|cups|fontconfig|dlopen' \
            horizon-research/configure-v1.6.log \
            | tail -n 1000 \
            || true


      # ============================================================
      # 20. Inspeciona JvmMapfile real
      # ============================================================

      - name: Inspect JvmMapfile before Horizon patch
        shell: bash
        run: |
          set -e

          JVMMAPFILE="openjdk21/make/hotspot/lib/JvmMapfile.gmk"

          test -f "$JVMMAPFILE"

          echo ""
          echo "========================================"
          echo " JVMMAPFILE BEFORE v1.6"
          echo "========================================"
          echo ""

          nl -ba "$JVMMAPFILE" \
            | tee horizon-research/JvmMapfile-before-v1.6.txt

          echo ""
          echo "Linux branch:"
          echo ""

          grep \
            -n \
            -A 25 \
            -B 5 \
            'isTargetOs, linux' \
            "$JVMMAPFILE" \
            | tee horizon-research/JvmMapfile-linux-v1.6.txt


      # ============================================================
      # 21. JvmMapfile Horizon ELF/GNU nm
      # ============================================================

      - name: Add Horizon support to JvmMapfile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/hotspot/lib/JvmMapfile.gmk"
          )

          if not p.exists():
              raise SystemExit(
                  "JvmMapfile.gmk not found"
              )

          s = p.read_text()

          linux_marker = '''ifeq ($(call isTargetOs, linux), true)'''

          mac_marker = '''else ifeq ($(call isTargetOs, macosx), true)'''

          if linux_marker not in s:
              raise SystemExit(
                  "Linux JvmMapfile branch not found"
              )

          if mac_marker not in s:
              raise SystemExit(
                  "macOS JvmMapfile branch not found"
              )

          if "isTargetOs, horizon" in s:
              raise SystemExit(
                  "Horizon JvmMapfile branch already exists"
              )

          horizon_branch = r'''else ifeq ($(call isTargetOs, horizon), true)
            # Minecraft-NX / Horizon
            #
            # Horizon AArch64 object files are ELF objects generated
            # by the devkitA64 GNU toolchain.
            #
            # This branch only controls HotSpot symbol extraction.
            # Horizon remains a distinct target OS.
            DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only *$(OBJ_SUFFIX)
            ifneq ($(FILTER_SYMBOLS_PATTERN), )
              FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|
            endif
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)^_ZTV|^gHotSpotVM|^UseSharedSpaces$$
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|^_ZN9Arguments17SharedArchivePathE$$
            FILTER_SYMBOLS_AWK_SCRIPT := \
                '{ \
                  if ($$3 ~ /$(FILTER_SYMBOLS_PATTERN)/) print $$3; \
                }'

          '''

          s = s.replace(
              mac_marker,
              horizon_branch + mac_marker,
              1
          )

          p.write_text(s)

          print("")
          print("========================================")
          print(" JVMMAPFILE HORIZON PATCH INSTALLED")
          print("========================================")
          print("")
          print("Target OS: horizon")
          print("Object format: ELF")
          print("Symbol extraction: GNU nm")
          print("")
          PY

          echo ""
          echo "===== JVMMAPFILE PATCH ====="
          echo ""

          git -C openjdk21 diff \
            -- make/hotspot/lib/JvmMapfile.gmk \
            | tee horizon-research/JvmMapfile-patch-v1.6.diff

          echo ""
          echo "===== HORIZON BRANCH ====="
          echo ""

          grep \
            -n \
            -A 30 \
            -B 10 \
            'isTargetOs, horizon' \
            openjdk21/make/hotspot/lib/JvmMapfile.gmk \
            | tee horizon-research/JvmMapfile-horizon-v1.6.txt

          echo ""
          echo "JvmMapfile Horizon patch: OK"


      # ============================================================
      # 22. Valida JvmMapfile
      # ============================================================

      - name: Validate JvmMapfile Horizon patch
        shell: bash
        run: |
          set -e

          FILE="openjdk21/make/hotspot/lib/JvmMapfile.gmk"

          grep -q \
            'isTargetOs, horizon' \
            "$FILE"

          grep -q \
            'DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only' \
            "$FILE"

          grep -q \
            'Unknown target OS' \
            "$FILE"

          echo ""
          echo "JvmMapfile validation: OK"
          echo ""
          echo "Horizon has its own symbol branch."
          echo "Unknown-OS protection remains intact."


      # ============================================================
      # 23. Salva patch completo
      # ============================================================

      - name: Save complete Horizon patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v1.6.patch

          echo ""
          echo "Patch size:"
          echo ""

          wc -l \
            horizon-research/openjdk-horizon-v1.6.patch

          echo ""
          echo "Horizon references:"
          echo ""

          grep \
            -n \
            -i \
            'horizon' \
            horizon-research/openjdk-horizon-v1.6.patch \
            | head -n 1000 \
            || true


      # ============================================================
      # 24. HotSpot probe
      # ============================================================

      - name: Probe HotSpot build v1.6
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then

            {
              echo "========================================"
              echo " Minecraft-NX"
              echo " HOTSPOT PROBE v1.6"
              echo " Created by Farbert_Took"
              echo "========================================"

              echo ""
              echo "NOT STARTED"

              echo ""
              echo "Configure exit:"
              echo "$CONFIG_STATUS"

            } > horizon-research/hotspot-summary-v1.6.txt

            cat \
              horizon-research/hotspot-summary-v1.6.txt

            exit 0
          fi

          cd openjdk21

          echo ""
          echo "========================================"
          echo " OPENJDK CONFIGURE = 0"
          echo " STARTING HOTSPOT PROBE v1.6"
          echo "========================================"
          echo ""

          make hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v1.6.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " HOTSPOT PROBE v1.6"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "make hotspot exit:"
            echo "$STATUS"

            echo ""
            echo "Relevant messages:"
            echo ""

            grep -i -E \
              'error|fatal|horizon|aarch64|os_cpu|os/|not found|no rule|undefined|unsupported|missing|posix|linux|pthread|signal|mmap|munmap|dlopen|dlsym|clock|gettimeofday|thread|socket|atomic|errno|mapfile|JvmMapfile' \
              ../horizon-research/hotspot-build-v1.6.log \
              | tail -n 8000 \
              || true

            echo ""
            echo "===== LAST 2000 ====="
            echo ""

            tail \
              -n 2000 \
              ../horizon-research/hotspot-build-v1.6.log

          } > ../horizon-research/hotspot-summary-v1.6.txt

          cat \
            ../horizon-research/hotspot-summary-v1.6.txt

          exit 0


      # ============================================================
      # 25. Extrai primeiro erro
      # ============================================================

      - name: Extract first HotSpot failure
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v1.6.log"

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " FIRST HOTSPOT FAILURE v1.6"
            echo " Created by Farbert_Took"
            echo "========================================"
            echo ""

            if [ ! -f "$LOG" ]; then

              echo "HotSpot log not available."

              exit 0
            fi

            echo "===== FIRST ERROR-LIKE LINES ====="
            echo ""

            grep \
              -n \
              -m 80 \
              -E \
              '(^|[^A-Za-z])(error:|fatal error:|Error [0-9]|undefined reference|No such file|No rule to make target|Unknown target|unsupported|Unsupported)' \
              "$LOG" \
              || true

            echo ""
            echo "===== FIRST HORIZON REFERENCES ====="
            echo ""

            grep \
              -n \
              -m 100 \
              -i \
              -E \
              'horizon|os_cpu|src/hotspot/os/' \
              "$LOG" \
              || true

          } > horizon-research/first-hotspot-failure-v1.6.txt

          cat \
            horizon-research/first-hotspot-failure-v1.6.txt

          exit 0


      # ============================================================
      # 26. HotSpot OS source map
      # ============================================================

      - name: Create HotSpot OS source map
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " HotSpot Horizon Source Map v1.6"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "===== AARCH64 CPU ====="
            echo ""

            find \
              openjdk21/src/hotspot/cpu/aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== OS DIRECTORIES ====="
            echo ""

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== OS_CPU DIRECTORIES ====="
            echo ""

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== LINUX REFERENCE ====="
            echo ""

            find \
              openjdk21/src/hotspot/os/linux \
              openjdk21/src/hotspot/os_cpu/linux_aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== HORIZON CURRENT ====="
            echo ""

            find \
              openjdk21/src/hotspot/os/horizon \
              openjdk21/src/hotspot/os_cpu/horizon_aarch64 \
              -type f \
              -print \
              2>/dev/null \
              | sort

          } > horizon-research/hotspot-source-map-v1.6.txt

          exit 0


      # ============================================================
      # 27. Procura seletores adicionais de OS
      # ============================================================

      - name: Research next HotSpot OS selectors
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " HotSpot OS Selector Research v1.6"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "===== UNKNOWN / UNSUPPORTED OS ====="
            echo ""

            grep \
              -Rni \
              -E \
              'Unknown target OS|Unsupported target OS|unsupported.*TARGET_OS' \
              openjdk21/make \
              2>/dev/null \
              | head -n 5000

            echo ""
            echo "===== OPENJDK_TARGET_OS ====="
            echo ""

            grep \
              -Rni \
              'OPENJDK_TARGET_OS' \
              openjdk21/make/hotspot \
              2>/dev/null \
              | head -n 5000

            echo ""
            echo "===== isTargetOs ====="
            echo ""

            grep \
              -Rni \
              'isTargetOs' \
              openjdk21/make/hotspot \
              2>/dev/null \
              | head -n 5000

            echo ""
            echo "===== OS SOURCE PATHS ====="
            echo ""

            grep \
              -Rni \
              -E \
              'src/hotspot/os/|src/hotspot/os_cpu/' \
              openjdk21/make/hotspot \
              2>/dev/null \
              | head -n 5000

          } > horizon-research/hotspot-os-selectors-v1.6.txt

          exit 0


      # ============================================================
      # 28. Pesquisa POSIX/Linux sem modificar
      # ============================================================

      - name: Research future Horizon portability requirements
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " Horizon Portability Research v1.6"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "This step does NOT patch these APIs."
            echo ""

            echo "===== LINUX AARCH64 OS_CPU FILES ====="
            echo ""

            find \
              openjdk21/src/hotspot/os_cpu/linux_aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== LINUX OS FILES ====="
            echo ""

            find \
              openjdk21/src/hotspot/os/linux \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== POSIX REFERENCES ====="
            echo ""

            grep \
              -Rni \
              -E \
              'pthread_|mmap|munmap|mprotect|sigaction|sigaltstack|dlopen|dlsym|clock_gettime|gettimeofday' \
              openjdk21/src/hotspot/os/linux \
              openjdk21/src/hotspot/os/posix \
              openjdk21/src/hotspot/os_cpu/linux_aarch64 \
              2>/dev/null \
              | head -n 5000

          } > horizon-research/horizon-portability-v1.6.txt

          exit 0


      # ============================================================
      # 29. Summary
      # ============================================================

      - name: Final v1.6 summary
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v1.6"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Target:"
            echo "Horizon / AArch64"

            echo ""
            echo "JVM:"
            echo "minimal"

            echo ""
            echo "Mode:"
            echo "headless"

            echo ""
            echo "FreeType:"
            echo "${FREETYPE_READY:-no}"

            echo ""
            echo "Configure exit:"
            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "JvmMapfile:"
            echo "Horizon ELF/GNU nm branch installed"

            echo ""

            if [ -f horizon-research/hotspot-exit-code.txt ]; then

              echo "HotSpot exit:"
              cat horizon-research/hotspot-exit-code.txt

            else

              echo "HotSpot exit:"
              echo "not-run"

            fi

            echo ""
            echo "===== FIRST FAILURE ====="
            echo ""

            if [ -f horizon-research/first-hotspot-failure-v1.6.txt ]; then

              cat \
                horizon-research/first-hotspot-failure-v1.6.txt

            fi

            echo ""
            echo "===== HOTSPOT LAST 800 ====="
            echo ""

            if [ -f horizon-research/hotspot-build-v1.6.log ]; then

              tail \
                -n 800 \
                horizon-research/hotspot-build-v1.6.log

            fi

          } > horizon-research/summary-v1.6.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v1.6"
          echo "========================================"
          echo ""

          cat horizon-research/summary-v1.6.txt


      # ============================================================
      # 30. Coleta config logs
      # ============================================================

      - name: Collect OpenJDK config logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name 'config.log' \
              -o \
              -name 'configure.log' \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE=$(
                echo "$FILEPATH" \
                | tr '/' '_'
              )

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 31. Final report
      # ============================================================

      - name: Final report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v1.6"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Configure:"
          cat horizon-research/configure-exit-code.txt

          if [ -f horizon-research/hotspot-exit-code.txt ]; then

            echo ""
            echo "HotSpot:"
            cat horizon-research/hotspot-exit-code.txt

          fi

          echo ""
          echo "Research files:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"
          echo " STATUS v1.6"
          echo "========================================"
          echo ""
          echo "OpenJDK configure: pesquisado"
          echo "JvmMapfile Horizon: patch aplicado"
          echo "HotSpot: probe executado se configure = 0"
          echo ""
          echo "Este workflow ainda e pesquisa de port."
          echo "Ele nao produz uma JVM Horizon funcional automaticamente."


      # ============================================================
      # 32. Artifact
      # ============================================================

      - name: Upload Horizon Research v1.6
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v1.6
          path: horizon-research
