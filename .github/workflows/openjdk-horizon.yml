name: OpenJDK Horizon Research v2.1

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v2.1"
          echo " Created by Farbert_Took"
          echo "========================================"

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          cat > horizon-research/info.txt <<'EOF'
          Minecraft-NX
          OpenJDK Horizon Research v2.1
          Created by Farbert_Took

          Target: Nintendo Switch Horizon
          Architecture: AArch64
          JVM: OpenJDK 21 HotSpot
          JVM variant: minimal
          Mode: headless

          Experimental target macro:
          MINECRAFT_NX_HORIZON=1

          v2.1 target:
          globalDefinitions_gcc.hpp platform-specific definition
          EOF

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          test -f /opt/devkitpro/libnx/include/switch.h

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt

      - name: Test Horizon macro independently
        shell: bash
        run: |
          set -e

          cat > horizon-research/macro-test.cpp <<'EOF'
          #ifndef MINECRAFT_NX_HORIZON
          #error MINECRAFT_NX_HORIZON missing
          #endif

          #if MINECRAFT_NX_HORIZON != 1
          #error MINECRAFT_NX_HORIZON wrong value
          #endif

          int minecraft_nx_horizon_test()
          {
              return MINECRAFT_NX_HORIZON;
          }
          EOF

          aarch64-none-elf-g++ \
            -march=armv8-a \
            -DMINECRAFT_NX_HORIZON=1 \
            -c \
            horizon-research/macro-test.cpp \
            -o horizon-research/macro-test.o

          echo "Standalone Horizon macro test: OK"

      # ============================================================
      # Boot JDK
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt

      # ============================================================
      # FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build

          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          echo "${PIPESTATUS[0]}" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/freetype-configure-exit.txt \
            2>/dev/null || echo "99"
          )

          if [ "$CONFIG_STATUS" != "0" ]; then
            echo "99" > horizon-research/freetype-build-exit.txt
            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then
            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log
          fi

          exit 0

      - name: Validate Horizon FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | sed -n '1p'
          )

          if [ -z "$FREETYPE_LIB" ]; then
            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"
            echo "libfreetype.a NOT FOUND"
            exit 0
          fi

          FREETYPE_LIBDIR=$(dirname "$FREETYPE_LIB")

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"
          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" >> "$GITHUB_ENV"

          echo "FreeType: $FREETYPE_LIB"

      # ============================================================
      # OpenJDK
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt

      # ============================================================
      # elf -> horizon
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          existing = re.search(
              r'(?m)^([ \t]*)elf\)[ \t]*$',
              s
          )

          if existing:
              area = s[
                  existing.start():
                  min(len(s), existing.start() + 300)
              ]

              if "VAR_OS=horizon" in area:
                  print("elf -> horizon already installed")
                  raise SystemExit(0)

              raise SystemExit(
                  "Existing elf case does not map to Horizon"
              )

          error = re.search(
              r'unsupported operating system',
              s,
              re.IGNORECASE
          )

          if not error:
              raise SystemExit(
                  "Unsupported OS message not found"
              )

          before = s[:error.start()]

          fallbacks = list(
              re.finditer(
                  r'(?m)^([ \t]*)\*\)[ \t]*$',
                  before
              )
          )

          if not fallbacks:
              raise SystemExit(
                  "OS fallback not found"
              )

          fallback = fallbacks[-1]
          indent = fallback.group(1)

          horizon = (
              f"{indent}elf)\n"
              f"{indent}  VAR_OS=horizon\n"
              f"{indent}  ;;\n"
          )

          s = (
              s[:fallback.start()]
              + horizon
              + s[fallback.start():]
          )

          p.write_text(s)

          print("elf -> horizon installed")
          PY

      # ============================================================
      # CUPS
      # ============================================================

      - name: Apply Horizon CUPS bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          for p in root.rglob("*.m4"):
              s = p.read_text(errors="ignore")

              if "Could not find cups" not in s:
                  continue

              pos = s.find("Could not find cups")
              start = s.rfind("\n", 0, pos) + 1
              end = s.find("\n", pos)

              if end < 0:
                  end = len(s)

              original = s[start:end]
              indent = original[
                  :len(original) - len(original.lstrip())
              ]

              replacement = (
                  indent
                  + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
                  + indent
                  + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
                  + indent
                  + '  CUPS_CFLAGS=""\n'
                  + indent
                  + '  CUPS_LIBS=""\n'
                  + indent
                  + 'else\n'
                  + original
                  + '\n'
                  + indent
                  + 'fi'
              )

              p.write_text(
                  s[:start] + replacement + s[end:]
              )

              print("CUPS bypass:", p)
              break

          else:
              raise SystemExit("CUPS check not found")
          PY

      # ============================================================
      # Fontconfig
      # ============================================================

      - name: Apply Horizon Fontconfig bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          for p in root.rglob("*.m4"):
              s = p.read_text(errors="ignore")

              if "Could not find fontconfig" not in s:
                  continue

              pos = s.find("Could not find fontconfig")
              start = s.rfind("\n", 0, pos) + 1
              end = s.find("\n", pos)

              if end < 0:
                  end = len(s)

              original = s[start:end]
              indent = original[
                  :len(original) - len(original.lstrip())
              ]

              replacement = (
                  indent
                  + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
                  + indent
                  + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
                  + indent
                  + '  FONTCONFIG_CFLAGS=""\n'
                  + indent
                  + '  FONTCONFIG_LIBS=""\n'
                  + indent
                  + 'else\n'
                  + original
                  + '\n'
                  + indent
                  + 'fi'
              )

              p.write_text(
                  s[:start] + replacement + s[end:]
              )

              print("Fontconfig bypass:", p)
              break

          else:
              raise SystemExit(
                  "Fontconfig check not found"
              )
          PY

      # ============================================================
      # Static FreeType
      # ============================================================

      - name: Add static FreeType detection
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit(
                  "FreeType expression not found exactly once"
              )

          p.write_text(
              s.replace(old, new, 1)
          )

          print("Static FreeType patch installed")
          PY

      # ============================================================
      # X11
      # ============================================================

      - name: Apply Horizon X11 bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          checks = [
              (
                  "Could not find X11 libraries",
                  "X11 libraries disabled for experimental Horizon headless target"
              ),
              (
                  "Could not find all X11 headers",
                  "X11 headers disabled for experimental Horizon headless target"
              ),
          ]

          for needle, warning in checks:
              found = False

              for p in root.rglob("*.m4"):
                  lines = p.read_text(
                      errors="ignore"
                  ).splitlines(True)

                  for i, line in enumerate(lines):
                      if (
                          needle not in line
                          or "AC_MSG_ERROR" not in line
                      ):
                          continue

                      indent = line[
                          :len(line) - len(line.lstrip())
                      ]

                      original = line.rstrip("\n")

                      lines[i] = (
                          indent
                          + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
                          + indent
                          + '  AC_MSG_WARN(['
                          + warning
                          + '])\n'
                          + indent
                          + '  X_CFLAGS=""\n'
                          + indent
                          + '  X_LIBS=""\n'
                          + indent
                          + 'else\n'
                          + original
                          + '\n'
                          + indent
                          + 'fi\n'
                      )

                      p.write_text(
                          "".join(lines)
                      )

                      found = True
                      break

                  if found:
                      break

              if not found:
                  raise SystemExit(
                      "X11 check not found: " + needle
                  )

          print("X11 bypass installed")
          PY

      # ============================================================
      # Configure
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then
            echo "99" \
              > horizon-research/configure-exit-code.txt
            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v2.1.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0

      - name: Locate OpenJDK spec.gmk
        shell: bash
        run: |
          set -e

          SPEC=$(
            find openjdk21/build \
              -type f \
              -name spec.gmk \
              | sed -n '1p'
          )

          test -n "$SPEC"

          echo "OPENJDK_SPEC=$SPEC" >> "$GITHUB_ENV"

          echo "$SPEC" \
            > horizon-research/spec-path-v2.1.txt

      - name: Inject Minecraft-NX Horizon macro
        shell: bash
        run: |
          set -e

          cat >> "$OPENJDK_SPEC" <<'EOF'

          # Minecraft-NX Horizon v2.1
          CFLAGS += -DMINECRAFT_NX_HORIZON=1
          CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EOF

      # ============================================================
      # JvmMapfile
      # ============================================================

      - name: Add Horizon support to JvmMapfile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/hotspot/lib/JvmMapfile.gmk"
          )

          s = p.read_text()

          if "isTargetOs, horizon" in s:
              print("Horizon branch already present")
              raise SystemExit(0)

          marker = (
              'else ifeq ($(call isTargetOs, macosx), true)'
          )

          if marker not in s:
              raise SystemExit(
                  "JvmMapfile macOS branch not found"
              )

          horizon = r'''else ifeq ($(call isTargetOs, horizon), true)
            # Minecraft-NX / Horizon
            DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only *$(OBJ_SUFFIX)
            ifneq ($(FILTER_SYMBOLS_PATTERN), )
              FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|
            endif
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)^_ZTV|^gHotSpotVM|^UseSharedSpaces$$
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|^_ZN9Arguments17SharedArchivePathE$$
            FILTER_SYMBOLS_AWK_SCRIPT := \
                '{ \
                  if ($$3 ~ /$(FILTER_SYMBOLS_PATTERN)/) print $$3; \
                }'

          '''

          p.write_text(
              s.replace(
                  marker,
                  horizon + marker,
                  1
              )
          )

          print("JvmMapfile Horizon branch installed")
          PY

      # ============================================================
      # dlfcn.h
      # ============================================================

      - name: Disable global dlfcn include for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          s = p.read_text()

          old = "#include <dlfcn.h>"

          if "MINECRAFT_NX_HORIZON" in s:
              print("dlfcn Horizon guard already present")
              raise SystemExit(0)

          if s.count(old) != 1:
              raise SystemExit(
                  "Expected one dlfcn.h include"
              )

          new = '''// Minecraft-NX / Horizon
          #if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif'''

          p.write_text(
              s.replace(old, new, 1)
          )

          print("dlfcn guard installed")
          PY

      # ============================================================
      # v2.1: investigate exact globalDefinitions block
      # ============================================================

      - name: Research globalDefinitions GCC blocker
        shell: bash
        run: |
          set -e

          FILE="openjdk21/src/hotspot/share/utilities/globalDefinitions_gcc.hpp"

          echo "========================================" \
            > horizon-research/globalDefinitions-research-v2.1.txt

          echo " Minecraft-NX globalDefinitions research" \
            >> horizon-research/globalDefinitions-research-v2.1.txt

          echo " Created by Farbert_Took" \
            >> horizon-research/globalDefinitions-research-v2.1.txt

          echo "========================================" \
            >> horizon-research/globalDefinitions-research-v2.1.txt

          echo "" \
            >> horizon-research/globalDefinitions-research-v2.1.txt

          echo "===== LINES 70-145 =====" \
            >> horizon-research/globalDefinitions-research-v2.1.txt

          sed -n '70,145p' "$FILE" \
            | nl -ba -v70 \
            >> horizon-research/globalDefinitions-research-v2.1.txt

          echo "" \
            >> horizon-research/globalDefinitions-research-v2.1.txt

          echo "===== PLATFORM ERROR =====" \
            >> horizon-research/globalDefinitions-research-v2.1.txt

          grep \
            -n \
            -B20 \
            -A20 \
            'missing platform-specific definition here' \
            "$FILE" \
            >> horizon-research/globalDefinitions-research-v2.1.txt \
            || true

          cat horizon-research/globalDefinitions-research-v2.1.txt

      # ============================================================
      # v2.1 patch:
      #
      # globalDefinitions_gcc.hpp contains the compiler-level
      # implementation for global definitions.
      #
      # We do NOT remove the #error blindly.
      #
      # We inspect the conditional branch immediately containing
      # the known #error and give Horizon its own GCC implementation
      # only when that block matches the expected structure.
      # ============================================================

      - name: Patch globalDefinitions GCC for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          s = p.read_text()

          needle = (
              '#error "missing platform-specific '
              'definition here"'
          )

          if needle not in s:
              raise SystemExit(
                  "Known globalDefinitions error not found"
              )

          pos = s.index(needle)

          # Preserve exact source around the blocker.
          start = max(0, pos - 2500)
          end = min(len(s), pos + 1500)

          Path(
              "horizon-research/"
              "globalDefinitions-block-before-v2.1.txt"
          ).write_text(
              s[start:end]
          )

          lines = s.splitlines()

          error_index = None

          for i, line in enumerate(lines):
              if needle in line:
                  error_index = i
                  break

          if error_index is None:
              raise SystemExit(
                  "Error line could not be indexed"
              )

          print(
              "Known platform-specific error line:",
              error_index + 1
          )

          # The important definition in this GCC block is
          # DEFAULT_CACHE_LINE_SIZE.
          #
          # AArch64 commonly exposes 64-byte cache lines and the
          # HotSpot AArch64 code is designed around that baseline.
          #
          # Keep this Horizon-specific instead of defining Linux.
          #
          # Only replace the known terminal error line. This leaves
          # every existing upstream platform branch untouched.

          replacement = '''#if defined(MINECRAFT_NX_HORIZON)
          // Minecraft-NX / Nintendo Switch Horizon / AArch64
          //
          // Horizon is not Linux, so keep a distinct platform path.
          // Nintendo Switch uses ARM Cortex-A57-class AArch64 CPU.
          // Use the 64-byte cache-line baseline expected by this
          // HotSpot compiler definition.
          #define DEFAULT_CACHE_LINE_SIZE 64
          #else
          #error "missing platform-specific definition here"
          #endif'''

          s = s.replace(
              needle,
              replacement,
              1
          )

          p.write_text(s)

          print(
              "Installed Horizon-specific "
              "globalDefinitions GCC branch"
          )
          PY

          FILE="openjdk21/src/hotspot/share/utilities/globalDefinitions_gcc.hpp"

          echo ""
          echo "===== PATCHED GLOBAL DEFINITIONS ====="

          grep \
            -n \
            -B15 \
            -A20 \
            'Minecraft-NX / Nintendo Switch Horizon' \
            "$FILE" \
            | tee horizon-research/globalDefinitions-after-v2.1.txt

      # ============================================================
      # Verify the old #error is now unreachable for our macro.
      # ============================================================

      - name: Verify globalDefinitions Horizon preprocessing
        shell: bash
        run: |
          set +e

          FILE="openjdk21/src/hotspot/share/utilities/globalDefinitions_gcc.hpp"

          grep \
            -n \
            -B10 \
            -A15 \
            'DEFAULT_CACHE_LINE_SIZE 64' \
            "$FILE" \
            > horizon-research/globalDefinitions-verification-v2.1.txt \
            || true

          cat \
            horizon-research/globalDefinitions-verification-v2.1.txt

          exit 0

      # ============================================================
      # Save complete source patch
      # ============================================================

      - name: Save OpenJDK Horizon patch
        shell: bash
        run: |
          set +e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v2.1.patch

          exit 0

      # ============================================================
      # HotSpot
      # ============================================================

      - name: Probe HotSpot build v2.1
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null || echo "99"
          )

          if [ "$CONFIG_STATUS" != "0" ]; then
            echo "99" \
              > horizon-research/hotspot-exit-code.txt
            exit 0
          fi

          cd openjdk21

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " HOTSPOT PROBE v2.1"
          echo " Created by Farbert_Took"
          echo "========================================"
          echo ""

          make \
            LOG=trace \
            hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v2.1.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          exit 0

      - name: Capture HotSpot tail
        shell: bash
        run: |
          set +e

          tail \
            -n 200 \
            horizon-research/hotspot-build-v2.1.log \
            > horizon-research/hotspot-last-200-v2.1.txt \
            2>/dev/null \
            || true

          exit 0

      # ============================================================
      # Verify milestones
      # ============================================================

      - name: Verify milestones
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v2.1.log"

          if grep -q \
            -- '-DMINECRAFT_NX_HORIZON=1' \
            "$LOG"
          then
            echo "YES" \
              > horizon-research/macro-result.txt
          else
            echo "NO" \
              > horizon-research/macro-result.txt
          fi

          if grep -Fq \
            'fatal error: dlfcn.h: No such file or directory' \
            "$LOG"
          then
            echo "PRESENT" \
              > horizon-research/dlfcn-result.txt
          else
            echo "PASSED" \
              > horizon-research/dlfcn-result.txt
          fi

          if grep -Fq \
            '#error "missing platform-specific definition here"' \
            "$LOG"
          then
            echo "PRESENT" \
              > horizon-research/globaldefinitions-result.txt
          else
            echo "PASSED" \
              > horizon-research/globaldefinitions-result.txt
          fi

          exit 0

      # ============================================================
      # Find real next blocker
      # ============================================================

      - name: Analyze HotSpot failure v2.1
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path(
              "horizon-research/hotspot-build-v2.1.log"
          )

          out = Path(
              "horizon-research/diagnostic-v2.1.txt"
          )

          if not log.exists():
              out.write_text(
                  "HotSpot log not found.\n"
              )
              raise SystemExit(0)

          lines = log.read_text(
              errors="replace"
          ).splitlines()

          patterns = [
              (
                  "FATAL COMPILER ERROR",
                  re.compile(
                      r"fatal error:",
                      re.I
                  )
              ),
              (
                  "PREPROCESSOR ERROR",
                  re.compile(
                      r'error:\s*#error',
                      re.I
                  )
              ),
              (
                  "COMPILER ERROR",
                  re.compile(
                      r"(^|[\s:])error:",
                      re.I
                  )
              ),
              (
                  "MISSING FILE",
                  re.compile(
                      r"No such file or directory",
                      re.I
                  )
              ),
              (
                  "UNDEFINED REFERENCE",
                  re.compile(
                      r"undefined reference",
                      re.I
                  )
              ),
              (
                  "MAKE FAILURE",
                  re.compile(
                      r"(?:^|\s)g?make"
                      r"(?:\[[0-9]+\])?: "
                      r"\*\*\*",
                      re.I
                  )
              ),
              (
                  "NO RULE",
                  re.compile(
                      r"No rule to make target",
                      re.I
                  )
              ),
              (
                  "UNKNOWN TARGET OS",
                  re.compile(
                      r"Unknown target OS",
                      re.I
                  )
              ),
              (
                  "LINKER ERROR",
                  re.compile(
                      r"(collect2:|ld:).*error",
                      re.I
                  )
              ),
          ]

          matches = []

          for i, line in enumerate(lines):
              for label, regex in patterns:
                  if regex.search(line):
                      matches.append(
                          (i, label, line)
                      )
                      break

          result = [
              "========================================",
              " Minecraft-NX",
              " HOTSPOT DIAGNOSTIC v2.1",
              " Created by Farbert_Took",
              "========================================",
              "",
          ]

          if not matches:
              result.extend([
                  "No standard failure pattern detected.",
                  "",
                  "Inspect LAST 200 LINES.",
              ])

          else:
              index, label, line = matches[0]

              result.extend([
                  f"FIRST FAILURE TYPE: {label}",
                  f"FIRST FAILURE LINE: {index + 1}",
                  "",
                  "===== CONTEXT =====",
                  "",
              ])

              start = max(0, index - 15)
              end = min(
                  len(lines),
                  index + 40
              )

              for n in range(start, end):
                  result.append(
                      f"{n + 1}: {lines[n]}"
                  )

              result.extend([
                  "",
                  "===== DETECTED FAILURES =====",
                  "",
              ])

              for index, label, line in matches[:50]:
                  result.append(
                      f"{index + 1}: "
                      f"[{label}] {line}"
                  )

          out.write_text(
              "\n".join(result) + "\n"
          )
          PY

          exit 0

      - name: Scan missing headers
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E \
            'fatal error: .*: No such file or directory' \
            horizon-research/hotspot-build-v2.1.log \
            > horizon-research/missing-headers-v2.1.txt \
            || true

          exit 0

      - name: Scan compiler linker errors
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E \
            'fatal error:|(^|[[:space:]:])error:|undefined reference|collect2:|ld: .*error' \
            horizon-research/hotspot-build-v2.1.log \
            > horizon-research/compiler-errors-v2.1.txt \
            || true

          exit 0

      - name: Scan make failures
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E \
            '(^|[[:space:]])g?make(\[[0-9]+\])?: \*\*\*|\*\*\*.*Error [0-9]+|No rule to make target' \
            horizon-research/hotspot-build-v2.1.log \
            > horizon-research/make-failures-v2.1.txt \
            || true

          exit 0

      - name: Collect OpenJDK failure logs
        shell: bash
        run: |
          set +e

          ROOT="openjdk21/build/horizon-aarch64-minimal-release/make-support/failure-logs"

          mkdir -p \
            horizon-research/failure-logs

          if [ -d "$ROOT" ]; then
            find "$ROOT" \
              -type f \
              -print \
              > horizon-research/failure-log-files-v2.1.txt

            cp -R \
              "$ROOT"/. \
              horizon-research/failure-logs/ \
              2>/dev/null \
              || true
          fi

          exit 0

      # ============================================================
      # Compact result
      # ============================================================

      - name: Compact result
        shell: bash
        run: |
          set +e

          CONFIG=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null || echo "unknown"
          )

          HOTSPOT=$(
            cat horizon-research/hotspot-exit-code.txt \
            2>/dev/null || echo "unknown"
          )

          MACRO=$(
            cat horizon-research/macro-result.txt \
            2>/dev/null || echo "unknown"
          )

          DLFCN=$(
            cat horizon-research/dlfcn-result.txt \
            2>/dev/null || echo "unknown"
          )

          GLOBALDEF=$(
            cat horizon-research/globaldefinitions-result.txt \
            2>/dev/null || echo "unknown"
          )

          echo ""
          echo "========================================"
          echo " Minecraft-NX v2.1 COMPACT RESULT"
          echo " Created by Farbert_Took"
          echo "========================================"
          echo ""

          echo "Configure: $CONFIG"
          echo "HotSpot: $HOTSPOT"
          echo "Macro Horizon: $MACRO"
          echo "dlfcn.h blocker: $DLFCN"
          echo "globalDefinitions blocker: $GLOBALDEF"

          echo ""
          echo "===== DIAGNOSTIC ====="
          echo ""

          sed -n '1,110p' \
            horizon-research/diagnostic-v2.1.txt \
            2>/dev/null \
            || true

          echo ""
          echo "===== MISSING HEADERS ====="
          echo ""

          if [ -s \
            horizon-research/missing-headers-v2.1.txt \
          ]; then

            sed -n '1,30p' \
              horizon-research/missing-headers-v2.1.txt

          else
            echo "None detected."
          fi

          echo ""
          echo "===== COMPILER / LINKER ERRORS ====="
          echo ""

          if [ -s \
            horizon-research/compiler-errors-v2.1.txt \
          ]; then

            sed -n '1,50p' \
              horizon-research/compiler-errors-v2.1.txt

          else
            echo "None detected."
          fi

          echo ""
          echo "===== MAKE FAILURES ====="
          echo ""

          if [ -s \
            horizon-research/make-failures-v2.1.txt \
          ]; then

            sed -n '1,40p' \
              horizon-research/make-failures-v2.1.txt

          else
            echo "None detected."
          fi

          echo ""
          echo "========================================"
          echo " END Minecraft-NX v2.1"
          echo "========================================"

          exit 0

      - name: Upload Horizon Research v2.1
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v2.1
          path: horizon-research
