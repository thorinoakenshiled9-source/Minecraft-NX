name: OpenJDK Horizon Research v0.2

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK / Horizon Research v0.2
      #
      # Created by Farbert_Took
      #
      # Objetivo:
      # - localizar corretamente devkitA64
      # - adicionar toolchain ao PATH
      # - testar AArch64
      # - testar libnx
      # - baixar OpenJDK 21
      # - executar configure exploratorio
      # - salvar todos os logs
      #
      # NAO altera o build.yml v5.
      # ============================================================


      # ============================================================
      # 1. Instala ferramentas
      # ============================================================

      - name: Install research tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            make \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.2"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. Inspeciona devkitPro
      # ============================================================

      - name: Inspect devkitPro installation
        shell: bash
        run: |
          set -e

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"

          echo ""
          echo "===== /opt/devkitpro ====="

          ls -la /opt/devkitpro

          echo ""
          echo "===== devkitA64 ====="

          ls -la /opt/devkitpro/devkitA64

          echo ""
          echo "===== devkitA64/bin ====="

          ls -la /opt/devkitpro/devkitA64/bin

          echo ""
          echo "===== libnx ====="

          ls -la /opt/devkitpro/libnx


      # ============================================================
      # 3. Adiciona devkitA64 ao PATH do restante do job
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

          echo ""
          echo "devkitA64 adicionado ao GITHUB_PATH"


      # ============================================================
      # 4. Detecta compiladores usando caminho absoluto
      #
      # Isso confirma primeiro que os executaveis realmente existem.
      # ============================================================

      - name: Verify AArch64 compiler files
        shell: bash
        run: |
          set -e

          GCC="/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc"
          GXX="/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++"
          AR="/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar"
          NM="/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm"
          OBJCOPY="/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy"
          STRIP="/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip"

          test -x "$GCC"
          test -x "$GXX"
          test -x "$AR"
          test -x "$NM"
          test -x "$OBJCOPY"
          test -x "$STRIP"

          echo ""
          echo "===== GCC ====="
          "$GCC" --version

          echo ""
          echo "===== G++ ====="
          "$GXX" --version

          echo ""
          echo "===== AR ====="
          "$AR" --version | head -n 2

          echo ""
          echo "===== NM ====="
          "$NM" --version | head -n 2

          echo ""
          echo "Toolchain localizado com sucesso."


      # ============================================================
      # 5. Confirma PATH
      # ============================================================

      - name: Verify toolchain PATH
        shell: bash
        run: |
          set -e

          echo "PATH=$PATH"

          echo ""
          echo "===== which gcc ====="
          which aarch64-none-elf-gcc

          echo ""
          echo "===== which g++ ====="
          which aarch64-none-elf-g++

          echo ""
          echo "===== gcc version ====="
          aarch64-none-elf-gcc --version

          echo ""
          echo "===== g++ version ====="
          aarch64-none-elf-g++ --version


      # ============================================================
      # 6. Cria diretório dos resultados
      # ============================================================

      - name: Prepare research directory
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          echo "Minecraft-NX" \
            > horizon-research/info.txt

          echo "OpenJDK Horizon Research v0.2" \
            >> horizon-research/info.txt

          echo "Created by Farbert_Took" \
            >> horizon-research/info.txt


      # ============================================================
      # 7. Teste ARM64 simples
      #
      # Apenas gera um .o AArch64.
      # ============================================================

      - name: Test bare AArch64 compiler
        shell: bash
        run: |
          set -e

          cat > horizon-research/test.c <<'EOF'
          int minecraft_nx_test(void)
          {
              return 21;
          }
          EOF

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a \
            -c \
            horizon-research/test.c \
            -o horizon-research/test.o

          echo ""
          echo "===== ARM64 OBJECT ====="

          file horizon-research/test.o

          echo ""
          ls -lh horizon-research/test.o

          echo ""
          echo "AArch64 compiler OK"


      # ============================================================
      # 8. Teste libnx
      #
      # Confirma compilacao de codigo que inclui switch.h.
      # ============================================================

      - name: Test Horizon libnx compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon_test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon_test(void)
          {
              u64 value = 21;
              return (int)value;
          }
          EOF

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon_test.c \
            -o horizon-research/horizon_test.o

          echo ""
          echo "===== HORIZON/LIBNX OBJECT ====="

          file horizon-research/horizon_test.o

          echo ""
          ls -lh horizon-research/horizon_test.o

          echo ""
          echo "libnx compilation OK"


      # ============================================================
      # 9. Salva informações do toolchain
      # ============================================================

      - name: Save toolchain information
        shell: bash
        run: |
          set -e

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.2"
            echo "Created by Farbert_Took"

            echo ""
            echo "DEVKITPRO=$DEVKITPRO"
            echo "DEVKITA64=$DEVKITA64"

            echo ""
            echo "===== GCC ====="

            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
              --version

            echo ""
            echo "===== G++ ====="

            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
              --version

            echo ""
            echo "===== OBJECT ====="

            file horizon-research/test.o

            echo ""
            echo "===== LIBNX OBJECT ====="

            file horizon-research/horizon_test.o

          } > horizon-research/toolchain.txt


      # ============================================================
      # 10. Baixa OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          echo ""
          echo "===== OPENJDK COMMIT ====="

          git -C openjdk21 rev-parse HEAD

          git -C openjdk21 rev-parse HEAD \
            > horizon-research/openjdk-commit.txt


      # ============================================================
      # 11. Inspeciona portas de sistema operacional existentes
      # ============================================================

      - name: Inspect HotSpot OS ports
        shell: bash
        run: |
          set -e

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.2"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== HOTSPOT OS PORTS ====="

            find \
              openjdk21/src/hotspot/os \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -print \
              | sort

            echo ""
            echo "===== AARCH64 FILES ====="

            find \
              openjdk21/src/hotspot/cpu/aarch64 \
              -maxdepth 1 \
              -type f \
              -print \
              | sort \
              | head -n 100

          } > horizon-research/hotspot-ports.txt

          cat horizon-research/hotspot-ports.txt


      # ============================================================
      # 12. Procura dependências Linux/POSIX
      # ============================================================

      - name: Inspect Linux POSIX dependencies
        shell: bash
        run: |
          set -e

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.2"
            echo "Created by Farbert_Took"

            echo ""
            echo "Selected Linux/POSIX references:"
            echo ""

            grep -R -n -E \
              'pthread_|mmap\(|munmap\(|mprotect\(|dlopen\(|dlsym\(|sigaction\(|sigaltstack\(|/proc/|clock_gettime\(|fork\(|exec' \
              openjdk21/src/hotspot/os/linux \
              | head -n 1000 \
              || true

          } > horizon-research/linux-dependencies.txt

          echo ""
          echo "===== LINUX DEPENDENCIES PREVIEW ====="

          head -n 100 \
            horizon-research/linux-dependencies.txt


      # ============================================================
      # 13. Inspeciona configure antes da tentativa
      # ============================================================

      - name: Inspect OpenJDK configure
        shell: bash
        run: |
          set -e

          echo ""
          echo "===== CONFIGURE HELP TARGET ====="

          cd openjdk21

          bash configure --help 2>/dev/null \
            | grep -i -E \
              'target|cross|toolchain|sysroot' \
            | head -n 100 \
            || true


      # ============================================================
      # 14. Configure exploratório
      #
      # Aqui esperamos encontrar a próxima barreira real.
      #
      # IMPORTANTE:
      # Esta etapa NÃO derruba o job caso configure falhe.
      # Queremos salvar o erro para analisar.
      # ============================================================

      - name: Probe OpenJDK configure
        shell: bash
        run: |
          set +e

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 | tee ../horizon-research/configure.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          echo ""
          echo "========================================"
          echo " OpenJDK configure exit code: $STATUS"
          echo "========================================"

          exit 0


      # ============================================================
      # 15. Analisa resultado
      # ============================================================

      - name: Analyze configure result
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v0.2"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Configure exit code:"

            cat \
              horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant configure messages:"
            echo ""

            grep -i -E \
              'error|unsupported|target|host|aarch64|linux|elf|sysroot|compiler|toolchain|boot jdk|bootjdk' \
              horizon-research/configure.log \
              | tail -n 300 \
              || true

          } > horizon-research/summary.txt

          echo ""
          echo "========================================"
          echo " SUMMARY"
          echo "========================================"

          cat horizon-research/summary.txt


      # ============================================================
      # 16. Coleta config.log
      # ============================================================

      - name: Collect OpenJDK config logs
        shell: bash
        run: |
          set -e

          find openjdk21 \
            -type f \
            \( \
              -name "config.log" \
              -o \
              -name "configure.log" \
            \) \
            -print \
            > horizon-research/config-files.txt \
            || true

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE_NAME=$(echo "$FILEPATH" | tr '/' '_')

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE_NAME"

            fi

          done < horizon-research/config-files.txt


      # ============================================================
      # 17. Resultado final
      # ============================================================

      - name: Final research result
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.2"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Arquivos coletados:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "IMPORTANTE:"
          echo "Esta ainda e uma build de pesquisa."
          echo "Ela nao gera Minecraft-NX.nro ainda."


      # ============================================================
      # 18. Artifact
      # ============================================================

      - name: Upload Horizon Research v0.2
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v0.2
          path: horizon-research
