name: OpenJDK Horizon Research v2.2

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:

      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v2.2"
          echo " Created by Farbert_Took"
          echo "========================================"

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e
          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          cat > horizon-research/info.txt <<'EOF'
          Minecraft-NX
          OpenJDK Horizon Research v2.2
          Created by Farbert_Took

          Target: Nintendo Switch Horizon
          Architecture: AArch64
          JVM: OpenJDK 21 HotSpot
          JVM variant: minimal
          Mode: headless

          Known passed milestones:
          - configure Horizon
          - JvmMapfile
          - MINECRAFT_NX_HORIZON propagation
          - global dlfcn.h blocker
          - globalDefinitions_gcc.hpp blocker

          v2.2 target:
          - c1_globals_horizon.hpp
          - detect next Horizon-specific header requirement
          EOF

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          test -f /opt/devkitpro/libnx/include/switch.h

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt

      - name: Test Horizon macro
        shell: bash
        run: |
          set -e

          cat > horizon-research/macro-test.cpp <<'EOF'
          #ifndef MINECRAFT_NX_HORIZON
          #error MINECRAFT_NX_HORIZON missing
          #endif

          #if MINECRAFT_NX_HORIZON != 1
          #error MINECRAFT_NX_HORIZON wrong
          #endif

          int minecraft_nx_horizon_test()
          {
              return MINECRAFT_NX_HORIZON;
          }
          EOF

          aarch64-none-elf-g++ \
            -march=armv8-a \
            -DMINECRAFT_NX_HORIZON=1 \
            -c \
            horizon-research/macro-test.cpp \
            -o horizon-research/macro-test.o

      # ============================================================
      # Boot JDK
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt

      # ============================================================
      # FreeType
      # ============================================================

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

      - name: Configure FreeType
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build
          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          echo "${PIPESTATUS[0]}" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0

      - name: Build FreeType
        shell: bash
        run: |
          set +e

          CONFIG=$(
            cat horizon-research/freetype-configure-exit.txt \
            2>/dev/null || echo 99
          )

          if [ "$CONFIG" != "0" ]; then
            echo 99 > horizon-research/freetype-build-exit.txt
            exit 0
          fi

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then
            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log
          fi

          exit 0

      - name: Validate FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | sed -n '1p'
          )

          if [ -z "$FREETYPE_LIB" ]; then
            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi

          FREETYPE_LIBDIR=$(dirname "$FREETYPE_LIB")

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"
          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" >> "$GITHUB_ENV"

          echo "FreeType: $FREETYPE_LIB"

      # ============================================================
      # OpenJDK
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt

      # ============================================================
      # OS mapping
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          existing = re.search(
              r'(?m)^([ \t]*)elf\)[ \t]*$',
              s
          )

          if existing:
              area = s[
                  existing.start():
                  min(len(s), existing.start() + 300)
              ]

              if "VAR_OS=horizon" in area:
                  print("elf -> horizon already present")
                  raise SystemExit(0)

              raise SystemExit(
                  "Existing elf OS case is unexpected"
              )

          error = re.search(
              r'unsupported operating system',
              s,
              re.I
          )

          if not error:
              raise SystemExit(
                  "Unsupported operating system marker not found"
              )

          before = s[:error.start()]

          matches = list(
              re.finditer(
                  r'(?m)^([ \t]*)\*\)[ \t]*$',
                  before
              )
          )

          if not matches:
              raise SystemExit(
                  "OS fallback not found"
              )

          m = matches[-1]
          indent = m.group(1)

          horizon = (
              f"{indent}elf)\n"
              f"{indent}  VAR_OS=horizon\n"
              f"{indent}  ;;\n"
          )

          s = (
              s[:m.start()]
              + horizon
              + s[m.start():]
          )

          p.write_text(s)

          print("elf -> horizon installed")
          PY

      # ============================================================
      # Configure dependency patches
      # ============================================================

      - name: Apply CUPS bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          for p in root.rglob("*.m4"):
              s = p.read_text(errors="ignore")

              if "Could not find cups" not in s:
                  continue

              pos = s.find("Could not find cups")
              start = s.rfind("\n", 0, pos) + 1
              end = s.find("\n", pos)

              if end < 0:
                  end = len(s)

              original = s[start:end]
              indent = original[
                  :len(original)-len(original.lstrip())
              ]

              replacement = (
                  indent +
                  'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n' +
                  indent +
                  '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n' +
                  indent +
                  '  CUPS_CFLAGS=""\n' +
                  indent +
                  '  CUPS_LIBS=""\n' +
                  indent +
                  'else\n' +
                  original + '\n' +
                  indent +
                  'fi'
              )

              p.write_text(
                  s[:start] + replacement + s[end:]
              )

              print("CUPS:", p)
              break
          else:
              raise SystemExit("CUPS check not found")
          PY

      - name: Apply Fontconfig bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          for p in root.rglob("*.m4"):
              s = p.read_text(errors="ignore")

              if "Could not find fontconfig" not in s:
                  continue

              pos = s.find("Could not find fontconfig")
              start = s.rfind("\n", 0, pos) + 1
              end = s.find("\n", pos)

              if end < 0:
                  end = len(s)

              original = s[start:end]
              indent = original[
                  :len(original)-len(original.lstrip())
              ]

              replacement = (
                  indent +
                  'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n' +
                  indent +
                  '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n' +
                  indent +
                  '  FONTCONFIG_CFLAGS=""\n' +
                  indent +
                  '  FONTCONFIG_LIBS=""\n' +
                  indent +
                  'else\n' +
                  original + '\n' +
                  indent +
                  'fi'
              )

              p.write_text(
                  s[:start] + replacement + s[end:]
              )

              print("Fontconfig:", p)
              break
          else:
              raise SystemExit(
                  "Fontconfig check not found"
              )
          PY

      - name: Add static FreeType detection
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/autoconf/lib-freetype.m4"
          )

          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit(
                  "FreeType expression not found exactly once"
              )

          p.write_text(
              s.replace(old, new, 1)
          )
          PY

      - name: Apply X11 bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          checks = [
              (
                  "Could not find X11 libraries",
                  "X11 libraries disabled for experimental Horizon headless target"
              ),
              (
                  "Could not find all X11 headers",
                  "X11 headers disabled for experimental Horizon headless target"
              ),
          ]

          for needle, warning in checks:
              found = False

              for p in root.rglob("*.m4"):
                  lines = p.read_text(
                      errors="ignore"
                  ).splitlines(True)

                  for i, line in enumerate(lines):
                      if (
                          needle not in line
                          or "AC_MSG_ERROR" not in line
                      ):
                          continue

                      indent = line[
                          :len(line)-len(line.lstrip())
                      ]

                      original = line.rstrip("\n")

                      lines[i] = (
                          indent +
                          'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n' +
                          indent +
                          '  AC_MSG_WARN([' + warning + '])\n' +
                          indent +
                          '  X_CFLAGS=""\n' +
                          indent +
                          '  X_LIBS=""\n' +
                          indent +
                          'else\n' +
                          original + '\n' +
                          indent +
                          'fi\n'
                      )

                      p.write_text(
                          "".join(lines)
                      )

                      found = True
                      break

                  if found:
                      break

              if not found:
                  raise SystemExit(
                      "X11 check not found: " + needle
                  )
          PY

      # ============================================================
      # Configure
      # ============================================================

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then
            echo 99 > horizon-research/configure-exit-code.txt
            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v2.2.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0

      - name: Locate spec.gmk
        shell: bash
        run: |
          set -e

          SPEC=$(
            find openjdk21/build \
              -type f \
              -name spec.gmk \
              | sed -n '1p'
          )

          test -n "$SPEC"

          echo "OPENJDK_SPEC=$SPEC" >> "$GITHUB_ENV"
          echo "$SPEC" > horizon-research/spec-path.txt

      - name: Inject Horizon macro
        shell: bash
        run: |
          set -e

          cat >> "$OPENJDK_SPEC" <<'EOF'

          # Minecraft-NX Horizon v2.2
          CFLAGS += -DMINECRAFT_NX_HORIZON=1
          CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EOF

      # ============================================================
      # JvmMapfile
      # ============================================================

      - name: Add Horizon JvmMapfile support
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/make/hotspot/lib/JvmMapfile.gmk"
          )

          s = p.read_text()

          if "isTargetOs, horizon" in s:
              raise SystemExit(0)

          marker = (
              'else ifeq ($(call isTargetOs, macosx), true)'
          )

          if marker not in s:
              raise SystemExit(
                  "JvmMapfile marker missing"
              )

          horizon = r'''else ifeq ($(call isTargetOs, horizon), true)
            # Minecraft-NX / Horizon
            DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only *$(OBJ_SUFFIX)
            ifneq ($(FILTER_SYMBOLS_PATTERN), )
              FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|
            endif
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)^_ZTV|^gHotSpotVM|^UseSharedSpaces$$
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|^_ZN9Arguments17SharedArchivePathE$$
            FILTER_SYMBOLS_AWK_SCRIPT := \
                '{ \
                  if ($$3 ~ /$(FILTER_SYMBOLS_PATTERN)/) print $$3; \
                }'

          '''

          p.write_text(
              s.replace(
                  marker,
                  horizon + marker,
                  1
              )
          )
          PY

      # ============================================================
      # dlfcn
      # ============================================================

      - name: Patch dlfcn for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          s = p.read_text()

          old = "#include <dlfcn.h>"

          if "MINECRAFT_NX_HORIZON" in s:
              print("dlfcn guard already present")
              raise SystemExit(0)

          if s.count(old) != 1:
              raise SystemExit(
                  "dlfcn include not found exactly once"
              )

          new = '''// Minecraft-NX / Horizon
          #if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif'''

          p.write_text(
              s.replace(old, new, 1)
          )
          PY

      # ============================================================
      # globalDefinitions
      # ============================================================

      - name: Patch globalDefinitions for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          s = p.read_text()

          needle = (
              '#error "missing platform-specific '
              'definition here"'
          )

          if needle not in s:
              raise SystemExit(
                  "globalDefinitions blocker not found"
              )

          replacement = '''#if defined(MINECRAFT_NX_HORIZON)
          // Minecraft-NX / Nintendo Switch Horizon / AArch64
          #define DEFAULT_CACHE_LINE_SIZE 64
          #else
          #error "missing platform-specific definition here"
          #endif'''

          p.write_text(
              s.replace(
                  needle,
                  replacement,
                  1
              )
          )

          print(
              "globalDefinitions Horizon branch installed"
          )
          PY

      # ============================================================
      # v2.2 C1 research
      # ============================================================

      - name: Research C1 platform headers
        shell: bash
        run: |
          set -e

          OUT="horizon-research/c1-platform-research-v2.2.txt"

          echo "========================================" > "$OUT"
          echo " Minecraft-NX C1 Platform Research v2.2" >> "$OUT"
          echo " Created by Farbert_Took" >> "$OUT"
          echo "========================================" >> "$OUT"
          echo "" >> "$OUT"

          echo "===== c1_globals files =====" >> "$OUT"

          find openjdk21/src/hotspot \
            -type f \
            -name 'c1_globals_*.hpp' \
            -print \
            | sort \
            >> "$OUT"

          echo "" >> "$OUT"
          echo "===== CONTENT =====" >> "$OUT"

          while IFS= read -r FILE
          do
            echo "" >> "$OUT"
            echo "----------------------------------------" >> "$OUT"
            echo "$FILE" >> "$OUT"
            echo "----------------------------------------" >> "$OUT"

            cat "$FILE" >> "$OUT"

          done < <(
            find openjdk21/src/hotspot \
              -type f \
              -name 'c1_globals_*.hpp' \
              -print \
              | sort
          )

          cat "$OUT"

      # ============================================================
      # v2.2:
      # Generate Horizon C1 platform header from the generic POSIX
      # C1 definition if available.
      #
      # We deliberately do NOT call Horizon "linux".
      # ============================================================

      - name: Create c1_globals_horizon.hpp
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/src/hotspot")

          candidates = list(
              root.rglob("c1_globals_*.hpp")
          )

          candidates = [
              p for p in candidates
              if p.name != "c1_globals_horizon.hpp"
          ]

          print("Available C1 platform headers:")

          for p in candidates:
              print(" ", p)

          # Prefer the POSIX implementation if OpenJDK provides one.
          posix = [
              p for p in candidates
              if p.name == "c1_globals_posix.hpp"
          ]

          if posix:
              source = posix[0]
              strategy = "posix"

          else:
              # Current OpenJDK trees commonly place this definition
              # under OS-specific directories. For our experimental
              # Horizon port, Linux is useful only as a structural
              # reference because both builds use GCC/AArch64.
              #
              # We copy the declarations/defaults into a distinct
              # Horizon header. This does NOT define __linux__ and
              # does NOT make OPENJDK_TARGET_OS Linux.
              linux = [
                  p for p in candidates
                  if p.name == "c1_globals_linux.hpp"
              ]

              if not linux:
                  raise SystemExit(
                      "Neither c1_globals_posix.hpp nor "
                      "c1_globals_linux.hpp exists. "
                      "See c1-platform-research-v2.2.txt."
                  )

              source = linux[0]
              strategy = "linux-structural-reference"

          content = source.read_text()

          # OS_HEADER(c1_globals) searches include paths using the
          # generated Horizon suffix. Put the file in os/horizon.
          target_dir = root / "os" / "horizon"
          target_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          target = (
              target_dir /
              "c1_globals_horizon.hpp"
          )

          banner = '''/*
           * Minecraft-NX
           * OpenJDK Horizon experimental port
           * Created by Farbert_Took
           *
           * Horizon C1 platform defaults.
           *
           * Initial definition derived from the nearest upstream
           * GCC/POSIX platform structure. Horizon remains a distinct
           * OpenJDK target and is not defined as Linux.
           */

          '''

          # Rename include guard references if the source contains
          # an OS-specific guard.
          content = content.replace(
              "CPU_HEADER_HOTSPOT_OS_LINUX_C1_GLOBALS_LINUX_HPP",
              "CPU_HEADER_HOTSPOT_OS_HORIZON_C1_GLOBALS_HORIZON_HPP"
          )

          content = content.replace(
              "OS_LINUX_C1_GLOBALS_LINUX_HPP",
              "OS_HORIZON_C1_GLOBALS_HORIZON_HPP"
          )

          target.write_text(
              banner + content
          )

          Path(
              "horizon-research/"
              "c1-horizon-strategy-v2.2.txt"
          ).write_text(
              "Source: "
              + str(source)
              + "\nStrategy: "
              + strategy
              + "\nTarget: "
              + str(target)
              + "\n"
          )

          print("")
          print("C1 Horizon header created")
          print("Source:", source)
          print("Strategy:", strategy)
          print("Target:", target)
          PY

          cat \
            horizon-research/c1-horizon-strategy-v2.2.txt

          echo ""
          echo "===== c1_globals_horizon.hpp ====="

          sed -n '1,160p' \
            openjdk21/src/hotspot/os/horizon/c1_globals_horizon.hpp

      # ============================================================
      # IMPORTANT:
      # HotSpot's generated include search must see os/horizon.
      # ============================================================

      - name: Add Horizon HotSpot include directory
        shell: bash
        run: |
          set -e

          cat >> "$OPENJDK_SPEC" <<'EOF'

          # Minecraft-NX v2.2 Horizon HotSpot OS headers
          JVM_CFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon
          JVM_CXXFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon
          EXTRA_CFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon
          EXTRA_CXXFLAGS += -I$(TOPDIR)/src/hotspot/os/horizon
          EOF

          echo "Horizon HotSpot include path added"

      # ============================================================
      # Save patch
      # ============================================================

      - name: Save OpenJDK Horizon patch
        shell: bash
        run: |
          set +e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v2.2.patch

          find \
            openjdk21/src/hotspot/os/horizon \
            -maxdepth 2 \
            -type f \
            -print \
            > horizon-research/horizon-files-v2.2.txt \
            2>/dev/null \
            || true

          exit 0

      # ============================================================
      # HotSpot build
      # ============================================================

      - name: Probe HotSpot build v2.2
        shell: bash
        run: |
          set +e

          CONFIG=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null || echo 99
          )

          if [ "$CONFIG" != "0" ]; then
            echo 99 > horizon-research/hotspot-exit-code.txt
            exit 0
          fi

          cd openjdk21

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " HOTSPOT PROBE v2.2"
          echo " Created by Farbert_Took"
          echo "========================================"
          echo ""

          make \
            LOG=trace \
            hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v2.2.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          exit 0

      - name: Capture HotSpot tail
        shell: bash
        run: |
          set +e

          tail \
            -n 250 \
            horizon-research/hotspot-build-v2.2.log \
            > horizon-research/hotspot-last-250-v2.2.txt \
            2>/dev/null \
            || true

          exit 0

      # ============================================================
      # Milestones
      # ============================================================

      - name: Verify milestones
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v2.2.log"

          if grep -q \
            -- '-DMINECRAFT_NX_HORIZON=1' \
            "$LOG"
          then
            echo YES > horizon-research/macro-result.txt
          else
            echo NO > horizon-research/macro-result.txt
          fi

          if grep -Fq \
            'fatal error: dlfcn.h: No such file or directory' \
            "$LOG"
          then
            echo PRESENT > horizon-research/dlfcn-result.txt
          else
            echo PASSED > horizon-research/dlfcn-result.txt
          fi

          if grep -Fq \
            '#error "missing platform-specific definition here"' \
            "$LOG"
          then
            echo PRESENT > horizon-research/globaldefinitions-result.txt
          else
            echo PASSED > horizon-research/globaldefinitions-result.txt
          fi

          if grep -Fq \
            'fatal error: c1_globals_horizon.hpp: No such file or directory' \
            "$LOG"
          then
            echo PRESENT > horizon-research/c1-result.txt
          else
            echo PASSED > horizon-research/c1-result.txt
          fi

          exit 0

      # ============================================================
      # Detect missing Horizon headers
      # ============================================================

      - name: Detect missing Horizon headers
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path(
              "horizon-research/hotspot-build-v2.2.log"
          )

          out = Path(
              "horizon-research/"
              "missing-horizon-headers-v2.2.txt"
          )

          if not log.exists():
              out.write_text(
                  "HotSpot log unavailable.\n"
              )
              raise SystemExit(0)

          text = log.read_text(
              errors="replace"
          )

          names = []

          patterns = [
              r'fatal error:\s*([^:\s]*_horizon\.hpp):\s*No such file or directory',
              r'fatal error:\s*([^:\s]*horizon[^:\s]*\.hpp):\s*No such file or directory',
          ]

          for pattern in patterns:
              for match in re.findall(
                  pattern,
                  text,
                  re.I
              ):
                  if match not in names:
                      names.append(match)

          if not names:
              out.write_text(
                  "None detected.\n"
              )
          else:
              out.write_text(
                  "\n".join(names) + "\n"
              )
          PY

          cat \
            horizon-research/missing-horizon-headers-v2.2.txt

          exit 0

      # ============================================================
      # Main diagnostic
      # ============================================================

      - name: Analyze HotSpot failure
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path(
              "horizon-research/hotspot-build-v2.2.log"
          )

          out = Path(
              "horizon-research/diagnostic-v2.2.txt"
          )

          if not log.exists():
              out.write_text(
                  "HotSpot log unavailable.\n"
              )
              raise SystemExit(0)

          lines = log.read_text(
              errors="replace"
          ).splitlines()

          patterns = [
              (
                  "FATAL COMPILER ERROR",
                  re.compile(
                      r"fatal error:",
                      re.I
                  )
              ),
              (
                  "PREPROCESSOR ERROR",
                  re.compile(
                      r"error:\s*#error",
                      re.I
                  )
              ),
              (
                  "COMPILER ERROR",
                  re.compile(
                      r"(^|[\s:])error:",
                      re.I
                  )
              ),
              (
                  "MISSING FILE",
                  re.compile(
                      r"No such file or directory",
                      re.I
                  )
              ),
              (
                  "UNDEFINED REFERENCE",
                  re.compile(
                      r"undefined reference",
                      re.I
                  )
              ),
              (
                  "MAKE FAILURE",
                  re.compile(
                      r"(?:^|\s)g?make"
                      r"(?:\[[0-9]+\])?: "
                      r"\*\*\*",
                      re.I
                  )
              ),
              (
                  "NO RULE",
                  re.compile(
                      r"No rule to make target",
                      re.I
                  )
              ),
              (
                  "UNKNOWN TARGET OS",
                  re.compile(
                      r"Unknown target OS",
                      re.I
                  )
              ),
              (
                  "LINKER ERROR",
                  re.compile(
                      r"(collect2:|ld:).*error",
                      re.I
                  )
              ),
          ]

          matches = []

          for i, line in enumerate(lines):
              for label, regex in patterns:
                  if regex.search(line):
                      matches.append(
                          (i, label, line)
                      )
                      break

          result = [
              "========================================",
              " Minecraft-NX",
              " HOTSPOT DIAGNOSTIC v2.2",
              " Created by Farbert_Took",
              "========================================",
              "",
          ]

          if not matches:
              result += [
                  "No standard failure detected.",
                  "",
                  "Inspect LAST 250 LINES.",
              ]

          else:
              index, label, line = matches[0]

              result += [
                  f"FIRST FAILURE TYPE: {label}",
                  f"FIRST FAILURE LINE: {index + 1}",
                  "",
                  "===== CONTEXT =====",
                  "",
              ]

              start = max(
                  0,
                  index - 18
              )

              end = min(
                  len(lines),
                  index + 45
              )

              for n in range(start, end):
                  result.append(
                      f"{n + 1}: {lines[n]}"
                  )

              result += [
                  "",
                  "===== DETECTED FAILURES =====",
                  "",
              ]

              for index, label, line in matches[:60]:
                  result.append(
                      f"{index + 1}: "
                      f"[{label}] {line}"
                  )

          out.write_text(
              "\n".join(result) + "\n"
          )
          PY

          exit 0

      - name: Scan missing headers
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E \
            'fatal error: .*: No such file or directory' \
            horizon-research/hotspot-build-v2.2.log \
            > horizon-research/missing-headers-v2.2.txt \
            || true

          exit 0

      - name: Scan compiler linker errors
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E \
            'fatal error:|(^|[[:space:]:])error:|undefined reference|collect2:|ld: .*error' \
            horizon-research/hotspot-build-v2.2.log \
            > horizon-research/compiler-errors-v2.2.txt \
            || true

          exit 0

      - name: Scan make failures
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E \
            '(^|[[:space:]])g?make(\[[0-9]+\])?: \*\*\*|\*\*\*.*Error [0-9]+|No rule to make target' \
            horizon-research/hotspot-build-v2.2.log \
            > horizon-research/make-failures-v2.2.txt \
            || true

          exit 0

      - name: Collect OpenJDK failure logs
        shell: bash
        run: |
          set +e

          ROOT="openjdk21/build/horizon-aarch64-minimal-release/make-support/failure-logs"

          mkdir -p horizon-research/failure-logs

          if [ -d "$ROOT" ]; then
            find "$ROOT" \
              -type f \
              -print \
              > horizon-research/failure-log-files-v2.2.txt

            cp -R \
              "$ROOT"/. \
              horizon-research/failure-logs/ \
              2>/dev/null \
              || true
          fi

          exit 0

      # ============================================================
      # Compact result
      # ============================================================

      - name: Compact result
        shell: bash
        run: |
          set +e

          CONFIG=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null || echo unknown
          )

          HOTSPOT=$(
            cat horizon-research/hotspot-exit-code.txt \
            2>/dev/null || echo unknown
          )

          MACRO=$(
            cat horizon-research/macro-result.txt \
            2>/dev/null || echo unknown
          )

          DLFCN=$(
            cat horizon-research/dlfcn-result.txt \
            2>/dev/null || echo unknown
          )

          GLOBALDEF=$(
            cat horizon-research/globaldefinitions-result.txt \
            2>/dev/null || echo unknown
          )

          C1=$(
            cat horizon-research/c1-result.txt \
            2>/dev/null || echo unknown
          )

          echo ""
          echo "========================================"
          echo " Minecraft-NX v2.2 COMPACT RESULT"
          echo " Created by Farbert_Took"
          echo "========================================"
          echo ""

          echo "Configure: $CONFIG"
          echo "HotSpot: $HOTSPOT"
          echo "Macro Horizon: $MACRO"
          echo "dlfcn.h blocker: $DLFCN"
          echo "globalDefinitions blocker: $GLOBALDEF"
          echo "c1_globals_horizon blocker: $C1"

          echo ""
          echo "===== MISSING HORIZON HEADERS ====="
          echo ""

          cat \
            horizon-research/missing-horizon-headers-v2.2.txt \
            2>/dev/null \
            || true

          echo ""
          echo "===== DIAGNOSTIC ====="
          echo ""

          sed -n '1,120p' \
            horizon-research/diagnostic-v2.2.txt \
            2>/dev/null \
            || true

          echo ""
          echo "===== MISSING HEADERS ====="
          echo ""

          if [ -s \
            horizon-research/missing-headers-v2.2.txt \
          ]; then
            sed -n '1,40p' \
              horizon-research/missing-headers-v2.2.txt
          else
            echo "None detected."
          fi

          echo ""
          echo "===== COMPILER / LINKER ERRORS ====="
          echo ""

          if [ -s \
            horizon-research/compiler-errors-v2.2.txt \
          ]; then
            sed -n '1,60p' \
              horizon-research/compiler-errors-v2.2.txt
          else
            echo "None detected."
          fi

          echo ""
          echo "===== MAKE FAILURES ====="
          echo ""

          if [ -s \
            horizon-research/make-failures-v2.2.txt \
          ]; then
            sed -n '1,50p' \
              horizon-research/make-failures-v2.2.txt
          else
            echo "None detected."
          fi

          echo ""
          echo "========================================"
          echo " END Minecraft-NX v2.2"
          echo "========================================"

          exit 0

      - name: Upload Horizon Research v2.2
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v2.2
          path: horizon-research
