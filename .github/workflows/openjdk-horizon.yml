name: OpenJDK Horizon Research v2.0

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk
      FREETYPE_PREFIX: /opt/horizon-libs/freetype

    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            ninja-build \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v2.0"
          echo " Created by Farbert_Took"
          echo "========================================"

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e
          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          rm -rf /opt/horizon-libs
          mkdir -p "$FREETYPE_PREFIX"

          cat > horizon-research/info.txt <<'EOF'
          Minecraft-NX
          OpenJDK Horizon Research v2.0
          Created by Farbert_Took

          Target: Nintendo Switch Horizon
          CPU: AArch64
          JVM: OpenJDK 21 HotSpot minimal
          Mode: headless
          EOF

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
          test -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          test -f /opt/devkitpro/libnx/include/switch.h

          aarch64-none-elf-gcc --version \
            | tee horizon-research/gcc-version.txt

          aarch64-none-elf-g++ --version \
            | tee horizon-research/gxx-version.txt

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt

      - name: Clone FreeType
        shell: bash
        run: |
          set -e

          rm -rf freetype-src

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            freetype-src

      - name: Configure FreeType for Horizon
        shell: bash
        run: |
          set +e

          rm -rf freetype-build
          mkdir freetype-build
          cd freetype-build

          cmake \
            ../freetype-src \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -DCMAKE_AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            -DCMAKE_RANLIB=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ranlib \
            -DCMAKE_INSTALL_PREFIX="$FREETYPE_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="-march=armv8-a -D__SWITCH__ -I/opt/devkitpro/libnx/include" \
            2>&1 \
            | tee ../horizon-research/freetype-configure.log

          echo "${PIPESTATUS[0]}" \
            > ../horizon-research/freetype-configure-exit.txt

          exit 0

      - name: Build FreeType for Horizon
        shell: bash
        run: |
          set +e

          cd freetype-build

          ninja \
            2>&1 \
            | tee ../horizon-research/freetype-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/freetype-build-exit.txt

          if [ "$STATUS" = "0" ]; then
            ninja install \
              2>&1 \
              | tee ../horizon-research/freetype-install.log
          fi

          exit 0

      - name: Validate Horizon FreeType
        shell: bash
        run: |
          set +e

          FREETYPE_LIB=$(
            find "$FREETYPE_PREFIX" \
              -type f \
              -name 'libfreetype.a' \
              | sed -n '1p'
          )

          if [ -z "$FREETYPE_LIB" ]; then
            echo "FREETYPE_READY=no" >> "$GITHUB_ENV"
            echo "libfreetype.a NOT FOUND"
            exit 0
          fi

          FREETYPE_LIBDIR=$(dirname "$FREETYPE_LIB")

          echo "FREETYPE_READY=yes" >> "$GITHUB_ENV"
          echo "FREETYPE_LIB=$FREETYPE_LIB" >> "$GITHUB_ENV"
          echo "FREETYPE_LIBDIR=$FREETYPE_LIBDIR" >> "$GITHUB_ENV"

          echo "FreeType: $FREETYPE_LIB"

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          fallback = '''*)
              AC_MSG_ERROR([unsupported operating system $1])
              ;;'''

          insertion = '''elf)
              VAR_OS=horizon
              ;;
          '''

          if fallback not in s:
              raise SystemExit("OS fallback not found")

          s = s.replace(
              fallback,
              insertion + fallback,
              1
          )

          p.write_text(s)
          print("elf -> horizon mapping installed")
          PY

      - name: Apply Horizon CUPS bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          for p in root.rglob("*.m4"):
              s = p.read_text(errors="ignore")

              if "Could not find cups" not in s:
                  continue

              pos = s.find("Could not find cups")
              start = s.rfind("\n", 0, pos) + 1
              end = s.find("\n", pos)

              if end < 0:
                  end = len(s)

              original = s[start:end]
              indent = original[:len(original)-len(original.lstrip())]

              replacement = (
                  indent +
                  'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n' +
                  indent +
                  '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n' +
                  indent +
                  '  CUPS_CFLAGS=""\n' +
                  indent +
                  '  CUPS_LIBS=""\n' +
                  indent +
                  'else\n' +
                  original + '\n' +
                  indent +
                  'fi'
              )

              s = s[:start] + replacement + s[end:]
              p.write_text(s)

              print("CUPS bypass:", p)
              break
          else:
              raise SystemExit("CUPS check not found")
          PY

      - name: Apply Horizon Fontconfig bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          for p in root.rglob("*.m4"):
              s = p.read_text(errors="ignore")

              if "Could not find fontconfig" not in s:
                  continue

              pos = s.find("Could not find fontconfig")
              start = s.rfind("\n", 0, pos) + 1
              end = s.find("\n", pos)

              if end < 0:
                  end = len(s)

              original = s[start:end]
              indent = original[:len(original)-len(original.lstrip())]

              replacement = (
                  indent +
                  'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n' +
                  indent +
                  '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n' +
                  indent +
                  '  FONTCONFIG_CFLAGS=""\n' +
                  indent +
                  '  FONTCONFIG_LIBS=""\n' +
                  indent +
                  'else\n' +
                  original + '\n' +
                  indent +
                  'fi'
              )

              s = s[:start] + replacement + s[end:]
              p.write_text(s)

              print("Fontconfig bypass:", p)
              break
          else:
              raise SystemExit("Fontconfig check not found")
          PY

      - name: Add static FreeType detection
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/lib-freetype.m4")
          s = p.read_text()

          old = '''    FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"'''

          new = '''    if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}.a"
              AC_MSG_NOTICE([Horizon target: using static FreeType library $FREETYPE_LIB_NAME])
            else
              FREETYPE_LIB_NAME="${LIBRARY_PREFIX}${FREETYPE_BASE_NAME}${SHARED_LIBRARY_SUFFIX}"
            fi'''

          if s.count(old) != 1:
              raise SystemExit("FreeType expression not found exactly once")

          p.write_text(s.replace(old, new, 1))
          print("Static FreeType Horizon patch installed")
          PY

      - name: Apply Horizon X11 bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")

          checks = [
              (
                  "Could not find X11 libraries",
                  "X11 libraries disabled for experimental Horizon headless target"
              ),
              (
                  "Could not find all X11 headers",
                  "X11 headers disabled for experimental Horizon headless target"
              ),
          ]

          for needle, warning in checks:
              found = False

              for p in root.rglob("*.m4"):
                  lines = p.read_text(errors="ignore").splitlines(True)

                  for i, line in enumerate(lines):
                      if needle not in line or "AC_MSG_ERROR" not in line:
                          continue

                      indent = line[:len(line)-len(line.lstrip())]
                      original = line.rstrip("\n")

                      lines[i] = (
                          indent +
                          'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n' +
                          indent +
                          '  AC_MSG_WARN([' + warning + '])\n' +
                          indent +
                          '  X_CFLAGS=""\n' +
                          indent +
                          '  X_LIBS=""\n' +
                          indent +
                          'else\n' +
                          original + '\n' +
                          indent +
                          'fi\n'
                      )

                      p.write_text("".join(lines))
                      found = True
                      break

                  if found:
                      break

              if not found:
                  raise SystemExit("X11 check not found: " + needle)

          print("X11 Horizon bypass installed")
          PY

      - name: Configure OpenJDK Horizon
        shell: bash
        run: |
          set +e

          if [ "$FREETYPE_READY" != "yes" ]; then
            echo "99" > horizon-research/configure-exit-code.txt
            exit 0
          fi

          cd openjdk21

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            --enable-headless-only=yes \
            --with-jvm-variants=minimal \
            --with-freetype=system \
            --with-freetype-include="$FREETYPE_PREFIX/include/freetype2" \
            --with-freetype-lib="$FREETYPE_LIBDIR" \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v2.0.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          exit 0

      - name: Locate OpenJDK spec.gmk
        shell: bash
        run: |
          set -e

          SPEC=$(
            find openjdk21/build \
              -type f \
              -name spec.gmk \
              | sed -n '1p'
          )

          test -n "$SPEC"

          echo "OPENJDK_SPEC=$SPEC" >> "$GITHUB_ENV"
          echo "$SPEC" > horizon-research/spec-path-v2.0.txt

      - name: Inject Minecraft-NX Horizon macro
        shell: bash
        run: |
          set -e

          cat >> "$OPENJDK_SPEC" <<'EOF'

          # Minecraft-NX Horizon v2.0 compiler identity
          CFLAGS += -DMINECRAFT_NX_HORIZON=1
          CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          EXTRA_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CFLAGS += -DMINECRAFT_NX_HORIZON=1
          JVM_CXXFLAGS += -DMINECRAFT_NX_HORIZON=1
          EOF

          grep \
            -n \
            'MINECRAFT_NX_HORIZON' \
            "$OPENJDK_SPEC" \
            | tee horizon-research/spec-macro-v2.0.txt

      - name: Add Horizon support to JvmMapfile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/hotspot/lib/JvmMapfile.gmk")
          s = p.read_text()

          marker = 'else ifeq ($(call isTargetOs, macosx), true)'

          if marker not in s:
              raise SystemExit("macOS JvmMapfile branch not found")

          if "isTargetOs, horizon" in s:
              raise SystemExit("Horizon branch already exists")

          horizon = r'''else ifeq ($(call isTargetOs, horizon), true)
            # Minecraft-NX / Horizon
            # AArch64 ELF objects generated by devkitA64.
            DUMP_SYMBOLS_CMD := $(NM) $(NMFLAGS) --defined-only *$(OBJ_SUFFIX)
            ifneq ($(FILTER_SYMBOLS_PATTERN), )
              FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|
            endif
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)^_ZTV|^gHotSpotVM|^UseSharedSpaces$$
            FILTER_SYMBOLS_PATTERN := $(FILTER_SYMBOLS_PATTERN)|^_ZN9Arguments17SharedArchivePathE$$
            FILTER_SYMBOLS_AWK_SCRIPT := \
                '{ \
                  if ($$3 ~ /$(FILTER_SYMBOLS_PATTERN)/) print $$3; \
                }'

          '''

          p.write_text(
              s.replace(
                  marker,
                  horizon + marker,
                  1
              )
          )

          print("JvmMapfile Horizon branch installed")
          PY

      - name: Disable global dlfcn include for Horizon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "openjdk21/src/hotspot/share/"
              "utilities/globalDefinitions_gcc.hpp"
          )

          s = p.read_text()

          old = "#include <dlfcn.h>"

          if s.count(old) != 1:
              raise SystemExit(
                  "Expected exactly one dlfcn.h include"
              )

          new = '''// Minecraft-NX / Horizon
          // Horizon does not provide the POSIX dlfcn interface.
          #if !defined(MINECRAFT_NX_HORIZON)
          #include <dlfcn.h>
          #endif'''

          p.write_text(s.replace(old, new, 1))

          print("dlfcn.h Horizon guard installed")
          PY

      - name: Save OpenJDK Horizon patch
        shell: bash
        run: |
          set +e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v2.0.patch

          exit 0

      - name: Probe HotSpot build v2.0
        shell: bash
        run: |
          set +e

          CONFIG_STATUS=$(
            cat horizon-research/configure-exit-code.txt
          )

          if [ "$CONFIG_STATUS" != "0" ]; then
            echo "99" > horizon-research/hotspot-exit-code.txt
            exit 0
          fi

          cd openjdk21

          echo "========================================"
          echo " Minecraft-NX"
          echo " HOTSPOT PROBE v2.0"
          echo " Created by Farbert_Took"
          echo "========================================"

          make \
            LOG=trace \
            hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v2.0.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          exit 0

      - name: Capture last 200 HotSpot lines
        shell: bash
        run: |
          set +e

          tail \
            -n 200 \
            horizon-research/hotspot-build-v2.0.log \
            > horizon-research/hotspot-last-200-v2.0.txt

          exit 0

      - name: Verify Horizon macro
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v2.0.log"

          if grep -q \
            -- '-DMINECRAFT_NX_HORIZON=1' \
            "$LOG"
          then
            echo "YES" \
              > horizon-research/macro-result-v2.0.txt
          else
            echo "NO" \
              > horizon-research/macro-result-v2.0.txt
          fi

          exit 0

      - name: Verify dlfcn blocker
        shell: bash
        run: |
          set +e

          LOG="horizon-research/hotspot-build-v2.0.log"

          if grep -Fq \
            'fatal error: dlfcn.h: No such file or directory' \
            "$LOG"
          then
            echo "PRESENT" \
              > horizon-research/dlfcn-result-v2.0.txt
          else
            echo "PASSED" \
              > horizon-research/dlfcn-result-v2.0.txt
          fi

          exit 0

      - name: Analyze HotSpot failure v2.0
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path(
              "horizon-research/hotspot-build-v2.0.log"
          )

          out = Path(
              "horizon-research/diagnostic-v2.0.txt"
          )

          if not log.exists():
              out.write_text("HotSpot log not found.\n")
              raise SystemExit(0)

          lines = log.read_text(
              errors="replace"
          ).splitlines()

          patterns = [
              (
                  "FATAL COMPILER ERROR",
                  re.compile(
                      r"fatal error:",
                      re.I
                  )
              ),
              (
                  "COMPILER ERROR",
                  re.compile(
                      r"(^|[\s:])error:",
                      re.I
                  )
              ),
              (
                  "MISSING FILE",
                  re.compile(
                      r"No such file or directory",
                      re.I
                  )
              ),
              (
                  "UNDEFINED REFERENCE",
                  re.compile(
                      r"undefined reference",
                      re.I
                  )
              ),
              (
                  "MAKE FAILURE",
                  re.compile(
                      r"(?:^|\s)g?make(?:\[[0-9]+\])?: \*\*\*",
                      re.I
                  )
              ),
              (
                  "MAKE ERROR",
                  re.compile(
                      r"\*\*\*.*Error [0-9]+",
                      re.I
                  )
              ),
              (
                  "NO RULE",
                  re.compile(
                      r"No rule to make target",
                      re.I
                  )
              ),
              (
                  "UNKNOWN TARGET OS",
                  re.compile(
                      r"Unknown target OS",
                      re.I
                  )
              ),
              (
                  "LINKER ERROR",
                  re.compile(
                      r"(collect2:|ld:).*error",
                      re.I
                  )
              ),
          ]

          matches = []

          for i, line in enumerate(lines):
              for label, regex in patterns:
                  if regex.search(line):
                      matches.append(
                          (i, label, line)
                      )
                      break

          result = []

          result += [
              "========================================",
              " Minecraft-NX",
              " HOTSPOT DIAGNOSTIC v2.0",
              " Created by Farbert_Took",
              "========================================",
              "",
          ]

          if not matches:
              result += [
                  "No standard failure pattern detected.",
                  "",
                  "The last 200 build lines are the primary diagnostic.",
              ]

          else:
              index, label, line = matches[0]

              result += [
                  f"FIRST FAILURE TYPE: {label}",
                  f"FIRST FAILURE LINE: {index + 1}",
                  "",
                  "===== CONTEXT =====",
                  "",
              ]

              start = max(0, index - 15)
              end = min(len(lines), index + 35)

              for n in range(start, end):
                  result.append(
                      f"{n + 1}: {lines[n]}"
                  )

              result += [
                  "",
                  "===== DETECTED FAILURES =====",
                  "",
              ]

              for index, label, line in matches[:50]:
                  result.append(
                      f"{index + 1}: [{label}] {line}"
                  )

          out.write_text(
              "\n".join(result) + "\n"
          )
          PY

          cat horizon-research/diagnostic-v2.0.txt

          exit 0

      - name: Scan missing headers
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E 'fatal error: .*: No such file or directory' \
            horizon-research/hotspot-build-v2.0.log \
            > horizon-research/missing-headers-v2.0.txt \
            || true

          exit 0

      - name: Scan compiler linker errors
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E 'fatal error:|(^|[[:space:]:])error:|undefined reference|collect2:|ld: .*error' \
            horizon-research/hotspot-build-v2.0.log \
            > horizon-research/compiler-errors-v2.0.txt \
            || true

          exit 0

      - name: Scan make failures
        shell: bash
        run: |
          set +e

          grep \
            -n \
            -E '(^|[[:space:]])g?make(\[[0-9]+\])?: \*\*\*|\*\*\*.*Error [0-9]+|No rule to make target' \
            horizon-research/hotspot-build-v2.0.log \
            > horizon-research/make-failures-v2.0.txt \
            || true

          exit 0

      - name: Compact result
        shell: bash
        run: |
          set +e

          CONFIG=$(
            cat horizon-research/configure-exit-code.txt \
            2>/dev/null || echo "unknown"
          )

          HOTSPOT=$(
            cat horizon-research/hotspot-exit-code.txt \
            2>/dev/null || echo "unknown"
          )

          MACRO=$(
            cat horizon-research/macro-result-v2.0.txt \
            2>/dev/null || echo "unknown"
          )

          DLFCN=$(
            cat horizon-research/dlfcn-result-v2.0.txt \
            2>/dev/null || echo "unknown"
          )

          echo ""
          echo "========================================"
          echo " Minecraft-NX v2.0 COMPACT RESULT"
          echo " Created by Farbert_Took"
          echo "========================================"
          echo ""
          echo "Configure: $CONFIG"
          echo "HotSpot: $HOTSPOT"
          echo "Macro Horizon: $MACRO"
          echo "dlfcn.h: $DLFCN"

          echo ""
          echo "===== DIAGNOSTIC ====="
          echo ""

          sed -n '1,90p' \
            horizon-research/diagnostic-v2.0.txt \
            2>/dev/null || true

          echo ""
          echo "===== MISSING HEADERS ====="
          echo ""

          if [ -s horizon-research/missing-headers-v2.0.txt ]; then
            sed -n '1,30p' \
