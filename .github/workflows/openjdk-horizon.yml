name: OpenJDK Horizon Research v0.8

on:
  workflow_dispatch:

jobs:
  openjdk-horizon:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      BOOT_JDK: /opt/bootjdk

    steps:

      # ============================================================
      # Minecraft-NX
      # OpenJDK Horizon Research v0.8
      # Created by Farbert_Took
      #
      # NOVA ESTRATEGIA:
      #
      #   Horizon/AArch64
      #        +
      #   Headless
      #        +
      #   HotSpot minimal
      #
      # Objetivo:
      #
      # Descobrir ate onde o OpenJDK 21 consegue configurar uma
      # JVM minima para Horizon antes de realmente precisarmos criar:
      #
      #   src/hotspot/os/horizon
      #   src/hotspot/os_cpu/horizon_aarch64
      #
      # IMPORTANTE:
      #
      # Nao estamos tentando fazer java.desktop funcionar.
      # Nao estamos linkando bibliotecas Linux no Switch.
      # Nao esperamos gerar um NRO nesta versao.
      # ============================================================


      # ============================================================
      # 1. Dependencias do BUILD HOST
      # ============================================================

      - name: Install build host tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            git \
            bash \
            autoconf \
            make \
            zip \
            unzip \
            file \
            python3 \
            build-essential \
            ca-certificates \
            curl \
            wget \
            tar \
            gzip \
            grep \
            sed \
            gawk \
            pkg-config

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.8"
          echo " Created by Farbert_Took"
          echo "========================================"


      # ============================================================
      # 2. PATH devkitA64
      # ============================================================

      - name: Configure devkitA64 PATH
        shell: bash
        run: |
          set -e

          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. Toolchain
      # ============================================================

      - name: Verify devkitA64
        shell: bash
        run: |
          set -e

          GCC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
          GXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++

          test -x "$GCC"
          test -x "$GXX"

          echo "===== GCC ====="
          "$GCC" --version

          echo ""
          echo "===== G++ ====="
          "$GXX" --version


      # ============================================================
      # 4. Research directory
      # ============================================================

      - name: Prepare research directory
        shell: bash
        run: |
          set -e

          rm -rf horizon-research
          mkdir -p horizon-research

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Research v0.8"
            echo "Created by Farbert_Took"
            echo ""
            echo "Target:"
            echo "Horizon OS / Nintendo Switch / AArch64"
            echo ""
            echo "Research configuration:"
            echo "Headless + HotSpot minimal"
          } > horizon-research/info.txt


      # ============================================================
      # 5. Confirma compilacao Horizon/libnx
      # ============================================================

      - name: Verify Horizon compilation
        shell: bash
        run: |
          set -e

          cat > horizon-research/horizon_test.c <<'EOF'
          #include <switch.h>

          int minecraft_nx_horizon_test(void)
          {
              u64 java_version = 21;
              return (int)java_version;
          }
          EOF

          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a \
            -D__SWITCH__ \
            -I/opt/devkitpro/libnx/include \
            -c \
            horizon-research/horizon_test.c \
            -o horizon-research/horizon_test.o

          file horizon-research/horizon_test.o \
            | tee horizon-research/horizon-object.txt


      # ============================================================
      # 6. Boot JDK
      # ============================================================

      - name: Download Boot JDK 20
        shell: bash
        run: |
          set -e

          rm -rf "$BOOT_JDK"
          mkdir -p "$BOOT_JDK"

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/bootjdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/20/ga/linux/x64/jdk/hotspot/normal/eclipse"

          tar \
            -xzf /tmp/bootjdk.tar.gz \
            -C "$BOOT_JDK" \
            --strip-components=1

          "$BOOT_JDK/bin/java" -version \
            2>&1 \
            | tee horizon-research/boot-jdk-version.txt


      # ============================================================
      # 7. OpenJDK 21
      # ============================================================

      - name: Clone OpenJDK 21
        shell: bash
        run: |
          set -e

          rm -rf openjdk21

          git clone \
            --depth 1 \
            https://github.com/openjdk/jdk21u.git \
            openjdk21

          git -C openjdk21 rev-parse HEAD \
            | tee horizon-research/openjdk-commit.txt


      # ============================================================
      # 8. Salva configure --help
      #
      # Assim nao dependemos de suposicoes sobre as opcoes existentes
      # nessa revisao exata do jdk21u.
      # ============================================================

      - name: Inspect configure options
        shell: bash
        run: |
          set -e

          cd openjdk21

          bash configure --help \
            > ../horizon-research/configure-help.txt \
            2>&1 \
            || true

          bash configure --help=short \
            > ../horizon-research/configure-help-short.txt \
            2>&1 \
            || true

          echo "===== HEADLESS ====="

          grep -i -C 3 \
            'headless' \
            ../horizon-research/configure-help.txt \
            || true

          echo ""
          echo "===== JVM VARIANTS ====="

          grep -i -C 5 \
            'jvm-variants' \
            ../horizon-research/configure-help.txt \
            || true


      # ============================================================
      # 9. Verifica se as opcoes existem
      # ============================================================

      - name: Verify minimal and headless options
        shell: bash
        run: |
          set -e

          if grep -q -- '--enable-headless-only' \
            horizon-research/configure-help.txt
          then
            echo "HEADLESS_OPTION=yes" \
              >> "$GITHUB_ENV"

            echo "OpenJDK possui --enable-headless-only"
          else
            echo "HEADLESS_OPTION=no" \
              >> "$GITHUB_ENV"

            echo "ATENCAO:"
            echo "--enable-headless-only nao apareceu no help."
          fi

          if grep -q -- '--with-jvm-variants' \
            horizon-research/configure-help.txt
          then
            echo "JVM_VARIANT_OPTION=yes" \
              >> "$GITHUB_ENV"

            echo "OpenJDK possui --with-jvm-variants"
          else
            echo "JVM_VARIANT_OPTION=no" \
              >> "$GITHUB_ENV"

            echo "ATENCAO:"
            echo "--with-jvm-variants nao apareceu no help."
          fi


      # ============================================================
      # 10. Horizon OS mapping
      # ============================================================

      - name: Add Horizon OS mapping
        shell: bash
        run: |
          set -e

          cp \
            openjdk21/make/autoconf/platform.m4 \
            horizon-research/platform-original.m4

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openjdk21/make/autoconf/platform.m4")
          s = p.read_text()

          needle = 'AC_MSG_ERROR([unsupported operating system $1])'

          if needle not in s:
              raise SystemExit(
                  "Fallback de sistema operacional nao encontrado"
              )

          insertion = '''elf)
                VAR_OS=horizon
                ;;
            '''

          fallback = '''*)
                AC_MSG_ERROR([unsupported operating system $1])
                ;;'''

          if fallback in s:
              s = s.replace(
                  fallback,
                  insertion + fallback,
                  1
              )
          else:
              pos = s.find(needle)

              case_start = s.rfind(
                  "*)",
                  0,
                  pos
              )

              if case_start < 0:
                  raise SystemExit(
                      "Fallback *) nao encontrado"
                  )

              s = (
                  s[:case_start]
                  + insertion
                  + s[case_start:]
              )

          p.write_text(s)

          print(
              "Target elf sera identificado como Horizon."
          )
          PY

          grep \
            -n \
            -C 15 \
            'VAR_OS=horizon' \
            openjdk21/make/autoconf/platform.m4 \
            | tee horizon-research/horizon-platform-patch.txt


      # ============================================================
      # 11. CUPS bypass
      #
      # Mantemos o bypass comprovado no v0.6/v0.7.
      # ============================================================

      - name: Apply Horizon CUPS research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")
          target = None

          for p in root.rglob("*.m4"):
              text = p.read_text(errors="ignore")

              if "Could not find cups" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Nao encontrei checagem fatal CUPS"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find cups"
          )

          line_start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          line_end = text.find(
              "\n",
              pos
          )

          if line_end < 0:
              line_end = len(text)

          original = text[
              line_start:line_end
          ]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([CUPS disabled for experimental Horizon target])\n'
              + indent
              + '  CUPS_CFLAGS=""\n'
              + indent
              + '  CUPS_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:line_start]
              + replacement
              + text[line_end:]
          )

          target.write_text(text)

          print(
              "CUPS research bypass:",
              target
          )
          PY


      # ============================================================
      # 12. Fontconfig bypass
      #
      # Mantemos o bypass comprovado no v0.7.
      # ============================================================

      - name: Apply Horizon Fontconfig research bypass
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("openjdk21/make/autoconf")
          target = None

          for p in root.rglob("*.m4"):
              text = p.read_text(errors="ignore")

              if "Could not find fontconfig" in text:
                  target = p
                  break

          if target is None:
              raise SystemExit(
                  "Nao encontrei checagem fatal Fontconfig"
              )

          text = target.read_text()

          pos = text.find(
              "Could not find fontconfig"
          )

          line_start = text.rfind(
              "\n",
              0,
              pos
          ) + 1

          line_end = text.find(
              "\n",
              pos
          )

          if line_end < 0:
              line_end = len(text)

          original = text[
              line_start:line_end
          ]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          replacement = (
              indent
              + 'if test "x$OPENJDK_TARGET_OS" = "xhorizon"; then\n'
              + indent
              + '  AC_MSG_WARN([Fontconfig disabled for experimental Horizon target])\n'
              + indent
              + '  FONTCONFIG_CFLAGS=""\n'
              + indent
              + '  FONTCONFIG_LIBS=""\n'
              + indent
              + 'else\n'
              + original
              + '\n'
              + indent
              + 'fi'
          )

          text = (
              text[:line_start]
              + replacement
              + text[line_end:]
          )

          target.write_text(text)

          print(
              "Fontconfig research bypass:",
              target
          )
          PY


      # ============================================================
      # 13. NAO fazemos bypass do FreeType
      #
      # Queremos descobrir se headless/minimal muda a necessidade.
      # ============================================================

      - name: Record FreeType configuration
        shell: bash
        run: |
          set -e

          grep -R -n -E \
            'Could not find freetype|FREETYPE|freetype2|freetype/' \
            openjdk21/make/autoconf \
            2>/dev/null \
            | head -n 1000 \
            > horizon-research/freetype-configure.txt \
            || true

          echo "FreeType NAO foi bypassado no v0.8."


      # ============================================================
      # 14. Registra HotSpot OS existentes
      # ============================================================

      - name: Inspect existing HotSpot OS ports
        shell: bash
        run: |
          set -e

          {
            echo "Minecraft-NX"
            echo "HotSpot OS port inventory"
            echo ""

            echo "===== src/hotspot/os ====="

            find \
              openjdk21/src/hotspot/os \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

            echo ""
            echo "===== src/hotspot/os_cpu ====="

            find \
              openjdk21/src/hotspot/os_cpu \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

          } | tee horizon-research/hotspot-os-inventory.txt


      # ============================================================
      # 15. Procura referencias de OPENJDK_TARGET_OS
      #
      # Isso vai nos mostrar quantos lugares do build system
      # precisarao aprender sobre "horizon".
      # ============================================================

      - name: Inspect target OS decisions
        shell: bash
        run: |
          set +e

          grep -R -n \
            'OPENJDK_TARGET_OS' \
            openjdk21/make \
            | head -n 4000 \
            > horizon-research/target-os-decisions.txt

          exit 0


      # ============================================================
      # 16. Salva nosso patch antes do configure
      # ============================================================

      - name: Save v0.8 source patch
        shell: bash
        run: |
          set -e

          git -C openjdk21 diff \
            > horizon-research/openjdk-horizon-v0.8.patch

          echo "===== PATCH v0.8 ====="

          cat horizon-research/openjdk-horizon-v0.8.patch


      # ============================================================
      # 17. CONFIGURE HEADLESS + MINIMAL
      #
      # Nao iniciamos make ainda.
      #
      # Primeiro precisamos obter uma configuracao coerente.
      # ============================================================

      - name: Configure minimal headless Horizon JVM
        shell: bash
        run: |
          set +e

          cd openjdk21

          EXTRA_OPTIONS=""

          if [ "$HEADLESS_OPTION" = "yes" ]; then
            EXTRA_OPTIONS="$EXTRA_OPTIONS --enable-headless-only=yes"
          fi

          if [ "$JVM_VARIANT_OPTION" = "yes" ]; then
            EXTRA_OPTIONS="$EXTRA_OPTIONS --with-jvm-variants=minimal"
          fi

          echo "===== CONFIGURE OPTIONS ====="

          echo "$EXTRA_OPTIONS" \
            | tee ../horizon-research/v0.8-extra-options.txt

          echo ""

          bash configure \
            --openjdk-target=aarch64-none-elf \
            --with-toolchain-type=gcc \
            --with-boot-jdk=/opt/bootjdk \
            --with-debug-level=release \
            $EXTRA_OPTIONS \
            CC=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
            CXX=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            AR=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar \
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm \
            OBJCOPY=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objcopy \
            STRIP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip \
            2>&1 \
            | tee ../horizon-research/configure-v0.8.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > ../horizon-research/configure-exit-code.txt

          echo ""
          echo "Configure exit code: $STATUS"

          exit 0


      # ============================================================
      # 18. Analise
      # ============================================================

      - name: Analyze minimal headless configure
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo " Minecraft-NX"
            echo " OpenJDK Horizon Research v0.8"
            echo " Created by Farbert_Took"
            echo "========================================"

            echo ""
            echo "Strategy:"
            echo "Horizon + AArch64 + headless + minimal JVM"

            echo ""
            echo "Boot JDK:"

            "$BOOT_JDK/bin/java" -version 2>&1

            echo ""
            echo "Requested extra configure options:"

            cat horizon-research/v0.8-extra-options.txt

            echo ""
            echo "Configure exit code:"

            cat horizon-research/configure-exit-code.txt

            echo ""
            echo "Relevant configure messages:"
            echo ""

            grep -i -E \
              'error|warning|unsupported|horizon|target|host|aarch64|elf|headless|minimal|jvm variant|jvm features|cups|fontconfig|freetype|alsa|x11|xext|xrender|xtst|xi|libffi|sysroot|posix|linux|library|libraries|header|headers' \
              horizon-research/configure-v0.8.log \
              | tail -n 1600 \
              || true

          } > horizon-research/summary-v0.8.txt

          echo ""
          echo "========================================"
          echo " SUMMARY v0.8"
          echo "========================================"

          cat horizon-research/summary-v0.8.txt


      # ============================================================
      # 19. Tail bruto
      # ============================================================

      - name: Show configure tail
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " LAST 400 CONFIGURE LINES"
          echo "========================================"

          tail \
            -n 400 \
            horizon-research/configure-v0.8.log \
            | tee horizon-research/configure-tail-v0.8.txt


      # ============================================================
      # 20. Se configure funcionar, NAO fazemos build completo.
      #
      # Apenas pedimos ao Make para listar/alcançar o target HotSpot
      # e capturamos a primeira falha real do port.
      # ============================================================

      - name: Probe HotSpot build
        shell: bash
        run: |
          set +e

          STATUS=$(cat horizon-research/configure-exit-code.txt)

          if [ "$STATUS" != "0" ]; then

            echo "Configure ainda nao terminou com sucesso." \
              | tee horizon-research/hotspot-probe.txt

            echo "HotSpot build nao iniciado." \
              | tee -a horizon-research/hotspot-probe.txt

            exit 0
          fi

          echo "Configure OK." \
            | tee horizon-research/hotspot-probe.txt

          echo "Iniciando somente probe do target hotspot..." \
            | tee -a horizon-research/hotspot-probe.txt

          cd openjdk21

          make hotspot \
            2>&1 \
            | tee ../horizon-research/hotspot-build-v0.8.log

          MAKE_STATUS=${PIPESTATUS[0]}

          echo "$MAKE_STATUS" \
            > ../horizon-research/hotspot-exit-code.txt

          exit 0


      # ============================================================
      # 21. Analisa primeira falha real do HotSpot
      # ============================================================

      - name: Analyze HotSpot probe
        shell: bash
        run: |
          set +e

          if [ -f horizon-research/hotspot-build-v0.8.log ]; then

            {
              echo "========================================"
              echo " HOTSPOT PROBE v0.8"
              echo "========================================"

              echo ""

              grep -i -E \
                'error|fatal|horizon|os_cpu|os/|aarch64|missing|not found|no rule|undefined|unsupported' \
                horizon-research/hotspot-build-v0.8.log \
                | tail -n 1200

              echo ""
              echo "===== LAST 300 ====="

              tail \
                -n 300 \
                horizon-research/hotspot-build-v0.8.log

            } > horizon-research/hotspot-summary-v0.8.txt

            cat horizon-research/hotspot-summary-v0.8.txt

          else

            echo \
              "HotSpot probe nao executado porque configure ainda falhou." \
              > horizon-research/hotspot-summary-v0.8.txt

          fi

          exit 0


      # ============================================================
      # 22. Procura arquivos que seriam necessarios para Horizon
      # ============================================================

      - name: Prepare Horizon port map
        shell: bash
        run: |
          set +e

          {
            echo "Minecraft-NX"
            echo "OpenJDK Horizon Port Map v0.8"
            echo "Created by Farbert_Took"

            echo ""
            echo "===== Linux AArch64 HotSpot reference ====="

            find \
              openjdk21/src/hotspot/os/linux \
              openjdk21/src/hotspot/os_cpu/linux_aarch64 \
              -maxdepth 1 \
              -type f \
              -printf '%p\n' \
              2>/dev/null \
              | sort

            echo ""
            echo "===== BSD HotSpot reference ====="

            find \
              openjdk21/src/hotspot/os/bsd \
              openjdk21/src/hotspot/os_cpu/bsd_aarch64 \
              -maxdepth 1 \
              -type f \
              -printf '%p\n' \
              2>/dev/null \
              | sort

            echo ""
            echo "===== Potential Horizon directories ====="

            echo "src/hotspot/os/horizon"
            echo "src/hotspot/os_cpu/horizon_aarch64"

          } > horizon-research/horizon-port-map.txt

          exit 0


      # ============================================================
      # 23. Coleta logs de configuracao
      # ============================================================

      - name: Collect configuration logs
        shell: bash
        run: |
          set +e

          find openjdk21 \
            -type f \
            \( \
              -name "config.log" \
              -o \
              -name "configure.log" \
            \) \
            -print \
            > horizon-research/config-files.txt

          while IFS= read -r FILEPATH
          do

            if [ -f "$FILEPATH" ]; then

              SAFE_NAME=$(echo "$FILEPATH" | tr '/' '_')

              cp \
                "$FILEPATH" \
                "horizon-research/$SAFE_NAME"

            fi

          done < horizon-research/config-files.txt

          exit 0


      # ============================================================
      # 24. Resultado
      # ============================================================

      - name: Final v0.8 report
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " Minecraft-NX"
          echo " OpenJDK Horizon Research v0.8"
          echo " Created by Farbert_Took"
          echo "========================================"

          echo ""
          echo "Configure:"
          cat horizon-research/configure-exit-code.txt

          echo ""
          echo "Headless option detected:"
          echo "$HEADLESS_OPTION"

          echo ""
          echo "JVM variant option detected:"
          echo "$JVM_VARIANT_OPTION"

          echo ""
          echo "Research files:"
          echo ""

          find \
            horizon-research \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "v0.8 nao afirma que OpenJDK suporta Horizon."
          echo "Objetivo: localizar a fronteira real do port."


      # ============================================================
      # 25. Artifact
      # ============================================================

      - name: Upload Horizon Research v0.8
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-NX-Farbert_Took-OpenJDK-Horizon-v0.8
          path: horizon-research
